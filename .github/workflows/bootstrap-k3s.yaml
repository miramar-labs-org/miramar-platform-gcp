name: K3s Bootstrap

# Full end-to-end bootstrap for a fresh (or re-provisioned) k3s host.
# Runs the complete sequence in a single dispatch:
#   1. Install k3s + NVIDIA device plugin + nginx-ingress + CoreDNS + Dashboard
#      (SSHes to host — k3s install requires systemd which the runner container lacks)
#   2. Deploy NeMo Microservices
#   3. Deploy MLflow (uses NeMo's postgres as backend)
#   4. Deploy Qdrant
#   5. Deploy KFP (Kubeflow Pipelines)
#
# After a successful bootstrap, the machine is ready to run pipelines.
# NIM (DGX) or Ollama (AGX) must be deployed separately via their own workflows.
#
# Prerequisites:
#   - mlabs-runner container running on the target machine
#   - NVIDIA container toolkit installed on the host
#   - NVIDIA_API_KEY, HF_TOKEN, HOST_SSH_KEY secrets set; AUTOMATION_APP_CLIENT_ID/_KEY
#   - DGX_HOST_IP / AGX_HOST_IP, DGX_HOST_USER / AGX_HOST_USER org vars set

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
      nemo_version:
        description: "NeMo Microservices version (leave blank for chart default)"
        type: string
        required: false
        default: ""
      deploy_mlflow:
        description: "Deploy MLflow + MinIO on this machine (set false to use DGX MLflow instead)"
        type: boolean
        required: false
        default: true
      deploy_qdrant:
        description: "Deploy Qdrant on this machine (set false to use DGX Qdrant instead)"
        type: boolean
        required: false
        default: true
      deploy_nemo:
        description: "Deploy NeMo Microservices on this machine (set false to use DGX NeMo instead)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 90
    steps:
      # 1-hour GitHub App token (replaces the org-admin PAT; Nov 2026 incident)
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          owner: miramar-labs-org
      - name: Export App token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GH_APP_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ── Resolve machine-specific names ───────────────────────────────────────
      - name: Resolve machine-specific names
        run: |
          MACHINE=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          echo "MACHINE=${MACHINE}"                          >> "$GITHUB_ENV"
          echo "ACTIVE_VAR=${MACHINE}_K3S_ACTIVE"           >> "$GITHUB_ENV"
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "HOST_IP=${{ vars.AGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}" >> "$GITHUB_ENV"
          else
            echo "HOST_IP=${{ vars.DGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}" >> "$GITHUB_ENV"
          fi

      # ── Set up SSH key for host commands ─────────────────────────────────────
      - name: Set up SSH key
        env:
          HOST_SSH_KEY: ${{ secrets.HOST_SSH_KEY }}
        run: |
          # Key lives only in ssh-agent memory: never written to disk, never
          # interpolated into the step script. Agent persists for later steps via GITHUB_ENV.
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$HOST_SSH_KEY" | ssh-add -q -t 21600 -
          { echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"; echo "SSH_AGENT_PID=$SSH_AGENT_PID"; } >> "$GITHUB_ENV"
          ssh-keyscan -H "${HOST_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ── Preflight + host state probe ─────────────────────────────────────────
      - name: Preflight check
        run: |
          # Copy preflight script to host and run it (non-interactive — reports only, no fixes)
          scp -o StrictHostKeyChecking=no \
            scripts/ubuntu/preflight-host.sh \
            "${HOST_USER}@${HOST_IP}:/tmp/preflight-host.sh"
          # Non-interactive so the auto-fix prompt is suppressed. Never source a global
          # secrets file here: preflight needs no secrets (it checks that none leak into the env)
          # We continue even on failure — bootstrap steps are idempotent and preflight
          # failures are reported in the step summary for visibility
          PREFLIGHT=$(ssh -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}" \
            "bash /tmp/preflight-host.sh" 2>&1) || true
          echo "$PREFLIGHT"
          {
            echo "## Preflight — ${{ inputs.runner }}"
            echo '```'
            echo "$PREFLIGHT" | sed 's/\x1b\[[0-9;]*m//g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe host state
        run: |
          PROBE=$(ssh -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}" bash <<'PROBE'
          echo "k3s=$(command -v k3s &>/dev/null && k3s --version 2>/dev/null | head -1 || echo 'not installed')"
          echo "k3s_active=$(systemctl is-active k3s 2>/dev/null || echo inactive)"
          echo "helm_releases=$(KUBECONFIG=~/.kube/config helm list -A --short 2>/dev/null | tr '\n' ',' | sed 's/,$//' || echo 'none')"
          echo "error_pods=$(KUBECONFIG=~/.kube/config kubectl get pods -A --no-headers 2>/dev/null | awk '$4~/Error|CrashLoop|OOMKilled/{print $2}' | tr '\n' ',' | sed 's/,$//' || echo 'none')"
          PROBE
          )

          echo "$PROBE"

          # Parse and export
          K3S_VER=$(echo "$PROBE"        | grep '^k3s='          | cut -d= -f2-)
          K3S_ACTIVE=$(echo "$PROBE"     | grep '^k3s_active='   | cut -d= -f2-)
          HELM_RELEASES=$(echo "$PROBE"  | grep '^helm_releases=' | cut -d= -f2-)
          ERROR_PODS=$(echo "$PROBE"     | grep '^error_pods='    | cut -d= -f2-)

          {
            echo "## Host State — ${{ inputs.runner }}"
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| k3s | $K3S_VER ($K3S_ACTIVE) |"
            echo "| helm releases | ${HELM_RELEASES:-none} |"
            echo "| pods in error | ${ERROR_PODS:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Step 1: Install k3s (SSH to host — needs systemd) ────────────────────
      - name: Install k3s on host
        run: |
          # install-k3s.sh references dgx/k3s/nvidia-device-plugin.yaml via REPO_ROOT.
          # SCP both files into a temp dir on the host and point REPO_ROOT there.
          ssh -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}" "mkdir -p /tmp/k3s-bootstrap/dgx/k3s"
          scp -o StrictHostKeyChecking=no \
            scripts/ubuntu/install-k3s.sh \
            "${HOST_USER}@${HOST_IP}:/tmp/k3s-bootstrap/install-k3s.sh"
          scp -o StrictHostKeyChecking=no \
            dgx/k3s/nvidia-device-plugin.yaml \
            "${HOST_USER}@${HOST_IP}:/tmp/k3s-bootstrap/dgx/k3s/nvidia-device-plugin.yaml"
          ssh -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}" \
            "REPO_ROOT=/tmp/k3s-bootstrap bash /tmp/k3s-bootstrap/install-k3s.sh"

      - name: Copy kubeconfig from host
        run: |
          mkdir -p "${HOME}/.kube"
          scp -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}:/home/${HOST_USER}/.kube/config" \
            "${HOME}/.kube/config"
          echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster access
        run: kubectl get nodes -o wide

      # ── Step 2: Deploy NeMo ───────────────────────────────────────────────────
      - name: Prepare host data directories
        run: |
          ssh -o StrictHostKeyChecking=no "${HOST_USER}@${HOST_IP}" "
            mkdir -p /home/${HOST_USER}/shared/mlflow/minio
            chmod 777 /home/${HOST_USER}/shared/mlflow/minio
            mkdir -p /home/${HOST_USER}/shared/qdrant-data
            chmod 777 /home/${HOST_USER}/shared/qdrant-data
            mkdir -p /home/${HOST_USER}/shared/kfp/mysql /home/${HOST_USER}/shared/kfp/seaweedfs
            chmod 777 /home/${HOST_USER}/shared/kfp/mysql /home/${HOST_USER}/shared/kfp/seaweedfs
            mkdir -p /home/${HOST_USER}/shared/huggingface-kfp/hub \
                     /home/${HOST_USER}/shared/huggingface-kfp/adapters \
                     /home/${HOST_USER}/shared/nsight
          "

      - name: Prepare NeMo data directories
        if: ${{ inputs.deploy_nemo == true }}
        run: |
          ssh -o StrictHostKeyChecking=no "${HOST_USER}@${HOST_IP}" "
            NEMO_DATA=/home/${HOST_USER}/shared/nemo
            mkdir -p \${NEMO_DATA}/{customizerdb,entity-storedb,evaluatordb,jobsdb,postgresql,datastore,models,job-storage}
            chmod -R 777 \${NEMO_DATA}
          "

      - name: Create namespace and secrets
        if: ${{ inputs.deploy_nemo == true }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          kubectl create namespace nemo-microservices --dry-run=client -o yaml | kubectl apply -f -
          kubectl delete secret nvcrimagepullsecret ngc-api nvidia-api hf-token \
            -n nemo-microservices --ignore-not-found
          kubectl create secret docker-registry nvcrimagepullsecret \
            -n nemo-microservices \
            --docker-server=nvcr.io \
            --docker-username='$oauthtoken' \
            --docker-password="${NVIDIA_API_KEY}"
          kubectl create secret generic ngc-api \
            -n nemo-microservices --from-literal=NGC_API_KEY="${NVIDIA_API_KEY}"
          kubectl create secret generic nvidia-api \
            -n nemo-microservices --from-literal=NVIDIA_API_KEY="${NVIDIA_API_KEY}"
          kubectl create secret generic hf-token \
            -n nemo-microservices --from-literal=HF_TOKEN="${HF_TOKEN}"

      - name: Label GPU node
        if: ${{ inputs.deploy_nemo == true }}
        run: |
          NODE_NAME=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          kubectl label node "${NODE_NAME}" \
            nvidia.com/gpu.present=true \
            feature.node.kubernetes.io/pci-10de.present=true \
            --overwrite

      - name: Deploy NeMo Microservices
        if: ${{ inputs.deploy_nemo == true }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          NEMO_VERSION="${{ inputs.nemo_version }}"
          NEMO_VERSION="${NEMO_VERSION:-25.12.1}"
          helm repo add nmp https://helm.ngc.nvidia.com/nvidia/nemo-microservices \
            --username='$oauthtoken' --password="${NVIDIA_API_KEY}" --force-update
          helm repo update

          STATUS=$(helm status nemo -n nemo-microservices -o json 2>/dev/null | jq -r '.info.status // empty')
          if [[ "$STATUS" == "pending-install" || "$STATUS" == "pending-upgrade" || "$STATUS" == "pending-rollback" ]]; then
            helm rollback nemo -n nemo-microservices 2>/dev/null || \
              kubectl delete secret -n nemo-microservices -l owner=helm,name=nemo --ignore-not-found
          fi

          NEMO_DATA="/home/${HOST_USER}/shared/nemo"
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-customizerdb-pv
          spec:
            capacity: {storage: 8Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-customizerdb-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/customizerdb", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-entity-storedb-pv
          spec:
            capacity: {storage: 8Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-entity-storedb-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/entity-storedb", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-evaluatordb-pv
          spec:
            capacity: {storage: 8Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-evaluatordb-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/evaluatordb", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-jobsdb-pv
          spec:
            capacity: {storage: 8Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-jobsdb-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/jobsdb", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-postgresql-pv
          spec:
            capacity: {storage: 10Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-postgresql-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/postgresql", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-datastore-pv
          spec:
            capacity: {storage: 100Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: datastore-shared-storage, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/datastore", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-models-pv
          spec:
            capacity: {storage: 100Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: finetuning-ms-models-pvc, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/models", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-job-storage-pv
          spec:
            capacity: {storage: 200Gi}
            accessModes: [ReadWriteMany]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: nemo-core-job-storage, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/job-storage", type: DirectoryOrCreate}
          EOF

          helm upgrade --install nemo nmp/nemo-microservices-helm-chart \
            --namespace nemo-microservices \
            --create-namespace \
            --version "${NEMO_VERSION}" \
            -f dgx/k3s/nemo/install/values.yaml \
            --timeout 30m

      - name: Update hosts file
        if: ${{ inputs.deploy_nemo == true }}
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          CLUSTER_IP=$(kubectl get node -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            HOSTS_FILE="agx/k3s/nemo/hosts.agx"
          else
            HOSTS_FILE="dgx/k3s/nemo/hosts.dgx"
          fi
          printf '%s nemo.test nim.test data-store.test\n' "${CLUSTER_IP}" > "${HOSTS_FILE}"
          git config user.email "actions@github.com"
          git config user.name "Miramar Platform"
          if ! git diff --quiet; then
            git add "${HOSTS_FILE}"
            git commit -m "docs: update NeMo hosts file for ${{ inputs.runner }} [skip ci]"
            git config --local --unset-all http.https://github.com/.extraheader || true
            # Push with a throwaway credential helper rather than a tokenised remote URL:
            # set-url would write the PAT into .git/config, and a self-hosted runner keeps
            # its _work tree between jobs, so it would outlive the run. The token reaches
            # git through the environment only — never argv, never a config file.
            git \
              -c credential.helper= \
              -c credential.helper='!f(){ if test "$1" = get; then printf "username=x-access-token\npassword=%s\n" "${GH_APP_TOKEN}"; fi; }; f' \
              push https://github.com/miramar-labs-org/miramar-platform-gcp.git HEAD:main
          fi

      - name: Wait for NeMo pods
        if: ${{ inputs.deploy_nemo == true }}
        run: |
          echo "==> Waiting for NeMo pods to be ready (up to 20m)..."
          kubectl wait pod --all -n nemo-microservices \
            --for=condition=Ready --timeout=1200s

      - name: Set NeMo active state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          var="${MACHINE}_NEMO_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="${{ inputs.deploy_nemo }}" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="${{ inputs.deploy_nemo }}" -f visibility="all"

      # ── Step 3: Deploy MLflow ─────────────────────────────────────────────────
      - name: Deploy MLflow
        if: ${{ inputs.deploy_mlflow == true }}
        run: |
          MINIO_DATA_DIR="/home/${HOST_USER}/shared/mlflow/minio" \
          bash dgx/k3s/mlflow/integrate-mlflow.sh

      - name: Set MLflow active state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          var="${MACHINE}_MLFLOW_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="${{ inputs.deploy_mlflow }}" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="${{ inputs.deploy_mlflow }}" -f visibility="all"

      # ── Step 4: Deploy Qdrant ─────────────────────────────────────────────────
      - name: Deploy Qdrant
        if: ${{ inputs.deploy_qdrant == true }}
        run: |
          QDRANT_DATA_DIR="/home/${HOST_USER}/shared/qdrant-data" \
          bash dgx/k3s/qdrant/integrate-qdrant.sh

      - name: Set Qdrant active state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          var="${MACHINE}_QDRANT_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="${{ inputs.deploy_qdrant }}" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="${{ inputs.deploy_qdrant }}" -f visibility="all"

      # ── Step 5: Deploy KFP ───────────────────────────────────────────────────
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.MIRAMAR_ORG_GHCR_PAT }}" \
            | docker login ghcr.io -u miramar-labs-org --password-stdin

      - name: Deploy Kubeflow Pipelines
        env:
          MIRAMAR_ORG_GHCR_PAT: ${{ secrets.MIRAMAR_ORG_GHCR_PAT }}
        run: |
          KFP_DATA_DIR="/home/${HOST_USER}/shared/kfp" \
          bash dgx/k3s/kubeflow/deploy-kubeflow.sh

      - name: Create KFP shared storage
        run: |
          # Apply PVs (skipped if already exist — spec is immutable after creation)
          kubectl get pv hf-model-cache &>/dev/null || kubectl apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: hf-model-cache
          spec:
            capacity:
              storage: 200Gi
            accessModes: [ReadWriteMany]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            hostPath:
              path: /home/${HOST_USER}/shared/huggingface-kfp
          EOF
          # The legacy nsight-reports PV/PVC is deliberately not created. It dates from
          # a removed nsys-wrapper profiling path; the Nsight Operator writes to its own
          # MinIO and scripts/nsight/export-report.sh writes the host archive directly,
          # so nothing mounts it. Its hostPath was the profiling archive ROOT
          # (~/shared/nsight) exposed RWX. See deploy-kubeflow.yaml for the cleanup that
          # removes it from clusters provisioned before this commit.
          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: hf-model-cache
            namespace: kubeflow
          spec:
            accessModes: [ReadWriteMany]
            resources:
              requests:
                storage: 200Gi
            storageClassName: ""
            volumeName: hf-model-cache
          EOF

      - name: Set KFP active state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          var="${MACHINE}_KFP_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="true" -f visibility="all"

      # ── Finalise ─────────────────────────────────────────────────────────────
      - name: Set k3s active state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${ACTIVE_VAR}" \
            -f name="${ACTIVE_VAR}" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${ACTIVE_VAR}" -f value="true" -f visibility="all"

      - name: Summary
        run: |
          nemo_status() { [[ "${{ inputs.deploy_nemo }}"   == "true" ]] && echo "✅" || echo "⏭ skipped (uses DGX)"; }
          mlflow_status() { [[ "${{ inputs.deploy_mlflow }}" == "true" ]] && echo "✅ port 5000" || echo "⏭ skipped (uses DGX)"; }
          qdrant_status() { [[ "${{ inputs.deploy_qdrant }}" == "true" ]] && echo "✅ port 6333" || echo "⏭ skipped (uses DGX)"; }
          {
            echo "## K3s Bootstrap Complete — ${{ inputs.runner }}"
            echo ""
            echo "| Component | Status |"
            echo "|---|---|"
            echo "| k3s | ✅ |"
            echo "| NVIDIA device plugin | ✅ |"
            echo "| nginx-ingress | ✅ |"
            echo "| Kubernetes Dashboard | ✅ port 8001 |"
            echo "| NeMo Microservices | $(nemo_status) |"
            echo "| MLflow | $(mlflow_status) |"
            echo "| Qdrant | $(qdrant_status) |"
            echo "| KFP | ✅ port 8080 |"
            echo ""
            echo "Next: deploy NIM (DGX) or Ollama (AGX) via their own workflows."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k >/dev/null 2>&1 || true
