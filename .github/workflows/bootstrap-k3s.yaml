name: K3s Bootstrap

# Full end-to-end bootstrap for a machine that previously ran minikube.
# Runs the complete sequence in a single dispatch:
#   1. Uninstall minikube (idempotent — safe if already gone)
#   2. Install k3s + NVIDIA device plugin + nginx-ingress + CoreDNS + Dashboard
#      (SSHes to host — k3s install requires systemd which the runner container lacks)
#   3. Deploy NeMo Microservices
#   4. Deploy MLflow (uses NeMo's postgres as backend)
#   5. Deploy Qdrant
#   6. Deploy KFP (Kubeflow Pipelines)
#
# After a successful bootstrap, the machine is ready to run pipelines.
# NIM (DGX) or Ollama (AGX) must be deployed separately via their own workflows.
#
# Prerequisites:
#   - mlabs-runner container running on the target machine
#   - NVIDIA container toolkit installed on the host
#   - NVIDIA_API_KEY, HF_TOKEN, HOST_SSH_KEY, MIRAMAR_ORG_ADMIN_PAT secrets set
#   - DGX_HOST_IP / AGX_HOST_IP, DGX_HOST_USER / AGX_HOST_USER org vars set

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
      nemo_version:
        description: "NeMo Microservices version (leave blank for chart default)"
        type: string
        required: false
        default: ""
      skip_minikube_uninstall:
        description: "Skip minikube uninstall (if minikube was never installed)"
        type: boolean
        required: false
        default: false

jobs:
  bootstrap:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ── Resolve machine-specific names ───────────────────────────────────────
      - name: Resolve machine-specific names
        run: |
          MACHINE=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          echo "MACHINE=${MACHINE}"                          >> "$GITHUB_ENV"
          echo "ACTIVE_VAR=${MACHINE}_K3S_ACTIVE"           >> "$GITHUB_ENV"
          echo "KUBECONFIG_SECRET=${MACHINE}_K3S_KUBECONFIG" >> "$GITHUB_ENV"
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "HOST_IP=${{ vars.AGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}" >> "$GITHUB_ENV"
          else
            echo "HOST_IP=${{ vars.DGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}" >> "$GITHUB_ENV"
          fi

      # ── Set up SSH key for host commands ─────────────────────────────────────
      - name: Set up SSH key
        run: |
          echo "${{ secrets.HOST_SSH_KEY }}" > /tmp/bootstrap_key
          chmod 600 /tmp/bootstrap_key
          ssh-keyscan -H "${HOST_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ── Step 1: Uninstall minikube ────────────────────────────────────────────
      - name: Uninstall minikube
        if: ${{ inputs.skip_minikube_uninstall == false }}
        run: |
          ssh -i /tmp/bootstrap_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}" '
              set -euo pipefail
              if command -v minikube &>/dev/null; then
                echo "==> Stopping minikube..."
                minikube stop 2>/dev/null || true
                echo "==> Deleting minikube cluster..."
                minikube delete 2>/dev/null || true
                echo "==> Removing minikube binary..."
                sudo rm -f /usr/local/bin/minikube
                echo "==> minikube removed."
              else
                echo "==> minikube not found — nothing to uninstall."
              fi
              # Remove minikube systemd services if present
              for svc in minikube minikube-hf-cache-mount minikube-nsight-mount; do
                systemctl --user disable --now "${svc}.service" 2>/dev/null || true
                rm -f "${HOME}/.config/systemd/user/${svc}.service"
              done
              systemctl --user daemon-reload 2>/dev/null || true
            '

      # ── Step 2: Install k3s (SSH to host — needs systemd) ────────────────────
      - name: Install k3s on host
        run: |
          # install-k3s.sh references dgx/k3s/nvidia-device-plugin.yaml via REPO_ROOT.
          # SCP both files into a temp dir on the host and point REPO_ROOT there.
          ssh -i /tmp/bootstrap_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}" "mkdir -p /tmp/k3s-bootstrap/dgx/k3s"
          scp -i /tmp/bootstrap_key -o StrictHostKeyChecking=no \
            scripts/ubuntu/install-k3s.sh \
            "${HOST_USER}@${HOST_IP}:/tmp/k3s-bootstrap/install-k3s.sh"
          scp -i /tmp/bootstrap_key -o StrictHostKeyChecking=no \
            dgx/k3s/nvidia-device-plugin.yaml \
            "${HOST_USER}@${HOST_IP}:/tmp/k3s-bootstrap/dgx/k3s/nvidia-device-plugin.yaml"
          ssh -i /tmp/bootstrap_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}" \
            "REPO_ROOT=/tmp/k3s-bootstrap bash /tmp/k3s-bootstrap/install-k3s.sh"

      - name: Copy kubeconfig from host
        run: |
          mkdir -p "${HOME}/.kube"
          scp -i /tmp/bootstrap_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}:/home/${HOST_USER}/.kube/config" \
            "${HOME}/.kube/config"
          echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster access
        run: kubectl get nodes -o wide

      # ── Step 3: Deploy NeMo ───────────────────────────────────────────────────
      - name: Prepare host data directories
        run: |
          ssh -i /tmp/bootstrap_key -o StrictHostKeyChecking=no "${HOST_USER}@${HOST_IP}" "
            NEMO_DATA=/home/${HOST_USER}/shared/nemo
            mkdir -p \${NEMO_DATA}/{customizerdb,entity-storedb,evaluatordb,jobsdb,postgresql,datastore,models,job-storage}
            chmod -R 777 \${NEMO_DATA}
            mkdir -p /home/${HOST_USER}/shared/mlflow/minio
            chmod 777 /home/${HOST_USER}/shared/mlflow/minio
            mkdir -p /home/${HOST_USER}/shared/qdrant-data
            chmod 777 /home/${HOST_USER}/shared/qdrant-data
            mkdir -p /home/${HOST_USER}/shared/kfp/mysql /home/${HOST_USER}/shared/kfp/seaweedfs
            chmod 777 /home/${HOST_USER}/shared/kfp/mysql /home/${HOST_USER}/shared/kfp/seaweedfs
            mkdir -p /home/${HOST_USER}/shared/huggingface-kfp/hub \
                     /home/${HOST_USER}/shared/huggingface-kfp/adapters \
                     /home/${HOST_USER}/shared/nsight
          "

      - name: Create namespace and secrets
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          kubectl create namespace nemo-microservices --dry-run=client -o yaml | kubectl apply -f -
          kubectl delete secret nvcrimagepullsecret ngc-api nvidia-api hf-token \
            -n nemo-microservices --ignore-not-found
          kubectl create secret docker-registry nvcrimagepullsecret \
            -n nemo-microservices \
            --docker-server=nvcr.io \
            --docker-username='$oauthtoken' \
            --docker-password="${NVIDIA_API_KEY}"
          kubectl create secret generic ngc-api \
            -n nemo-microservices --from-literal=NGC_API_KEY="${NVIDIA_API_KEY}"
          kubectl create secret generic nvidia-api \
            -n nemo-microservices --from-literal=NVIDIA_API_KEY="${NVIDIA_API_KEY}"
          kubectl create secret generic hf-token \
            -n nemo-microservices --from-literal=HF_TOKEN="${HF_TOKEN}"

      - name: Label GPU node
        run: |
          NODE_NAME=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          kubectl label node "${NODE_NAME}" \
            nvidia.com/gpu.present=true \
            feature.node.kubernetes.io/pci-10de.present=true \
            --overwrite

      - name: Deploy NeMo Microservices
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          NEMO_VERSION="${{ inputs.nemo_version }}"
          NEMO_VERSION="${NEMO_VERSION:-25.12.1}"
          helm repo add nmp https://helm.ngc.nvidia.com/nvidia/nemo-microservices \
            --username='$oauthtoken' --password="${NVIDIA_API_KEY}" --force-update
          helm repo update

          STATUS=$(helm status nemo -n nemo-microservices -o json 2>/dev/null | jq -r '.info.status // empty')
          if [[ "$STATUS" == "pending-install" || "$STATUS" == "pending-upgrade" || "$STATUS" == "pending-rollback" ]]; then
            helm rollback nemo -n nemo-microservices 2>/dev/null || \
              kubectl delete secret -n nemo-microservices -l owner=helm,name=nemo --ignore-not-found
          fi

          NEMO_DATA="/home/${HOST_USER}/shared/nemo"
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-customizerdb-pv
          spec:
            capacity: {storage: 8Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-customizerdb-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/customizerdb", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-entity-storedb-pv
          spec:
            capacity: {storage: 8Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-entity-storedb-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/entity-storedb", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-evaluatordb-pv
          spec:
            capacity: {storage: 8Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-evaluatordb-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/evaluatordb", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-jobsdb-pv
          spec:
            capacity: {storage: 8Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-jobsdb-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/jobsdb", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-postgresql-pv
          spec:
            capacity: {storage: 10Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-postgresql-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/postgresql", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-datastore-pv
          spec:
            capacity: {storage: 100Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: datastore-shared-storage, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/datastore", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-models-pv
          spec:
            capacity: {storage: 100Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: finetuning-ms-models-pvc, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/models", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-job-storage-pv
          spec:
            capacity: {storage: 200Gi}
            accessModes: [ReadWriteMany]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: nemo-core-job-storage, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/job-storage", type: DirectoryOrCreate}
          EOF

          helm upgrade --install nemo nmp/nemo-microservices-helm-chart \
            --namespace nemo-microservices \
            --create-namespace \
            --version "${NEMO_VERSION}" \
            -f dgx/minikube/nemo/install/values.yaml \
            --timeout 30m

      - name: Update hosts file
        run: |
          CLUSTER_IP=$(kubectl get node -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            HOSTS_FILE="agx/minikube/nemo/hosts.agx"
          else
            HOSTS_FILE="dgx/minikube/nemo/hosts.dgx"
          fi
          printf '%s nemo.test nim.test data-store.test\n' "${CLUSTER_IP}" > "${HOSTS_FILE}"
          git config user.email "actions@github.com"
          git config user.name "Miramar Platform"
          if ! git diff --quiet; then
            git add "${HOSTS_FILE}"
            git commit -m "docs: update NeMo hosts file for ${{ inputs.runner }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Wait for NeMo pods
        run: |
          echo "==> Waiting for NeMo pods to be ready (up to 20m)..."
          kubectl wait pod --all -n nemo-microservices \
            --for=condition=Ready --timeout=1200s

      - name: Set NeMo active state
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          var="${MACHINE}_NEMO_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="true" -f visibility="all"

      # ── Step 4: Deploy MLflow ─────────────────────────────────────────────────
      - name: Deploy MLflow
        run: |
          MINIO_DATA_DIR="/home/${HOST_USER}/shared/mlflow/minio" \
          bash dgx/minikube/mlflow/integrate-mlflow.sh

      - name: Set MLflow active state
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          var="${MACHINE}_MLFLOW_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="true" -f visibility="all"

      # ── Step 5: Deploy Qdrant ─────────────────────────────────────────────────
      - name: Deploy Qdrant
        run: |
          QDRANT_DATA_DIR="/home/${HOST_USER}/shared/qdrant-data" \
          bash dgx/minikube/qdrant/integrate-qdrant.sh

      - name: Set Qdrant active state
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          var="${MACHINE}_QDRANT_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="true" -f visibility="all"

      # ── Step 6: Deploy KFP ───────────────────────────────────────────────────
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.MIRAMAR_ORG_GHCR_PAT }}" \
            | docker login ghcr.io -u miramar-labs-org --password-stdin

      - name: Deploy Kubeflow Pipelines
        env:
          MIRAMAR_ORG_GHCR_PAT: ${{ secrets.MIRAMAR_ORG_GHCR_PAT }}
        run: |
          KFP_DATA_DIR="/home/${HOST_USER}/shared/kfp" \
          bash dgx/minikube/kubeflow/deploy-kubeflow.sh

      - name: Create KFP shared storage
        run: |
          # Apply PVs (skipped if already exist — spec is immutable after creation)
          kubectl get pv hf-model-cache &>/dev/null || kubectl apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: hf-model-cache
          spec:
            capacity:
              storage: 200Gi
            accessModes: [ReadWriteMany]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            hostPath:
              path: /home/${HOST_USER}/shared/huggingface-kfp/hub
          EOF
          kubectl get pv nsight-reports &>/dev/null || kubectl apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nsight-reports
          spec:
            capacity:
              storage: 50Gi
            accessModes: [ReadWriteMany]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            hostPath:
              path: /home/${HOST_USER}/shared/nsight
          EOF
          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: hf-model-cache
            namespace: kubeflow
          spec:
            accessModes: [ReadWriteMany]
            resources:
              requests:
                storage: 200Gi
            storageClassName: ""
            volumeName: hf-model-cache
          ---
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: nsight-reports
            namespace: kubeflow
          spec:
            accessModes: [ReadWriteMany]
            resources:
              requests:
                storage: 50Gi
            storageClassName: ""
            volumeName: nsight-reports
          EOF

      - name: Set KFP active state
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          var="${MACHINE}_KFP_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="true" -f visibility="all"

      # ── Finalise ─────────────────────────────────────────────────────────────
      - name: Set k3s active state
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${ACTIVE_VAR}" \
            -f name="${ACTIVE_VAR}" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${ACTIVE_VAR}" -f value="true" -f visibility="all"

      - name: Update k3s kubeconfig org secret
        env:
          GITHUB_ORG_ADMIN_PAT: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          KUBECONFIG_B64=$(base64 -w0 < "${HOME}/.kube/config")
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh secret set "${KUBECONFIG_SECRET}" \
            --org miramar-labs-org \
            --body "${KUBECONFIG_B64}"

      - name: Summary
        run: |
          {
            echo "## K3s Bootstrap Complete — ${{ inputs.runner }}"
            echo ""
            echo "| Component | Status |"
            echo "|---|---|"
            echo "| k3s | ✅ |"
            echo "| NVIDIA device plugin | ✅ |"
            echo "| nginx-ingress | ✅ |"
            echo "| Kubernetes Dashboard | ✅ port 8001 |"
            echo "| NeMo Microservices | ✅ |"
            echo "| MLflow | ✅ port 5000 |"
            echo "| Qdrant | ✅ port 6333 |"
            echo "| KFP | ✅ port 8080 |"
            echo ""
            echo "Next: deploy NIM (DGX) or Ollama (AGX) via their own workflows."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/bootstrap_key
