name: Build GHA Runner Images

on:
  push:
    branches:
      - main
    paths:
      - 'gha-runners/**'
      - '.github/workflows/build-gha-runners.yml'
  pull_request:
    paths:
      - 'gha-runners/**'
      - '.github/workflows/build-gha-runners.yml'
  workflow_dispatch:
    inputs:
      runner_version:
        description: 'GitHub Actions runner version (e.g. 2.334.0)'
        required: false
        default: '2.334.0'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/gha-runner
  RUNNER_VERSION: ${{ inputs.runner_version || '2.334.0' }}

jobs:
  build:
    name: Build ${{ matrix.platform }} runner
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            dockerfile: gha-runners/Dockerfile.amd64
            image_suffix: amd64
          - platform: arm64
            dockerfile: gha-runners/Dockerfile.arm64
            image_suffix: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.RUNNER_VERSION }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: gha-runners
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUNNER_VERSION=${{ env.RUNNER_VERSION }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
