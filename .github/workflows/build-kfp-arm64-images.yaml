name: Build KFP arm64 Images

# CURRENTLY BLOCKED — arm64 build of kfp-metadata-writer is not possible because
# its dependency ml-metadata==1.17.0 has no aarch64 wheel on PyPI and no sdist.
# Building it requires compiling ml-metadata from source with Bazel, the same
# complex build as ml_metadata_store_server.
#
# This workflow is preserved for when that blocker is resolved. At that point:
#   1. Build ml-metadata wheel for arm64 (clone google/ml-metadata, apply PR#188 patches, Bazel build)
#   2. Publish the wheel to a reachable location (GCS, GHCR, or bake into a custom base image)
#   3. Modify the build step here to install the arm64 wheel before running pip install
#   4. Re-enable the kubectl set image patches in deploy-kubeflow.sh
#
# References:
#   kubeflow/pipelines issue #12705 — arm64 support tracking
#   kubeflow/pipelines PR #12804 — added arm64 for most images, excluded metadata-writer
#   google/ml-metadata PR#188 — unmerged arm64 Bazel build fix
#   deployKF arm64 server: ghcr.io/deploykf/ml_metadata_store_server:1.14.0-deploykf.0

on:
  workflow_dispatch:
    inputs:
      pipeline_version:
        description: KFP version tag to build from (e.g. 2.16.1)
        default: "2.16.1"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-metadata-writer:
    name: Build kfp-metadata-writer (arm64)
    runs-on: [self-hosted, dgx]
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.pipeline_version || '2.16.1' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/kfp-metadata-writer

    steps:
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Clone KFP at version
        run: |
          rm -rf /tmp/kubeflow-pipelines
          git clone \
            --branch "${VERSION}" \
            --depth 1 \
            --single-branch \
            https://github.com/kubeflow/pipelines.git \
            /tmp/kubeflow-pipelines

      - name: Build kfp-metadata-writer for arm64
        run: |
          docker build \
            --platform linux/arm64 \
            --file /tmp/kubeflow-pipelines/backend/metadata_writer/Dockerfile \
            --tag "${IMAGE}:${VERSION}-arm64" \
            /tmp/kubeflow-pipelines

      - name: Push to GHCR
        run: docker push "${IMAGE}:${VERSION}-arm64"

      - name: Clean up clone
        if: always()
        run: rm -rf /tmp/kubeflow-pipelines

      - name: Summary
        if: always()
        run: |
          {
            echo "## KFP arm64 Image Build"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}:${VERSION}-arm64\` |"
            echo "| KFP version | \`${VERSION}\` |"
            echo "| Builder | \`$(uname -m)\` (native arm64) |"
            echo ""
            echo "Run **Kubeflow Deploy** to use this image."
          } >> "$GITHUB_STEP_SUMMARY"
