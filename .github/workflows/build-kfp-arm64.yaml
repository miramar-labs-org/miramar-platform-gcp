name: Build KFP arm64 Images

# Builds native arm64 images for all 13 Kubeflow Pipelines 2.x components that
# upstream publishes as amd64-only (tracked in kubeflow/pipelines#12705).
#
# 11 KFP components are built natively on the DGX arm64 runner from the KFP
# source at the specified version tag. Build context is the KFP repo root for
# all components (they share go.mod and each Dockerfile uses repo-relative
# paths).
#
# 2 MLMD components require Bazel and custom Dockerfiles from this repo:
#   ml_metadata_store_server — upstream hardcodes x86_64 Bazel installer; patched
#     to use Bazelisk (auto-selects arch). ~45-60 min first run; fast on cache.
#   kfp-metadata-writer — explicitly excluded from upstream arm64 CI; depends on
#     ml-metadata Python wheel which has no aarch64 PyPI build — built via Bazel.
#
# Two KFP components require patched Dockerfiles:
#   kfp-api-server — upstream uses $TARGETARCH (unset in plain docker build) for
#     the Argo CLI download URL, producing argo-linux-.gz (404); patch hardcodes
#     arm64. Patched version: dgx/minikube/kubeflow/arm64/<version>/Dockerfile.api-server
#   kfp-visualization-server — upstream hardcodes x86_64 in the gcloud SDK URL;
#     patched version: dgx/minikube/kubeflow/arm64/<version>/Dockerfile.visualization-server
#
# Images produced (all under ghcr.io/miramar-labs-org/):
#   ml_metadata_store_server, kfp-metadata-writer,
#   kfp-api-server, kfp-frontend, kfp-persistence-agent,
#   kfp-scheduled-workflow-controller, kfp-cache-server, kfp-cache-deployer,
#   kfp-viewer-crd-controller, kfp-metadata-envoy, kfp-visualization-server,
#   kfp-driver, kfp-launcher
#
# Run before Kubeflow Deploy when first deploying or after a version bump.
# Set "component" to rebuild a single image (e.g. after a Dockerfile patch).
# See dgx/minikube/kubeflow/arm64/README.md for full details.

on:
  workflow_dispatch:
    inputs:
      pipeline_version:
        description: KFP version tag (e.g. 2.16.1)
        default: "2.16.1"
        required: false
      mlmd_server_version:
        description: ml-metadata server version (1.14.0 for KFP 2.16.1)
        default: "1.14.0"
        required: false
      mlmd_wheel_version:
        description: ml-metadata Python wheel version (1.17.0 for KFP 2.16.1)
        default: "1.17.0"
        required: false
      component:
        description: "Component to build (e.g. kfp-api-server). Leave blank to build all 13."
        default: ""
        required: false

permissions:
  contents: read
  packages: write

jobs:
  # Generates the matrix based on the "component" input.
  # When component is blank all 13 are included; when set only that one runs.
  # This indirection is required because GHA does not allow `matrix` context
  # in a job-level `if:` expression.
  setup:
    runs-on: [self-hosted, dgx]
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - id: build-matrix
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          python3 << 'PYEOF'
          import json, os

          ALL = [
            {"component": "kfp-api-server",                    "type": "kfp", "patched_dockerfile": "Dockerfile.api-server"},
            {"component": "kfp-frontend",                      "type": "kfp"},
            {"component": "kfp-persistence-agent",             "type": "kfp"},
            {"component": "kfp-scheduled-workflow-controller", "type": "kfp"},
            {"component": "kfp-cache-server",                  "type": "kfp"},
            {"component": "kfp-cache-deployer",                "type": "kfp"},
            {"component": "kfp-viewer-crd-controller",         "type": "kfp"},
            {"component": "kfp-metadata-envoy",                "type": "kfp"},
            {"component": "kfp-visualization-server",          "type": "kfp", "patched_dockerfile": "Dockerfile.visualization-server"},
            {"component": "kfp-driver",                        "type": "kfp"},
            {"component": "kfp-launcher",                      "type": "kfp"},
            {"component": "ml-metadata-server",  "type": "mlmd", "image_name": "ml_metadata_store_server", "mlmd_dockerfile": "Dockerfile.mlmd-server",    "use_mlmd_server_version": True},
            {"component": "kfp-metadata-writer", "type": "mlmd", "image_name": "kfp-metadata-writer",      "mlmd_dockerfile": "Dockerfile.metadata-writer", "use_mlmd_server_version": False},
          ]

          # Upstream Dockerfile paths (used when no patched_dockerfile is set)
          UPSTREAM = {
            "kfp-api-server":                    "backend/Dockerfile",
            "kfp-frontend":                      "frontend/Dockerfile",
            "kfp-persistence-agent":             "backend/Dockerfile.persistenceagent",
            "kfp-scheduled-workflow-controller": "backend/Dockerfile.scheduledworkflow",
            "kfp-cache-server":                  "backend/Dockerfile.cacheserver",
            "kfp-cache-deployer":                "backend/src/cache/deployer/Dockerfile",
            "kfp-viewer-crd-controller":         "backend/Dockerfile.viewercontroller",
            "kfp-metadata-envoy":                "third_party/metadata_envoy/Dockerfile",
            "kfp-visualization-server":          "backend/Dockerfile.visualization",
            "kfp-driver":                        "backend/Dockerfile.driver",
            "kfp-launcher":                      "backend/Dockerfile.launcher",
          }

          for entry in ALL:
            if entry["type"] == "kfp":
              entry["dockerfile"] = UPSTREAM[entry["component"]]

          component = os.environ.get("COMPONENT", "").strip()
          subset = [e for e in ALL if e["component"] == component] if component else ALL

          matrix = json.dumps({"include": subset})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"matrix={matrix}\n")
          PYEOF

  build:
    needs: setup
    name: Build ${{ matrix.component }} (arm64)
    runs-on: [self-hosted, dgx]
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      KFP_VERSION: ${{ inputs.pipeline_version || '2.16.1' }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Clone kubeflow/pipelines at ${{ env.KFP_VERSION }}
        if: matrix.type == 'kfp'
        run: |
          git clone \
            --branch "${KFP_VERSION}" \
            --depth 1 \
            --single-branch \
            https://github.com/kubeflow/pipelines.git \
            kfp-src

      - name: Build ${{ matrix.component }} for arm64
        if: matrix.type == 'kfp'
        env:
          PATCHED_DOCKERFILE: ${{ matrix.patched_dockerfile }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}"
          if [ -n "${PATCHED_DOCKERFILE}" ]; then
            DOCKERFILE="dgx/minikube/kubeflow/arm64/${KFP_VERSION}/${PATCHED_DOCKERFILE}"
          else
            DOCKERFILE="kfp-src/${{ matrix.dockerfile }}"
          fi
          docker build \
            --network=host \
            -f "${DOCKERFILE}" \
            -t "${IMAGE}:${KFP_VERSION}-arm64" \
            kfp-src
          echo "BUILT_IMAGE=${IMAGE}:${KFP_VERSION}-arm64" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.component }} for arm64 (MLMD)
        if: matrix.type == 'mlmd'
        env:
          MLMD_SERVER_VERSION: ${{ inputs.mlmd_server_version || '1.14.0' }}
          MLMD_WHEEL_VERSION:  ${{ inputs.mlmd_wheel_version  || '1.17.0' }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}"
          if [ "${{ matrix.use_mlmd_server_version }}" = "true" ]; then
            TAG="${MLMD_SERVER_VERSION}-arm64"
            BUILD_ARGS="--build-arg MLMD_VERSION=${MLMD_SERVER_VERSION}"
          else
            TAG="${KFP_VERSION}-arm64"
            BUILD_ARGS="--build-arg KFP_VERSION=${KFP_VERSION} --build-arg MLMD_VERSION=${MLMD_WHEEL_VERSION}"
          fi
          docker build \
            --network=host \
            ${BUILD_ARGS} \
            -f "dgx/minikube/kubeflow/arm64/${KFP_VERSION}/${{ matrix.mlmd_dockerfile }}" \
            -t "${IMAGE}:${TAG}" \
            "dgx/minikube/kubeflow/arm64/${KFP_VERSION}"
          echo "BUILT_IMAGE=${IMAGE}:${TAG}" >> "$GITHUB_ENV"

      - name: Push to GHCR
        run: docker push "${BUILT_IMAGE}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.component }} arm64"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${BUILT_IMAGE}\` |"
            echo "| KFP version | \`${KFP_VERSION}\` |"
            echo "| Builder arch | \`$(uname -m)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
