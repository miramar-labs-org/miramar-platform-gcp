name: Build KFP arm64 Images

# Builds native arm64 images for all Kubeflow Pipelines 2.x components that
# upstream publishes as amd64-only (tracked in kubeflow/pipelines#12705).
#
# All components are built natively on the DGX arm64 runner from the KFP source
# at the specified version tag. Build context is the KFP repo root for all
# components (they share go.mod and each Dockerfile uses repo-relative paths).
#
# Two components require patched Dockerfiles:
#   kfp-api-server — upstream uses $TARGETARCH (unset in plain docker build) for the Argo
#     CLI download URL, producing argo-linux-.gz (404); patch hardcodes arm64.
#     Patched version: dgx/minikube/kubeflow/arm64/<version>/Dockerfile.api-server
#   kfp-visualization-server — upstream hardcodes x86_64 in the gcloud SDK URL;
#     patched version lives at dgx/minikube/kubeflow/arm64/<version>/Dockerfile.visualization-server
#
# Images produced (all under ghcr.io/miramar-labs-org/):
#   kfp-api-server, kfp-frontend, kfp-persistence-agent,
#   kfp-scheduled-workflow-controller, kfp-cache-server, kfp-cache-deployer,
#   kfp-viewer-crd-controller, kfp-metadata-envoy, kfp-visualization-server,
#   kfp-driver, kfp-launcher
#
# Run before Kubeflow Deploy when first deploying or after a version bump.
# Set "component" to rebuild a single image (e.g. after a Dockerfile patch).
# See dgx/minikube/kubeflow/arm64/README.md for full details.

on:
  workflow_dispatch:
    inputs:
      pipeline_version:
        description: KFP version tag (e.g. 2.16.1)
        default: "2.16.1"
        required: false
      component:
        description: "Component to build (e.g. kfp-api-server). Leave blank to build all 11."
        default: ""
        required: false

permissions:
  contents: read
  packages: write

jobs:
  # Generates the matrix based on the "component" input.
  # When component is blank all 11 are included; when set only that one runs.
  # This indirection is required because GHA does not allow `matrix` context
  # in a job-level `if:` expression.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - id: build-matrix
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          python3 << 'PYEOF'
          import json, os

          ALL = [
            {"component": "kfp-api-server",                    "patched_dockerfile": "Dockerfile.api-server"},
            {"component": "kfp-frontend"},
            {"component": "kfp-persistence-agent"},
            {"component": "kfp-scheduled-workflow-controller"},
            {"component": "kfp-cache-server"},
            {"component": "kfp-cache-deployer"},
            {"component": "kfp-viewer-crd-controller"},
            {"component": "kfp-metadata-envoy"},
            {"component": "kfp-visualization-server",          "patched_dockerfile": "Dockerfile.visualization-server"},
            {"component": "kfp-driver"},
            {"component": "kfp-launcher"},
          ]

          # Upstream Dockerfile paths (used when no patched_dockerfile is set)
          UPSTREAM = {
            "kfp-api-server":                    "backend/Dockerfile",
            "kfp-frontend":                      "frontend/Dockerfile",
            "kfp-persistence-agent":             "backend/Dockerfile.persistenceagent",
            "kfp-scheduled-workflow-controller": "backend/Dockerfile.scheduledworkflow",
            "kfp-cache-server":                  "backend/Dockerfile.cacheserver",
            "kfp-cache-deployer":                "backend/src/cache/deployer/Dockerfile",
            "kfp-viewer-crd-controller":         "backend/Dockerfile.viewercontroller",
            "kfp-metadata-envoy":                "third_party/metadata_envoy/Dockerfile",
            "kfp-visualization-server":          "backend/Dockerfile.visualization",
            "kfp-driver":                        "backend/Dockerfile.driver",
            "kfp-launcher":                      "backend/Dockerfile.launcher",
          }

          for entry in ALL:
            entry["dockerfile"] = UPSTREAM[entry["component"]]

          component = os.environ.get("COMPONENT", "").strip()
          subset = [e for e in ALL if e["component"] == component] if component else ALL

          matrix = json.dumps({"include": subset})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"matrix={matrix}\n")
          PYEOF

  build:
    needs: setup
    name: Build ${{ matrix.component }} (arm64)
    runs-on: [self-hosted, dgx]
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      KFP_VERSION: ${{ inputs.pipeline_version || '2.16.1' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Clone kubeflow/pipelines at ${{ env.KFP_VERSION }}
        run: |
          git clone \
            --branch "${KFP_VERSION}" \
            --depth 1 \
            --single-branch \
            https://github.com/kubeflow/pipelines.git \
            kfp-src

      - name: Build ${{ matrix.component }} for arm64
        env:
          PATCHED_DOCKERFILE: ${{ matrix.patched_dockerfile }}
        run: |
          if [ -n "${PATCHED_DOCKERFILE}" ]; then
            DOCKERFILE="dgx/minikube/kubeflow/arm64/${KFP_VERSION}/${PATCHED_DOCKERFILE}"
          else
            DOCKERFILE="kfp-src/${{ matrix.dockerfile }}"
          fi
          docker build \
            --network=host \
            -f "${DOCKERFILE}" \
            -t "${IMAGE}:${KFP_VERSION}-arm64" \
            kfp-src

      - name: Push to GHCR
        run: docker push "${IMAGE}:${KFP_VERSION}-arm64"

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.component }} arm64"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}:${KFP_VERSION}-arm64\` |"
            echo "| KFP version | \`${KFP_VERSION}\` |"
            echo "| Builder arch | \`$(uname -m)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
