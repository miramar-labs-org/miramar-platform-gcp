name: Build MLABS Runner Image

on:
  push:
    branches:
      - main
    paths:
      - 'mlabs-runner/**'
      - '.github/workflows/build-mlabs-runner.yml'
  pull_request:
    paths:
      - 'mlabs-runner/**'
      - '.github/workflows/build-mlabs-runner.yml'
  workflow_dispatch:
    inputs:
      runner_version:
        description: 'GitHub Actions runner version (e.g. 2.334.0)'
        required: false
        default: '2.334.0'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/mlabs-runner
  RUNNER_VERSION: ${{ inputs.runner_version || '2.334.0' }}

jobs:
  build:
    name: Build multi-arch runner image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.RUNNER_VERSION }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mlabs-runner
          file: mlabs-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUNNER_VERSION=${{ env.RUNNER_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
