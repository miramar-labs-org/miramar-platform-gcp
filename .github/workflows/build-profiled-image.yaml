name: Build Profiled PyTorch Image

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push profiled PyTorch image
        run: |
          NGC_TAG=$(grep '^FROM' docker/Dockerfile.profiled | sed 's|.*pytorch:\(.*\)-py3|\1|')
          IMAGE="ghcr.io/miramar-labs-org/pytorch-profiled:${NGC_TAG}"
          docker build -f docker/Dockerfile.profiled -t "$IMAGE" -t "ghcr.io/miramar-labs-org/pytorch-profiled:latest" docker/
          docker push "$IMAGE"
          docker push "ghcr.io/miramar-labs-org/pytorch-profiled:latest"
          echo "Pushed $IMAGE and :latest"
