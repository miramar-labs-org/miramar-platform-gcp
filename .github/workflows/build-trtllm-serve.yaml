name: Build TRT-LLM Serve Image

# Builds ghcr.io/miramar-labs-org/mlabs-trtllm-serve for arm64 (DGX/AGX K3s).
# Used as the base image for serving-trt-engine projects.
# Run this when upgrading tensorrt-llm or updating the Dockerfile.

on:
  workflow_dispatch:
    inputs:
      trtllm_version:
        description: "tensorrt-llm pip version to install"
        required: false
        default: "0.18.2"
  push:
    branches: [main]
    paths:
      - platform-images/trtllm-serve/Dockerfile

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/miramar-labs-org/mlabs-trtllm-serve

jobs:
  build:
    runs-on: [self-hosted, dgx]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ env.GITHUB_ORG_GHCR_PAT }}" | docker login ghcr.io -u miramar-labs-org --password-stdin
        env:
          GITHUB_ORG_GHCR_PAT: ${{ env.GITHUB_ORG_GHCR_PAT }}

      - name: Set version tag
        run: |
          VERSION="${{ inputs.trtllm_version || '0.18.2' }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ env.IMAGE }}:${VERSION}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --build-arg TRTLLM_VERSION="${VERSION}" \
            -t "$IMAGE_TAG" \
            -t "${{ env.IMAGE }}:latest" \
            platform-images/trtllm-serve/

      - name: Push image
        run: |
          docker push "$IMAGE_TAG"
          docker push "${{ env.IMAGE }}:latest"

      - name: Summary
        run: |
          {
            echo "## TRT-LLM Serve Image Built"
            echo "- **Image:** \`$IMAGE_TAG\`"
            echo "- **TRT-LLM version:** ${VERSION}"
            echo "- **Arch:** arm64 (DGX/AGX K3s)"
          } >> "$GITHUB_STEP_SUMMARY"
