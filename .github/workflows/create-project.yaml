              echo "3. Trigger **Deploy** with \`host=dgx\` (engine_gb10) / \`host=agx\` (engine_sm87) / \`host=gke\` (engine_l4)"
              echo "4. Trigger **Undeploy** when done to stop costs / free GPU memory"
              echo ""
              echo "Prerequisites: Compiled TRT-LLM engines must exist at \`~/shared/huggingface-kfp/engines/<project>/<run_id>/engine_<target>/\`"
            elif [ "${PROJECT_TYPE}" = "nemo-ft-eval" ]; then
              echo "### Next steps"
              echo "1. Edit \`config.yaml\` — set \`model.id\` (NeMo catalog), \`model.hf_id\` (HuggingFace), \`nemo.base_url\`, datasets, thresholds"
              echo "2. Edit \`formatters.py\` / \`loaders.py\` — add one formatter/loader per dataset"
              echo "3. Open \`notebook.ipynb\` and implement the NeMo-specific USER CODE BLOCKs (see WORKBOOK.md)"
              echo "4. Run the **Build → \`pipeline.py\`** cell in the notebook"
              echo "5. Trigger **Deploy to KFP** to compile and submit a run"
              echo ""
              echo "Prerequisites: **Kubeflow Deploy** + **NeMo Deploy** must be running on \`${HOST}\`"
            elif [ "${PROJECT_TYPE}" = "kfp-rag" ]; then
              echo "### Next steps"
              echo "1. Edit \`config.yaml\` — set \`llm.base_url\`, \`llm.model\`, Qdrant URL, eval thresholds"
              echo "2. Add domain documents to \`docs_src/\` (.txt or .md)"
              echo "3. Edit \`eval_dataset.jsonl\` — replace stub rows with real Q&A pairs (aim for ≥ 20)"
              echo "4. Open \`notebook.ipynb\` — implement the 4 USER CODE BLOCKs (see WORKBOOK.md)"
              echo "5. Run the **Build → \`pipeline.py\`** cell in the notebook"
              echo "6. Trigger **Deploy to KFP** to ingest, eval, and gate"
              echo ""
              echo "Prerequisites: **Kubeflow Deploy** + **Qdrant Deploy** must be running on \`${HOST}\`; an active serving project for \`llm.base_url\`"
            elif [ "${PROJECT_TYPE}" = "kfp-nemo-curator" ]; then
              echo "### Next steps"
              echo "1. Add source documents to \`data_src/\` (.txt, .md, .html, or .jsonl)"
              echo "2. Edit \`config.yaml\` — set \`input.format\`, quality thresholds, dedup threshold, PII entity list"
              echo "3. Open \`notebook.ipynb\` — implement the 4 USER CODE BLOCKs (see WORKBOOK.md)"
              echo "4. Run the **Build → \`pipeline.py\`** cell in the notebook"
              echo "5. Trigger **Deploy to KFP** to run the curation pipeline"
              echo "6. Check \`~/shared/huggingface-kfp/curator-output/${PROJECT_NAME}/\` for the curation report"
              echo ""
              echo "Prerequisites: **Kubeflow Deploy** must be running on \`${HOST}\`"
              echo "GPU note: \`quality_filter\` and \`deduplication\` install \`nemo-curator[cuda12x]\` from pypi.nvidia.com — verify arm64 wheel availability on first run"
            else
              echo "No additional next steps."
            fi
            if [[ -n "${BLOG_PR_URL:-}" ]]; then
              echo ""
              echo "**Blog draft PR:** ${BLOG_PR_URL}"
            fi
