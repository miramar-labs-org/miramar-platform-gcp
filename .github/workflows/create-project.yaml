name: Create Project

# Creates a new GitHub repository under miramar-labs-org pre-wired
# to the Miramar platform. Defaults to public so projects appear in the dashboard.
#
# default      — generic notebook + platform endpoint reference
# kfp          — KFP v2 pipeline stub, notebook, deploy/undeploy KFP workflows
# kfp-ft-eval  — KFP v2 eval-first fine-tuning pipeline, config-driven 6-step scaffold
# nemo         — NeMo training job config, notebook, deploy/undeploy NeMo workflows
#
# The host input sets which machine (dgx/agx) the project lives on:
#   - controls which runner clones the repo on creation
#   - stored as PROJECT_HOST repo variable, read by the dashboard
#
# Uses GITHUB_ORG_ADMIN_PAT (runner env var from launch-runner.sh) for repo
# creation and initial push. No GitHub secrets required.

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Repository name (e.g. my-llm-experiment)
        required: true
      project_type:
        description: Project type
        type: choice
        options: [default, kfp, kfp-ft-eval, nemo]
        default: default
        required: true
      host:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        options: [dgx, agx]
        default: dgx
        required: false
      description:
        description: Short repo description (optional)
        default: ""
        required: false
      repo_visibility:
        description: Repository visibility
        type: choice
        options: [public, private]
        default: public
        required: false
      requirements:
        description: "Default Python packages for the project venv (space-separated). Edit to customize."
        default: "ipykernel ipywidgets numpy pandas matplotlib seaborn scikit-learn tqdm transformers datasets huggingface_hub evaluate accelerate openai anthropic mlflow qdrant-client pyyaml requests python-dotenv nvidia-ml-py"
        required: false

permissions:
  contents: read

jobs:
  create:
    runs-on: [self-hosted, "${{ inputs.host }}"]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Resolve host vars
        run: |
          if [[ "${{ inputs.host }}" == "agx" ]]; then
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}" >> "$GITHUB_ENV"
          else
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}" >> "$GITHUB_ENV"
          fi

      - name: Create repository
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          DESCRIPTION: ${{ inputs.description }}
          PROJECT_TYPE: ${{ inputs.project_type }}
          REPO_VISIBILITY: ${{ inputs.repo_visibility }}
        run: |
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh repo create \
            "miramar-labs-org/${PROJECT_NAME}" \
            --${REPO_VISIBILITY} \
            --description "${DESCRIPTION:-${PROJECT_TYPE} project}"
          echo "Created miramar-labs-org/${PROJECT_NAME}"

      - name: Set repository topics
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_TYPE: ${{ inputs.project_type }}
        run: |
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X PUT \
            "repos/miramar-labs-org/${PROJECT_NAME}/topics" \
            -f "names[]=miramar-project" \
            -f "names[]=miramar-${PROJECT_TYPE}"

      - name: Set PROJECT_HOST variable
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          HOST: ${{ inputs.host }}
        run: |
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X PATCH "repos/miramar-labs-org/${PROJECT_NAME}/actions/variables/PROJECT_HOST" \
            -f value="${HOST}" 2>/dev/null || \
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X POST "repos/miramar-labs-org/${PROJECT_NAME}/actions/variables" \
            -f name="PROJECT_HOST" -f value="${HOST}"

      - name: Initialise repository with template
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_TYPE: ${{ inputs.project_type }}
          HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail

          WORK_DIR=$(mktemp -d)
          trap 'rm -rf "${WORK_DIR}"' EXIT

          git config --global user.email "actions@github.com"
          git config --global user.name "Miramar Platform"

          cd "${WORK_DIR}"
          git init
          git checkout -b main

          # Copy the appropriate template (includes hidden .github/ dir)
          cp -r "${GITHUB_WORKSPACE}/templates/new-project-${PROJECT_TYPE}/." .

          # Replace placeholders in all text files
          YEAR=$(date +%Y)
          CHANGE_DATE="$((YEAR + 4))-01-01"
          JL_PORT=8888; [[ "${HOST}" == "agx" ]] && JL_PORT=8887
          JL_URL="http://localhost:${JL_PORT}/lab/tree/git-miramar-labs-org/projects/${PROJECT_NAME}/notebook.ipynb"
          find . -type f \( -name "*.md" -o -name "*.ipynb" -o -name "*.yaml" -o -name "*.py" -o -name "LICENSE" \) \
            -exec sed -i \
              -e "s/{{PROJECT_NAME}}/${PROJECT_NAME}/g" \
              -e "s/{{PROJECT_HOST}}/${HOST}/g" \
              -e "s/{{YEAR}}/${YEAR}/g" \
              -e "s/{{CHANGE_DATE}}/${CHANGE_DATE}/g" \
              -e "s|{{JL_URL}}|${JL_URL}|g" \
            {} +

          # Inject CI workflow badges after the title line for kfp and nemo types.
          # (default type has no CI badges — the JupyterLab button is in the template itself.)
          # Each badge is a separate variable so no line falls to column 0
          # (which would break the YAML block scalar).
          ORG_URL="https://github.com/miramar-labs-org/${PROJECT_NAME}"
          WF="${ORG_URL}/actions/workflows"
          if [ "${PROJECT_TYPE}" = "kfp" ] || [ "${PROJECT_TYPE}" = "kfp-ft-eval" ]; then
            BADGE_2="[![Deploy to KFP](${WF}/deploy-kfp.yaml/badge.svg)](${WF}/deploy-kfp.yaml)"
            BADGE_3="[![Undeploy from KFP](${WF}/undeploy-kfp.yaml/badge.svg)](${WF}/undeploy-kfp.yaml)"
            { head -1 README.md; printf '\n%s\n%s\n' "${BADGE_2}" "${BADGE_3}"; tail -n +2 README.md; } > README.tmp
            mv README.tmp README.md
          elif [ "${PROJECT_TYPE}" = "nemo" ]; then
            BADGE_2="[![Deploy to NeMo](${WF}/deploy-nemo.yaml/badge.svg)](${WF}/deploy-nemo.yaml)"
            BADGE_3="[![Undeploy from NeMo](${WF}/undeploy-nemo.yaml/badge.svg)](${WF}/undeploy-nemo.yaml)"
            { head -1 README.md; printf '\n%s\n%s\n' "${BADGE_2}" "${BADGE_3}"; tail -n +2 README.md; } > README.tmp
            mv README.tmp README.md
          fi

          # Write requirements.txt: start from workflow input, then append
          # type-specific packages (kfp or nemo-microservices).
          REQS="${{ inputs.requirements }}"
          [[ "${PROJECT_TYPE}" = "kfp" ]] && REQS="${REQS} kfp>=2.0.0"
          [[ "${PROJECT_TYPE}" = "kfp-ft-eval" ]] && REQS="${REQS} kfp>=2.0.0 kfp-kubernetes"
          [[ "${PROJECT_TYPE}" = "nemo" ]] && REQS="${REQS} nemo-microservices"
          printf '%s\n' ${REQS} > requirements.txt

          git add .
          [ -d .github ] && git add -f .github/  # force-add workflows if present (not in default template)
          git commit -m "Initial scaffold (type: ${PROJECT_TYPE}, host: ${HOST}) from Miramar template"

          git remote add origin \
            "https://x-access-token:${GITHUB_ORG_ADMIN_PAT}@github.com/miramar-labs-org/${PROJECT_NAME}.git"
          git push -u origin main

      - name: Clone to host projects folder
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          SCRIPT: |
            set -euo pipefail
            mkdir -p "${HOME}/git-miramar-labs-org/projects"
            DEST="${HOME}/git-miramar-labs-org/projects/${PROJECT_NAME}"
            if [ -d "${DEST}/.git" ]; then
              git -C "${DEST}" fetch origin
              git -C "${DEST}" reset --hard origin/main
              echo "Reset to origin/main: ${DEST}"
            else
              git clone \
                "https://x-access-token:${PAT}@github.com/miramar-labs-org/${PROJECT_NAME}.git" \
                "${DEST}"
              echo "Cloned to: ${DEST}"
            fi

            # Create per-project venv and register as a named JupyterLab kernel.
            VENV="${DEST}/.venv"
            if [ ! -x "${VENV}/bin/pip" ]; then
              rm -rf "${VENV}"
              python3 -c "import ensurepip" 2>/dev/null || sudo apt-get install -y --no-install-recommends python3-venv
              python3 -m venv "${VENV}"
              echo "Created venv: ${VENV}"
            fi
            "${VENV}/bin/pip" install --quiet --upgrade pip
            "${VENV}/bin/pip" install --quiet ipykernel
            if [ -f "${DEST}/requirements.txt" ]; then
              echo "Installing requirements.txt ..."
              "${VENV}/bin/pip" install --quiet -r "${DEST}/requirements.txt"
            fi
            "${VENV}/bin/python" -m ipykernel install --user \
              --name "${PROJECT_NAME}" \
              --display-name "${PROJECT_NAME}"
            echo "Kernel registered: ${PROJECT_NAME}"
        run: |
          if [ ! -f ~/.ssh/id_ed25519 ]; then
            echo "WARNING: ~/.ssh/id_ed25519 not found — skipping host clone" >&2
            exit 0
          fi
          printf '%s' "${SCRIPT}" \
            | ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                "${HOST_USER:-aaron}@localhost" \
                env PROJECT_NAME="${PROJECT_NAME}" \
                    PAT="${GITHUB_ORG_ADMIN_PAT}" bash

      - name: Draft blog post
        continue-on-error: true
        run: |
          set -euo pipefail
          BLOG_REPO="miramar-labs-org/miramar-labs-org.github.io"
          POST_DATE=$(date +%Y-%m-%d)
          PROJECT_NAME="${{ inputs.project_name }}"
          PROJECT_TYPE="${{ inputs.project_type }}"
          HOST="${{ inputs.host }}"
          DESCRIPTION="${{ inputs.description }}"
          BRANCH="draft-${PROJECT_NAME}"
          POST_SLUG=$(echo "${PROJECT_NAME}" | tr '[:upper:]' '[:lower:]')
          POST_PATH="_posts/${POST_DATE}-${POST_SLUG}.markdown"
          POST_TITLE=$(echo "${PROJECT_NAME}" | sed 's/-/ /g;s/\b\w/\u&/g')
          REPO_URL="https://github.com/miramar-labs-org/${PROJECT_NAME}"
          DASHBOARD_URL="https://miramar-labs-org.github.io/miramar-platform-gcp/"
          if [ "${HOST}" = "agx" ]; then HW="AGX Orin"; else HW="DGX Spark"; fi

          MAIN_SHA=$(GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            "repos/${BLOG_REPO}/git/refs/heads/main" --jq '.object.sha')
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api -X POST \
            "repos/${BLOG_REPO}/git/refs" \
            -f ref="refs/heads/${BRANCH}" -f sha="${MAIN_SHA}" 2>/dev/null \
          || echo "Branch already exists, continuing."

          if [ "${PROJECT_TYPE}" = "nemo" ]; then
            CATS="miramar nemo fine-tuning"
            BODY=$(printf '%s\n' \
              "${DESCRIPTION:-<!-- TODO: one-sentence description -->}" "" \
              "**Platform:** ${HW} via [Miramar Platform](${DASHBOARD_URL})" \
              "**Repo:** [miramar-labs-org/${PROJECT_NAME}](${REPO_URL})" "" \
              "## Training setup" "" "<!-- TODO: NeMo version, training framework -->" "" \
              "## Model and dataset" "" \
              "| Parameter | Value |" "|-----------|-------|" \
              "| Base model | <!-- TODO --> |" "| Dataset | <!-- TODO --> |" \
              "| Epochs | <!-- TODO --> |" "| Batch size | <!-- TODO --> |" "" \
              "## LoRA configuration" "" "<!-- TODO: rank, alpha, target modules -->" "" \
              "\`\`\`yaml" "# excerpt from job_config.yaml" "\`\`\`" "" \
              "## Evaluation results" "" \
              "| Metric | Base model | Fine-tuned |" "|--------|------------|------------|" \
              "| <!-- TODO --> | | |" "" \
              "## Next steps" "" "<!-- TODO -->")
          elif [ "${PROJECT_TYPE}" = "kfp" ]; then
            CATS="miramar kubeflow pipelines"
            BODY=$(printf '%s\n' \
              "${DESCRIPTION:-<!-- TODO: one-sentence description -->}" "" \
              "**Platform:** ${HW} via [Miramar Platform](${DASHBOARD_URL})" \
              "**Repo:** [miramar-labs-org/${PROJECT_NAME}](${REPO_URL})" "" \
              "## Pipeline description" "" "<!-- TODO: inputs, outputs, purpose -->" "" \
              "## Steps" "" \
              "| Step | Input | Output |" "|------|-------|--------|" \
              "| <!-- TODO --> | | |" "" \
              "## Artifact lineage" "" "<!-- TODO: models, datasets, metrics produced -->" "" \
              "\`\`\`python" "# TODO: pipeline.py excerpt" "\`\`\`" "" \
              "## Results" "" "<!-- TODO: run results, metrics, KFP UI screenshots -->" "" \
              "## Next steps" "" "<!-- TODO -->")
          elif [ "${PROJECT_TYPE}" = "kfp-ft-eval" ]; then
            CATS="miramar kubeflow fine-tuning"
            BODY=$(printf '%s\n' \
              "${DESCRIPTION:-<!-- TODO: one-sentence description -->}" "" \
              "**Platform:** ${HW} via [Miramar Platform](${DASHBOARD_URL})" \
              "**Repo:** [miramar-labs-org/${PROJECT_NAME}](${REPO_URL})" "" \
              "## Pipeline" "" "<!-- TODO: base model, dataset, fine-tuning approach -->" "" \
              "## Steps" "" \
              "| Step | Description |" "|------|-------------|" \
              "| \`prepare_dataset\` | <!-- TODO --> |" \
              "| \`baseline_eval\` | <!-- TODO --> |" \
              "| \`fine_tune\` | <!-- TODO --> |" \
              "| \`post_finetune_eval\` | <!-- TODO --> |" \
              "| \`safety_eval\` | <!-- TODO --> |" \
              "| \`deployment_gate\` | <!-- TODO --> |" "" \
              "## Configuration" "" \
              "| Parameter | Value |" "|-----------|-------|" \
              "| Base model | <!-- TODO --> |" "| Dataset(s) | <!-- TODO --> |" \
              "| LoRA rank | <!-- TODO --> |" "| Epochs | <!-- TODO --> |" "" \
              "## Evaluation results" "" \
              "| Metric | Base | Fine-tuned |" "|--------|------|------------|" \
              "| Accuracy | | |" "| Safety score | | |" "" \
              "## Next steps" "" "<!-- TODO -->")
          else
            CATS="miramar ml project"
            BODY=$(printf '%s\n' \
              "${DESCRIPTION:-<!-- TODO: one-sentence description -->}" "" \
              "**Platform:** ${HW} via [Miramar Platform](${DASHBOARD_URL})" \
              "**Repo:** [miramar-labs-org/${PROJECT_NAME}](${REPO_URL})" "" \
              "## Overview" "" "<!-- TODO: problem, approach, why -->" "" \
              "## Approach" "" "<!-- TODO: model, techniques, libraries -->" "" \
              "## Dataset" "" "<!-- TODO: source, size, preprocessing -->" "" \
              "## Results" "" \
              "| Metric | Value |" "|--------|-------|" "| <!-- TODO --> | |" "" \
              "## Next steps" "" "<!-- TODO -->")
          fi

          CONTENT_B64=$(printf '%s\n' \
            "---" "layout: post" "title: \"${POST_TITLE}\"" \
            "date: ${POST_DATE}" "categories: ${CATS}" "---" "" \
            "${BODY}" | base64 -w0)

          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api -X PUT \
            "repos/${BLOG_REPO}/contents/${POST_PATH}" \
            -f message="Draft: ${PROJECT_NAME} (${PROJECT_TYPE})" \
            -f content="${CONTENT_B64}" -f branch="${BRANCH}"

          PR_BODY=$(printf 'Auto-generated draft for **%s**. Edit the TODOs in `%s` then merge to publish.\n\n- Type: `%s`\n- Host: `%s` (%s)\n- Repo: %s\n- Dashboard: %s' \
            "${PROJECT_NAME}" "${POST_PATH}" "${PROJECT_TYPE}" "${HOST}" "${HW}" "${REPO_URL}" "${DASHBOARD_URL}")
          PR_URL=$(GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api -X POST \
            "repos/${BLOG_REPO}/pulls" \
            -f title="Draft: ${POST_TITLE} — ${PROJECT_TYPE}" \
            -f head="${BRANCH}" -f base="main" \
            -f body="${PR_BODY}" \
            --jq '.html_url')

          echo "Blog PR: ${PR_URL}"
          echo "BLOG_PR_URL=${PR_URL}" >> "$GITHUB_ENV"

      - name: Checkout blog draft on host
        continue-on-error: true
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          SCRIPT: |
            set -euo pipefail
            BLOG_DIR="${HOME}/git-miramar-labs-org/miramar-labs-org.github.io"
            DRAFT_BRANCH="draft-${PROJECT_NAME}"
            if [ ! -d "${BLOG_DIR}/.git" ]; then
              echo "Blog repo not on host — skipping"
              exit 0
            fi
            git -C "${BLOG_DIR}" fetch --quiet origin
            git -C "${BLOG_DIR}" checkout "${DRAFT_BRANCH}" 2>/dev/null || \
              git -C "${BLOG_DIR}" checkout -b "${DRAFT_BRANCH}" --track "origin/${DRAFT_BRANCH}"
            echo "Blog checked out: ${DRAFT_BRANCH}"
        run: |
          if [ ! -f ~/.ssh/id_ed25519 ]; then
            echo "WARNING: no SSH key — skipping blog checkout" >&2
            exit 0
          fi
          printf '%s' "${SCRIPT}" \
            | ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                "${HOST_USER:-aaron}@localhost" \
                env PROJECT_NAME="${PROJECT_NAME}" bash

      - name: Summary
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_TYPE: ${{ inputs.project_type }}
          HOST: ${{ inputs.host }}
          REPO_VISIBILITY: ${{ inputs.repo_visibility }}
        run: |
          REPO_URL="https://github.com/miramar-labs-org/${PROJECT_NAME}"
          JL_PORT=8888; [[ "${HOST}" == "agx" ]] && JL_PORT=8887
          JL_URL="http://localhost:${JL_PORT}/lab/tree/git-miramar-labs-org/projects/${PROJECT_NAME}"
          {
            echo "## New ${PROJECT_TYPE} Project Created"
            echo ""
            echo "**Repository:** [${REPO_URL}](${REPO_URL})"
            echo "**Type:** \`${PROJECT_TYPE}\`"
            echo "**Host:** \`${HOST}\`"
            echo "**Visibility:** \`${REPO_VISIBILITY}\`"
            echo "**JupyterLab:** [${JL_URL}](${JL_URL})"
            echo ""
            if [ "${PROJECT_TYPE}" = "default" ]; then
              echo "### Next steps"
              echo "1. Edit \`README.md\` — add a one-line description"
              echo "2. Open SSH tunnel: \`ssh -L ${JL_PORT}:localhost:8888 aaron@$([ "${HOST}" = "agx" ] && echo "orin.local" || echo "spark-79b7.local")\`"
              echo "3. Open \`notebook.ipynb\` — the \`${PROJECT_NAME}\` kernel is ready"
            elif [ "${PROJECT_TYPE}" = "kfp" ]; then
              echo "### Next steps"
              echo "1. Edit \`pipeline.py\` to define your pipeline components"
              echo "2. Trigger **Deploy to KFP** to compile and submit a run"
              echo "3. Prerequisites: **Kubeflow Deploy** must be running on \`${HOST}\`"
            elif [ "${PROJECT_TYPE}" = "kfp-ft-eval" ]; then
              echo "### Next steps"
              echo "1. Edit \`config.yaml\` — set model ID, datasets, thresholds, and judge prompt"
              echo "2. Edit \`formatters.py\` — add one formatter per dataset, register in \`FORMATTERS\`"
              echo "3. Open \`notebook.ipynb\` and implement the \`TODO\` logic in each component cell"
              echo "4. Run the **Build → \`pipeline.py\`** cell"
              echo "5. Trigger **Deploy to KFP** to compile and submit a run"
              echo "6. Prerequisites: **Kubeflow Deploy** must be running on \`${HOST}\`"
            else
              echo "### Next steps"
              echo "1. Edit \`job_config.yaml\` — set model, dataset path, hyperparameters"
              echo "2. Trigger **Deploy to NeMo** to submit the job"
              echo "3. Prerequisites: **NeMo Deploy** must be running on \`${HOST}\`"
            fi
            if [[ -n "${BLOG_PR_URL:-}" ]]; then
              echo ""
              echo "**Blog draft PR:** ${BLOG_PR_URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
