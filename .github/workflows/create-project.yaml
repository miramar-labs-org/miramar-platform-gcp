              echo "### Next steps"
              echo "1. Set \`adapter.manifest_uri\` in \`serving-config.yaml\` — run \`publish-adapter.yaml\` on the FT project first"
              echo "2. Trigger **Build and Push** with \`host=dgx\` (GHCR) or \`host=gke\` (GAR)"
              echo "3. Trigger **Deploy** with \`host=dgx|agx\` (K3s) or \`host=gke\` (L4 spot)"
              echo "4. Trigger **Undeploy** when done to stop costs / free GPU memory"
              echo ""
              echo "Prerequisites: \`gcp-platform-create.yaml\` must have run to provision \`gs://miramar-platform-ft-adapters\`"
            elif [ "${PROJECT_TYPE}" = "serving-nim" ]; then
              echo "### Next steps"
              echo "1. Fill in \`serving-config.yaml\` — set \`nim.org\`, \`nim.model_name\`, \`nim.dgx_image_tag\`, \`nim.gke_image_tag\`"
              echo "2. Trigger **Deploy** with \`host=dgx\` (K3s) or \`host=gke\` (L4 spot)"
              echo "3. Trigger **Undeploy** when done to stop costs / free GPU memory"
              echo ""
              echo "Prerequisites: \`secrets.NGC_API_KEY\` must be set (org-level secret)"
            elif [ "${PROJECT_TYPE}" = "serving-llm-nim" ]; then
              echo "### Next steps"
              echo "1. Verify \`serving-config.yaml\` — confirm \`model.host_path\` points to your merged model weights on DGX"
              echo "2. Optional: run \`bash scripts/list-profiles.sh\` locally to validate NIM compatibility before deploy"
              echo "3. Trigger **Deploy** to deploy the model as a NIM service on DGX K3s"
              echo "4. Trigger **Undeploy** when done to free GPU memory"
              echo ""
              echo "Prerequisites: \`secrets.NGC_API_KEY\` must be set (org-level secret); model must be full merged weights (not LoRA adapter)"
            elif [ "${PROJECT_TYPE}" = "serving-trt-fp8" ]; then
              echo "### Next steps"
              echo "1. Fill in \`serving-config.yaml\` — set \`compression.project\` and \`compression.run_id\`"
              echo "2. For GKE: Trigger **Build and Push** to bake FP8 checkpoint into GAR image"
              echo "3. Trigger **Deploy** with \`host=dgx|agx\` (hostPath) or \`host=gke\` (baked image)"
              echo "4. Trigger **Undeploy** when done to stop costs / free GPU memory"
              echo ""
              echo "Prerequisites: FP8 checkpoint must exist at \`~/shared/huggingface-kfp/quantization/<project>/<run_id>/\`"
