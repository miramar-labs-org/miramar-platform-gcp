              echo "1. Edit \`config.yaml\` — set model ID, datasets, thresholds, and judge prompt"
              echo "2. Edit \`formatters.py\` — add one formatter per dataset, register in \`FORMATTERS\`"
              echo "3. Edit \`loaders.py\` — add one loader lambda per dataset, register in \`LOADERS\`"
              echo "4. Open \`notebook.ipynb\` and implement any remaining \`TODO\` logic in component cells"
              echo "5. Run the **Build → \`pipeline.py\`** cell"
              echo "6. Trigger **Deploy to KFP** to compile and submit a run"
              echo "7. Prerequisites: **Kubeflow Deploy** must be running on \`${HOST}\`"
