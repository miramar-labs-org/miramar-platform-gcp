name: Create Project

# Creates a new GitHub repository under miramar-labs-org pre-wired
# to the Miramar platform. Defaults to public so projects appear in the dashboard.
#
# default          — generic notebook + platform endpoint reference
# kfp              — KFP v2 pipeline stub, notebook, deploy/undeploy KFP workflows
# ft-eval      — KFP v2 eval-first fine-tuning pipeline, config-driven 6-step scaffold
# nemo-ft-eval     — NeMo Customizer fine-tuning + eval pipeline, parity with ft-eval
# serving-vllm — vLLM LoRA adapter serving on GKE (L4 spot); build-push/deploy/undeploy workflows
#
# The host input sets which machine (dgx/agx) the project lives on:
#   - controls which runner clones the repo on creation
#   - stored as PROJECT_HOST repo variable, read by the dashboard
#
# Uses GITHUB_ORG_ADMIN_PAT (runner env var from launch-runner.sh) for repo
# creation and initial push. No GitHub secrets required.

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Repository name (e.g. my-llm-experiment)
        required: true
      project_type:
        description: Project type
        type: choice
        options: [default, kfp, ft-eval, nemo-ft-eval, serving-vllm, serving-nim, serving-llm-nim, serving-trt-fp8, serving-trt-engine, kfp-rag, kfp-nemo-curator]
        default: default
        required: true
      host:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        options: [dgx, agx]
        default: dgx
        required: false
      description:
        description: Short repo description (optional)
        default: ""
        required: false
      repo_visibility:
        description: Repository visibility
        type: choice
        options: [public, private]
        default: public
        required: false
      requirements:
        description: "Default Python packages for the project venv (space-separated). Edit to customize."
        default: "ipykernel ipywidgets numpy pandas matplotlib seaborn scikit-learn tqdm transformers datasets huggingface_hub evaluate accelerate openai anthropic mlflow qdrant-client pyyaml requests python-dotenv nvidia-ml-py"
        required: false
      hf_model_id:
        description: "HuggingFace model ID (ft-eval only, e.g. Qwen/Qwen2.5-7B-Instruct)"
        default: "org/model"
        required: false
      hf_dataset_id:
        description: "HuggingFace dataset ID (ft-eval only, e.g. allenai/ai2_arc)"
        default: "org/dataset"
        required: false
      served_model_name:
        description: "Stable model alias for the API (serving-vllm / serving-llm-nim; defaults to model_name for llm-nim)"
        default: "my-model"
        required: false
      nim_model:
        description: "NIM model to deploy (serving-nim only)"
        type: choice
        required: false
        default: "nvidia-nemotron-nano-9b-v2-dgx-spark"
        options:
          - llama-3.1-8b-instruct-dgx-spark
          - nvidia-nemotron-nano-9b-v2-dgx-spark
          - llm-nim
          - nemotron-3-nano-30b-a3b
          - gpt-oss-120b
          - llama-3.3-nemotron-super-49b-v1.5
          - minimax-m25
          - cosmos-reason2-8b
          - boltz2
          - magpie-tts-multilingual
          - parakeet-1-1b-rnnt-multilingual
          - parakeet-1-1b-ctc-en-us
      model_path:
        description: "Model source for serving-llm-nim: /absolute/local/path  OR  hf://org/model  OR  org/model"
        default: "/home/aaron/shared/huggingface-kfp/models/my-model"
        required: false
      model_name:
        description: "Short name for the model dir inside the NIM container (serving-llm-nim only)"
        default: "my-model"
        required: false
      nim_image_tag:
        description: "llm-nim image tag (serving-llm-nim only)"
        default: "latest"
        required: false

permissions:
  contents: read

jobs:
  create:
    runs-on: [self-hosted, "${{ inputs.host }}"]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Resolve host vars
        run: |
          if [[ "${{ inputs.host }}" == "agx" ]]; then
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}" >> "$GITHUB_ENV"
          else
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}" >> "$GITHUB_ENV"
          fi

      - name: Create repository
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          DESCRIPTION: ${{ inputs.description }}
          PROJECT_TYPE: ${{ inputs.project_type }}
          REPO_VISIBILITY: ${{ inputs.repo_visibility }}
          GITHUB_ORG_ADMIN_PAT: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh repo create \
            "miramar-labs-org/${PROJECT_NAME}" \
            --${REPO_VISIBILITY} \
            --description "${DESCRIPTION:-${PROJECT_TYPE} project}"
          echo "Created miramar-labs-org/${PROJECT_NAME}"

      - name: Set repository topics
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_TYPE: ${{ inputs.project_type }}
          GITHUB_ORG_ADMIN_PAT: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X PUT \
            "repos/miramar-labs-org/${PROJECT_NAME}/topics" \
            -f "names[]=miramar-project" \
            -f "names[]=miramar-${PROJECT_TYPE}"

      - name: Set PROJECT_HOST variable
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_TYPE: ${{ inputs.project_type }}
          HOST: ${{ inputs.host }}
          GITHUB_ORG_ADMIN_PAT: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X PATCH "repos/miramar-labs-org/${PROJECT_NAME}/actions/variables/PROJECT_HOST" \
            -f value="${HOST}" 2>/dev/null || \
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X POST "repos/miramar-labs-org/${PROJECT_NAME}/actions/variables" \
            -f name="PROJECT_HOST" -f value="${HOST}"

      - name: Initialise repository with template
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_TYPE: ${{ inputs.project_type }}
          HOST: ${{ inputs.host }}
          HF_MODEL_ID: ${{ inputs.hf_model_id }}
          HF_DATASET_ID: ${{ inputs.hf_dataset_id }}
          SERVED_MODEL_NAME: ${{ inputs.served_model_name }}
          NIM_MODEL: ${{ inputs.nim_model }}
          MODEL_PATH: ${{ inputs.model_path }}
          MODEL_NAME: ${{ inputs.model_name }}
          NIM_IMAGE_TAG: ${{ inputs.nim_image_tag }}
          DESCRIPTION: ${{ inputs.description }}
          GITHUB_ORG_ADMIN_PAT: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          set -euo pipefail

          WORK_DIR=$(mktemp -d)
          trap 'rm -rf "${WORK_DIR}"' EXIT

          git config --global user.email "actions@github.com"
          git config --global user.name "Miramar Platform"

          cd "${WORK_DIR}"
          git init
          git checkout -b main

          # Copy the appropriate template (includes hidden .github/ dir)
          cp -r "${GITHUB_WORKSPACE}/templates/new-project-${PROJECT_TYPE}/." .

          # Decode serving-nim NIM model → org, full DGX image name, and image tags
          NIM_ORG="nvidia"; NIM_DGX_IMAGE="${NIM_MODEL}"; DGX_IMAGE_TAG="latest"; GKE_IMAGE_TAG="latest"
          case "${NIM_MODEL}" in
            "llama-3.1-8b-instruct-dgx-spark")
              NIM_ORG="meta"; NIM_DGX_IMAGE="llama-3.1-8b-instruct-dgx-spark"
              DGX_IMAGE_TAG="1.0.0-variant"; GKE_IMAGE_TAG="1.0.0" ;;
            "nvidia-nemotron-nano-9b-v2-dgx-spark")
              NIM_ORG="nvidia"; NIM_DGX_IMAGE="nvidia-nemotron-nano-9b-v2-dgx-spark"
              DGX_IMAGE_TAG="1.0.0-variant"; GKE_IMAGE_TAG="1.0.0" ;;
            "llm-nim")
              NIM_ORG="nvidia"; NIM_DGX_IMAGE="llm-nim" ;;
            "nemotron-3-nano-30b-a3b")
              NIM_ORG="nvidia"; NIM_DGX_IMAGE="nemotron-3-nano-30b-a3b" ;;
            "gpt-oss-120b")
              NIM_ORG="nvidia"; NIM_DGX_IMAGE="gpt-oss-120b" ;;
            "llama-3.3-nemotron-super-49b-v1.5")
              NIM_ORG="nvidia"; NIM_DGX_IMAGE="llama-3.3-nemotron-super-49b-v1.5" ;;
            "minimax-m25")
              NIM_ORG="minimax-ai"; NIM_DGX_IMAGE="minimax-m25" ;;
            "cosmos-reason2-8b")
              NIM_ORG="nvidia"; NIM_DGX_IMAGE="cosmos-reason2-8b" ;;
            "boltz2")
              NIM_ORG="mit"; NIM_DGX_IMAGE="boltz2" ;;
            "magpie-tts-multilingual")
              NIM_ORG="nvidia"; NIM_DGX_IMAGE="magpie-tts-multilingual" ;;
            "parakeet-1-1b-rnnt-multilingual")
              NIM_ORG="nvidia"; NIM_DGX_IMAGE="parakeet-1-1b-rnnt-multilingual" ;;
            "parakeet-1-1b-ctc-en-us")
              NIM_ORG="nvidia"; NIM_DGX_IMAGE="parakeet-1-1b-ctc-en-us" ;;
          esac
          # Base model name (strip -dgx-spark suffix for GKE reference)
          NIM_MODEL_NAME="${NIM_DGX_IMAGE%-dgx-spark}"

          # For serving-llm-nim, default served_model_name to model_name when not explicitly set
          if [ "${PROJECT_TYPE}" = "serving-llm-nim" ] && [ "${SERVED_MODEL_NAME}" = "my-model" ]; then
            SERVED_MODEL_NAME="${MODEL_NAME}"
          fi

          # Replace placeholders in all text files
          YEAR=$(date +%Y)
          CHANGE_DATE="$((YEAR + 4))-01-01"
          JL_PORT=8888; [[ "${HOST}" == "agx" ]] && JL_PORT=8887
          JL_URL="http://localhost:${JL_PORT}/lab/tree/git-miramar-labs-org/projects/${PROJECT_NAME}/notebook.ipynb"
          find . -type f \( -name "*.md" -o -name "*.ipynb" -o -name "*.yaml" -o -name "*.py" -o -name "LICENSE" \) \
            -exec sed -i \
              -e "s/{{PROJECT_NAME}}/${PROJECT_NAME}/g" \
              -e "s/{{PROJECT_HOST}}/${HOST}/g" \
              -e "s/{{YEAR}}/${YEAR}/g" \
              -e "s/{{CHANGE_DATE}}/${CHANGE_DATE}/g" \
              -e "s|{{JL_URL}}|${JL_URL}|g" \
              -e "s|{{HF_MODEL_ID}}|${HF_MODEL_ID}|g" \
              -e "s|{{HF_DATASET_ID}}|${HF_DATASET_ID}|g" \
              -e "s|{{SERVED_MODEL_NAME}}|${SERVED_MODEL_NAME}|g" \
              -e "s|{{NIM_ORG}}|${NIM_ORG}|g" \
              -e "s|{{NIM_MODEL_NAME}}|${NIM_MODEL_NAME}|g" \
              -e "s|{{NIM_DGX_IMAGE}}|${NIM_DGX_IMAGE}|g" \
              -e "s|{{DGX_IMAGE_TAG}}|${DGX_IMAGE_TAG}|g" \
              -e "s|{{GKE_IMAGE_TAG}}|${GKE_IMAGE_TAG}|g" \
              -e "s|{{MODEL_PATH}}|${MODEL_PATH}|g" \
              -e "s|{{MODEL_NAME}}|${MODEL_NAME}|g" \
              -e "s|{{NIM_IMAGE_TAG}}|${NIM_IMAGE_TAG}|g" \
              -e "s|{{DESCRIPTION}}|${DESCRIPTION}|g" \
            {} +

          # Inject CI workflow badges after the title line for kfp-type projects.
          # (default type has no CI badges — the JupyterLab button is in the template itself.)
          # Each badge is a separate variable so no line falls to column 0
          # (which would break the YAML block scalar).
          ORG_URL="https://github.com/miramar-labs-org/${PROJECT_NAME}"
          WF="${ORG_URL}/actions/workflows"
          if [ "${PROJECT_TYPE}" = "ft-eval" ] || [ "${PROJECT_TYPE}" = "nemo-ft-eval" ]; then
            BADGE_2="[![Deploy to KFP](${WF}/deploy-to-kfp.yaml/badge.svg)](${WF}/deploy-to-kfp.yaml)"
            BADGE_3="[![Undeploy from KFP](${WF}/undeploy-from-kfp.yaml/badge.svg)](${WF}/undeploy-from-kfp.yaml)"
          elif [ "${PROJECT_TYPE}" = "kfp" ]; then
            BADGE_2="[![Deploy to KFP](${WF}/deploy-kfp.yaml/badge.svg)](${WF}/deploy-kfp.yaml)"
            BADGE_3="[![Undeploy from KFP](${WF}/undeploy-kfp.yaml/badge.svg)](${WF}/undeploy-kfp.yaml)"
            { head -1 README.md; printf '\n%s\n%s\n' "${BADGE_2}" "${BADGE_3}"; tail -n +2 README.md; } > README.tmp
            mv README.tmp README.md
          elif [ "${PROJECT_TYPE}" = "serving-vllm" ]; then
            BADGE_2="[![Build and Push](${WF}/build-push.yaml/badge.svg)](${WF}/build-push.yaml)"
            BADGE_3="[![Deploy](${WF}/deploy.yaml/badge.svg)](${WF}/deploy.yaml)"
            BADGE_4="[![Undeploy](${WF}/undeploy.yaml/badge.svg)](${WF}/undeploy.yaml)"
            { head -1 README.md; printf '\n%s\n%s\n%s\n' "${BADGE_2}" "${BADGE_3}" "${BADGE_4}"; tail -n +2 README.md; } > README.tmp
            mv README.tmp README.md
          elif [ "${PROJECT_TYPE}" = "serving-nim" ]; then
            BADGE_2="[![Deploy](${WF}/deploy.yaml/badge.svg)](${WF}/deploy.yaml)"
            BADGE_3="[![Undeploy](${WF}/undeploy.yaml/badge.svg)](${WF}/undeploy.yaml)"
            { head -1 README.md; printf '\n%s\n%s\n' "${BADGE_2}" "${BADGE_3}"; tail -n +2 README.md; } > README.tmp
            mv README.tmp README.md
          elif [ "${PROJECT_TYPE}" = "serving-llm-nim" ]; then
            BADGE_2="[![Deploy](${WF}/deploy.yaml/badge.svg)](${WF}/deploy.yaml)"
            BADGE_3="[![Undeploy](${WF}/undeploy.yaml/badge.svg)](${WF}/undeploy.yaml)"
            { head -1 README.md; printf '\n%s\n%s\n' "${BADGE_2}" "${BADGE_3}"; tail -n +2 README.md; } > README.tmp
            mv README.tmp README.md
          elif [ "${PROJECT_TYPE}" = "serving-trt-fp8" ]; then
            BADGE_2="[![Build and Push](${WF}/build-push.yaml/badge.svg)](${WF}/build-push.yaml)"
            BADGE_3="[![Deploy](${WF}/deploy.yaml/badge.svg)](${WF}/deploy.yaml)"
            BADGE_4="[![Undeploy](${WF}/undeploy.yaml/badge.svg)](${WF}/undeploy.yaml)"
            { head -1 README.md; printf '\n%s\n%s\n%s\n' "${BADGE_2}" "${BADGE_3}" "${BADGE_4}"; tail -n +2 README.md; } > README.tmp
            mv README.tmp README.md
          elif [ "${PROJECT_TYPE}" = "serving-trt-engine" ]; then
            BADGE_2="[![Build and Push](${WF}/build-push.yaml/badge.svg)](${WF}/build-push.yaml)"
            BADGE_3="[![Deploy](${WF}/deploy.yaml/badge.svg)](${WF}/deploy.yaml)"
            BADGE_4="[![Undeploy](${WF}/undeploy.yaml/badge.svg)](${WF}/undeploy.yaml)"
            { head -1 README.md; printf '\n%s\n%s\n%s\n' "${BADGE_2}" "${BADGE_3}" "${BADGE_4}"; tail -n +2 README.md; } > README.tmp
            mv README.tmp README.md
          fi

          # Write requirements.txt: start from workflow input, then append
          # type-specific packages (kfp or nemo-microservices).
          REQS="${{ inputs.requirements }}"
          [[ "${PROJECT_TYPE}" = "kfp" ]] && REQS="${REQS} kfp>=2.0.0"
          [[ "${PROJECT_TYPE}" = "ft-eval" ]] && REQS="${REQS} kfp>=2.0.0 kfp-kubernetes"
          [[ "${PROJECT_TYPE}" = "nemo-ft-eval" ]] && REQS="${REQS} kfp>=2.0.0 kfp-kubernetes nemo-microservices"
          [[ "${PROJECT_TYPE}" = "kfp-rag" ]] && REQS="${REQS} kfp>=2.0.0 kfp-kubernetes langchain langchain-text-splitters langchain-qdrant langsmith qdrant-client sentence-transformers"
          [[ "${PROJECT_TYPE}" = "kfp-nemo-curator" ]] && REQS="${REQS} kfp>=2.0.0 kfp-kubernetes nemo-curator trafilatura ftfy presidio-analyzer presidio-anonymizer spacy"
          printf '%s\n' ${REQS} > requirements.txt

          git add .
          [ -d .github ] && git add -f .github/  # force-add workflows if present (not in default template)
          git commit -m "Initial scaffold (type: ${PROJECT_TYPE}, host: ${HOST}) from Miramar template"

          git remote add origin \
            "https://x-access-token:${GITHUB_ORG_ADMIN_PAT}@github.com/miramar-labs-org/${PROJECT_NAME}.git"
          git push -u origin main

      - name: Clone to host projects folder
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          GITHUB_ORG_ADMIN_PAT: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
          SCRIPT: |
            set -euo pipefail
            mkdir -p "${HOME}/git-miramar-labs-org/projects"
            DEST="${HOME}/git-miramar-labs-org/projects/${PROJECT_NAME}"
            if [ -d "${DEST}/.git" ]; then
              git -C "${DEST}" fetch origin
              git -C "${DEST}" reset --hard origin/main
              echo "Reset to origin/main: ${DEST}"
            else
              git clone \
                "https://x-access-token:${PAT}@github.com/miramar-labs-org/${PROJECT_NAME}.git" \
                "${DEST}"
              echo "Cloned to: ${DEST}"
            fi

            # Create per-project venv and register as a named JupyterLab kernel.
            VENV="${DEST}/.venv"
            if [ ! -x "${VENV}/bin/pip" ]; then
              rm -rf "${VENV}"
              python3 -c "import ensurepip" 2>/dev/null || sudo apt-get install -y --no-install-recommends python3-venv
              python3 -m venv "${VENV}"
              echo "Created venv: ${VENV}"
            fi
            "${VENV}/bin/pip" install --quiet --upgrade pip
            "${VENV}/bin/pip" install --quiet ipykernel
            if [ -f "${DEST}/requirements.txt" ]; then
              echo "Installing requirements.txt ..."
              "${VENV}/bin/pip" install --quiet -r "${DEST}/requirements.txt"
            fi
            "${VENV}/bin/python" -m ipykernel install --user \
              --name "${PROJECT_NAME}" \
              --display-name "${PROJECT_NAME}"
            echo "Kernel registered: ${PROJECT_NAME}"
        run: |
          if [ ! -f ~/.ssh/id_ed25519 ]; then
            echo "WARNING: ~/.ssh/id_ed25519 not found — skipping host clone" >&2
            exit 0
          fi
          printf '%s' "${SCRIPT}" \
            | ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                "${HOST_USER}@localhost" \
                env PROJECT_NAME="${PROJECT_NAME}" \
                    PAT="${GITHUB_ORG_ADMIN_PAT}" bash

      - name: Draft blog post
        continue-on-error: true
        env:
          GITHUB_ORG_ADMIN_PAT: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          set -euo pipefail
          BLOG_REPO="miramar-labs-org/miramar-labs-org.github.io"
          POST_DATE=$(date +%Y-%m-%d)
          PROJECT_NAME="${{ inputs.project_name }}"
          PROJECT_TYPE="${{ inputs.project_type }}"
          HOST="${{ inputs.host }}"
          DESCRIPTION="${{ inputs.description }}"
          BRANCH="draft-${PROJECT_NAME}"
          POST_SLUG=$(echo "${PROJECT_NAME}" | tr '[:upper:]' '[:lower:]')
          POST_PATH="_posts/${POST_DATE}-${POST_SLUG}.markdown"
          POST_TITLE=$(echo "${PROJECT_NAME}" | sed 's/-/ /g;s/\b\w/\u&/g')
          REPO_URL="https://github.com/miramar-labs-org/${PROJECT_NAME}"
          DASHBOARD_URL="https://miramar-labs-org.github.io/miramar-platform-gcp/"
          if [ "${HOST}" = "agx" ]; then HW="AGX Orin"; else HW="DGX Spark"; fi

          MAIN_SHA=$(GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            "repos/${BLOG_REPO}/git/refs/heads/main" --jq '.object.sha')
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api -X POST \
            "repos/${BLOG_REPO}/git/refs" \
            -f ref="refs/heads/${BRANCH}" -f sha="${MAIN_SHA}" 2>/dev/null \
          || echo "Branch already exists, continuing."

          if [ "${PROJECT_TYPE}" = "nemo-ft-eval" ]; then
            CATS="miramar nemo kubeflow fine-tuning"
            BODY=$(printf '%s\n' \
              "${DESCRIPTION:-<!-- TODO: one-sentence description -->}" "" \
              "**Platform:** ${HW} via [Miramar Platform](${DASHBOARD_URL})" \
              "**Repo:** [miramar-labs-org/${PROJECT_NAME}](${REPO_URL})" "" \
              "## Pipeline" "" "<!-- TODO: base model, dataset, NeMo customization setup -->" "" \
              "## Steps" "" \
              "| Step | Description |" "|------|-------------|" \
              "| \`prepare_dataset\` | <!-- TODO --> |" \
              "| \`baseline_eval\` | <!-- TODO --> |" \
              "| \`fine_tune\` | NeMo Customizer async job |" \
              "| \`export_adapter\` | NeMo → HF PEFT adapter |" \
              "| \`post_finetune_eval\` | <!-- TODO --> |" \
              "| \`safety_eval\` | <!-- TODO --> |" \
              "| \`deployment_gate\` | <!-- TODO --> |" "" \
              "## Configuration" "" \
              "| Parameter | Value |" "|-----------|-------|" \
              "| Base model (NeMo) | <!-- TODO --> |" "| Base model (HF eval) | <!-- TODO --> |" \
              "| Dataset(s) | <!-- TODO --> |" \
              "| Epochs | <!-- TODO --> |" "| Batch size | <!-- TODO --> |" "" \
              "## Evaluation results" "" \
              "| Metric | Base | Fine-tuned |" "|--------|------|------------|" \
              "| Accuracy | | |" "| Safety score | | |" "" \
              "## Next steps" "" "<!-- TODO -->")
          elif [ "${PROJECT_TYPE}" = "kfp" ]; then
            CATS="miramar kubeflow pipelines"
            BODY=$(printf '%s\n' \
              "${DESCRIPTION:-<!-- TODO: one-sentence description -->}" "" \
              "**Platform:** ${HW} via [Miramar Platform](${DASHBOARD_URL})" \
              "**Repo:** [miramar-labs-org/${PROJECT_NAME}](${REPO_URL})" "" \
              "## Pipeline description" "" "<!-- TODO: inputs, outputs, purpose -->" "" \
              "## Steps" "" \
              "| Step | Input | Output |" "|------|-------|--------|" \
              "| <!-- TODO --> | | |" "" \
              "## Artifact lineage" "" "<!-- TODO: models, datasets, metrics produced -->" "" \
              "\`\`\`python" "# TODO: pipeline.py excerpt" "\`\`\`" "" \
              "## Results" "" "<!-- TODO: run results, metrics, KFP UI screenshots -->" "" \
              "## Next steps" "" "<!-- TODO -->")
          elif [ "${PROJECT_TYPE}" = "serving-vllm" ]; then
            CATS="miramar vllm serving gke"
            BODY=$(printf '%s\n' \
              "${DESCRIPTION:-<!-- TODO: one-sentence description -->}" "" \
              "**Platform:** [Miramar Platform](${DASHBOARD_URL})" \
              "**Repo:** [miramar-labs-org/${PROJECT_NAME}](${REPO_URL})" "" \
              "## Serving stack" "" \
              "| | |" "|---|---|" \
              "| Base model | <!-- TODO --> |" \
              "| LoRA adapter | <!-- TODO: FT project + run --> |" \
              "| Inference engine | vLLM |" \
              "| Host | <!-- TODO: DGX Spark / AGX Orin / GKE L4 --> |" \
              "| Model alias | \`<!-- TODO: served_model_name -->\` |" "" \
              "## Deployment" "" \
              "\`\`\`bash" \
              "curl http://localhost:8000/v1/models" \
              "curl -X POST http://localhost:8000/v1/chat/completions \\\\" \
              "  -d '{\"model\":\"<!-- TODO -->\",\"messages\":[{\"role\":\"user\",\"content\":\"...\"}]}'" \
              "\`\`\`" "" \
              "## Smoke test results" "" \
              "<!-- TODO: sample prompts and responses -->" "" \
              "## Next steps" "" "<!-- TODO -->")
          elif [ "${PROJECT_TYPE}" = "serving-llm-nim" ]; then
            CATS="miramar nim serving dgx local-nim"
            BODY=$(printf '%s\n' \
              "${DESCRIPTION:-<!-- TODO: one-sentence description -->}" "" \
              "**Platform:** [Miramar Platform](${DASHBOARD_URL})" \
              "**Repo:** [miramar-labs-org/${PROJECT_NAME}](${REPO_URL})" "" \
              "## Serving stack" "" \
              "| | |" "|---|---|" \
