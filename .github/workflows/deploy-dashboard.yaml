name: Deploy Platform Dashboard

on:
  schedule:
    - cron: '0 * * * *'   # hourly
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Create Project"
      - "Delete Project"
      - "K3s Install"
      - "K3s Uninstall"
      - "NeMo Deploy"
      - "NeMo Undeploy"
      - "MLflow Deploy"
      - "MLflow Undeploy"
      - "Kubeflow Deploy"
      - "Kubeflow Undeploy"
      - "Ollama Update"
      - "NIM Deploy"
      - "NIM Undeploy"
      - "Ollama Deploy"
      - "Ollama Undeploy"
      - "GKE Expand"
      - "GKE Restore"
      - "GKE Expand GPU"
      - "GKE Restore GPU"
      - "GCP Platform Create"
      - "GCP Platform Destroy"
      - "Qdrant Deploy"
      - "Qdrant Undeploy"
      - "Open WebUI Deploy"
      - "Open WebUI Undeploy"
      - "Nsight Operator Deploy"
      - "Nsight Operator Undeploy"
      - "Nsight Operator Deploy (GKE)"
      - "Nsight Operator Undeploy (GKE)"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate dashboard
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # 1-hour GitHub App token (replaces the org-admin PAT; Nov 2026 incident)
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          owner: miramar-labs-org
      - name: Export App token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GH_APP_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate dashboard HTML
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pages
          GH_TOKEN="${GITHUB_TOKEN}" \
          GH_ADMIN_TOKEN="${{ steps.app-token.outputs.token }}" \
          bash scripts/dashboard/generate-dashboard.sh \
            --org miramar-labs-org \
            --output /tmp/pages/index.html

      # The page is world-readable. A token baked into it (DASHBOARD_DISPATCH_TOKEN)
      # was the entry point of the Nov 2026 account compromise — fail closed.
      - name: Refuse to publish credentials
        run: |
          if grep -nE '(gh[pousr]_|github_pat_)[A-Za-z0-9_]{20,}' /tmp/pages/index.html; then
            echo "::error::GitHub token found in dashboard HTML — refusing to publish"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: /tmp/pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
