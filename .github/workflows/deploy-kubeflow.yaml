name: Kubeflow Deploy

# Deploys Kubeflow Pipelines standalone into the kubeflow namespace on the target
# minikube cluster. The env/dev kustomize overlay creates the kubeflow namespace
# automatically and includes built-in SeaweedFS and MySQL — no external dependencies.
# arm64 image overrides applied post-apply:
#   - controller-manager removed (Application CRD, display-only, amd64-only binary)
#   - All upstream amd64-only images replaced with ghcr.io/miramar-labs-org arm64 builds
#     when use_native_kfp_images=true (the default)
#
# Prerequisites (run in order before first deploy or after version bump):
#   1. Build KFP arm64 Images (covers all 13 components including MLMD)
# See dgx/minikube/kubeflow/arm64/README.md for details.
#
# UI is served by svc/ml-pipeline-ui:80, forwarded to host port 8080 by
# kubeflow-portfwd.service. The REST API is served by svc/ml-pipeline:8888,
# forwarded to host port 8890 by kfp-api-portfwd.service. Restart both after
# deploying:
#   systemctl --user restart kubeflow-portfwd kfp-api-portfwd
#
# Prerequisites:
#   - minikube running on the target machine (Minikube Install workflow)
#   - kubeflow-portfwd.service and kfp-api-portfwd.service installed

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
      pipeline_version:
        description: Kubeflow Pipelines version tag (e.g. 2.16.1)
        default: "2.16.1"
        required: false
      use_native_kfp_images:
        description: Patch all KFP deployments with native arm64 images (requires Build KFP arm64 Images to have run)
        type: boolean
        default: true
        required: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          # After a runner restart the container is on the default bridge and
          # can't reach 192.168.49.x (minikube Docker network). Connect to it.
          docker network connect minikube "$(cat /etc/hostname)" 2>/dev/null || true
          sudo chmod -R a+rX "${HOME}/.minikube"
          TMP_KC=$(mktemp)
          sed "s|/home/[^/]*/\.minikube/|${HOME}/.minikube/|g" \
              "${HOME}/.kube/config" > "${TMP_KC}"
          echo "KUBECONFIG=${TMP_KC}" >> "${GITHUB_ENV}"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy Kubeflow Pipelines
        env:
          PIPELINE_VERSION: ${{ inputs.pipeline_version || '2.16.1' }}
          MLMD_SERVER_VERSION: "1.14.0"
          USE_NATIVE_KFP_IMAGES: ${{ inputs.use_native_kfp_images == false && 'false' || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          MIRAMAR_ORG_GHCR_PAT: ${{ secrets.MIRAMAR_ORG_GHCR_PAT }}
        run: bash dgx/minikube/kubeflow/deploy-kubeflow.sh

      - name: Wait for pods
        run: |
          echo "Waiting up to 20m for all pods to reach Running/Completed..."
          timeout 1200 bash -c '
            pull_fail_iters=0
            while true; do
              statuses="$(kubectl get pods -n kubeflow --no-headers 2>/dev/null)"
              if echo "$statuses" | grep -qE "ImagePullBackOff|ErrImagePull"; then
                pull_fail_iters=$((pull_fail_iters + 1))
                # Tolerate transient pull failures for up to 5 minutes (10 x 30s)
                # before declaring fatal — slow GHCR responses are common on first pull.
                if [[ $pull_fail_iters -ge 10 ]]; then
                  echo "ERROR: image pull failure persisted for 5m — giving up" >&2
                  echo "$statuses" >&2
                  exit 1
                fi
                echo "$(date -u +%H:%M:%S) — image pull backoff on $(echo "$statuses" | grep -cE "ImagePullBackOff|ErrImagePull") pod(s) [attempt ${pull_fail_iters}/10, waiting...]"
              else
                pull_fail_iters=0
              fi
              not_ready="$(echo "$statuses" | grep -vE "Running|Completed|Succeeded" | grep -v "^$")"
              if [[ -z "$not_ready" ]]; then
                echo "All pods ready."
                break
              fi
              echo "$(date -u +%H:%M:%S) — waiting on $(echo "$not_ready" | wc -l) pod(s):"
              echo "$not_ready" | awk "{print \"  \", \$1, \$3}" | head -5
              sleep 30
            done
          '
          kubectl get pods -n kubeflow

      - name: Create KFP shared storage
        run: |
          # --- Host directories ---
          # World-writable (777): minikube 9p does not map container UIDs to the
          # host user, so pods (root/UID 0) cannot write into 755 directories.
          mkdir -p "${HOME}/shared/huggingface-kfp" "${HOME}/shared/nsight"
          chmod 777 "${HOME}/shared/huggingface-kfp" "${HOME}/shared/nsight"

          # --- minikube 9p mounts (idempotent) ---
          # umask 000 on the subshell ensures the 9p server inherits umask 0,
          # so all directories created through the mount get 777 permissions
          # (not 755, which pods cannot write into via this mount).
          if ! minikube ssh "mount 2>/dev/null | grep -q '/hf-cache'" 2>/dev/null; then
            echo "==> Starting hf-cache minikube mount..."
            (umask 000; nohup minikube mount "${HOME}/shared/huggingface-kfp:/hf-cache" \
              > /tmp/minikube-mount-hf.log 2>&1) &
            disown $!
          else
            echo "==> hf-cache already mounted in VM."
          fi
          if ! minikube ssh "mount 2>/dev/null | grep -q '/nsight-reports'" 2>/dev/null; then
            echo "==> Starting nsight-reports minikube mount..."
            (umask 000; nohup minikube mount "${HOME}/shared/nsight:/nsight-reports" \
              > /tmp/minikube-mount-nsight.log 2>&1) &
            disown $!
          else
            echo "==> nsight-reports already mounted in VM."
          fi
          sleep 5

          # --- PV + PVC manifests (idempotent — kubectl apply is safe to re-run) ---
          kubectl apply -f - <<'MANIFESTS'
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: hf-model-cache
          spec:
            capacity:
              storage: 200Gi
            accessModes: [ReadWriteMany]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            hostPath:
              path: /hf-cache
          ---
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: hf-model-cache
            namespace: kubeflow
          spec:
            accessModes: [ReadWriteMany]
            resources:
              requests:
                storage: 200Gi
            storageClassName: ""
            volumeName: hf-model-cache
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nsight-reports
          spec:
            capacity:
              storage: 50Gi
            accessModes: [ReadWriteMany]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            hostPath:
              path: /nsight-reports
          ---
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: nsight-reports
            namespace: kubeflow
          spec:
            accessModes: [ReadWriteMany]
            resources:
              requests:
                storage: 50Gi
            storageClassName: ""
            volumeName: nsight-reports
          MANIFESTS

          kubectl get pv hf-model-cache nsight-reports 2>/dev/null || true
          kubectl get pvc hf-model-cache nsight-reports -n kubeflow 2>/dev/null || true

      - name: Build and push profiled PyTorch image to GHCR
        run: |
          IMAGE="ghcr.io/miramar-labs-org/pytorch-profiled:25.03"
          docker build -f docker/Dockerfile.profiled -t "$IMAGE" docker/
          docker push "$IMAGE"
          echo "Pushed $IMAGE to GHCR."

      - name: Smoke-test endpoints
        continue-on-error: true
        run: bash dgx/minikube/kubeflow/verify-kfp-endpoints.sh

      - name: Sync API keys to cluster
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN:          ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WANDB_API_KEY:     ${{ secrets.WANDB_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          NGC_API_KEY:       ${{ secrets.NGC_API_KEY }}
          NVIDIA_API_KEY:    ${{ secrets.NVIDIA_API_KEY }}
        run: |
          kubectl create secret generic mlabs-api-keys \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=HF_TOKEN="$HF_TOKEN" \
            --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --from-literal=WANDB_API_KEY="$WANDB_API_KEY" \
            --from-literal=LANGCHAIN_API_KEY="$LANGCHAIN_API_KEY" \
            --from-literal=NGC_API_KEY="$NGC_API_KEY" \
            --from-literal=NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            -n kubeflow --dry-run=client -o yaml | kubectl apply -f -

      - name: Set KFP active state
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          var="${machine}_KFP_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="true" -f visibility="all"

      - name: Summary
        if: always()
        run: |
          POD_COUNT=$(kubectl get pods -n kubeflow --no-headers 2>/dev/null | grep -c . || echo 0)
          {
            echo "## Kubeflow Pipelines Deployed"
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| Namespace | \`kubeflow\` |"
            echo "| Version | \`${{ inputs.pipeline_version || '2.16.1' }}\` |"
            echo "| Pods | \`${POD_COUNT}\` |"
            echo ""
            echo "Restart port-forward services on the host, then tunnel to access:"
            echo "\`\`\`"
            echo "systemctl --user restart kubeflow-portfwd kfp-api-portfwd"
            echo "ssh -L 8080:localhost:8080 -L 8890:localhost:8890 <user>@<host>"
            echo "# UI:  http://localhost:8080"
            echo "# API: http://localhost:8890/apis/v2beta1/healthz"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
