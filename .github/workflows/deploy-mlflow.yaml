name: MLflow Deploy

# Deploys MLflow + MinIO into the mlflow-system namespace on the target k3s
# cluster and integrates with an existing NeMo Microservices deployment.
# MLflow uses NeMo's postgres as its backend store.
#
# Prerequisites: NeMo must already be deployed on the target machine.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx

jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve host
        run: |
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "HOST_IP=${{ vars.AGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}" >> "$GITHUB_ENV"
          else
            echo "HOST_IP=${{ vars.DGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}" >> "$GITHUB_ENV"
          fi

      - name: Set up SSH key
        run: |
          echo "${{ secrets.HOST_SSH_KEY }}" > /tmp/k_key
          chmod 600 /tmp/k_key
          ssh-keyscan -H "${HOST_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy kubeconfig from host
        run: |
          mkdir -p ~/.kube
          scp -i /tmp/k_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}:/home/${HOST_USER}/.kube/config" ~/.kube/config
          echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Prepare MLflow data directories on host
        run: |
          ssh -i /tmp/k_key -o StrictHostKeyChecking=no "${HOST_USER}@${HOST_IP}" "
            mkdir -p /home/${HOST_USER}/shared/mlflow/minio
            chmod 777 /home/${HOST_USER}/shared/mlflow/minio || true
          "

      - name: Deploy MLflow and integrate with NeMo
        run: |
          MINIO_DATA_DIR="/home/${HOST_USER}/shared/mlflow/minio" \
          bash dgx/k3s/mlflow/integrate-mlflow.sh

      - name: Create MinIO mlflow bucket
        run: |
          MINIO_POD=$(kubectl get pods -n mlflow-system | grep minio | grep Running | awk '{print $1}' | head -1)
          if [ -z "$MINIO_POD" ]; then
            echo "ERROR: MinIO pod not found in mlflow-system" && exit 1
          fi
          echo "Using MinIO pod: $MINIO_POD"
          ACCESS_KEY=$(kubectl get secret minio-creds -n mlflow-system -o jsonpath='{.data.rootUser}' | base64 -d)
          SECRET_KEY=$(kubectl get secret minio-creds -n mlflow-system -o jsonpath='{.data.rootPassword}' | base64 -d)
          kubectl exec -n mlflow-system "$MINIO_POD" -- sh -c "
            mc alias set mlocal http://localhost:9000 '${ACCESS_KEY}' '${SECRET_KEY}' 2>/dev/null
            mc mb --ignore-existing mlocal/mlflow
            mc ls mlocal/
          "

      - name: Smoke-test endpoints
        continue-on-error: true
        run: bash dgx/k3s/mlflow/verify-mlflow-endpoints.sh

      - name: Set MLflow active state
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          var="${machine}_MLFLOW_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="true" -f visibility="all"

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/k_key
