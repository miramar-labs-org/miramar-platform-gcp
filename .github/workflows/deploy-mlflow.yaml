name: MLflow Deploy

# Deploys MLflow + MinIO into the mlflow-system namespace on the DGX minikube
# cluster and integrates with an existing NeMo Microservices deployment.
# MLflow uses NeMo's postgres as its backend store.
#
# Triggers automatically after a successful NeMo Deploy run, or manually
# via workflow_dispatch (NeMo must already be deployed).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["NeMo Deploy"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, dgx]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          # After a runner restart the container is on the default bridge and
          # can't reach 192.168.49.x (minikube Docker network). Connect to it.
          docker network connect minikube "$(cat /etc/hostname)" 2>/dev/null || true
          sudo chmod -R a+rX "${HOME}/.minikube"
          TMP_KC=$(mktemp)
          sed "s|/home/[^/]*/\.minikube/|${HOME}/.minikube/|g" \
              "${HOME}/.kube/config" > "${TMP_KC}"
          echo "KUBECONFIG=${TMP_KC}" >> "${GITHUB_ENV}"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Deploy MLflow and integrate with NeMo
        run: bash dgx/minikube/mlflow/integrate-mlflow.sh

      - name: Smoke-test endpoints
        continue-on-error: true
        run: bash dgx/minikube/mlflow/verify-mlflow-endpoints.sh
