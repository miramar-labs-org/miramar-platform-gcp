name: Model Router Deploy

# Deploys the LiteLLM model router into the model-router namespace on the target k3s cluster.
# The router exposes a single OpenAI-compatible /v1 endpoint that dispatches to multiple
# serving backends by model name.
#
# The routing table is built at deploy time: {machine}/k3s/model-router/litellm-config.yaml
# (gke/model-router/ for gke) plus generated upstreams — Ollama models from each host's
# /api/tags (dgx) and every serving Service labelled miramar.ai/router=true
# (scripts/gha/gen-serving-upstreams.py). Serving deploy/undeploy re-run this workflow.
#
# Sets {MACHINE}_OPENWEBUI_API_URL to the router's in-cluster URL. If Open WebUI is active,
# it is redeployed to pick up the new backend.
#
# Prerequisites: k3s must be running on the target machine.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
          - gke

jobs:
  deploy:
    name: Deploy Model Router (${{ inputs.runner }})
    if: inputs.runner != 'gke'
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 15
    steps:
      # 1-hour GitHub App token (replaces the org-admin PAT; Nov 2026 incident)
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          owner: miramar-labs-org
      - name: Export App token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "GH_APP_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          echo "GH_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: echo "KUBECONFIG=${HOME}/.kube/config" >> "${GITHUB_ENV}"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Apply base manifests
        run: kubectl apply -f dgx/k3s/model-router/router.yaml

      - name: Build effective litellm config (repo + generated Ollama/serving upstreams)
        run: |
          CONFIG_PATH="dgx/k3s/model-router/litellm-config.yaml"
          [[ "${{ inputs.runner }}" == "agx" ]] && CONFIG_PATH="agx/k3s/model-router/litellm-config.yaml"
          EFFECTIVE="${RUNNER_TEMP}/litellm-config.yaml"
          cp "${CONFIG_PATH}" "${EFFECTIVE}"

          # Both hosts run Ollama natively and both catalogs are dynamic, so their
          # upstreams are generated from the live /api/tags rather than hand-maintained
          # in the repo. Host prefixes keep the two apart — Open WebUI reaches Ollama
          # only through this router, so these entries are the whole picker.
          # An unreachable host warns and emits nothing; it is not fatal.
          if [[ "${{ inputs.runner }}" == "dgx" ]]; then
            python3 scripts/gha/gen-ollama-upstreams.py \
              --host-ip "${{ vars.DGX_HOST_IP }}" --prefix "dgx/" >> "${EFFECTIVE}"
            python3 scripts/gha/gen-ollama-upstreams.py \
              --host-ip "${{ vars.AGX_HOST_IP }}" --prefix "agx/" >> "${EFFECTIVE}"
          fi
          python3 scripts/gha/gen-serving-upstreams.py >> "${EFFECTIVE}"

          # Nothing static is left in the committed file, so an effective config with no
          # model_list means both hosts were unreachable. Fail rather than hand LiteLLM
          # an empty routing table — the running router keeps its previous config.
          python3 -c "
          import sys, yaml
          cfg = yaml.safe_load(open('${EFFECTIVE}')) or {}
          if not (cfg.get('model_list') or []):
              sys.exit('ERROR: effective litellm config has no models — both Ollama hosts unreachable?')
          print(f\"Effective config: {len(cfg['model_list'])} model(s)\")
          "

          echo "EFFECTIVE_CONFIG=${EFFECTIVE}" >> "${GITHUB_ENV}"

      - name: Upsert litellm ConfigMap
        run: |
          kubectl create configmap litellm-config \
            --from-file=config.yaml="${EFFECTIVE_CONFIG}" \
            -n model-router --dry-run=client -o yaml | kubectl apply -f -

      - name: Restart deployment to pick up new config
        run: kubectl rollout restart deployment/model-router -n model-router

      - name: Wait for rollout
        run: kubectl rollout status deployment/model-router -n model-router --timeout=300s

      - name: Smoke test
        run: |
          kubectl port-forward svc/model-router 18000:8000 -n model-router &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          # Poll for readiness instead of sleeping a fixed interval. The port-forward
          # needs a moment to establish, and the hardcoded `sleep 8` this replaces is
          # what reported a false failure on a perfectly healthy router (2026-09-07)
          # once the routing table grew past a single upstream. The trap is armed
          # before the wait so a timeout here cannot leak the port-forward.
          ready=""
          for _ in $(seq 1 30); do
            if curl -sf -m 5 http://localhost:18000/health/readiness >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "ERROR: router did not answer /health/readiness within 60s" >&2
            kubectl logs -n model-router deployment/model-router --tail=50 >&2 || true
            exit 1
          fi
          curl -sf -m 10 http://localhost:18000/v1/models | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          models = [m['id'] for m in d.get('data', [])]
          print('Router is up. Models registered:', models if models else '(none yet — add upstreams to litellm-config.yaml)')
          "

      - name: Set OpenWebUI backend URL
        run: |
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          var="${machine}_OPENWEBUI_API_URL"
          url="http://model-router.model-router.svc.cluster.local:8000/v1"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="${url}" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="${url}" -f visibility="all"

      - name: Redeploy Open WebUI if active
        run: |
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          owui_active=$(gh api "orgs/miramar-labs-org/actions/variables/${machine}_OPENWEBUI_ACTIVE" \
            --jq '.value // empty' 2>/dev/null || true)
          if [[ "$owui_active" == "true" ]]; then
            echo "Open WebUI is active — triggering redeploy to pick up new backend URL"
            gh workflow run deploy-openwebui.yaml \
              --repo miramar-labs-org/miramar-platform-gcp \
              --field host="${{ inputs.runner }}"
          else
            echo "Open WebUI not active — skipping redeploy"
          fi

      - name: Summary
        if: always()
        run: |
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          {
            echo "## Model Router Deployed (${{ inputs.runner }})"
            echo "| | |"
            echo "|---|---|"
            echo "| Namespace | \`model-router\` |"
            echo "| In-cluster URL | \`http://model-router.model-router.svc.cluster.local:8000/v1\` |"
            echo "| Org variable | \`${machine}_OPENWEBUI_API_URL\` |"
            echo ""
            CONFIG_PATH="dgx/k3s/model-router/litellm-config.yaml"
            [[ "${{ inputs.runner }}" == "agx" ]] && CONFIG_PATH="agx/k3s/model-router/litellm-config.yaml"
            echo "Serving projects register by labelling their Service (deploy/undeploy re-run this workflow). Other upstreams: edit \`${CONFIG_PATH}\`, commit, re-run."
            echo ""
            echo "Local access: \`kubectl port-forward svc/model-router 8000:8000 -n model-router\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_gke:
    name: Deploy Model Router (gke)
    if: inputs.runner == 'gke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
      GKE_ZONE: ${{ vars.GKE_ZONE }}
    steps:
      # 1-hour GitHub App token (replaces the org-admin PAT; Nov 2026 incident)
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          owner: miramar-labs-org
      - name: Export App token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "GH_APP_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          echo "GH_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Apply base manifests
        run: kubectl apply -f dgx/k3s/model-router/router.yaml

      - name: Upsert litellm ConfigMap (repo + generated serving upstreams)
        run: |
          EFFECTIVE="${RUNNER_TEMP}/litellm-config.yaml"
          cp gke/model-router/litellm-config.yaml "${EFFECTIVE}"
          python3 scripts/gha/gen-serving-upstreams.py >> "${EFFECTIVE}"
          # No serving project running: keep an explicit empty list, as before.
          grep -q '^- litellm_params:' "${EFFECTIVE}" || sed -i 's/^model_list:$/model_list: []/' "${EFFECTIVE}"
          kubectl create configmap litellm-config \
            --from-file=config.yaml="${EFFECTIVE}" \
            -n model-router --dry-run=client -o yaml | kubectl apply -f -

      - name: Restart deployment to pick up new config
        run: kubectl rollout restart deployment/model-router -n model-router

      - name: Wait for rollout
        run: kubectl rollout status deployment/model-router -n model-router --timeout=300s

      - name: Smoke test
        run: |
          kubectl port-forward svc/model-router 18000:8000 -n model-router &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          # Poll for readiness instead of sleeping a fixed interval. The port-forward
          # needs a moment to establish, and the hardcoded `sleep 8` this replaces is
          # what reported a false failure on a perfectly healthy router (2026-09-07)
          # once the routing table grew past a single upstream. The trap is armed
          # before the wait so a timeout here cannot leak the port-forward.
          ready=""
          for _ in $(seq 1 30); do
            if curl -sf -m 5 http://localhost:18000/health/readiness >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "ERROR: router did not answer /health/readiness within 60s" >&2
            kubectl logs -n model-router deployment/model-router --tail=50 >&2 || true
            exit 1
          fi
          curl -sf -m 10 http://localhost:18000/v1/models | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          models = [m['id'] for m in d.get('data', [])]
          print('Router is up. Models registered:', models if models else '(none yet — deploy a serving project)')
          "

      - name: Set GKE model router active
        run: |
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/GKE_MODEL_ROUTER_ACTIVE" \
            -f name="GKE_MODEL_ROUTER_ACTIVE" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="GKE_MODEL_ROUTER_ACTIVE" -f value="true" -f visibility="all"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Model Router Deployed (gke)"
            echo "| | |"
            echo "|---|---|"
            echo "| Namespace | \`model-router\` |"
            echo "| In-cluster URL | \`http://model-router.model-router.svc.cluster.local:8000/v1\` |"
            echo ""
            echo "Serving projects register by labelling their Service (deploy/undeploy re-run this workflow). Other upstreams: edit \`gke/model-router/litellm-config.yaml\`, commit, re-run."
            echo ""
            echo "Next: run **GKE Gateway Deploy** to expose \`https://api.miramar-labs.com/v1\` externally."
          } >> "$GITHUB_STEP_SUMMARY"
