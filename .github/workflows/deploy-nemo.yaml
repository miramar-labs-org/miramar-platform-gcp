name: NeMo Deploy

# Installs NeMo Microservices into the nemo-microservices namespace on the target k3s
# cluster.
#
# Prerequisites:
#   - k3s running on the target machine (K3s Install workflow)
#   - NVIDIA_API_KEY org secret set
#   - HF_TOKEN org secret set

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
      nemo_version:
        description: "NeMo Microservices Helm chart version (e.g. 25.12.1)"
        required: false
        default: "25.12.1"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve machine-specific paths
        run: |
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "HOSTS_FILE=agx/k3s/nemo/hosts.agx" >> "$GITHUB_ENV"
            echo "VALUES_FILE=dgx/k3s/nemo/install/values.yaml" >> "$GITHUB_ENV"
            echo "HOST_IP=${{ vars.AGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}" >> "$GITHUB_ENV"
          else
            echo "HOSTS_FILE=dgx/k3s/nemo/hosts.dgx" >> "$GITHUB_ENV"
            echo "VALUES_FILE=dgx/k3s/nemo/install/values.yaml" >> "$GITHUB_ENV"
            echo "HOST_IP=${{ vars.DGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}" >> "$GITHUB_ENV"
          fi

      - name: Set up SSH key
        run: |
          echo "${{ secrets.HOST_SSH_KEY }}" > /tmp/k_key
          chmod 600 /tmp/k_key
          ssh-keyscan -H "${HOST_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy kubeconfig from host
        run: |
          mkdir -p ~/.kube
          scp -i /tmp/k_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}:/home/${HOST_USER}/.kube/config" ~/.kube/config
          echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Create namespace
        run: |
          kubectl create namespace nemo-microservices --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Kubernetes secrets
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          kubectl delete secret nvcrimagepullsecret ngc-api nvidia-api hf-token \
            -n nemo-microservices --ignore-not-found

          kubectl create secret docker-registry nvcrimagepullsecret \
            -n nemo-microservices \
            --docker-server=nvcr.io \
            --docker-username='$oauthtoken' \
            --docker-password="${NVIDIA_API_KEY}"

          kubectl create secret generic ngc-api \
            -n nemo-microservices \
            --from-literal=NGC_API_KEY="${NVIDIA_API_KEY}"

          kubectl create secret generic nvidia-api \
            -n nemo-microservices \
            --from-literal=NVIDIA_API_KEY="${NVIDIA_API_KEY}"

          kubectl create secret generic hf-token \
            -n nemo-microservices \
            --from-literal=HF_TOKEN="${HF_TOKEN}"

      - name: Label GPU node
        run: |
          NODE_NAME=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          kubectl label node "${NODE_NAME}" \
            feature.node.kubernetes.io/pci-10de.present=true --overwrite || true

      - name: Install Volcano scheduler
        run: |
          kubectl apply -f \
            https://raw.githubusercontent.com/volcano-sh/volcano/v1.9.0/installer/volcano-development.yaml
          kubectl -n volcano-system wait deploy/volcano-scheduler \
            --for=condition=Available --timeout=120s || true

      - name: Add NGC Helm repo
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          helm repo add nmp https://helm.ngc.nvidia.com/nvidia/nemo-microservices \
            --username='$oauthtoken' \
            --password="${NVIDIA_API_KEY}" \
            --force-update
          helm repo update

      - name: Clear any stuck Helm release
        run: |
          STATUS=$(helm status nemo -n nemo-microservices -o json 2>/dev/null | jq -r '.info.status // empty')
          if [[ "$STATUS" == "pending-install" || "$STATUS" == "pending-upgrade" || "$STATUS" == "pending-rollback" ]]; then
            echo "Release is stuck in '${STATUS}' — rolling back to clear lock"
            helm rollback nemo -n nemo-microservices 2>/dev/null || \
              kubectl delete secret -n nemo-microservices -l owner=helm,name=nemo --ignore-not-found
          else
            echo "Release status: '${STATUS:-not found}' — no cleanup needed"
          fi

      - name: Prepare NeMo data directories on host
        run: |
          NEMO_DATA="/home/${HOST_USER}/shared/nemo"
          ssh -i /tmp/k_key -o StrictHostKeyChecking=no "${HOST_USER}@${HOST_IP}" "
            mkdir -p ${NEMO_DATA}/{customizerdb,entity-storedb,evaluatordb,jobsdb,postgresql,datastore,models,job-storage}
            chmod -R 777 ${NEMO_DATA} || true
          "

      - name: Create NeMo hostPath PVs
        run: |
          # k3s has no dynamic provisioner — create all PVs before Helm install
          # so PVCs bind immediately and the 30m Helm timeout isn't wasted.
          NEMO_DATA="/home/${HOST_USER}/shared/nemo"
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-customizerdb-pv
          spec:
            capacity: {storage: 8Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-customizerdb-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/customizerdb", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-entity-storedb-pv
          spec:
            capacity: {storage: 8Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-entity-storedb-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/entity-storedb", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-evaluatordb-pv
          spec:
            capacity: {storage: 8Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-evaluatordb-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/evaluatordb", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-jobsdb-pv
          spec:
            capacity: {storage: 8Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-jobsdb-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/jobsdb", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-postgresql-pv
          spec:
            capacity: {storage: 10Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: data-nemo-postgresql-0, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/postgresql", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-datastore-pv
          spec:
            capacity: {storage: 100Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: datastore-shared-storage, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/datastore", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-models-pv
          spec:
            capacity: {storage: 100Gi}
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: finetuning-ms-models-pvc, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/models", type: DirectoryOrCreate}
          ---
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nemo-job-storage-pv
          spec:
            capacity: {storage: 200Gi}
            accessModes: [ReadWriteMany]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef: {name: nemo-core-job-storage, namespace: nemo-microservices}
            hostPath: {path: "${NEMO_DATA}/job-storage", type: DirectoryOrCreate}
          EOF

      - name: Install NeMo Microservices
        run: |
          helm upgrade --install nemo nmp/nemo-microservices-helm-chart \
            --namespace nemo-microservices \
            --create-namespace \
            --version "${{ inputs.nemo_version }}" \
            -f "$VALUES_FILE" \
            --timeout 30m

      - name: Update hosts file and commit
        env:
          NEMO_VERSION: ${{ inputs.nemo_version }}
          RUNNER: ${{ inputs.runner }}
          MIRAMAR_ORG_ADMIN_PAT: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          set -euo pipefail
          CLUSTER_IP=$(kubectl get node -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')

          printf '%s nemo.test nim.test data-store.test\n' "${CLUSTER_IP}" > "$HOSTS_FILE"

          if [[ "$RUNNER" == "dgx" ]]; then
            # DGX: also refresh version-stamped docs
            DOC_LABEL="${NEMO_VERSION%.*}"

            sed -i "s|cluster IP (\`[0-9][0-9.]*[0-9]\`)|cluster IP (\`${CLUSTER_IP}\`)|g" \
              dgx/k3s/nemo/ENDPOINTS.md

            sed -i \
              -e "s|/nemo/microservices/[0-9][0-9]\.[0-9][0-9]\.[0-9]*/|/nemo/microservices/${NEMO_VERSION}/|g" \
              -e "s|(API reference ([0-9][0-9]\.[0-9][0-9]))|(API reference (${DOC_LABEL}))|g" \
              dgx/k3s/nemo/README.md

            sed -i \
              -e "s|/nemo/microservices/[0-9][0-9]\.[0-9][0-9]\.[0-9]*/|/nemo/microservices/${NEMO_VERSION}/|g" \
              -e "s|\[NeMo [0-9][0-9]\.[0-9][0-9] Swagger\]|\[NeMo ${DOC_LABEL} Swagger\]|g" \
              templates/new-project-nemo/README.md

            sed -i "s|^nemo-microservices.*$|nemo-microservices==${NEMO_VERSION}|" \
              dgx/k3s/nemo/requirements.txt

            sed -i "s|nemo-microservices[^ ]*|nemo-microservices==${NEMO_VERSION}|g" \
              templates/new-project-nemo/notebook.ipynb
          fi

          if git diff --quiet; then
            echo "No changes to commit."
          else
            git config user.email "actions@github.com"
            git config user.name "Miramar Platform"
            git add "$HOSTS_FILE"
            if [[ "$RUNNER" == "dgx" ]]; then
              git add dgx/k3s/nemo/ENDPOINTS.md \
                      dgx/k3s/nemo/README.md \
                      dgx/k3s/nemo/requirements.txt \
                      templates/new-project-nemo/README.md \
                      templates/new-project-nemo/notebook.ipynb
            fi
            git commit -m "docs: update NeMo doc links to ${NEMO_VERSION} [skip ci]"
            git config --local --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${MIRAMAR_ORG_ADMIN_PAT}@github.com/miramar-labs-org/miramar-platform-gcp.git"
            git push origin HEAD:main
            echo "Changes committed and pushed to main."
          fi

      - name: Wait for pods
        run: |
          echo "Waiting up to 30m for all pods to reach Running/Completed..."
          timeout 1800 bash -c '
            while true; do
              statuses="$(kubectl get pods -n nemo-microservices --no-headers 2>/dev/null)"
              if echo "$statuses" | grep -qE "ImagePullBackOff|ErrImagePull"; then
                echo "ERROR: image pull failure detected" >&2
                echo "$statuses" >&2
                exit 1
              fi
              not_ready="$(echo "$statuses" | grep -vE "Running|Completed|Succeeded" | grep -v "^$")"
              if [[ -z "$not_ready" ]]; then
                echo "All pods ready."
                break
              fi
              echo "$(date -u +%H:%M:%S) — waiting on $(echo "$not_ready" | wc -l) pod(s):"
              echo "$not_ready" | awk "{print \"  \", \$1, \$3}" | head -5
              sleep 30
            done
          '
          kubectl get pods -n nemo-microservices

      - name: Configure DNS in runner container
        run: |
          HOSTS_LINE=$(cat "$HOSTS_FILE")
          docker run --rm \
            -e HOSTS_LINE="${HOSTS_LINE}" \
            -v /etc:/host-etc \
            alpine sh -c '
              sed -i "/nemo\.test/d; /nim\.test/d; /data-store\.test/d; /# Added by NeMo/d" /host-etc/hosts
              printf "%s\n" "$HOSTS_LINE" >> /host-etc/hosts
              echo "Updated /etc/hosts entries:"
              grep -E "nemo\.test|nim\.test|data-store\.test" /host-etc/hosts
            '

      - name: Set NeMo active state
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          var="${machine}_NEMO_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="true" -f visibility="all"

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/k_key

      - name: Smoke-test endpoints
        continue-on-error: true
        run: |
          NS=nemo-microservices bash dgx/k3s/nemo/utils/verify-nemo-endpoints.sh

      - name: Summary
        if: always()
        run: |
          POD_COUNT=$(kubectl get pods -n nemo-microservices --no-headers 2>/dev/null | grep -c . || echo 0)
          CHART_VER=$(helm list -n nemo-microservices -o json 2>/dev/null | jq -r '.[0].chart // "unknown"')
          CLUSTER_IP=$(kubectl get node -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null || echo "unknown")
          {
            echo "## NeMo Microservices Deployed"
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| Namespace | \`nemo-microservices\` |"
            echo "| Version | \`${{ inputs.nemo_version }}\` |"
            echo "| Helm chart | \`${CHART_VER}\` |"
            echo "| Pods | \`${POD_COUNT}\` |"
            echo ""
            echo "### /etc/hosts entry"
            echo "\`\`\`"
            cat "$HOSTS_FILE"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
