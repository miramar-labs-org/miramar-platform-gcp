name: NIM Deploy

# Deploys a NIM on the target minikube cluster via the NeMo Microservices deployment API.
# If a different NIM is already deployed it is undeployed first.
# NeMo Microservices must be running before triggering this workflow.
#
# Note: the default nim_name uses the -dgx-spark suffix (Blackwell-optimized).
# For AGX Orin (Ampere sm_87), specify an sm_87-compatible NIM image tag.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
      nim_name:
        description: "NIM model name (e.g. nvidia-nemotron-nano-9b-v2-dgx-spark)"
        required: false
        default: nvidia-nemotron-nano-9b-v2-dgx-spark
      nim_org:
        description: "NIM org / NGC namespace (e.g. nvidia, meta)"
        required: false
        default: nvidia
      image_tag:
        description: "NIM image tag"
        required: false
        default: "1.0.0-variant"

jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SSH target and state vars
        shell: bash
        run: |
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "HOST_IP=${{ vars.AGX_HOST_IP }}"             >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}"           >> "$GITHUB_ENV"
            echo "STATE_NIM_MODEL_VAR=CURRENT_NIM_MODEL_AGX"   >> "$GITHUB_ENV"
            echo "STATE_NIM_VRAM_VAR=CURRENT_NIM_VRAM_GB_AGX"  >> "$GITHUB_ENV"
          else
            echo "HOST_IP=${{ vars.DGX_HOST_IP }}"             >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}"           >> "$GITHUB_ENV"
            echo "STATE_NIM_MODEL_VAR=CURRENT_NIM_MODEL"        >> "$GITHUB_ENV"
            echo "STATE_NIM_VRAM_VAR=CURRENT_NIM_VRAM_GB"       >> "$GITHUB_ENV"
          fi

      - name: Set up kubeconfig
        run: |
          docker network connect minikube "$(cat /etc/hostname)" 2>/dev/null || true
          sudo chmod -R a+rX "${HOME}/.minikube"
          TMP_KC=$(mktemp)
          sed "s|/home/[^/]*/\.minikube/|${HOME}/.minikube/|g" \
              "${HOME}/.kube/config" > "${TMP_KC}"
          echo "KUBECONFIG=${TMP_KC}" >> "${GITHUB_ENV}"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Set up /etc/hosts for NeMo endpoints
        run: |
          MINIKUBE_IP=$(kubectl get node minikube \
            -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')
          sudo sed -i '/nemo\.test/d' /etc/hosts || true
          sudo sed -i '/nim\.test/d'  /etc/hosts || true
          printf '%s nemo.test\n%s nim.test\n' "$MINIKUBE_IP" "$MINIKUBE_IP" \
            | sudo tee -a /etc/hosts >/dev/null
          echo "nemo.test → $MINIKUBE_IP"

      - name: Check for Ollama conflict
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            printf '%s\n' "${{ secrets.AGX_HOST_SSH_KEY }}" > /tmp/host_key
          else
            printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > /tmp/host_key
          fi
          chmod 600 /tmp/host_key
          ssh-keyscan -H "$HOST_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Ollama runs on the host (not in this container), so SSH to check it
          loaded=$(ssh -i /tmp/host_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$HOST_USER@$HOST_IP" \
            'curl -s --connect-timeout 5 --max-time 10 http://localhost:11434/api/ps \
             | jq -r ".models[]?.name" 2>/dev/null || true')

          if [[ -n "$loaded" ]]; then
            echo "::error::An Ollama model is loaded in GPU memory and will conflict with NIM deployment."
            while IFS= read -r m; do echo "  → $m"; done <<< "$loaded"
            echo "Run the Ollama Undeploy workflow first, then retry."
            exit 1
          fi
          echo "No Ollama models loaded — clear to deploy NIM."

      - name: Undeploy existing NIM if different
        env:
          TARGET_ORG: ${{ inputs.nim_org }}
          TARGET_NAME: ${{ inputs.nim_name }}
        run: |
          # NeMo API returns {"data":[...]} not {"items":[...]}
          existing=$(curl -s --connect-timeout 5 --max-time 15 \
            http://nemo.test/v1/deployment/model-deployments 2>/dev/null \
            | jq -r '.data[]? | "\(.namespace) \(.name)"' || true)

          if [[ -z "$existing" ]]; then
            echo "No existing NIM deployments found."
          else
            while IFS=' ' read -r org name; do
              [[ -z "$org" || -z "$name" ]] && continue
              if [[ "$org/$name" != "$TARGET_ORG/$TARGET_NAME" ]]; then
                echo "Undeploying existing NIM: $org/$name"
                # shellcheck source=dgx/minikube/nim/undeploy_nim.sh
                source dgx/minikube/nim/undeploy_nim.sh
                undeploy_nim "$org" "$name"
              else
                echo "Target NIM $org/$name already registered — will redeploy."
              fi
            done <<< "$existing"
          fi

      - name: Deploy NIM
        env:
          NIM_ORG: ${{ inputs.nim_org }}
          NIM_NAME: ${{ inputs.nim_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          # shellcheck source=dgx/minikube/nim/deploy_nim.sh
          source dgx/minikube/nim/deploy_nim.sh
          deploy_nim "$NIM_ORG" "$NIM_NAME" "$IMAGE_TAG"

      - name: Rollback on deploy failure
        if: failure()
        env:
          NIM_ORG: ${{ inputs.nim_org }}
          NIM_NAME: ${{ inputs.nim_name }}
        run: |
          echo "NIM deploy failed — submitting undeploy for ${NIM_ORG}/${NIM_NAME}..."
          ( source dgx/minikube/nim/undeploy_nim.sh
            undeploy_nim "$NIM_ORG" "$NIM_NAME" ) || echo "Undeploy attempt finished (404 = already gone)"
          for var in "${STATE_NIM_MODEL_VAR}" "${STATE_NIM_VRAM_VAR}"; do
            val="none"; [[ "$var" == *"VRAM"* ]] && val="0"
            GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
              -X PATCH "repos/${GITHUB_REPOSITORY}/actions/variables/${var}" \
              -f value="${val}" 2>/dev/null || \
            GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
              -X POST "repos/${GITHUB_REPOSITORY}/actions/variables" \
              -f name="${var}" -f value="${val}" || true
          done

      - name: Update platform state
        if: success()
        run: |
          set -euo pipefail
          NIM_MODEL="${{ inputs.nim_org }}/${{ inputs.nim_name }}"
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X PATCH "repos/${GITHUB_REPOSITORY}/actions/variables/${STATE_NIM_MODEL_VAR}" \
            -f value="${NIM_MODEL}" 2>/dev/null || \
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X POST "repos/${GITHUB_REPOSITORY}/actions/variables" \
            -f name="${STATE_NIM_MODEL_VAR}" -f value="${NIM_MODEL}"

      - name: Record NIM VRAM usage
        if: success()
        run: |
          vram_gb=$(ssh -i /tmp/host_key \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "$HOST_USER@$HOST_IP" \
            'nvidia-smi --query-compute-apps=used_memory --format=csv,noheader,nounits 2>/dev/null | jq -Rn "[inputs | tonumber] | add // 0 | . / 1024 | round"' \
            2>/dev/null || echo "0")
          vram_gb="${vram_gb:-0}"
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X PATCH "repos/${GITHUB_REPOSITORY}/actions/variables/${STATE_NIM_VRAM_VAR}" \
            -f value="${vram_gb}" 2>/dev/null || \
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X POST "repos/${GITHUB_REPOSITORY}/actions/variables" \
            -f name="${STATE_NIM_VRAM_VAR}" -f value="${vram_gb}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## NIM Deploy"
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| NIM | \`${{ inputs.nim_org }}/${{ inputs.nim_name }}\` |"
            echo "| Image tag | \`${{ inputs.image_tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
