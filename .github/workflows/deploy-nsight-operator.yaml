name: Nsight Operator Deploy

# Deploys the NVIDIA Nsight Operator into the nsight-operator namespace on
# the target k3s cluster via Helm from the NGC devtools registry.
#
# After deploy, nsight-portfwd.service forwards two host ports:
#   8889  -> svc/nsight-operator-gateway:8888   (SPA / web UI)
#   13001 -> svc/nsight-operator-coordinator:80 (REST API, used by
#            ~/bin/nsight-export-report to drive collection + fetch reports)
# The :8889 SPA endpoint does NOT serve the REST API. Optionally labels the
# kubeflow namespace with nvidia-nsight-profile=enabled so the injector can
# target KFP pods.
#
# Privileged-mode workarounds are gated on nsight-injector.privileged, read from
# the per-host values file. Whether elevation is needed is a property of the HOST
# DRIVER (RmProfilingAdminOnly), not of the trace mode:
#
#   dgx  RmProfilingAdminOnly: 0  privileged: false  -> webhook + PSA relax skipped
#   agx  RmProfilingAdminOnly: 1  privileged: true   -> webhook + PSA relax applied
#
# On a privileged:false host the injector's added containers carry no securityContext
# at all, so PSA 'baseline' admits them and the APE webhook has nothing to reconcile.
# A host that flips from true to false is converged by "Remove privileged-only
# workarounds", which tears both back down.
#
# Prerequisites:
#   - k3s running on the target machine (K3s Install workflow)
#   - nsight-portfwd.service installed on the host (dgx/systemd/install.sh)
#   - NVIDIA_API_KEY org secret (NGC auth for Helm chart pull)
#
# NOTE: after first deploy, verify the UI service name matches:
#   kubectl get svc -n nsight-operator
# If it differs from nsight-operator-ui, update dgx/systemd/nsight-portfwd.service.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
      chart_version:
        description: Nsight Operator Helm chart version
        default: "26.3.1"
        required: false
      label_kubeflow_namespace:
        description: "Label kubeflow namespace with nvidia-nsight-profile=enabled — WARNING: injects nsys into ALL pods including KFP system pods (DAG driver etc.) which fail with runAsNonRoot. Leave false; use per-pod kubernetes.add_pod_label() in pipeline.py instead."
        type: boolean
        default: false
        required: false
      relax_kubeflow_psa:
        description: "Permit relaxing the kubeflow namespace PodSecurity 'enforce' from baseline to privileged (restored on undeploy). Only consulted on hosts whose values file sets nsight-injector.privileged=true (AGX: RmProfilingAdminOnly=1) — PSA baseline forbids privileged:true. Ignored where privileged=false (DGX), which needs no relax. warn:restricted is left in place."
        type: boolean
        default: true
        required: false
      ape_webhook_tag:
        description: "Image tag for the nsight-ape-webhook admission webhook (reconciles the injector's privileged:true with PSS-hardened KFP step pods). Only deployed where nsight-injector.privileged=true."
        default: "latest"
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve host
        run: |
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "HOST_IP=${{ vars.AGX_HOST_IP }}"     >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}" >> "$GITHUB_ENV"
          else
            echo "HOST_IP=${{ vars.DGX_HOST_IP }}"     >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}" >> "$GITHUB_ENV"
          fi

      - name: Set up SSH key
        run: |
          echo "${{ secrets.HOST_SSH_KEY }}" > /tmp/k_key
          chmod 600 /tmp/k_key
          ssh-keyscan -H "${HOST_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy kubeconfig from host
        run: |
          mkdir -p ~/.kube
          scp -i /tmp/k_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}:/home/${HOST_USER}/.kube/config" ~/.kube/config
          echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Prepare Nsight data directory and PV
        run: |
          # Create host directory for OTLP data
          ssh -i /tmp/k_key -o StrictHostKeyChecking=no "${HOST_USER}@${HOST_IP}" "
            mkdir -p /home/${HOST_USER}/shared/nsight/otlp-data
            chmod 777 /home/${HOST_USER}/shared/nsight/otlp-data || true
          "
          # k3s has no dynamic provisioner — create the static PV so the StatefulSet PVC can bind.
          # Clear stale claimRef if PV is in Released state from a prior undeploy.
          if kubectl get pv nsight-otlp-data-pv -o jsonpath='{.status.phase}' 2>/dev/null | grep -q "Released"; then
            kubectl patch pv nsight-otlp-data-pv -p '{"spec":{"claimRef":null}}' --type=merge
          fi
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: nsight-otlp-data-pv
          spec:
            capacity:
              storage: 10Gi
            accessModes: [ReadWriteOnce]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef:
              name: otlp-data-nsight-operator-overview-0
              namespace: nsight-operator
            hostPath:
              path: /home/${HOST_USER}/shared/nsight/otlp-data
              type: DirectoryOrCreate
          EOF

      - name: Resolve injector privilege mode
        # Single source of truth for everything downstream that depends on whether
        # the injector runs privileged: the per-host values file. Whether elevation
        # is needed at all is decided by the HOST DRIVER, not by the trace mode:
        #
        #   RmProfilingAdminOnly: 0  (DGX)  -> CUPTI attaches unprivileged
        #   RmProfilingAdminOnly: 1  (AGX)  -> CUPTI needs elevation
        #
        # When privileged is false there is nothing for the APE webhook to reconcile
        # (it only rewrites containers already marked privileged) and nothing for PSA
        # 'baseline' to reject, so both are skipped — and any leftovers from a
        # previous privileged deploy are removed further down.
        run: |
          VALUES="dgx/k3s/nsight/values.yaml"
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            VALUES="agx/k3s/nsight/values.yaml"
          fi
          PRIV=$(python3 -c "
          import sys, yaml
          v = yaml.safe_load(open('$VALUES', 'rb').read()) or {}
          print(str(v.get('nsight-injector', {}).get('privileged', False)).lower())
          ")
          case "$PRIV" in
            true|false) ;;
            *) echo "ERROR: could not read nsight-injector.privileged from $VALUES (got '${PRIV}')" >&2; exit 1 ;;
          esac
          echo "NSIGHT_VALUES=$VALUES"        >> "$GITHUB_ENV"
          echo "INJECTOR_PRIVILEGED=$PRIV"    >> "$GITHUB_ENV"
          echo "Values file: $VALUES"
          echo "nsight-injector.privileged: $PRIV"

      - name: Preflight — driver vs privilege mode
        # Guards the one failure this gating can introduce, and the one it inherits:
        # a host that REQUIRES elevation running with privileged:false. That fails
        # silently — collection runs, the coordinator reports success, the report is
        # exported and verified, and it simply contains no GPU records. Catch it here
        # instead of three steps into an interpretation session.
        run: |
          ADMIN_ONLY=$(ssh -i /tmp/k_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}" \
            "awk '/RmProfilingAdminOnly/ {print \$2}' /proc/driver/nvidia/params" 2>/dev/null || echo "")

          if [[ -z "$ADMIN_ONLY" ]]; then
            echo "WARNING: could not read RmProfilingAdminOnly from the host driver — skipping the check."
            exit 0
          fi
          echo "host RmProfilingAdminOnly: $ADMIN_ONLY | values privileged: ${INJECTOR_PRIVILEGED}"

          if [[ "$ADMIN_ONLY" == "1" && "${INJECTOR_PRIVILEGED}" == "false" ]]; then
            echo "ERROR: ${{ inputs.runner }} reports RmProfilingAdminOnly: 1, so CUPTI cannot" >&2
            echo "       attach without elevation, but ${NSIGHT_VALUES} sets privileged: false." >&2
            echo "       Profiling would appear to succeed and produce reports with no GPU" >&2
            echo "       records. Set privileged: true in that file, or clear the driver flag." >&2
            exit 1
          fi

          if [[ "$ADMIN_ONLY" == "0" && "${INJECTOR_PRIVILEGED}" == "true" ]]; then
            echo "NOTE: this host allows unprivileged profiling (RmProfilingAdminOnly: 0) but"
            echo "      ${NSIGHT_VALUES} still sets privileged: true. That works, but it"
            echo "      needs the APE webhook and the kubeflow PSA relax to do so."
          fi

      - name: Add NGC Helm repo
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          helm repo add nvidia-devtools https://helm.ngc.nvidia.com/nvidia/devtools \
            --username='$oauthtoken' \
            --password="${NVIDIA_API_KEY}" \
            --force-update
          helm repo update

      - name: Sync Nsight Operator CRDs
        # Helm never upgrades CRDs on `helm upgrade` (only on first install). The
        # nsight-operator chart evolves its CRD schemas between minor versions —
        # e.g. 26.2.x -> 26.3.x moved the process include/exclude patterns into
        # NsightOperatorProfileConfig.spec.injectionRules[] — so a stale CRD
        # silently strips the new fields from the templated CR. Apply the chart's
        # bundled CRDs (server-side; several exceed the client-side annotation
        # limit) before the Helm release.
        run: |
          rm -rf /tmp/nsight-chart && mkdir -p /tmp/nsight-chart
          helm pull nvidia-devtools/nsight-operator \
            --version "${{ inputs.chart_version }}" \
            --untar --untardir /tmp/nsight-chart
          find /tmp/nsight-chart -path '*/crds/*.yaml' -print0 \
            | xargs -0 -r -I{} kubectl apply --server-side --force-conflicts -f {}

      - name: Clear stale injection ProfileConfigs
        # helm's 3-way merge only repairs a field when the old and new release
        # manifests differ for it. If an earlier upgrade wrote the CR against a
        # stale CRD that stripped a field, both manifests now agree and helm will
        # never re-add it to the live object. Delete the helm-managed ProfileConfig
        # CRs so the Helm release below recreates them cleanly against the CRDs
        # just applied. Safe: this runs mid-deploy, injection is reconfigured anyway.
        run: |
          kubectl delete nsightoperatorprofileconfig \
            -n nsight-operator --all --ignore-not-found

      - name: Install Nsight Operator
        # Values are per-host: the injector's securityContext.privileged depends on
        # the host driver's RmProfilingAdminOnly. DGX runs 0 (non-admin profiling
        # allowed) and sets privileged:false; AGX runs 1 and must stay privileged.
        # NSIGHT_VALUES is resolved once by "Resolve injector privilege mode".
        run: |
          echo "Using values: ${NSIGHT_VALUES}"
          helm upgrade --install \
            --wait \
            --namespace nsight-operator \
            --create-namespace \
            --version "${{ inputs.chart_version }}" \
            -f "${NSIGHT_VALUES}" \
            --timeout 10m \
            nsight-operator \
            nvidia-devtools/nsight-operator

      - name: Wait for pods
        run: kubectl get pods -n nsight-operator

      - name: Roll the injector so values changes take effect
        # helm only rewrites the nsight-injector ConfigMap; the Deployment spec is
        # unchanged, so no rollout is triggered and the injector keeps serving the
        # sidecar config it parsed at startup (privileged, injection patterns, tool
        # setup). Values changes then silently do not apply until the pod happens to
        # restart. Observed 2026-09-06: privileged:false sat in the ConfigMap for a
        # full deploy while pods were still being stamped privileged:true.
        run: |
          kubectl rollout restart deploy/nsight-injector -n nsight-operator
          kubectl rollout status deploy/nsight-injector -n nsight-operator --timeout=180s

      - name: Deploy APE fixup webhook
        if: ${{ env.INJECTOR_PRIVILEGED == 'true' }}
        # Only needed when the injector runs privileged. It stamps
        # securityContext.privileged=true on every container of a labelled pod; KFP
        # bakes allowPrivilegeEscalation=false + drop:[ALL] + RuntimeDefault into its
        # step containers, and the apiserver rejects privileged+APE:false. This tiny
        # mutating webhook (reinvocationPolicy: IfNeeded) reconciles the two on pods
        # carrying nvidia-nsight-profile=enabled. See nsight-ape-webhook/.
        #
        # With privileged:false the webhook is a no-op by construction — buildPatch()
        # returns early for any container not already marked privileged — so it is
        # skipped rather than deployed inert.
        env:
          MIRAMAR_ORG_GHCR_PAT: ${{ secrets.MIRAMAR_ORG_GHCR_PAT }}
          WEBHOOK_TAG: ${{ inputs.ape_webhook_tag }}
        run: |
          # namespace already exists — helm ran with --create-namespace above.
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=miramar-labs-org \
            --docker-password="${MIRAMAR_ORG_GHCR_PAT}" \
            --namespace=nsight-operator \
            --dry-run=client -o yaml | kubectl apply -f -
          IMAGE="ghcr.io/miramar-labs-org/nsight-ape-webhook:${WEBHOOK_TAG}"
          sed "s|__IMAGE__|${IMAGE}|g" nsight-ape-webhook/manifests/webhook.yaml | kubectl apply -f -
          kubectl rollout status deploy/nsight-ape-webhook -n nsight-operator --timeout=120s

      - name: Relax kubeflow PodSecurity enforcement
        if: ${{ inputs.relax_kubeflow_psa && env.INJECTOR_PRIVILEGED == 'true' }}
        # PSA 'baseline' on the kubeflow namespace (set by upstream KFP kustomize)
        # forbids privileged:true, so on a host that must run the injector privileged
        # it blocks profiling of KFP step pods even after the APE webhook resolves the
        # apiserver conflict. Relax 'enforce' to 'privileged' for the duration;
        # undeploy restores 'baseline'. 'warn: restricted' is kept so non-profiling
        # manifests still get warnings.
        #
        # Skipped entirely when privileged is false: the injector's added containers
        # then carry no securityContext at all, which 'baseline' admits. The input
        # remains a permission, not a command — it can still be declined on a host
        # that does need the relax.
        run: |
          if kubectl get namespace kubeflow >/dev/null 2>&1; then
            kubectl label namespace kubeflow \
              pod-security.kubernetes.io/enforce=privileged --overwrite
          else
            echo "kubeflow namespace not present — skipping PSA relax"
          fi

      - name: Remove privileged-only workarounds
        if: ${{ env.INJECTOR_PRIVILEGED != 'true' }}
        # Converge a host that used to run privileged. Without this, flipping a values
        # file to privileged:false would leave the webhook Running and the kubeflow
        # namespace at enforce=privileged indefinitely — the deploy would simply stop
        # touching them, and the cluster would keep a permanently relaxed namespace
        # plus an admission webhook in every profiled pod's create path for no reason.
        #
        # Mirrors what Nsight Operator Undeploy does, so the two stay symmetric.
        run: |
          echo "--- removing the APE webhook (nothing privileged to reconcile) ---"
          # Delete the MutatingWebhookConfiguration FIRST: while it exists with
          # failurePolicy Ignore it is harmless, but removing the backing Deployment
          # first would leave a window with a registered webhook and no endpoint.
          kubectl delete mutatingwebhookconfiguration nsight-ape-webhook --ignore-not-found
          kubectl delete clusterrolebinding nsight-ape-webhook --ignore-not-found
          kubectl delete clusterrole nsight-ape-webhook --ignore-not-found
          kubectl delete deploy,svc,serviceaccount -n nsight-operator \
            -l app=nsight-ape-webhook --ignore-not-found

          echo "--- restoring kubeflow PSA enforce=baseline ---"
          if kubectl get namespace kubeflow >/dev/null 2>&1; then
            current=$(kubectl get namespace kubeflow \
              -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}')
            if [[ "$current" == "privileged" ]]; then
              kubectl label namespace kubeflow \
                pod-security.kubernetes.io/enforce=baseline --overwrite
              echo "restored enforce: privileged -> baseline"
            else
              echo "enforce already '${current:-unset}' — left alone"
            fi
          else
            echo "kubeflow namespace not present — nothing to restore"
          fi

      - name: Label kubeflow namespace
        if: ${{ inputs.label_kubeflow_namespace }}
        run: |
          kubectl label namespace kubeflow nvidia-nsight-profile=enabled --overwrite

      - name: Start port-forward service
        # nsight-portfwd forwards BOTH the gateway SPA (8889) and the coordinator
        # REST API (13001). ~/bin/nsight-export-report talks to :13001; the :8889
        # SPA endpoint does not expose the REST API.
        run: |
          scp -i /tmp/k_key -o StrictHostKeyChecking=no \
            dgx/systemd/nsight-portfwd.service \
            "${HOST_USER}@${HOST_IP}:~/.config/systemd/user/nsight-portfwd.service"
          ssh -i /tmp/k_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}" \
            'systemctl --user daemon-reload && systemctl --user enable nsight-portfwd.service && systemctl --user restart nsight-portfwd.service'
          # Give the pair a moment to bind, then verify the coordinator REST API is
          # reachable (JSON), not the SPA fallback.
          ssh -i /tmp/k_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}" \
            'for i in $(seq 1 20); do curl -fsS localhost:13001/api/v1/sessions/ | head -c 1 | grep -q "[[{]" && { echo "coordinator REST API OK on :13001"; exit 0; }; sleep 2; done; echo "WARNING: coordinator REST API not confirmed on :13001"; systemctl --user status nsight-portfwd.service --no-pager || true'

      - name: Set Nsight Operator active state
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          var="${machine}_NSIGHT_OPERATOR_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="true" -f visibility="all"

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/k_key

      - name: Summary
        if: always()
        run: |
          POD_COUNT=$(kubectl get pods -n nsight-operator --no-headers 2>/dev/null | grep -c . || echo 0)
          KF_LABEL=$(kubectl get namespace kubeflow --show-labels 2>/dev/null | grep -o 'nvidia-nsight-profile=enabled' || echo 'not labeled')
          KF_PSA=$(kubectl get namespace kubeflow -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}' 2>/dev/null || echo 'n/a')
          APE_WEBHOOK=$(kubectl get deploy nsight-ape-webhook -n nsight-operator -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)
          if [[ "${INJECTOR_PRIVILEGED:-}" == "true" ]]; then
            PRIV_NOTE="privileged — APE webhook + PSA relax active"
          else
            PRIV_NOTE="unprivileged — APE webhook + PSA relax not needed"
          fi
          {
            echo "## Nsight Operator Deployed"
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| Chart version | \`${{ inputs.chart_version }}\` |"
            echo "| Namespace | \`nsight-operator\` |"
            echo "| Pods | \`${POD_COUNT}\` |"
            echo "| Injector mode | \`${INJECTOR_PRIVILEGED:-unknown}\` — ${PRIV_NOTE} |"
            echo "| APE fixup webhook ready | \`${APE_WEBHOOK:-0}\` |"
            echo "| kubeflow enforce PSA | \`${KF_PSA:-n/a}\` |"
            echo "| kubeflow label | \`${KF_LABEL}\` |"
            echo ""
            echo "Tunnel to access the UI:"
            echo "\`\`\`"
            echo "ssh -L 8889:localhost:8889 ${HOST_USER}@${HOST_IP}"
            echo "# http://localhost:8889"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
