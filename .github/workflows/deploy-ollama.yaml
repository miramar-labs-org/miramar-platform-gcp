name: Ollama Deploy

# Pulls an Ollama model and loads it into GPU memory on the DGX Spark.
# Fails if a NIM or another Ollama model is already using the 128 GB GPU pool.
# Requires minikube to be running for the NIM conflict check (skipped if not).

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model tag (e.g. llama3.3:70b-instruct-q4_K_M)"
        required: false
        default: llama3.3:70b-instruct-q4_K_M

jobs:
  deploy:
    runs-on: [self-hosted, dgx]
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key for DGX host
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > /tmp/dgx_host
          chmod 600 /tmp/dgx_host
          ssh-keyscan -H "${{ vars.DGX_HOST_IP }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Auto-undeploy existing Ollama model
        shell: bash
        run: |
          set -euo pipefail
          # Unload any currently loaded model before deploying the new one.
          # undeploy_ollama.sh with no args auto-detects the loaded model; exits 0 if none.
          ssh -i /tmp/dgx_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST_IP }}" \
            'bash -s' \
            < dgx/ollama/undeploy_ollama.sh

      - name: Check conflicts and deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh -i /tmp/dgx_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST_IP }}" \
            bash -s -- "${{ inputs.model }}" "${{ vars.DGX_VRAM_USEABLE }}" \
            < dgx/ollama/deploy_ollama.sh

      - name: Rollback on deploy failure
        if: failure()
        shell: bash
        run: |
          echo "Ollama deploy failed — unloading any partially loaded model..."
          ssh -i /tmp/dgx_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST_IP }}" \
            'bash -s' \
            < dgx/ollama/undeploy_ollama.sh || true
          for var_val in "CURRENT_OLLAMA_MODEL=none" "CURRENT_OLLAMA_VRAM_GB=0"; do
            var="${var_val%%=*}"; val="${var_val#*=}"
            GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
              -X PATCH "repos/${GITHUB_REPOSITORY}/actions/variables/${var}" \
              -f value="${val}" 2>/dev/null || \
            GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
              -X POST "repos/${GITHUB_REPOSITORY}/actions/variables" \
              -f name="${var}" -f value="${val}" || true
          done

      - name: Update platform state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X PATCH "repos/${GITHUB_REPOSITORY}/actions/variables/CURRENT_OLLAMA_MODEL" \
            -f value="${{ inputs.model }}" 2>/dev/null || \
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X POST "repos/${GITHUB_REPOSITORY}/actions/variables" \
            -f name="CURRENT_OLLAMA_MODEL" -f value="${{ inputs.model }}"

      - name: Record Ollama VRAM usage
        if: success()
        shell: bash
        run: |
          vram_gb=$(ssh -i /tmp/dgx_host \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST_IP }}" \
            'curl -s http://localhost:11434/api/ps | jq "[.models[].size_vram // 0] | add // 0 | . / 1073741824 | round"' \
            2>/dev/null || echo "0")
          vram_gb="${vram_gb:-0}"
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X PATCH "repos/${GITHUB_REPOSITORY}/actions/variables/CURRENT_OLLAMA_VRAM_GB" \
            -f value="${vram_gb}" 2>/dev/null || \
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X POST "repos/${GITHUB_REPOSITORY}/actions/variables" \
            -f name="CURRENT_OLLAMA_VRAM_GB" -f value="${vram_gb}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Ollama Deploy"
            echo "| | |"
            echo "|---|---|"
            echo "| Model | \`${{ inputs.model }}\` |"
            echo "| Host | \`${{ vars.DGX_HOST_IP }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
