name: Qdrant Deploy

# Deploys Qdrant vector database into the qdrant-system namespace on the
# target minikube cluster and restarts the qdrant-portfwd systemd service.
#
# Prerequisites: Minikube must be running on the target machine.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx

jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          # k3s writes kubeconfig to ~/.kube/config at install time; no docker network
          # tricks needed — the API server is at 127.0.0.1:6443 and the runner uses
          # --network=host so it resolves directly.
          echo "KUBECONFIG=${HOME}/.kube/config" >> "${GITHUB_ENV}"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Deploy Qdrant
        run: bash dgx/minikube/qdrant/integrate-qdrant.sh

      - name: Smoke-test endpoints
        continue-on-error: true
        run: bash dgx/minikube/qdrant/verify-qdrant-endpoints.sh

      - name: Restart qdrant-portfwd systemd service on host
        env:
          HOST_USER: ${{ vars.DGX_HOST_USER }}
          HOST_IP:   ${{ inputs.runner == 'agx' && vars.AGX_HOST_IP || vars.DGX_HOST_IP }}
          SSH_KEY:   ${{ secrets.HOST_SSH_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}" \
            'systemctl --user restart qdrant-portfwd 2>/dev/null || true; \
             systemctl --user is-active qdrant-portfwd || true'
          rm -f /tmp/deploy_key

      - name: Set Qdrant active state
        env:
          GITHUB_ORG_ADMIN_PAT: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          export GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}"
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          var="${machine}_QDRANT_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="true" -f visibility="all"
