name: Diagnose NeMo Endpoints
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, dgx]
    timeout-minutes: 5
    steps:
      - name: Check NeMo pods and endpoints
        run: |
          echo "=== minikube status ==="
          minikube status --profile minikube 2>&1 || true

          echo ""
          echo "=== nemo-microservices pods ==="
          kubectl get pods -n nemo-microservices 2>&1 || echo "namespace not found or kubectl error"

          echo ""
          echo "=== /etc/hosts entries ==="
          grep -E "nemo\.test|nim\.test|data-store\.test" /etc/hosts || echo "no entries found"

          echo ""
          echo "=== nemo-portfwd service ==="
          systemctl --user is-active nemo-portfwd.service 2>&1 || true
          systemctl --user status nemo-portfwd.service --no-pager -l 2>&1 | tail -10 || true

          echo ""
          echo "=== curl nemo.test (port 80) ==="
          curl -s -o /dev/null -w "HTTP %{http_code}" --connect-timeout 5 http://nemo.test/v1/namespaces 2>&1 || echo "FAILED"

          echo ""
          echo "=== curl localhost:8082 ==="
          curl -s -o /dev/null -w "HTTP %{http_code}" --connect-timeout 5 http://localhost:8082/v1/namespaces 2>&1 || echo "FAILED"
