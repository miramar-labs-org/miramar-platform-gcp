name: GCP Platform Create

# Provisions (or re-provisions) the miramar-platform GCP resources via Terraform:
#   - GKE Standard cluster + node pool
#   - Artifact Registry repo
#   - GCS cluster state bucket (pre-Terraform; also serves as TF backend)
# Then applies K8s namespaces and RBAC via create-miramar-platform.zsh.
#
# Requires bootstrap-miramar-platform.zsh to have run first (WIF + service
# accounts must exist and WIF_PROVIDER / GCP_SERVICE_ACCOUNT secrets set).
#
# NOTE: first run after migrating from gcloud-managed resources requires a
# destroy + create cycle — Terraform cannot adopt pre-existing resources
# without an import.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}
  AR_REPO: ${{ vars.GAR_REPO }}
  CLUSTER_STATE_BUCKET: ${{ vars.GKE_STATE_BUCKET }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        id: wif_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.wif_auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Clear stale WIF credentials on auth failure
        if: steps.wif_auth.outcome != 'success'
        run: |
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          {
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_GHA_CREDS_PATH="
            echo "CLOUDSDK_CORE_PROJECT="
            echo "CLOUDSDK_PROJECT="
            echo "GCLOUD_PROJECT="
            echo "GCP_PROJECT="
            echo "GOOGLE_CLOUD_PROJECT="
          } >> "$GITHUB_ENV"

      - name: Verify gcloud authentication
        run: gcloud auth list --filter=status:ACTIVE --format='value(account)'

      - name: Ensure Terraform state / snapshot bucket
        run: |
          if ! gcloud storage ls "gs://$CLUSTER_STATE_BUCKET" > /dev/null 2>&1; then
            echo "Creating bucket gs://$CLUSTER_STATE_BUCKET"
            gcloud storage buckets create "gs://$CLUSTER_STATE_BUCKET" \
              --project="$PROJECT_ID" \
              --location="$GCP_REGION"
            sleep 5
          else
            echo "Bucket already exists: gs://$CLUSTER_STATE_BUCKET"
          fi


      - name: Ensure FT adapters bucket
        run: |
          if ! gcloud storage buckets describe "gs://miramar-platform-ft-adapters" > /dev/null 2>&1; then
            echo "Creating gs://miramar-platform-ft-adapters"
            gcloud storage buckets create "gs://miramar-platform-ft-adapters" \
              --project="$PROJECT_ID" \
              --location="$GCP_REGION" \
              --uniform-bucket-level-access
          else
            echo "Bucket gs://miramar-platform-ft-adapters already exists"
          fi

      - name: Terraform Init
        working-directory: gcp/terraform
        run: terraform init -backend-config="bucket=$CLUSTER_STATE_BUCKET"

      - name: Terraform Apply
        working-directory: gcp/terraform
        run: |
          for attempt in 1 2 3; do
            terraform apply -auto-approve -var-file=terraform.tfvars && break
            if [[ $attempt -lt 3 ]]; then
              echo "Attempt $attempt failed — retrying in 60s..."
              sleep 60
            else
              echo "All 3 attempts failed."
              exit 1
            fi
          done

      - name: Get GKE credentials (WIF)
        if: steps.wif_auth.outcome == 'success'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Get GKE credentials (cold start)
        if: steps.wif_auth.outcome != 'success'
        run: |
          gcloud container clusters get-credentials "$GKE_CLUSTER_NAME" \
            --zone "$GKE_ZONE" --project "$PROJECT_ID"

      - name: Install zsh
        run: which zsh || (sudo apt-get update && sudo apt-get install -y zsh)

      - name: Apply K8s namespaces and RBAC
        run: zsh ./gcp/create-miramar-platform.zsh 2>&1 | tee /tmp/create.log

      - name: Add NGC Helm repo
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          helm repo add nvidia-devtools https://helm.ngc.nvidia.com/nvidia/devtools \
            --username='$oauthtoken' \
            --password="${NVIDIA_API_KEY}" \
            --force-update
          helm repo update

      - name: Install Nsight Operator
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          helm upgrade --install \
            --wait \
            --namespace nsight-operator \
            --create-namespace \
            -f gke/nsight/values.yaml \
            --timeout 5m \
            nsight-operator \
            nvidia-devtools/nsight-operator
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/GKE_NSIGHT_OPERATOR_ACTIVE" \
            -f name="GKE_NSIGHT_OPERATOR_ACTIVE" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="GKE_NSIGHT_OPERATOR_ACTIVE" -f value="true" -f visibility="all"

      - name: Show cluster state
        run: |
          echo "--- Nodes ---"
          kubectl get nodes -o wide
          echo "--- Namespaces ---"
          kubectl get namespaces

      - name: Sync GitHub org variables from tfvars
        env:
          GITHUB_ORG_ADMIN_PAT: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list
            sudo apt-get update -qq && sudo apt-get install -y -qq gh
          fi
          GH_TOKEN="$GITHUB_ORG_ADMIN_PAT" ./scripts/gha/sync-github-tf-vars.sh

      - name: Mark cluster active
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/GKE_CLUSTER_ACTIVE" \
            -f name="GKE_CLUSTER_ACTIVE" -f value="true" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="GKE_CLUSTER_ACTIVE" -f value="true" -f visibility="all"

      - name: Summary
        run: |
          NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -c . || echo 0)
          NS_COUNT=$(kubectl get namespaces --no-headers 2>/dev/null | grep -c . || echo 0)
          {
            echo "## Miramar Platform Created / Verified"
            echo "| | |"
            echo "|---|---|"
            echo "| Project | \`$PROJECT_ID\` |"
            echo "| Cluster | \`$GKE_CLUSTER_NAME\` |"
            echo "| Zone | \`$GKE_ZONE\` |"
            echo "| Nodes | \`$NODE_COUNT\` |"
            echo "| Namespaces | \`$NS_COUNT\` |"
          } >> "$GITHUB_STEP_SUMMARY"
