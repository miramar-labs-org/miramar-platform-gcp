name: GCP Platform Destroy

# ⚠ DESTRUCTIVE — tears down the miramar-platform stack:
#   1. terraform destroy — GKE cluster + node pool + Artifact Registry repo
#   2. gcloud fallback — cleans up any pre-Terraform resources not in TF state
#   3. gsutil — deletes the GCS state/snapshot bucket (cannot be in TF state)
#   4. Optionally: delete the GCP project itself (separate confirmation)
#
# Two guards must both pass before anything is deleted:
#   1. Type the project name exactly in confirm_project.
#   2. Check i_confirm to acknowledge the action is irreversible.
#
# Deleting the GCP project is gated behind a third checkbox (delete_project).
# Project deletion has a 30-day undelete window but removes billing immediately.

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Type the project name to confirm: miramar-platform"
        required: true
      i_confirm:
        description: I understand this permanently destroys the cluster and all workloads
        type: boolean
        default: false
        required: true
      delete_project:
        description: "Also delete the GCP project itself (30-day undelete window)"
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}
  AR_REPO: ${{ vars.GAR_REPO }}
  CLUSTER_STATE_BUCKET: ${{ vars.GKE_STATE_BUCKET }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm_project }}" != "$PROJECT_ID" ]; then
            echo "::error::Project name mismatch. Expected '$PROJECT_ID', got '${{ inputs.confirm_project }}'."
            exit 1
          fi
          if [ "${{ inputs.i_confirm }}" != "true" ]; then
            echo "::error::You must check the confirmation box to proceed."
            exit 1
          fi
          echo "::warning::Destroying miramar-platform stack. This cannot be undone."

      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        id: tf_init
        continue-on-error: true
        working-directory: gcp/terraform
        run: terraform init -backend-config="bucket=$CLUSTER_STATE_BUCKET"

      - name: Terraform Destroy
        id: tf_destroy
        if: steps.tf_init.outcome == 'success'
        working-directory: gcp/terraform
        run: |
          terraform destroy -auto-approve -var-file=terraform.tfvars

      - name: Cleanup GKE cluster (fallback for pre-Terraform resources)
        id: del_gke
        continue-on-error: true
        run: |
          STATUS=$(gcloud container clusters describe "$GKE_CLUSTER_NAME" \
              --zone "$GKE_ZONE" --project "$PROJECT_ID" \
              --format="value(status)" 2>/dev/null || echo "NOT_FOUND")
          case "$STATUS" in
            RUNNING)
              echo "::notice::GKE cluster RUNNING after terraform destroy — deleting via gcloud"
              gcloud container clusters delete "$GKE_CLUSTER_NAME" \
                --zone "$GKE_ZONE" --project "$PROJECT_ID" --quiet
              echo "result=deleted" >> "$GITHUB_OUTPUT"
              ;;
            STOPPING|RECONCILING|PROVISIONING)
              echo "Cluster status is $STATUS — deletion already in progress, skipping."
              echo "result=skipped ($STATUS)" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Cluster not found or status=$STATUS — skipping."
              echo "result=skipped" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Cleanup Artifact Registry repo (fallback for pre-Terraform resources)
        id: del_ar
        continue-on-error: true
        run: |
          if gcloud artifacts repositories describe "$AR_REPO" \
              --location "$GCP_REGION" --project "$PROJECT_ID" &>/dev/null; then
            echo "::notice::AR repo still exists after terraform destroy — deleting via gcloud"
            gcloud artifacts repositories delete "$AR_REPO" \
              --location "$GCP_REGION" --project "$PROJECT_ID" --quiet
            echo "result=deleted" >> "$GITHUB_OUTPUT"
          else
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete cluster state bucket
        id: del_bucket
        run: |
          if gcloud storage ls "gs://$CLUSTER_STATE_BUCKET" > /dev/null 2>&1; then
            gcloud storage rm --recursive "gs://$CLUSTER_STATE_BUCKET"
            echo "Cluster state bucket deleted."
            echo "result=deleted" >> "$GITHUB_OUTPUT"
          else
            echo "Cluster state bucket not found — skipping."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete GCP project
        if: ${{ inputs.delete_project == true }}
        run: |
          echo "::warning::Deleting GCP project $PROJECT_ID. 30-day undelete window applies."
          gcloud projects delete "$PROJECT_ID" --quiet
          echo "Project $PROJECT_ID deleted."

      - name: Release Gateway static IP and SSL certificate
        continue-on-error: true
        run: |
          gcloud compute ssl-certificates delete miramar-api-cert \
            --global --project="$PROJECT_ID" --quiet || true
          gcloud compute addresses delete miramar-gateway-ip \
            --global --project="$PROJECT_ID" --quiet || true

      - name: Mark cluster inactive
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          for var_name in GKE_CLUSTER_ACTIVE GKE_GPU_POOL_ACTIVE GKE_NSIGHT_OPERATOR_ACTIVE GKE_GATEWAY_ACTIVE GKE_MODEL_ROUTER_ACTIVE; do
            gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var_name}" \
              -f name="${var_name}" -f value="false" -f visibility="all" \
            || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
              -f name="${var_name}" -f value="false" -f visibility="all"
          done
          for var_name in GKE_GPU_TYPE; do
            gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var_name}" \
              -f name="${var_name}" -f value="none" -f visibility="all" \
            || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
              -f name="${var_name}" -f value="none" -f visibility="all"
          done
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/GKE_NODE_COUNT" \
            -f name="GKE_NODE_COUNT" -f value="1" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="GKE_NODE_COUNT" -f value="1" -f visibility="all"
          # GitHub's API rejects creating a variable with an empty value, so only
          # clear GKE_GATEWAY_URL if it already exists (a never-created variable
          # is already logically "inactive/empty" for dashboard purposes).
          if gh api "/orgs/miramar-labs-org/actions/variables/GKE_GATEWAY_URL" >/dev/null 2>&1; then
            gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/GKE_GATEWAY_URL" \
              -f name="GKE_GATEWAY_URL" -f value="" -f visibility="all"
          fi

      - name: Summary
        run: |
          {
            echo "## Miramar Platform Destroyed"
            echo "| | |"
            echo "|---|---|"
            echo "| Project | \`$PROJECT_ID\` |"
            echo "| Terraform destroy | ${{ steps.tf_destroy.outcome || 'skipped (no state)' }} |"
            echo "| GKE fallback | ${{ steps.del_gke.outputs.result || 'n/a' }} |"
            echo "| AR fallback | ${{ steps.del_ar.outputs.result || 'n/a' }} |"
            echo "| State bucket | ${{ steps.del_bucket.outputs.result }} |"
            echo "| Project deleted | ${{ inputs.delete_project }} |"
            echo "| Destroyed by | \`${{ github.actor }}\` |"
            echo ""
            echo "> To recreate, run the **Miramar Platform Create** workflow."
          } >> "$GITHUB_STEP_SUMMARY"
