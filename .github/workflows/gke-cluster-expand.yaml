name: GKE Cluster Expand

on:
  workflow_dispatch:
    inputs:
      node_pool:
        description: Node pool to resize
        default: e2-medium-pool
        required: true
      target_nodes:
        description: Number of nodes while testing
        default: '2'
        required: true

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: miramar-platform
  GKE_CLUSTER_NAME: miramar-shared-gke
  GKE_ZONE: us-west1-a
  CLUSTER_STATE_BUCKET: miramar-platform-cluster-state

jobs:
  expand:
    runs-on: [self-hosted, wsl2]
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Snapshot node pool state
        id: snapshot
        run: |
          gcloud container node-pools describe "${{ inputs.node_pool }}" \
            --cluster "$GKE_CLUSTER_NAME" \
            --zone "$GKE_ZONE" \
            --project "$GCP_PROJECT_ID" \
            --format=json > /tmp/pool-state.json

          LIVE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -c . || echo 0)

          python3 -c "import json; d=json.load(open('/tmp/pool-state.json')); d['_snapshotLiveNodeCount']=$LIVE_COUNT; json.dump(d,open('/tmp/pool-state-save.json','w'),indent=2)"

          STATE_PATH="gs://$CLUSTER_STATE_BUCKET/gke/node-pool-${{ inputs.node_pool }}.json"
          gsutil cp /tmp/pool-state-save.json "$STATE_PATH"

          MACHINE=$(python3 -c "import json; print(json.load(open('/tmp/pool-state.json'))['config']['machineType'])")
          CONFIGURED=$(python3 -c "import json; print(json.load(open('/tmp/pool-state.json'))['initialNodeCount'])")

          echo "live_count=$LIVE_COUNT" >> "$GITHUB_OUTPUT"
          echo "configured_count=$CONFIGURED" >> "$GITHUB_OUTPUT"
          echo "machine_type=$MACHINE" >> "$GITHUB_OUTPUT"
          echo "state_path=$STATE_PATH" >> "$GITHUB_OUTPUT"
          echo "::notice title=State saved::$LIVE_COUNT live node(s) | $MACHINE | configured=$CONFIGURED → $STATE_PATH"

      - name: Expand node pool
        run: |
          gcloud container clusters resize "$GKE_CLUSTER_NAME" \
            --zone "$GKE_ZONE" \
            --project "$GCP_PROJECT_ID" \
            --node-pool "${{ inputs.node_pool }}" \
            --num-nodes "${{ inputs.target_nodes }}" \
            --quiet

      - name: Wait for nodes Ready
        run: |
          echo "Waiting for ${{ inputs.target_nodes }} node(s) to be Ready..."
          for i in $(seq 1 30); do
            READY=$(kubectl get nodes --no-headers 2>/dev/null | grep -c " Ready" || echo 0)
            echo "Ready: $READY / ${{ inputs.target_nodes }}"
            [ "$READY" -ge "${{ inputs.target_nodes }}" ] && break
            sleep 10
          done

      - name: Summary
        run: |
          {
            echo "## GKE Cluster Expanded"
            echo "| | |"
            echo "|---|---|"
            echo "| Node pool | \`${{ inputs.node_pool }}\` |"
            echo "| Machine type | \`${{ steps.snapshot.outputs.machine_type }}\` |"
            echo "| Live nodes before | \`${{ steps.snapshot.outputs.live_count }}\` |"
            echo "| Configured count before | \`${{ steps.snapshot.outputs.configured_count }}\` |"
            echo "| Nodes now | \`${{ inputs.target_nodes }}\` |"
            echo "| State saved to | \`${{ steps.snapshot.outputs.state_path }}\` |"
            echo ""
            echo "> Run **GKE Cluster Restore** when done — it reads the saved state automatically."
          } >> "$GITHUB_STEP_SUMMARY"
