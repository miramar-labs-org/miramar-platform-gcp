name: GKE Expand GPU

# Adds a temporary GPU node pool and relaxes the namespace resource quota.
# Run GKE Restore GPU when done to remove the pool and restore the quota.
#
# GPU options (gpu_type input):
#   nvidia-tesla-t4  — Turing,  16GB VRAM, n1-standard-4, us-central1-b  (~$0.54/hr) [default]
#   nvidia-l4        — Ada,     24GB VRAM, g2-standard-4, us-central1-b  (~$0.74/hr)
#   nvidia-tesla-p4  — Pascal,   8GB VRAM, n1-standard-4, us-central1-b  (~$0.42/hr) — lighter models only
#
# T4 and L4 are recommended for Triton inference workloads.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Namespace to expand quota for
        default: mlops-torch-triton-gke-pipeline
        required: true
      machine_type:
        description: Machine type for GPU node
        default: n1-standard-4
        required: true
      gpu_type:
        description: GPU accelerator type
        default: nvidia-tesla-t4
        required: true
      spot:
        description: Use Spot VMs (better availability, interruptible)
        default: 'false'
        required: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}
  CLUSTER_STATE_BUCKET: ${{ vars.GKE_STATE_BUCKET }}

jobs:
  expand:
    runs-on: [self-hosted, wsl2]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Save current namespace quota to GCS
        run: |
          STATE_PATH="gs://$CLUSTER_STATE_BUCKET/gke/quota-${{ inputs.namespace }}.json"
          if gcloud storage ls "$STATE_PATH" > /dev/null 2>&1; then
            echo "::notice::Quota snapshot already exists — skipping save (already expanded)"
          else
            kubectl get resourcequota namespace-quota \
              -n "${{ inputs.namespace }}" \
              -o json > /tmp/quota-backup.json
            gcloud storage cp /tmp/quota-backup.json "$STATE_PATH"
            echo "::notice::Quota snapshot saved to $STATE_PATH"
          fi

      - name: Create GPU node pool
        working-directory: gcp/terraform-gpu
        run: |
          terraform init -backend-config="bucket=$CLUSTER_STATE_BUCKET"
          terraform apply -auto-approve \
            -var-file=gpu.tfvars \
            -var="gpu_machine_type=${{ inputs.machine_type }}" \
            -var="gpu_type=${{ inputs.gpu_type }}" \
            -var="spot=${{ inputs.spot }}"

      - name: Install NVIDIA device plugin
        run: |
          kubectl apply -f https://raw.githubusercontent.com/GoogleCloudPlatform/container-engine-accelerators/master/nvidia-driver-installer/cos/daemonset-preloaded.yaml

      - name: Wait for GPU node Ready
        run: |
          echo "Waiting for GPU node to be Ready..."
          for i in $(seq 1 30); do
            READY=$(kubectl get nodes --no-headers 2>/dev/null \
              | grep -c " Ready" || echo 0)
            echo "Ready nodes: $READY"
            [ "$READY" -ge 2 ] && break
            sleep 15
          done

      - name: Expand namespace quota for GPU
        run: |
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: namespace-quota
            namespace: ${{ inputs.namespace }}
          spec:
            hard:
              requests.cpu: "1"
              requests.memory: 2Gi
              limits.cpu: "4"
              limits.memory: 8Gi
              pods: "10"
              requests.nvidia.com/gpu: "1"
              limits.nvidia.com/gpu: "1"
          EOF

      - name: Cleanup on failure
        if: failure()
        working-directory: gcp/terraform-gpu
        run: |
          echo "==> Attempting cleanup after failed expand..."
          terraform init -backend-config="bucket=$CLUSTER_STATE_BUCKET" || true
          if terraform show -json 2>/dev/null \
              | python3 -c "import json,sys; r=json.load(sys.stdin).get('values',{}).get('root_module',{}).get('resources',[]); sys.exit(0 if r else 1)" 2>/dev/null; then
            echo "Pool found in Terraform state — destroying..."
            terraform destroy -auto-approve -var-file=gpu.tfvars || true
          else
            echo "No pool in Terraform state."
          fi
          if gcloud container node-pools describe gpu-pool \
              --cluster "$GKE_CLUSTER_NAME" --zone "$GKE_ZONE" \
              --project "$GCP_PROJECT_ID" > /dev/null 2>&1; then
            echo "Pool found in GKE — deleting..."
            gcloud container node-pools delete gpu-pool \
              --cluster "$GKE_CLUSTER_NAME" --zone "$GKE_ZONE" \
              --project "$GCP_PROJECT_ID" --quiet || true
          else
            echo "No pool found in GKE."
          fi

      - name: Summary
        run: |
          {
            echo "## GKE Expand GPU"
            echo "| | |"
            echo "|---|---|"
            echo "| GPU pool | \`gpu-pool\` |"
            echo "| Machine | \`${{ inputs.machine_type }}\` + \`${{ inputs.gpu_type }}\` (spot: ${{ inputs.spot }}) |"
            echo "| Namespace | \`${{ inputs.namespace }}\` |"
            echo ""
            echo "> Run **GKE Restore GPU** when done to remove the GPU pool and restore quota."
          } >> "$GITHUB_STEP_SUMMARY"
