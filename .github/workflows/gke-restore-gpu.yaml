name: GKE Restore GPU

# Removes the temporary GPU node pool added by GKE Expand GPU and
# restores the namespace resource quota to its pre-expand state.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Namespace to restore quota for
        default: biomistral-7b-onc-llm-serving-vllm
        required: true

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}
  CLUSTER_STATE_BUCKET: ${{ vars.GKE_STATE_BUCKET }}

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Restore namespace quota from snapshot
        run: |
          STATE_PATH="gs://$CLUSTER_STATE_BUCKET/gke/quota-${{ inputs.namespace }}.json"
          if gcloud storage ls "$STATE_PATH" > /dev/null 2>&1; then
            gcloud storage cp "$STATE_PATH" /tmp/quota-backup.json
            kubectl apply -f /tmp/quota-backup.json
            echo "::notice::Quota restored from $STATE_PATH"
          else
            echo "::warning::No quota snapshot found at $STATE_PATH — applying default tight quota"
            kubectl apply -f - <<EOF
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: namespace-quota
            namespace: ${{ inputs.namespace }}
          spec:
            hard:
              requests.cpu: "200m"
              requests.memory: 512Mi
              limits.cpu: "500m"
              limits.memory: 1Gi
              pods: "5"
          EOF
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Delete GPU node pool
        id: del_pool
        working-directory: gcp/terraform-gpu
        run: |
          terraform init -backend-config="bucket=$CLUSTER_STATE_BUCKET"
          if terraform show -json 2>/dev/null \
              | python3 -c "import json,sys; r=json.load(sys.stdin).get('values',{}).get('root_module',{}).get('resources',[]); sys.exit(0 if r else 1)"; then
            terraform destroy -auto-approve -var-file=gpu.tfvars
            echo "result=deleted" >> "$GITHUB_OUTPUT"
          else
            echo "No GPU pool in Terraform state — skipping."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          {
            echo "## GKE Restore GPU"
            echo "| | |"
            echo "|---|---|"
            echo "| GPU pool | ${{ steps.del_pool.outputs.result }} |"
            echo "| Namespace | \`${{ inputs.namespace }}\` |"
            echo "| Quota | restored from snapshot |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clear GPU pool state vars
        if: success()
        env:
          GITHUB_ORG_ADMIN_PAT: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          upsert_org_var() {
            GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
              -X PATCH "orgs/miramar-labs-org/actions/variables/${1}" \
              -f value="${2}" 2>/dev/null || \
            GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
              -X POST "orgs/miramar-labs-org/actions/variables" \
              -f name="${1}" -f value="${2}"
          }
          upsert_org_var GKE_GPU_POOL_ACTIVE "false"
          upsert_org_var GKE_GPU_TYPE "none"
