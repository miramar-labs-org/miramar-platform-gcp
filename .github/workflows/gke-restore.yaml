name: GKE Restore

on:
  workflow_dispatch:
    inputs:
      node_pool:
        description: Node pool to restore (used for state snapshot key)
        default: default-pool
        required: true
      node_count_override:
        description: Override node count (leave blank to restore from saved state)
        required: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.GAR_REPO }}
  CLUSTER_STATE_BUCKET: ${{ vars.GKE_STATE_BUCKET }}

jobs:
  restore:
    runs-on: [self-hosted, dgx]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Load node pool state
        id: state
        run: |
          if [ -n "${{ inputs.node_count_override }}" ]; then
            RESTORE_COUNT="${{ inputs.node_count_override }}"
            MACHINE="(manual override)"
            echo "::notice title=Manual override::Restoring to $RESTORE_COUNT node(s)"
          else
            STATE_PATH="gs://$CLUSTER_STATE_BUCKET/gke/node-pool-${{ inputs.node_pool }}.json"
            if ! gcloud storage ls "$STATE_PATH" > /dev/null 2>&1; then
              echo "::error::No saved state at $STATE_PATH — run GKE Expand first, or set node_count_override."
              exit 1
            fi
            gcloud storage cp "$STATE_PATH" /tmp/pool-state.json
            RESTORE_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/pool-state.json')); print(d.get('_snapshotLiveNodeCount', d['initialNodeCount']))")
            MACHINE=$(python3 -c "import json; print(json.load(open('/tmp/pool-state.json'))['config']['machineType'])")
            echo "::notice title=State loaded::Restoring to $RESTORE_COUNT × $MACHINE from $STATE_PATH"
          fi
          echo "restore_count=$RESTORE_COUNT" >> "$GITHUB_OUTPUT"
          echo "machine_type=$MACHINE" >> "$GITHUB_OUTPUT"


      - name: Terraform Init
        working-directory: gcp/terraform
        run: terraform init -backend-config="bucket=$CLUSTER_STATE_BUCKET"

      - name: Restore node pool
        working-directory: gcp/terraform
        run: |
          terraform apply -auto-approve \
            -var-file=terraform.tfvars \
            -var="node_pool_count=${{ steps.state.outputs.restore_count }}"

      - name: Reset node count variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_ORG_ADMIN_PAT }}
        run: |
          gh variable set GKE_NODE_COUNT \
            --body "1" \
            --org miramar-labs-org

      - name: Summary
        run: |
          {
            echo "## GKE Restored"
            echo "| | |"
            echo "|---|---|"
            echo "| Node pool | \`${{ inputs.node_pool }}\` |"
            echo "| Machine type | \`${{ steps.state.outputs.machine_type }}\` |"
            echo "| Restored to | \`${{ steps.state.outputs.restore_count }}\` node(s) |"
          } >> "$GITHUB_STEP_SUMMARY"
