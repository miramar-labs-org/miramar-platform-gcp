name: Minikube Install

# Installs the minikube binary (if needed) and starts the cluster on the target
# machine with GPU support and required addons. Safe to re-run — idempotent;
# skips start if cluster is already running.
#
# After starting, updates the <RUNNER>_MINIKUBE_KUBECONFIG org secret with a
# fresh self-contained kubeconfig (certs are rotated on every minikube delete+recreate).
#
# Prerequisites:
#   - Docker running on the host
#   - mlabs-runner container launched via scripts/gha/launch-runner.sh
#   - GITHUB_ORG_ADMIN_PAT env var set on the runner (injected by launch-runner.sh)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx

jobs:
  install:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve kubeconfig secret name
        run: |
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "KUBECONFIG_SECRET=AGX_MINIKUBE_KUBECONFIG" >> "$GITHUB_ENV"
          else
            echo "KUBECONFIG_SECRET=DGX_MINIKUBE_KUBECONFIG" >> "$GITHUB_ENV"
          fi

      - name: Install minikube on host
        run: |
          # /host-bin is mounted from the host's /usr/local/bin by launch-runner.sh.
          if [[ -x /host-bin/minikube ]]; then
            echo "==> minikube already on host, skipping."
          else
            ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
            echo "==> Downloading minikube for host..."
            curl -fsSL \
              "https://github.com/kubernetes/minikube/releases/latest/download/minikube-linux-${ARCH}" \
              -o /tmp/minikube-host
            sudo install -m 0755 /tmp/minikube-host /host-bin/minikube
            rm /tmp/minikube-host
            echo "==> minikube installed on host."
          fi

      - name: Start cluster and configure addons
        run: bash scripts/ubuntu/install-minikube.sh --start

      - name: Cleanup on failure
        if: failure()
        run: |
          echo "==> Start failed — purging minikube state for a clean retry..."
          minikube delete --all --purge 2>/dev/null || true
          echo "==> Cleanup done. Re-trigger this workflow to start fresh."

      - name: Write MINIKUBE_VERSION repo variable
        run: |
          VERSION=$(minikube version --short | sed 's/^v//')
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            VAR_NAME="AGX_MINIKUBE_VERSION"
          else
            VAR_NAME="DGX_MINIKUBE_VERSION"
          fi
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X PATCH "repos/${GITHUB_REPOSITORY}/actions/variables/${VAR_NAME}" \
            -f name="${VAR_NAME}" -f value="${VERSION}" 2>/dev/null || \
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X POST "repos/${GITHUB_REPOSITORY}/actions/variables" \
            -f name="${VAR_NAME}" -f value="${VERSION}"
          echo "==> ${VAR_NAME}=${VERSION}"

      - name: Update minikube kubeconfig org secret
        run: |
          set -o pipefail
          docker network connect minikube "$(cat /etc/hostname)" 2>/dev/null || true
          sudo chmod -R a+rX "${HOME}/.minikube"
          TMP_KC=$(mktemp)
          sed "s|/home/[^/]*/\.minikube/|${HOME}/.minikube/|g" \
              "${HOME}/.kube/config" > "${TMP_KC}"
          KUBECONFIG_B64=$(KUBECONFIG="${TMP_KC}" kubectl config view \
            --raw --minify --flatten --context=minikube \
            | base64 -w0)
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh secret set "${KUBECONFIG_SECRET}" \
            --org miramar-labs-org \
            --body "${KUBECONFIG_B64}"
          echo "==> ${KUBECONFIG_SECRET} updated"
