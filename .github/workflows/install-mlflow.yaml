name: MLflow Install

# Deploys MLflow + MinIO into the mlflow-system namespace on the DGX minikube
# cluster and integrates with an existing NeMo Microservices deployment.
# MLflow uses NeMo's postgres as its backend store.
#
# Prerequisites:
#   - minikube running on the DGX (Minikube Install workflow)
#   - NeMo Microservices deployed (NeMo Deploy workflow)

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: [self-hosted, dgx]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig and verify cluster access
        run: |
          echo "==> HOME=${HOME}"
          CONFIG="${HOME}/.kube/config"
          echo "==> config exists: $([[ -f ${CONFIG} ]] && echo yes || echo no)"
          echo "==> cert paths in source config:"
          grep -E "certificate|client-cert|client-key" "${CONFIG}" || true
          TMP_KC=$(mktemp)
          sed "s|/home/[^/]*/\.minikube/|${HOME}/.minikube/|g" "${CONFIG}" > "${TMP_KC}"
          echo "==> cert paths in rewritten config:"
          grep -E "certificate|client-cert|client-key" "${TMP_KC}" || true
          echo "KUBECONFIG=${TMP_KC}" >> "${GITHUB_ENV}"
          echo "==> running kubectl..."
          KUBECONFIG="${TMP_KC}" kubectl get nodes

      - name: Deploy MLflow and integrate with NeMo
        run: bash dgx/minikube/mlflow/integrate-mlflow.sh
