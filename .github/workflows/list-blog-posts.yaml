name: List Blog Posts

# Lists all posts in miramar-labs/miramar-labs.github.io with their
# publish status (live vs open draft PR). Run this to get filenames
# before using the Delete Blog Post workflow.

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: [self-hosted, dgx]
    timeout-minutes: 5
    steps:
      - name: List posts and draft PRs
        run: |
          set -euo pipefail
          BLOG_REPO="miramar-labs/miramar-labs.github.io"

          # Get all published posts
          POSTS=$(GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            "repos/${BLOG_REPO}/contents/_posts" \
            --jq '.[].name' 2>/dev/null || echo "")

          # Get all open draft PRs
          OPEN_PRS=$(GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            "repos/${BLOG_REPO}/pulls?state=open&per_page=50" \
            --jq '.[] | "\(.head.ref) — \(.title)"' 2>/dev/null || echo "")

          {
            echo "## Blog Posts"
            echo ""
            echo "### Live posts"
            echo ""
            if [ -z "${POSTS}" ]; then
              echo "_No published posts._"
            else
              echo "| Filename | URL |"
              echo "|----------|-----|"
              while IFS= read -r name; do
                # Derive URL slug: strip date prefix and extension
                slug=$(echo "${name}" | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//;s/\.[^.]*$//')
                date_part=$(echo "${name}" | grep -oE '^[0-9]{4}/[0-9]{2}/[0-9]{2}' \
                  || echo "${name}" | sed 's/^\([0-9]\{4\}\)-\([0-9]\{2\}\)-\([0-9]\{2\}\)-.*/\1\/\2\/\3/')
                url="https://blog.aaroncody.com/${date_part}/${slug}/"
                echo "| \`${name}\` | [link](${url}) |"
              done <<< "${POSTS}"
            fi
            echo ""
            echo "### Open draft PRs"
            echo ""
            if [ -z "${OPEN_PRS}" ]; then
              echo "_No open draft PRs._"
            else
              echo "\`\`\`"
              echo "${OPEN_PRS}"
              echo "\`\`\`"
            fi
            echo ""
            echo "---"
            echo "To delete a post: **Actions → Delete Blog Post** and paste the filename from the table above."
          } >> "$GITHUB_STEP_SUMMARY"
