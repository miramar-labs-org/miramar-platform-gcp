name: List Blog Posts

# Lists all posts in miramar-labs-org/miramar-labs-org.github.io with their
# publish status (live vs open draft PR). Run this to get filenames
# before using the Delete Blog Post workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: [self-hosted, dgx]
    timeout-minutes: 5
    steps:
      # 1-hour GitHub App token (replaces the org-admin PAT; Nov 2026 incident)
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          owner: miramar-labs-org
      - name: Export App token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GH_APP_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      - name: List posts and draft PRs
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BLOG_REPO="miramar-labs-org/miramar-labs-org.github.io"

          # Get all published posts
          POSTS=$(GH_TOKEN="${GH_APP_TOKEN}" gh api \
            "repos/${BLOG_REPO}/contents/_posts" \
            --jq '.[].name' 2>/dev/null || echo "")

          # Get all open draft PRs
          OPEN_PRS=$(GH_TOKEN="${GH_APP_TOKEN}" gh api \
            "repos/${BLOG_REPO}/pulls?state=open&per_page=50" \
            --jq '.[] | "\(.head.ref) — \(.title)"' 2>/dev/null || echo "")

          {
            echo "## Blog Posts"
            echo ""
            echo "### Live posts"
            echo ""
            if [ -z "${POSTS}" ]; then
              echo "_No published posts._"
            else
              echo "| Filename | URL |"
              echo "|----------|-----|"
              while IFS= read -r name; do
                # Derive URL slug: strip date prefix and extension
                slug=$(echo "${name}" | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//;s/\.[^.]*$//')
                date_part=$(echo "${name}" | grep -oE '^[0-9]{4}/[0-9]{2}/[0-9]{2}' \
                  || echo "${name}" | sed 's/^\([0-9]\{4\}\)-\([0-9]\{2\}\)-\([0-9]\{2\}\)-.*/\1\/\2\/\3/')
                url="https://blog.aaroncody.com/${date_part}/${slug}/"
                echo "| \`${name}\` | [link](${url}) |"
              done <<< "${POSTS}"
            fi
            echo ""
            echo "### Open draft PRs"
            echo ""
            if [ -z "${OPEN_PRS}" ]; then
              echo "_No open draft PRs._"
            else
              echo "\`\`\`"
              echo "${OPEN_PRS}"
              echo "\`\`\`"
            fi
            echo ""
            echo "---"
            echo "To delete a post: **Actions → Delete Blog Post** and paste the filename from the table above."
          } >> "$GITHUB_STEP_SUMMARY"
