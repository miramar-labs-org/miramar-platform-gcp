name: Miramar Platform Create

# Provisions (or re-provisions) the miramar-platform GCP resources:
# Artifact Registry, GKE cluster, GCS cluster state bucket,
# Kubernetes namespaces, and RBAC.
#
# Requires bootstrap-project to have run first (WIF + service accounts
# must exist and WIF_PROVIDER / GCP_SERVICE_ACCOUNT secrets must be set).
#
# The setup script is idempotent — existing resources are left untouched.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}

jobs:
  create:
    runs-on: [self-hosted, wsl2]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        id: wif_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.wif_auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Clear stale WIF credentials on auth failure
        if: steps.wif_auth.outcome != 'success'
        run: |
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          {
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_GHA_CREDS_PATH="
            echo "CLOUDSDK_CORE_PROJECT="
            echo "CLOUDSDK_PROJECT="
            echo "GCLOUD_PROJECT="
            echo "GCP_PROJECT="
            echo "GOOGLE_CLOUD_PROJECT="
          } >> "$GITHUB_ENV"

      - name: Verify gcloud authentication
        run: gcloud auth list --filter=status:ACTIVE --format='value(account)'

      - name: Install zsh
        run: which zsh || (sudo apt-get update && sudo apt-get install -y zsh)

      - name: Run platform create script
        run: zsh ./gcp/create-miramar-platform.zsh 2>&1 | tee /tmp/create.log

      - name: Get GKE credentials (WIF)
        if: steps.wif_auth.outcome == 'success'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Get GKE credentials (cold start)
        if: steps.wif_auth.outcome != 'success'
        run: |
          gcloud container clusters get-credentials "$GKE_CLUSTER_NAME" \
            --zone "$GKE_ZONE" --project "$PROJECT_ID"

      - name: Show cluster state
        run: |
          echo "--- Nodes ---"
          kubectl get nodes -o wide
          echo "--- Namespaces ---"
          kubectl get namespaces

      - name: Summary
        run: |
          NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -c . || echo 0)
          NS_COUNT=$(kubectl get namespaces --no-headers 2>/dev/null | grep -c . || echo 0)
          {
            echo "## Miramar Platform Created / Verified"
            echo "| | |"
            echo "|---|---|"
            echo "| Project | \`$PROJECT_ID\` |"
            echo "| Cluster | \`$GKE_CLUSTER_NAME\` |"
            echo "| Zone | \`$GKE_ZONE\` |"
            echo "| Nodes | \`$NODE_COUNT\` |"
            echo "| Namespaces | \`$NS_COUNT\` |"
          } >> "$GITHUB_STEP_SUMMARY"
