name: Miramar Platform Create

# Provisions (or re-provisions) the entire miramar-platform stack:
# GCP project, billing, APIs, WIF pool/provider, service accounts,
# Artifact Registry, GKE cluster, namespaces, RBAC, and cluster state bucket.
# The setup script is idempotent — existing resources are left untouched.
#
# Cold start (first run — WIF secrets not yet set):
#   Run with WIF_PROVIDER and GCP_SERVICE_ACCOUNT secrets absent or empty.
#   Uses the runner's existing gcloud session instead of WIF.
#   Job summary will print WIF_PROVIDER and GCP_SERVICE_ACCOUNT values
#   to set as GitHub secrets — all subsequent runs will use WIF.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: miramar-platform
  GKE_CLUSTER_NAME: miramar-shared-gke
  GKE_ZONE: us-west1-a

jobs:
  create:
    runs-on: [self-hosted, wsl2]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        if: ${{ secrets.WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: ${{ secrets.WIF_PROVIDER != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify gcloud authentication
        run: gcloud auth list --filter=status:ACTIVE --format='value(account)'

      - name: Run setup script
        run: ./gcp/setup-miramar-gke-cicd.zsh 2>&1 | tee /tmp/setup.log

      - name: Show cluster state
        run: |
          gcloud container clusters get-credentials "$GKE_CLUSTER_NAME" \
            --zone "$GKE_ZONE" --project "$PROJECT_ID"
          echo "--- Nodes ---"
          kubectl get nodes -o wide
          echo "--- Namespaces ---"
          kubectl get namespaces

      - name: Summary
        run: |
          NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -c . || echo 0)
          NS_COUNT=$(kubectl get namespaces --no-headers 2>/dev/null | grep -c . || echo 0)
          {
            echo "## Miramar Platform Created / Verified"
            echo "| | |"
            echo "|---|---|"
            echo "| Project | \`$PROJECT_ID\` |"
            echo "| Cluster | \`$GKE_CLUSTER_NAME\` |"
            echo "| Zone | \`$GKE_ZONE\` |"
            echo "| Nodes | \`$NODE_COUNT\` |"
            echo "| Namespaces | \`$NS_COUNT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${{ secrets.WIF_PROVIDER }}" ]; then
            WIF=$(grep -A1 'Workload Identity Provider:' /tmp/setup.log | tail -1 | tr -d ' ')
            SA=$(grep -A1 'Cluster management SA' /tmp/setup.log | tail -1 | tr -d ' ')
            {
              echo ""
              echo "## Cold Start — Set These GitHub Secrets"
              echo ""
              echo "| Secret | Value |"
              echo "|---|---|"
              echo "| \`WIF_PROVIDER\` | \`${WIF}\` |"
              echo "| \`GCP_SERVICE_ACCOUNT\` | \`${SA}\` |"
              echo ""
              echo "> [Secrets page](https://github.com/miramar-labs-org/miramar-platform-gcp/settings/secrets/actions)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
