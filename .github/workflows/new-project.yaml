name: New Project

# Creates a new private GitHub repository under miramar-labs-org pre-wired
# to the Miramar platform.
#
# kfp  — KFP v2 pipeline stub, notebook, deploy/undeploy KFP workflows
# nemo — NeMo training job config, notebook, deploy/undeploy NeMo workflows
#
# Uses GITHUB_ORG_ADMIN_PAT (runner env var from launch-runner.sh) for repo
# creation and initial push. No GitHub secrets required.

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Repository name (e.g. my-llm-experiment)
        required: true
      project_type:
        description: Project type
        type: choice
        options: [kfp, nemo]
        default: kfp
        required: true
      description:
        description: Short repo description (optional)
        default: ""
        required: false

permissions:
  contents: read

jobs:
  create:
    runs-on: [self-hosted, dgx]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Create repository
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          DESCRIPTION: ${{ inputs.description }}
          PROJECT_TYPE: ${{ inputs.project_type }}
        run: |
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh repo create \
            "miramar-labs-org/${PROJECT_NAME}" \
            --private \
            --description "${DESCRIPTION:-${PROJECT_TYPE} project}"
          echo "Created miramar-labs-org/${PROJECT_NAME}"

      - name: Initialise repository with template
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_TYPE: ${{ inputs.project_type }}
        run: |
          set -euo pipefail

          WORK_DIR=$(mktemp -d)
          trap 'rm -rf "${WORK_DIR}"' EXIT

          git config --global user.email "actions@github.com"
          git config --global user.name "Miramar Platform"

          cd "${WORK_DIR}"
          git init
          git checkout -b main

          # Copy the appropriate template (includes hidden .github/ dir)
          cp -r "${GITHUB_WORKSPACE}/templates/new-project-${PROJECT_TYPE}/." .

          # Replace placeholders in all text files
          YEAR=$(date +%Y)
          find . -type f \( -name "*.md" -o -name "*.ipynb" -o -name "*.yaml" -o -name "*.py" -o -name "LICENSE" \) \
            -exec sed -i \
              -e "s/{{PROJECT_NAME}}/${PROJECT_NAME}/g" \
              -e "s/{{YEAR}}/${YEAR}/g" \
            {} +

          # Inject workflow badges into README.md (done here, not in the template,
          # so the template repo itself never shows broken placeholder URLs)
          ORG_URL="https://github.com/miramar-labs-org/${PROJECT_NAME}"
          if [ "${PROJECT_TYPE}" = "kfp" ]; then
            BADGES="[![Open in JupyterLab](${ORG_URL}/actions/workflows/open-jupyterlab.yaml/badge.svg)](${ORG_URL}/actions/workflows/open-jupyterlab.yaml)
[![Deploy to KFP](${ORG_URL}/actions/workflows/deploy-kfp.yaml/badge.svg)](${ORG_URL}/actions/workflows/deploy-kfp.yaml)
[![Undeploy from KFP](${ORG_URL}/actions/workflows/undeploy-kfp.yaml/badge.svg)](${ORG_URL}/actions/workflows/undeploy-kfp.yaml)"
          else
            BADGES="[![Open in JupyterLab](${ORG_URL}/actions/workflows/open-jupyterlab.yaml/badge.svg)](${ORG_URL}/actions/workflows/open-jupyterlab.yaml)
[![Deploy to NeMo](${ORG_URL}/actions/workflows/deploy-nemo.yaml/badge.svg)](${ORG_URL}/actions/workflows/deploy-nemo.yaml)
[![Undeploy from NeMo](${ORG_URL}/actions/workflows/undeploy-nemo.yaml/badge.svg)](${ORG_URL}/actions/workflows/undeploy-nemo.yaml)"
          fi
          # Insert badges after the first line (the # title)
          sed -i "1a\\
\\
${BADGES}
" README.md

          git add .
          git commit -m "Initial scaffold (type: ${PROJECT_TYPE}) from Miramar template"

          git remote add origin \
            "https://x-access-token:${GITHUB_ORG_ADMIN_PAT}@github.com/miramar-labs-org/${PROJECT_NAME}.git"
          git push -u origin main

      - name: Summary
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_TYPE: ${{ inputs.project_type }}
        run: |
          REPO_URL="https://github.com/miramar-labs-org/${PROJECT_NAME}"
          {
            echo "## New ${PROJECT_TYPE} Project Created"
            echo ""
            echo "**Repository:** [${REPO_URL}](${REPO_URL})"
            echo "**Type:** \`${PROJECT_TYPE}\`"
            echo ""
            if [ "${PROJECT_TYPE}" = "kfp" ]; then
              echo "### Files"
              echo "- \`README.md\`, \`CLAUDE.md\`"
              echo "- \`pipeline.py\` — KFP v2 pipeline stub"
              echo "- \`notebook.ipynb\` — compile, submit, monitor runs"
              echo "- \`scripts/deploy_pipeline.py\`, \`scripts/terminate_pipeline.py\`"
              echo "- \`.github/workflows/deploy-kfp.yaml\`, \`undeploy-kfp.yaml\`"
              echo ""
              echo "### Next steps"
              echo "1. Edit \`pipeline.py\` to define your pipeline components"
              echo "2. Trigger **Deploy to KFP** to compile and submit a run"
              echo "3. Prerequisites: **Kubeflow Deploy** must be running on DGX"
            else
              echo "### Files"
              echo "- \`README.md\`, \`CLAUDE.md\`"
              echo "- \`job_config.yaml\` — training job config"
              echo "- \`notebook.ipynb\` — NeMo SDK + job monitoring"
              echo "- \`scripts/submit_job.py\`, \`scripts/cancel_job.py\`"
              echo "- \`.github/workflows/deploy-nemo.yaml\`, \`undeploy-nemo.yaml\`"
              echo ""
              echo "### Next steps"
              echo "1. Edit \`job_config.yaml\` — set model, dataset path, hyperparameters"
              echo "2. Trigger **Deploy to NeMo** to submit the job"
              echo "3. Prerequisites: **NeMo Deploy** must be running on DGX"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
