name: WSL2 Post-Provision

# Automates all manual steps from wsl2/post-bootstrap.md:
#   1. Write .wslconfig (mirrored networking) + wsl --shutdown
#   2. Windows Firewall rule for the distro's sshd port
#   3. WSL2 pubkey → MSI administrators_authorized_keys
#   4. Mount ~/shared (CIFS → DGX ~/shared) + create ~/.ssh symlinks
#   5. DGX and Orin pubkeys → shared authorized_keys (via WSL2 symlink)
#   6. WSL2 pubkey → shared authorized_keys (via Windows path)
#   7. wsl2-<name> host block → shared SSH config (all machines pick it up)
#   8. Windows ~/.ssh/config hardlink → shared config
#
# Prerequisites:
#   - WSL2 distro already provisioned (run WSL2 Provision first)
#   - setup-shared-ssh workflow already run (initialises DGX ~/shared/ssh/)
#   - Secrets: WSL2_HOST, WSL2_HOST_USER, WSL2_HOST_SSH_KEY,
#              DGX_HOST, DGX_HOST_USER, DGX_SMB_PASSWORD

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "WSL2 distro name to configure"
        required: true
        default: dev
      ssh_port:
        description: "sshd port for this distro (2222 for first instance, increment for each additional)"
        required: false
        default: "2222"
      runner:
        description: "Runner for Windows SSH steps"
        required: false
        default: dgx
        type: choice
        options:
          - dgx
          - agx

jobs:

  # -----------------------------------------------------------------------
  # Phase 1: collect public keys from each runner (parallel)
  # -----------------------------------------------------------------------

  collect-keys-dgx:
    runs-on: dgx
    outputs:
      pubkey: ${{ steps.pubkey.outputs.value }}
    steps:
      - id: pubkey
        name: Read DGX public key
        run: echo "value=$(cat ~/.ssh/id_ed25519.pub)" >> "$GITHUB_OUTPUT"

  collect-keys-agx:
    runs-on: agx
    outputs:
      pubkey: ${{ steps.pubkey.outputs.value }}
    steps:
      - id: pubkey
        name: Read Orin public key
        run: echo "value=$(cat ~/.ssh/id_ed25519.pub)" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Phase 2: Windows-side setup (all SSH mesh wiring via post-provision.ps1)
  # -----------------------------------------------------------------------

  windows-setup:
    needs: [collect-keys-dgx, collect-keys-agx]
    runs-on: ${{ inputs.runner }}
    outputs:
      wsl2_pubkey: ${{ steps.run-script.outputs.wsl2_pubkey }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key for Windows host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.WSL2_HOST_SSH_KEY }}" > ~/.ssh/wsl2_host
          chmod 600 ~/.ssh/wsl2_host
          ssh-keyscan -H "${{ secrets.WSL2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write runner pubkey files for transfer
        env:
          DGX_PUBKEY: ${{ needs.collect-keys-dgx.outputs.pubkey }}
          AGX_PUBKEY: ${{ needs.collect-keys-agx.outputs.pubkey }}
        run: |
          printf '%s\n' "$DGX_PUBKEY" > /tmp/dgx-key.pub
          printf '%s\n' "$AGX_PUBKEY" > /tmp/agx-key.pub

      - name: Copy script and key files to Windows host
        run: |
          scp -i ~/.ssh/wsl2_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            wsl2/post-provision.ps1 \
            /tmp/dgx-key.pub \
            /tmp/agx-key.pub \
            "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}:"

      - name: Run post-provision.ps1 on Windows host
        id: run-script
        run: |
          set -euo pipefail
          OUTPUT=$(ssh -i ~/.ssh/wsl2_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}" \
            "powershell -ExecutionPolicy Bypass -File \"%USERPROFILE%\\post-provision.ps1\" \
              -Name \"${{ inputs.distro_name }}\" \
              -User \"${{ secrets.WSL2_HOST_USER }}\" \
              -Port \"${{ inputs.ssh_port }}\" \
              -DgxHost \"${{ vars.DGX_HOST }}\" \
              -SmbPassword \"${{ secrets.DGX_SMB_PASSWORD }}\"")
          echo "$OUTPUT"
          WSL2_PUBKEY=$(echo "$OUTPUT" | grep '^WSL2_PUBKEY=' | cut -d= -f2-)
          if [[ -z "$WSL2_PUBKEY" ]]; then
            echo "ERROR: post-provision.ps1 did not output WSL2_PUBKEY" >&2
            exit 1
          fi
          echo "wsl2_pubkey=${WSL2_PUBKEY}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Summary
  # -----------------------------------------------------------------------

  summary:
    needs: windows-setup
    if: always()
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Summary
        run: |
          {
            echo "## WSL2 Post-Provision"
            echo "| | |"
            echo "|---|---|"
            echo "| Distro | \`${{ inputs.distro_name }}\` |"
            echo "| SSH alias | \`wsl2-${{ inputs.distro_name }}\` |"
            echo "| Port | \`${{ inputs.ssh_port }}\` |"
            echo "| Host | \`${{ secrets.WSL2_HOST }}\` |"
            echo ""
            echo "### Configured"
            echo "| Step | Status |"
            echo "|---|---|"
            echo "| \`.wslconfig\` + firewall + sshd port + CIFS mount + symlinks + SSH mesh | ${{ needs.windows-setup.result }} |"
            echo ""
            echo "### Next step"
            echo "Run **WSL2 Verify SSH Topology** to confirm all SSH paths work end-to-end."
          } >> "$GITHUB_STEP_SUMMARY"
