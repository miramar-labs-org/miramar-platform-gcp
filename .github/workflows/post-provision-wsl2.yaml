name: WSL2 Post-Provision

# Per-distro SSH mesh setup. Run after WSL2 Provision.
#
# PowerShell does Windows config only:
#   1. .wslconfig (mirrored networking) + wsl --shutdown if changed
#   2. Firewall rule for sshd port
#   3. sshd port config inside distro
#   4. SSH key check (template already has id_ed25519; just reads pubkey)
#   5. Write /etc/wsl2-distro-name (so the service knows its SSH alias)
#   6. Start wsl2-ssh-setup.service + wait for completion
#
# The distro does the SSH work itself via wsl2-ssh-setup.service
# (installed by bootstrap.sh, runs setup-shared-ssh.sh on every cold start):
#   - smbclient get: config / known_hosts / authorized_keys from DGX
#   - Appends own pubkey → smbclient put authorized_keys back
#   - Adds wsl2-<name> host block → smbclient put config back
#
# Requires a distro built from a template exported after bootstrap.sh baked
# id_ed25519_smb + ~/.smbcredentials (run bootstrap.sh, export template,
# commit wsl2/id_ed25519_smb.pub to the repo).
#
# Prerequisites:
#   - WSL2 distro provisioned from current template (run WSL2 Provision first)
#   - Setup Shared SSH Store run at least once (initialises DGX ~/shared/ssh/ + Orin)
#   - Secrets: WSL2_HOST, WSL2_HOST_USER, WSL2_HOST_SSH_KEY
#   - Vars:    DGX_HOST

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "WSL2 distro name to configure"
        required: true
        default: dev
      ssh_port:
        description: "sshd port (2222 for first distro, increment for each additional)"
        required: false
        default: "2222"
      runner:
        description: "Runner to use for the Windows SSH steps"
        required: false
        default: dgx
        type: choice
        options:
          - dgx
          - agx

jobs:

  windows-setup:
    runs-on: ${{ inputs.runner }}
    outputs:
      wsl2_pubkey: ${{ steps.run-script.outputs.wsl2_pubkey }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key for Windows host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.WSL2_HOST_SSH_KEY }}" > /tmp/wsl2_host
          chmod 600 /tmp/wsl2_host
          ssh-keyscan -H "${{ secrets.WSL2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy post-provision.ps1 to Windows host
        run: |
          scp -i /tmp/wsl2_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            wsl2/post-provision.ps1 \
            "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}:"

      - name: Run post-provision.ps1 on Windows host
        id: run-script
        run: |
          set -euo pipefail
          # tee streams output in real-time; || true ensures we always check for WSL2_PUBKEY.
          PS_OUT=$(mktemp)
          ssh -i /tmp/wsl2_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}" \
            "powershell -ExecutionPolicy Bypass -File \"%USERPROFILE%\\post-provision.ps1\" \
              -Name \"${{ inputs.distro_name }}\" \
              -User \"${{ secrets.WSL2_HOST_USER }}\" \
              -Port \"${{ inputs.ssh_port }}\" \
              -DgxHost \"${{ vars.DGX_HOST }}\"" \
            | tee "$PS_OUT" || true
          WSL2_PUBKEY=$(grep '^WSL2_PUBKEY=' "$PS_OUT" | cut -d= -f2- || true)
          if [[ -z "$WSL2_PUBKEY" ]]; then
            echo "ERROR: post-provision.ps1 did not output WSL2_PUBKEY" >&2
            exit 1
          fi
          echo "wsl2_pubkey=${WSL2_PUBKEY}" >> "$GITHUB_OUTPUT"

  summary:
    needs: windows-setup
    if: always()
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Summary
        run: |
          {
            echo "## WSL2 Post-Provision"
            echo "| | |"
            echo "|---|---|"
            echo "| Distro | \`${{ inputs.distro_name }}\` |"
            echo "| SSH alias | \`wsl2-${{ inputs.distro_name }}\` |"
            echo "| Port | \`${{ inputs.ssh_port }}\` |"
            echo "| Host | \`${{ secrets.WSL2_HOST }}\` |"
            echo ""
            echo "### Result"
            echo "| Step | Status |"
            echo "|---|---|"
            echo "| .wslconfig + firewall + sshd + smbclient SSH mesh sync (creds baked in template) | ${{ needs.windows-setup.result }} |"
            echo ""
            echo "### Next step"
            echo "Run **WSL2 Verify SSH Topology** to confirm all SSH paths work end-to-end."
          } >> "$GITHUB_STEP_SUMMARY"
