name: Probe NeMo Endpoints
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, dgx]
    timeout-minutes: 5
    steps:
      - name: Probe all endpoints from DGX host via SSH
        env:
          DGX_USER: ${{ vars.DGX_HOST_USER }}
          SCRIPT: |
            set -uo pipefail
            BASE=http://nemo.test
            NIM=http://nim.test
            DS=http://data-store.test
            probe() { CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "$1" 2>/dev/null); printf "%-55s %s\n" "$1" "$CODE"; }
            echo "=== nemo.test - entity store ==="
            probe $BASE/v1/namespaces
            probe $BASE/v1/projects
            probe $BASE/v1/datasets
            probe $BASE/v1/repos
            probe $BASE/v1/models
            echo "=== nemo.test - deployment ==="
            probe $BASE/v1/deployment/model-deployments
            probe $BASE/v2/inference/gateway
            probe $BASE/v2/inference
            probe $BASE/v2/models
            echo "=== nemo.test - core api ==="
            probe $BASE/v1/jobs
            echo "=== nemo.test - customizer ==="
            probe $BASE/v1/customization/jobs
            probe $BASE/v1/customization/models
            echo "=== nemo.test - evaluator ==="
            probe $BASE/v1/evaluation/jobs
            probe $BASE/v1/evaluation/targets
            probe $BASE/v2/evaluation/jobs
            echo "=== nemo.test - data designer ==="
            probe $BASE/v1/data-designer/jobs
            echo "=== nemo.test - auditor / safe-synth / intake ==="
            probe $BASE/v1beta1/audit
            probe $BASE/v1beta1/safe-synthesizer
            probe $BASE/v1/intake
            echo "=== data-store.test ==="
            probe $DS/v1/health
            echo "=== nim.test ==="
            probe $NIM/v1/models
        run: |
          printf '%s' "${SCRIPT}" \
            | ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                "${DGX_USER:-aaron}@localhost" bash 2>/dev/null
