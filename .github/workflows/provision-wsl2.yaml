name: WSL2 Provision

# Full lifecycle: import distro from template, wire into the lab SSH mesh.
#
# All per-distro config (hostname, sshd port, CIFS mount, ~/.ssh/ symlinks)
# is handled by firstboot.sh running INSIDE the distro via wsl exec —
# no direct port-2222 SSH, so WSL2 mirrored-networking issues are avoided.
#
#   1. SSH to Windows host → wsl --import (idempotent)
#   2. Write /etc/wsl2-provision.conf into distro (via wsl exec)
#   3. Open Windows firewall for SSH port
#   4. Run firstboot.sh inside distro (sets hostname, sshd port, CIFS, ~/.ssh/)
#   5. Authorize DGX SSH key (writes to ~/shared/ssh/authorized_keys via symlink)
#   6. Wait for sshd + systemd ready (verification)
#
# Prerequisites:
#   - Setup Shared SSH Store run at least once (DGX ~/shared/ssh/ initialised)
#   - .wslconfig (mirrored networking) set on Windows (see wsl2/README.md)
#   - Template rebuilt with rebuild-template.ps1 (.smbcredentials + fstab baked in)
#   - Secrets: WSL2_HOST, WSL2_HOST_USER, WSL2_HOST_SSH_KEY, DGX_HOST_SSH_KEY
#     (DGX_SMB_PASSWORD is NOT needed — baked into template by rebuild-template.ps1)
#   - Vars:    DGX_HOST, DGX_HOST_USER

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "WSL2 distro name"
        required: true
        default: dev
      ssh_port:
        description: "sshd port inside the distro"
        required: false
        default: "2222"
      runner:
        description: "Runner to SSH from"
        required: false
        default: dgx
        type: choice
        options:
          - dgx
          - agx

jobs:
  provision:
    runs-on: ${{ inputs.runner || 'dgx' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ── Step 1: import distro from template tarball ──────────────────────
      - name: Import WSL2 distro from template
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
          WSL2_HOST_USER: ${{ secrets.WSL2_HOST_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.WSL2_HOST_SSH_KEY }}" > /tmp/wsl2_win_host
          chmod 600 /tmp/wsl2_win_host
          ssh-keyscan -H "$WSL2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          DISTRO='${{ inputs.distro_name }}'

          scp -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            wsl2/wsl-from-tar.ps1 \
            "$WSL2_HOST_USER@$WSL2_HOST:wsl-from-tar.ps1"

          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "wsl --unregister $DISTRO 2>nul & echo unregister done"

          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "powershell -ExecutionPolicy Bypass -File wsl-from-tar.ps1 -Name $DISTRO"
          echo "Import step complete"

      # ── Step 2: write provision config + open Windows firewall ───────────
      # Uses wsl exec (not port-2222 SSH) — no mirrored-networking issues.
      - name: Write provision config and open firewall
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
          WSL2_HOST_USER: ${{ secrets.WSL2_HOST_USER }}
          DGX_HOST_USER: ${{ vars.DGX_HOST_USER }}
          DGX_HOST: ${{ vars.DGX_HOST }}
        run: |
          DISTRO='${{ inputs.distro_name }}'
          PORT='${{ inputs.ssh_port }}'
          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "powershell -Command \"wsl -d $DISTRO --user root -- bash -c 'echo distro_name=$DISTRO > /etc/wsl2-provision.conf && echo ssh_port=$PORT >> /etc/wsl2-provision.conf && echo mount_user=$DGX_HOST_USER >> /etc/wsl2-provision.conf && echo dgx_host=$DGX_HOST >> /etc/wsl2-provision.conf && echo config_written'\""
          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "powershell -Command \"New-NetFirewallRule -DisplayName 'WSL2 SSH $DISTRO' -Direction Inbound -Protocol TCP -LocalPort $PORT -Action Allow -ErrorAction SilentlyContinue | Out-Null; Write-Host 'firewall OK'\""
          echo "Provision config and firewall step complete"

      # ── Step 3: run firstboot inside distro ──────────────────────────────
      # Pushes latest firstboot.sh + setup-shared-ssh.sh from repo,
      # then runs firstboot.sh via wsl exec (synchronous, waits for CIFS).
      - name: Run firstboot
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
          WSL2_HOST_USER: ${{ secrets.WSL2_HOST_USER }}
        run: |
          DISTRO='${{ inputs.distro_name }}'
          # Push latest scripts to Windows home (accessible via /mnt/c/ in WSL)
          scp -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            wsl2/firstboot.sh wsl2/setup-shared-ssh.sh \
            "$WSL2_HOST_USER@$WSL2_HOST:"
          # Install inside the distro
          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "powershell -Command \"wsl -d $DISTRO --user root -- bash -c 'install -m 755 /mnt/c/Users/$WSL2_HOST_USER/firstboot.sh /usr/local/bin/firstboot.sh && install -m 755 /mnt/c/Users/$WSL2_HOST_USER/setup-shared-ssh.sh /usr/local/bin/setup-shared-ssh.sh && echo scripts_installed'\""
          # Run firstboot synchronously (sets hostname, sshd port, CIFS, ~/.ssh/)
          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "powershell -Command \"wsl -d $DISTRO --user root -- bash /usr/local/bin/firstboot.sh\""
          echo "Firstboot complete"

      # ── Step 4: authorize DGX SSH key ────────────────────────────────────
      # Runs after firstboot so ~/.ssh/authorized_keys is already symlinked
      # to ~/shared/ssh/authorized_keys — key goes into the shared store.
      - name: Authorize DGX SSH key in distro
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
          WSL2_HOST_USER: ${{ secrets.WSL2_HOST_USER }}
        run: |
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > /tmp/dgx_priv
          chmod 600 /tmp/dgx_priv
          DGX_PUBKEY=$(ssh-keygen -y -f /tmp/dgx_priv)
          rm -f /tmp/dgx_priv
          DISTRO='${{ inputs.distro_name }}'
          printf '%s\n' "$DGX_PUBKEY" | \
            ssh -i /tmp/wsl2_win_host \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              "$WSL2_HOST_USER@$WSL2_HOST" \
              "wsl -d $DISTRO -- bash -c \"mkdir -p ~/.ssh && chmod 700 ~/.ssh && cat >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys\""
          echo "DGX pubkey authorized in distro"

      # ── Step 5: verify sshd is reachable ─────────────────────────────────
      - name: Wait for sshd in distro
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
        run: |
          echo "Waiting for sshd on $WSL2_HOST:${{ inputs.ssh_port }}..."
          for i in $(seq 1 30); do
            if ssh-keyscan -p "${{ inputs.ssh_port }}" "$WSL2_HOST" >/dev/null 2>&1; then
              echo "sshd up (attempt $i)"
              break
            fi
            echo "  waiting... ($i/30)"
            sleep 5
            if [[ $i -eq 30 ]]; then
              echo "ERROR: sshd not reachable after 150s" >&2
              exit 1
            fi
          done

      # ── Step 6: verify systemd ready ─────────────────────────────────────
      - name: Wait for systemd ready
        env:
          DGX_HOST_USER: ${{ vars.DGX_HOST_USER }}
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
        run: |
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > /tmp/wsl2_host
          chmod 600 /tmp/wsl2_host
          ssh-keyscan -p "${{ inputs.ssh_port }}" -H "${{ secrets.WSL2_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null || true
          for i in $(seq 1 24); do
            state=$(ssh -i /tmp/wsl2_host \
              -p "${{ inputs.ssh_port }}" \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              "$DGX_HOST_USER@$WSL2_HOST" \
              'systemctl is-system-running 2>&1 || true' 2>/dev/null || echo ssh-failed)
            echo "systemd: $state (attempt $i/24)"
            [[ "$state" =~ ^(running|degraded)$ ]] && echo "systemd ready" && break
            sleep 5
            [[ $i -eq 24 ]] && echo "WARNING: systemd not fully ready after 120s, proceeding"
          done

      - name: Register in WSL2_DISTROS
        run: |
          DISTRO='${{ inputs.distro_name }}'
          REPO='${{ github.repository }}'
          export GH_TOKEN="$GITHUB_ORG_ADMIN_PAT"
          CURRENT=$(gh api "repos/$REPO/actions/variables/WSL2_DISTROS" --jq '.value' 2>/dev/null || echo "")
          [[ "$CURRENT" == "NONE" ]] && CURRENT=""
          if echo " $CURRENT " | grep -qF " $DISTRO "; then
            echo "$DISTRO already in WSL2_DISTROS — skipping"
          else
            NEW=$(echo "$CURRENT $DISTRO" | xargs)
            gh variable set WSL2_DISTROS --body "$NEW" --repo "$REPO"
            echo "WSL2_DISTROS: $NEW"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## WSL2 Provision"
            echo "| | |"
            echo "|---|---|"
            echo "| Distro | \`${{ inputs.distro_name }}\` |"
            echo "| SSH alias | \`wsl2-${{ inputs.distro_name }}\` |"
            echo "| Port | \`${{ inputs.ssh_port }}\` |"
            echo "| Host | \`${{ secrets.WSL2_HOST }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: provision
    uses: ./.github/workflows/verify-ssh-topology.yaml
    with:
      distro_name: ${{ inputs.distro_name }}
      ssh_port: ${{ inputs.ssh_port }}
