name: WSL2 Provision

# Wires a WSL2 distro into the lab SSH mesh — same pattern as Orin:
#   1. Write ~/.smbcredentials (from secret — not baked into template)
#   2. Mount //DGX/shared at ~/shared/ via CIFS
#   3. Symlink ~/.ssh/ → ~/shared/ssh/ (all machines share Spark's identity)
#   4. Add wsl2-<name> host block to shared SSH config
#
# Assumes the distro is already running and sshd is up on ssh_port.
#
# Prerequisites:
#   - Setup Shared SSH Store run at least once (DGX ~/shared/ssh/ initialised)
#   - Secrets: WSL2_HOST, DGX_HOST_SSH_KEY, DGX_SMB_PASSWORD
#   - Vars:    DGX_HOST, DGX_HOST_USER

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "WSL2 distro name"
        required: true
        default: dev
      ssh_port:
        description: "sshd port inside the distro"
        required: false
        default: "2222"
      runner:
        description: "Runner to SSH from"
        required: false
        default: dgx
        type: choice
        options:
          - dgx
          - agx

jobs:
  provision:
    runs-on: ${{ inputs.runner || 'dgx' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key for WSL2 distro
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > /tmp/wsl2_host
          chmod 600 /tmp/wsl2_host
          ssh-keyscan -p "${{ inputs.ssh_port }}" -H "${{ secrets.WSL2_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Write .smbcredentials on distro
        env:
          DGX_SMB_PASSWORD: ${{ secrets.DGX_SMB_PASSWORD }}
          DGX_HOST_USER: ${{ vars.DGX_HOST_USER }}
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
        run: |
          printf 'username=%s\npassword=%s\n' "$DGX_HOST_USER" "$DGX_SMB_PASSWORD" | \
            ssh -i /tmp/wsl2_host \
              -p "${{ inputs.ssh_port }}" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              "$DGX_HOST_USER@$WSL2_HOST" \
              'cat > ~/.smbcredentials && chmod 600 ~/.smbcredentials'
          echo "Written .smbcredentials"

      - name: Mount DGX shared store and symlink SSH files
        env:
          DGX_HOST: ${{ vars.DGX_HOST }}
          DGX_HOST_USER: ${{ vars.DGX_HOST_USER }}
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
        run: |
          ssh -i /tmp/wsl2_host \
            -p "${{ inputs.ssh_port }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$DGX_HOST_USER@$WSL2_HOST" \
            bash -s "$DGX_HOST" "$DGX_HOST_USER" "${{ inputs.distro_name }}" "${{ inputs.ssh_port }}" << 'EOF'
          set -euo pipefail
          sudo /usr/local/bin/setup-shared-ssh.sh "$1" "$2" "$3" "$4"
          EOF

      - name: Summary
        if: always()
        run: |
          {
            echo "## WSL2 Provision"
            echo "| | |"
            echo "|---|---|"
            echo "| Distro | \`${{ inputs.distro_name }}\` |"
            echo "| SSH alias | \`wsl2-${{ inputs.distro_name }}\` |"
            echo "| Port | \`${{ inputs.ssh_port }}\` |"
            echo "| Host | \`${{ secrets.WSL2_HOST }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: provision
    uses: ./.github/workflows/verify-ssh-topology.yaml
    with:
      distro_name: ${{ inputs.distro_name }}
      ssh_port: ${{ inputs.ssh_port }}
