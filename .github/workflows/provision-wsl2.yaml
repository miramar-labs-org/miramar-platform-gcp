name: WSL2 Provision

# Full lifecycle: import distro from template, wire into the lab SSH mesh.
#
# All per-distro config (hostname, sshd port, post-boot CIFS mount,
# SSH symlinks)
# is handled by firstboot.sh running INSIDE the distro via wsl exec —
# no direct port-2222 SSH, so WSL2 mirrored-networking issues are avoided.
#
#   1. SSH to Windows host → wsl --import (idempotent)
#   2. Preflight that sshd can bind the requested port inside WSL2
#   3. Write /etc/wsl2-provision.conf into distro (via wsl exec)
#   4. Open Windows firewall for SSH port
#   5. Run firstboot.sh inside distro (sets hostname, sshd port, CIFS timer, SSH symlinks)
#   6. Authorize DGX SSH key (writes to ~/shared/ssh/authorized_keys via symlink)
#   7. Wait for sshd + systemd ready (verification)
#
# Prerequisites:
#   - Setup Shared SSH Store run at least once (DGX ~/shared/ssh/ initialised)
#   - .wslconfig (mirrored networking) set on Windows (see wsl2/README.md)
#   - Template rebuilt with rebuild-template.ps1 (.smbcredentials baked in; no CIFS fstab)
#   - Secrets: WSL2_HOST, WSL2_HOST_USER, WSL2_HOST_SSH_KEY, DGX_HOST_SSH_KEY
#     (DGX_SMB_PASSWORD is NOT needed — baked into template by rebuild-template.ps1)
#   - Vars:    DGX_HOST_IP, DGX_HOST_USER

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "WSL2 distro name"
        required: true
        default: dev
      ssh_port:
        description: "sshd port inside the distro"
        required: false
        default: "2222"
      runner:
        description: "Runner to SSH from"
        required: false
        default: dgx
        type: choice
        options:
          - dgx
          - agx

jobs:
  provision:
    runs-on: ${{ inputs.runner || 'dgx' }}
    timeout-minutes: 15
    outputs:
      wsl2_distros: ${{ steps.register.outputs.wsl2_distros }}
    steps:
      - uses: actions/checkout@v4

      # ── Step 1: preflight Windows port state, then import distro ─────────
      - name: Import WSL2 distro from template
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
          WSL2_HOST_USER: ${{ secrets.WSL2_HOST_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.WSL2_HOST_SSH_KEY }}" > /tmp/wsl2_win_host
          chmod 600 /tmp/wsl2_win_host
          ssh-keyscan -H "$WSL2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          DISTRO='${{ inputs.distro_name }}'
          PORT='${{ inputs.ssh_port }}'

          echo "Checking Windows-side port state for $PORT before import..."
          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "powershell -NoProfile -Command \"\$port = $PORT; \$listeners = Get-NetTCPConnection -LocalPort \$port -State Listen -ErrorAction SilentlyContinue; if (\$listeners) { \$listeners | Format-Table -AutoSize; Write-Error \\\"Port \$port already has a Windows-visible listener\\\"; exit 1 }; \$ranges = netsh interface ipv4 show excludedportrange protocol=tcp | Select-String '^\\s*\\d+\\s+\\d+' | ForEach-Object { \$parts = -split \$_.Line; [pscustomobject]@{ Start = [int]\$parts[0]; End = [int]\$parts[1] } }; \$hit = \$ranges | Where-Object { \$_.Start -le \$port -and \$port -le \$_.End }; if (\$hit) { \$hit | Format-Table -AutoSize; Write-Error \\\"Port \$port is in a Windows excluded port range\\\"; exit 1 }; Write-Host \\\"Windows-side port \$port preflight passed\\\"\""

          scp -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            wsl2/wsl-from-tar.ps1 \
            "$WSL2_HOST_USER@$WSL2_HOST:wsl-from-tar.ps1"

          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "wsl --unregister $DISTRO 2>nul & echo unregister done"

          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "powershell -ExecutionPolicy Bypass -File wsl-from-tar.ps1 -Name $DISTRO"
          echo "Import step complete"

      # ── Step 1a: fail early if the requested direct sshd port cannot bind ─
      # WSL mirrored networking can reject a port inside the distro even when
      # Windows does not show a normal listener. Test with sshd itself before
      # firstboot writes shared SSH config or registers the distro.
      - name: Preflight sshd port bindability
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
          WSL2_HOST_USER: ${{ secrets.WSL2_HOST_USER }}
        run: |
          DISTRO='${{ inputs.distro_name }}'
          PORT='${{ inputs.ssh_port }}'
          echo "Checking whether $DISTRO can bind sshd port $PORT..."
          if ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "powershell -Command \"wsl -d $DISTRO --user root --exec /bin/bash -lc 'install -d -m 0755 /run/sshd; timeout 2 /usr/sbin/sshd -D -e -f /etc/ssh/sshd_config -o Port=$PORT -o PidFile=/run/sshd-preflight-$PORT.pid'; exit \$LASTEXITCODE\""; then
            echo "ERROR: preflight sshd exited before timeout; expected timeout after successful bind" >&2
            exit 1
          else
            rc=$?
            if [[ "$rc" == "124" ]]; then
              echo "Port $PORT bind preflight passed"
            else
              echo "ERROR: WSL2 distro '$DISTRO' cannot bind sshd port $PORT (exit $rc)." >&2
              echo "Choose another unique ssh_port, for example 2225 or 2230." >&2
              exit "$rc"
            fi
          fi
          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "wsl --terminate $DISTRO"
          echo "Port bind preflight complete; distro terminated for clean provisioning"

      # ── Step 1b: restart distros stopped by wsl --shutdown during import ─
      # wsl-from-tar.ps1 runs `wsl --shutdown` before importing the new distro,
      # which stops ALL running distros globally. Wake them up so they are ready
      # by the time the verify job runs (sshd comes up via systemd on restart).
      - name: Wake up existing WSL2 distros
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
          WSL2_HOST_USER: ${{ secrets.WSL2_HOST_USER }}
          DISTROS: ${{ vars.WSL2_DISTROS }}
        run: |
          if [[ "$DISTROS" == "NONE" || -z "$DISTROS" ]]; then
            echo "No existing distros to restart — skipping"
            exit 0
          fi
          echo "Restarting distros stopped by wsl --shutdown: $DISTROS"
          for d in $DISTROS; do
            echo "  Starting wsl2-$d..."
            ssh -i /tmp/wsl2_win_host \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              "$WSL2_HOST_USER@$WSL2_HOST" \
              "wsl -d $d --exec true" \
              && echo "  wsl2-$d started" \
              || echo "  Warning: could not start $d (may already be stopped or missing)"
          done

      # ── Step 2: write provision config + patch wsl.conf + open firewall ────
      # Uses wsl exec (not port-2222 SSH) — no mirrored-networking issues.
      #
      # The first wsl exec starts the distro. Keep mountFsTab=false so WSL2's
      # pre-systemd fstab handling never tries mDNS/CIFS during early boot. That
      # path can disrupt WSL Plan 9/p9io and cause AcceptAsync canceled followed
      # by distro powerdown. The DGX share is mounted later by a systemd timer.
      - name: Write provision config and open firewall
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
          WSL2_HOST_USER: ${{ secrets.WSL2_HOST_USER }}
          DGX_HOST_USER: ${{ vars.DGX_HOST_USER }}
          DGX_HOST_IP: ${{ vars.DGX_HOST_IP }}
        run: |
          DISTRO='${{ inputs.distro_name }}'
          PORT='${{ inputs.ssh_port }}'
          # Write provision config AND patch wsl.conf in the same wsl exec.
          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "powershell -Command \"wsl -d $DISTRO --user root -- bash -c 'echo distro_name=$DISTRO > /etc/wsl2-provision.conf && echo ssh_port=$PORT >> /etc/wsl2-provision.conf && echo mount_user=$DGX_HOST_USER >> /etc/wsl2-provision.conf && echo dgx_host_ip=$DGX_HOST_IP >> /etc/wsl2-provision.conf && echo wsl_host=$WSL2_HOST >> /etc/wsl2-provision.conf && grep -q mountFsTab /etc/wsl.conf 2>/dev/null || { echo && echo [automount] && echo mountFsTab = false; } >> /etc/wsl.conf && echo config_written'\""
          # Terminate so firstboot runs on a fresh boot with mountFsTab=false
          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "wsl --terminate $DISTRO"
          echo "wsl.conf patched (mountFsTab=false); distro terminated for clean restart"
          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "powershell -Command \"New-NetFirewallRule -DisplayName 'WSL2 SSH $DISTRO' -Direction Inbound -Protocol TCP -LocalPort $PORT -Action Allow -ErrorAction SilentlyContinue | Out-Null; Write-Host 'firewall OK'\""
          echo "Provision config and firewall step complete"

      # ── Step 3: run firstboot inside distro ──────────────────────────────
      # Pushes latest firstboot.sh, setup-shared-ssh.sh, and mount timer files,
      # then runs firstboot.sh via wsl exec.
      - name: Run firstboot
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
          WSL2_HOST_USER: ${{ secrets.WSL2_HOST_USER }}
        run: |
          DISTRO='${{ inputs.distro_name }}'
          # Push latest scripts to Windows home (accessible via /mnt/c/ in WSL)
          scp -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            wsl2/firstboot.sh \
            wsl2/setup-shared-ssh.sh \
            wsl2/mount-dgx-shared.sh \
            wsl2/mount-dgx-shared.service \
            wsl2/mount-dgx-shared.timer \
            wsl2/collect-wsl2-root-cause.ps1 \
            "$WSL2_HOST_USER@$WSL2_HOST:"
          # Install inside the distro
          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "powershell -Command \"wsl -d $DISTRO --user root -- bash -c 'install -m 755 /mnt/c/Users/$WSL2_HOST_USER/firstboot.sh /usr/local/bin/firstboot.sh && install -m 755 /mnt/c/Users/$WSL2_HOST_USER/setup-shared-ssh.sh /usr/local/bin/setup-shared-ssh.sh && install -m 755 /mnt/c/Users/$WSL2_HOST_USER/mount-dgx-shared.sh /usr/local/sbin/mount-dgx-shared.sh && install -m 644 /mnt/c/Users/$WSL2_HOST_USER/mount-dgx-shared.service /etc/systemd/system/mount-dgx-shared.service && install -m 644 /mnt/c/Users/$WSL2_HOST_USER/mount-dgx-shared.timer /etc/systemd/system/mount-dgx-shared.timer && echo scripts_installed'\""
          # Run firstboot synchronously (sets hostname, sshd port, CIFS timer, SSH symlinks)
          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "powershell -Command \"wsl -d $DISTRO --user root -- bash /usr/local/bin/firstboot.sh\""
          echo "Firstboot complete"

      # ── Step 4: authorize DGX SSH key ────────────────────────────────────
      # Runs after firstboot so authorized_keys is already symlinked to the
      # shared store.
      # bootstrap.sh seeds the same key into the template, so this step is
      # usually a no-op; sort -u deduplicates so re-runs don't accumulate
      # duplicate entries in the shared authorized_keys file.
      - name: Authorize DGX SSH key in distro
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
          WSL2_HOST_USER: ${{ secrets.WSL2_HOST_USER }}
        run: |
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > /tmp/dgx_priv
          chmod 600 /tmp/dgx_priv
          DGX_PUBKEY=$(ssh-keygen -y -f /tmp/dgx_priv)
          rm -f /tmp/dgx_priv
          DISTRO='${{ inputs.distro_name }}'
          printf '%s\n' "$DGX_PUBKEY" | \
            ssh -i /tmp/wsl2_win_host \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              "$WSL2_HOST_USER@$WSL2_HOST" \
              "wsl -d $DISTRO -- bash -c \"mkdir -p ~/.ssh && chmod 700 ~/.ssh && cat >> ~/.ssh/authorized_keys && sort -u -o ~/.ssh/authorized_keys ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys\""
          echo "DGX pubkey authorized in distro (idempotent)"

      # ── Step 5: verify sshd is reachable ─────────────────────────────────
      - name: Wait for sshd in distro
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
        run: |
          echo "Waiting for sshd on $WSL2_HOST:${{ inputs.ssh_port }}..."
          for i in $(seq 1 30); do
            if ssh-keyscan -p "${{ inputs.ssh_port }}" "$WSL2_HOST" >/dev/null 2>&1; then
              echo "sshd up (attempt $i)"
              break
            fi
            echo "  waiting... ($i/30)"
            sleep 5
            if [[ $i -eq 30 ]]; then
              echo "ERROR: sshd not reachable after 150s" >&2
              exit 1
            fi
          done

      # ── Step 6: verify systemd ready ─────────────────────────────────────
      - name: Wait for systemd ready
        env:
          DGX_HOST_USER: ${{ vars.DGX_HOST_USER }}
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
        run: |
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > /tmp/wsl2_host
          chmod 600 /tmp/wsl2_host
          ssh-keyscan -p "${{ inputs.ssh_port }}" -H "${{ secrets.WSL2_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null || true
          for i in $(seq 1 24); do
            state=$(ssh -i /tmp/wsl2_host \
              -p "${{ inputs.ssh_port }}" \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              "$DGX_HOST_USER@$WSL2_HOST" \
              'systemctl is-system-running 2>&1 || true' 2>/dev/null || echo ssh-failed)
            echo "systemd: $state (attempt $i/24)"
            [[ "$state" =~ ^(running|degraded)$ ]] && echo "systemd ready" && break
            sleep 5
            if [[ $i -eq 24 ]]; then
              echo "ERROR: systemd not ready after 120s (last state: $state)" >&2
              exit 1
            fi
          done

      - name: Register in WSL2_DISTROS
        id: register
        run: |
          DISTRO='${{ inputs.distro_name }}'
          REPO='${{ github.repository }}'
          export GH_TOKEN="$GITHUB_ORG_ADMIN_PAT"
          CURRENT=$(gh api "repos/$REPO/actions/variables/WSL2_DISTROS" --jq '.value' 2>/dev/null || echo "")
          [[ "$CURRENT" == "NONE" ]] && CURRENT=""
          if echo " $CURRENT " | grep -qF " $DISTRO "; then
            echo "$DISTRO already in WSL2_DISTROS — skipping"
            NEW="$CURRENT"
          else
            NEW=$(echo "$CURRENT $DISTRO" | xargs)
            gh variable set WSL2_DISTROS --body "$NEW" --repo "$REPO"
            echo "WSL2_DISTROS: $NEW"
          fi
          echo "wsl2_distros=$NEW" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "## WSL2 Provision"
            echo "| | |"
            echo "|---|---|"
            echo "| Distro | \`${{ inputs.distro_name }}\` |"
            echo "| SSH alias | \`wsl2-${{ inputs.distro_name }}\` |"
            echo "| Port | \`${{ inputs.ssh_port }}\` |"
            echo "| Host | \`${{ secrets.WSL2_HOST }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: provision
    uses: ./.github/workflows/verify-ssh-topology.yaml
    secrets: inherit
    with:
      distros: ${{ needs.provision.outputs.wsl2_distros }}
