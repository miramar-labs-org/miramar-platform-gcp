name: WSL2 Provision

# Full lifecycle: import distro from template, wire into the lab SSH mesh.
#
#   1. SSH to Windows host → wsl --import (idempotent)
#   2. Wait for sshd inside the distro to be reachable
#   3. Write ~/.smbcredentials inside distro
#   4. Mount //DGX/shared at ~/shared/ via CIFS
#   5. Symlink ~/.ssh/ → ~/shared/ssh/ (all machines share Spark's identity)
#   6. Add wsl2-<name> host block to shared SSH config
#
# Prerequisites:
#   - Setup Shared SSH Store run at least once (DGX ~/shared/ssh/ initialised)
#   - .wslconfig (mirrored networking) set on Windows (see wsl2/post-bootstrap.md)
#   - Firewall rule for ssh_port open on Windows (see wsl2/post-bootstrap.md)
#   - Secrets: WSL2_HOST, WSL2_HOST_USER, WSL2_HOST_SSH_KEY,
#              DGX_HOST_SSH_KEY, DGX_SMB_PASSWORD
#   - Vars:    DGX_HOST, DGX_HOST_USER

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "WSL2 distro name"
        required: true
        default: dev
      ssh_port:
        description: "sshd port inside the distro"
        required: false
        default: "2222"
      runner:
        description: "Runner to SSH from"
        required: false
        default: dgx
        type: choice
        options:
          - dgx
          - agx

jobs:
  provision:
    runs-on: ${{ inputs.runner || 'dgx' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # ── Step 1: import distro from template tarball ──────────────────────
      - name: Import WSL2 distro from template
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
          WSL2_HOST_USER: ${{ secrets.WSL2_HOST_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.WSL2_HOST_SSH_KEY }}" > /tmp/wsl2_win_host
          chmod 600 /tmp/wsl2_win_host
          ssh-keyscan -H "$WSL2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # The default SSH shell on Windows is cmd.exe.
          # cmd.exe's & chains commands; if import fails (distro exists), wsl -d still runs.
          # GHA has already substituted distro_name before bash sees this.
          # \\ in bash double-quoted string → \ (Windows path separator).
          DISTRO='${{ inputs.distro_name }}'
          ssh -i /tmp/wsl2_win_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$WSL2_HOST_USER@$WSL2_HOST" \
            "mkdir C:\\wsl\\$DISTRO 2>nul & wsl --import $DISTRO C:\\wsl\\$DISTRO C:\\wsl-templates\\ubuntu-22.04-configured-template.tar --version 2 & wsl -d $DISTRO -- bash -c \"echo distro up\""
          echo "Import step complete"

      # ── Step 2: wait for sshd inside the distro ──────────────────────────
      - name: Wait for sshd in distro

        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
        run: |
          echo "Waiting for sshd on $WSL2_HOST:${{ inputs.ssh_port }}..."
          for i in $(seq 1 30); do
            if ssh-keyscan -p "${{ inputs.ssh_port }}" "$WSL2_HOST" >/dev/null 2>&1; then
              echo "sshd up (attempt $i)"
              break
            fi
            echo "  waiting... ($i/30)"
            sleep 5
            if [[ $i -eq 30 ]]; then
              echo "ERROR: sshd not reachable after 150s" >&2
              exit 1
            fi
          done

      # ── Step 3: authorize DGX key in distro ──────────────────────────────
      # Templates exported before bootstrap.sh gained DGX_PUBKEY seeding won't
      # have Spark's key in authorized_keys. Derive the public key from the private
      # key and inject it via Windows SSH (pipe through wsl -d ... -- bash).
      - name: Authorize DGX SSH key in distro
        env:
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
          WSL2_HOST_USER: ${{ secrets.WSL2_HOST_USER }}
        run: |
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > /tmp/dgx_priv
          chmod 600 /tmp/dgx_priv
          DGX_PUBKEY=$(ssh-keygen -y -f /tmp/dgx_priv)
          rm -f /tmp/dgx_priv
          DISTRO='${{ inputs.distro_name }}'
          printf '%s\n' "$DGX_PUBKEY" | \
            ssh -i /tmp/wsl2_win_host \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              "$WSL2_HOST_USER@$WSL2_HOST" \
              "wsl -d $DISTRO -- bash -c \"mkdir -p ~/.ssh && chmod 700 ~/.ssh && cat >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys\""
          echo "DGX pubkey authorized in distro"

      # ── Steps 4-6: wire SSH mesh ──────────────────────────────────────────
      - name: Set up SSH key for WSL2 distro
        run: |
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > /tmp/wsl2_host
          chmod 600 /tmp/wsl2_host
          ssh-keyscan -p "${{ inputs.ssh_port }}" -H "${{ secrets.WSL2_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Write .smbcredentials on distro
        env:
          DGX_SMB_PASSWORD: ${{ secrets.DGX_SMB_PASSWORD }}
          DGX_HOST_USER: ${{ vars.DGX_HOST_USER }}
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
        run: |
          printf 'username=%s\npassword=%s\n' "$DGX_HOST_USER" "$DGX_SMB_PASSWORD" | \
            ssh -i /tmp/wsl2_host \
              -p "${{ inputs.ssh_port }}" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              "$DGX_HOST_USER@$WSL2_HOST" \
              'cat > ~/.smbcredentials && chmod 600 ~/.smbcredentials'
          echo "Written .smbcredentials"

      - name: Mount DGX shared store and symlink SSH files
        env:
          DGX_HOST: ${{ vars.DGX_HOST }}
          DGX_HOST_USER: ${{ vars.DGX_HOST_USER }}
          WSL2_HOST: ${{ secrets.WSL2_HOST }}
        run: |
          # Always push the repo's copy so template vintage doesn't matter
          scp -i /tmp/wsl2_host \
            -P "${{ inputs.ssh_port }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            wsl2/setup-shared-ssh.sh \
            "$DGX_HOST_USER@$WSL2_HOST:/tmp/setup-shared-ssh.sh"
          ssh -i /tmp/wsl2_host \
            -p "${{ inputs.ssh_port }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$DGX_HOST_USER@$WSL2_HOST" \
            "sudo install -m 755 /tmp/setup-shared-ssh.sh /usr/local/bin/setup-shared-ssh.sh && sudo /usr/local/bin/setup-shared-ssh.sh '$DGX_HOST' '$DGX_HOST_USER' '${{ inputs.distro_name }}' '${{ inputs.ssh_port }}' '$WSL2_HOST'"

      - name: Summary
        if: always()
        run: |
          {
            echo "## WSL2 Provision"
            echo "| | |"
            echo "|---|---|"
            echo "| Distro | \`${{ inputs.distro_name }}\` |"
            echo "| SSH alias | \`wsl2-${{ inputs.distro_name }}\` |"
            echo "| Port | \`${{ inputs.ssh_port }}\` |"
            echo "| Host | \`${{ secrets.WSL2_HOST }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: provision
    uses: ./.github/workflows/verify-ssh-topology.yaml
    with:
      distro_name: ${{ inputs.distro_name }}
      ssh_port: ${{ inputs.ssh_port }}
