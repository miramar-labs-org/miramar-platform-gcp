name: Setup Shared SSH Store

# One-time infrastructure setup — run before provisioning any WSL2 distro.
#
# DGX host is the single source of truth: ~/shared/ssh/ holds the canonical
# config, known_hosts, and authorized_keys for all machines.
#
# Phase 1 (setup-dgx):  runner → SSH → DGX host
#   - Init ~/shared/ssh/ (migrate existing known_hosts + authorized_keys)
#   - Create ~/.ssh symlinks on DGX host
#
# Phase 2 (setup-orin): runner → SSH → DGX host → SSH → Orin host
#   - Install cifs-utils, write .smbcredentials, add fstab entry, mount
#   - Create ~/.ssh symlinks on Orin host
#   - Add Orin pubkey to shared authorized_keys
#
# Prerequisites:
#   - DGX ~/shared Samba share configured and running
#   - DGX host can already SSH to orin.local (pre-existing lab SSH)
#   - Vars:    DGX_HOST, DGX_HOST_USER
#   - Secrets: DGX_HOST_SSH_KEY, DGX_SMB_PASSWORD

on:
  workflow_dispatch:

jobs:

  # -----------------------------------------------------------------------
  # Phase 1: DGX host — init ~/shared/ssh/ + symlinks
  # -----------------------------------------------------------------------

  setup-dgx:
    runs-on: agx
    steps:
      - name: Set up SSH key for DGX host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > ~/.ssh/dgx_host
          chmod 600 ~/.ssh/dgx_host
          ssh-keyscan -H "${{ vars.DGX_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Initialise ~/shared/ssh/ and create symlinks on DGX host
        run: |
          ssh -i ~/.ssh/dgx_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST }}" bash -s << 'EOF'
          set -euo pipefail

          mkdir -p ~/shared/ssh
          chmod 700 ~/shared/ssh

          # --- config ---
          if [[ ! -f ~/shared/ssh/config ]]; then
            {
              echo "Host msi"
              echo "    HostName msi.local"
              echo "    User aaron"
              echo "    IdentityFile ~/.ssh/id_ed25519"
              echo "    IdentitiesOnly yes"
              echo ""
              echo "Host orin"
              echo "    HostName orin.local"
              echo "    User aaron"
              echo "    IdentityFile ~/.ssh/id_ed25519"
              echo "    IdentitiesOnly yes"
              echo ""
              echo "Host dgx spark spark-79b7"
              echo "    HostName spark-79b7.local"
              echo "    User aaron"
              echo "    IdentityFile ~/.ssh/id_ed25519"
              echo "    IdentitiesOnly yes"
              echo ""
              echo "Host github.com"
              echo "    HostName github.com"
              echo "    User git"
              echo "    IdentityFile ~/.ssh/id_ed25519"
              echo "    IdentitiesOnly yes"
            } > ~/shared/ssh/config
            chmod 600 ~/shared/ssh/config
            echo "Created ~/shared/ssh/config"
          else
            echo "~/shared/ssh/config already exists — skipping"
          fi

          # --- known_hosts: seed from existing file to preserve host keys ---
          if [[ ! -f ~/shared/ssh/known_hosts ]]; then
            if [[ -f ~/.ssh/known_hosts && ! -L ~/.ssh/known_hosts ]]; then
              cp ~/.ssh/known_hosts ~/shared/ssh/known_hosts
              echo "Seeded ~/shared/ssh/known_hosts from existing file"
            else
              touch ~/shared/ssh/known_hosts
              echo "Created empty ~/shared/ssh/known_hosts"
            fi
            chmod 644 ~/shared/ssh/known_hosts
          else
            echo "~/shared/ssh/known_hosts already exists — skipping"
          fi

          # --- authorized_keys: seed from existing file ---
          if [[ ! -f ~/shared/ssh/authorized_keys ]]; then
            if [[ -f ~/.ssh/authorized_keys && ! -L ~/.ssh/authorized_keys ]]; then
              cp ~/.ssh/authorized_keys ~/shared/ssh/authorized_keys
              echo "Seeded ~/shared/ssh/authorized_keys from existing file"
            else
              touch ~/shared/ssh/authorized_keys
              echo "Created empty ~/shared/ssh/authorized_keys"
            fi
            chmod 600 ~/shared/ssh/authorized_keys
          else
            echo "~/shared/ssh/authorized_keys already exists — skipping"
          fi

          # --- add DGX host pubkey ---
          DGX_PUB=$(cat ~/.ssh/id_ed25519.pub)
          grep -qF "$DGX_PUB" ~/shared/ssh/authorized_keys 2>/dev/null || \
            printf '\n%s\n' "$DGX_PUB" >> ~/shared/ssh/authorized_keys
          echo "DGX pubkey present"

          # --- symlinks (back up any existing regular files) ---
          for f in config known_hosts authorized_keys; do
            target="$HOME/shared/ssh/$f"
            link="$HOME/.ssh/$f"
            if [[ -L "$link" ]]; then
              echo "$f: already a symlink — skipping"
            elif [[ -f "$link" ]]; then
              mv "$link" "${link}.bak"
              echo "$f: backed up → ${link}.bak"
              ln -sf "$target" "$link"
              echo "$f: symlinked"
            else
              ln -sf "$target" "$link"
              echo "$f: symlinked"
            fi
          done

          echo "DGX host setup complete"
          EOF

  # -----------------------------------------------------------------------
  # Phase 2: Orin host — CIFS mount + symlinks (via DGX host SSH)
  # -----------------------------------------------------------------------

  setup-orin:
    needs: setup-dgx
    runs-on: agx
    steps:
      - name: Set up SSH key for DGX host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > ~/.ssh/dgx_host
          chmod 600 ~/.ssh/dgx_host
          ssh-keyscan -H "${{ vars.DGX_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install cifs-utils + create mountpoint on Orin (via DGX host)
        run: |
          ssh -i ~/.ssh/dgx_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST }}" \
            "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
              orin.local 'sudo apt-get install -y --no-install-recommends cifs-utils && mkdir -p ~/shared'"

      - name: Write .smbcredentials on Orin (via DGX host, stdin — password never in args)
        env:
          DGX_SMB_PASSWORD: ${{ secrets.DGX_SMB_PASSWORD }}
          DGX_HOST_USER: ${{ vars.DGX_HOST_USER }}
        run: |
          printf 'username=%s\npassword=%s\n' "$DGX_HOST_USER" "$DGX_SMB_PASSWORD" | \
            ssh -i ~/.ssh/dgx_host \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              -o PasswordAuthentication=no \
              "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST }}" \
              "ssh -o BatchMode=yes -o IdentitiesOnly=yes orin.local \
                'cat > ~/.smbcredentials && chmod 600 ~/.smbcredentials'"
          echo "Written .smbcredentials on Orin"

      - name: Add fstab entry + mount on Orin (via DGX host)
        run: |
          ssh -i ~/.ssh/dgx_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST }}" \
            "ssh -o BatchMode=yes -o IdentitiesOnly=yes orin.local bash -s" << 'EOF'
          set -euo pipefail
          if grep -q '/home/aaron/shared' /etc/fstab 2>/dev/null; then
            echo "fstab entry already present"
          else
            printf '//spark-79b7.local/shared /home/aaron/shared cifs credentials=/home/aaron/.smbcredentials,uid=%s,gid=%s,file_mode=0600,dir_mode=0700,_netdev 0 0\n' \
              "$(id -u)" "$(id -g)" | sudo tee -a /etc/fstab
            echo "fstab entry added"
          fi
          if mountpoint -q ~/shared; then
            echo "Already mounted"
          else
            sudo mount ~/shared
            echo "Mounted"
          fi
          EOF

      - name: Create ~/.ssh symlinks + add Orin pubkey (via DGX host)
        run: |
          ssh -i ~/.ssh/dgx_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST }}" \
            "ssh -o BatchMode=yes -o IdentitiesOnly=yes orin.local bash -s" << 'EOF'
          set -euo pipefail
          for f in config known_hosts authorized_keys; do
            target="$HOME/shared/ssh/$f"
            link="$HOME/.ssh/$f"
            if [[ -L "$link" ]]; then
              echo "$f: already a symlink — skipping"
            elif [[ -f "$link" ]]; then
              mv "$link" "${link}.bak"
              echo "$f: backed up → ${link}.bak"
              ln -sf "$target" "$link"
              echo "$f: symlinked"
            else
              ln -sf "$target" "$link"
              echo "$f: symlinked"
            fi
          done
          ORIN_PUB=$(cat ~/.ssh/id_ed25519.pub)
          grep -qF "$ORIN_PUB" ~/shared/ssh/authorized_keys 2>/dev/null || \
            printf '\n%s\n' "$ORIN_PUB" >> ~/shared/ssh/authorized_keys
          echo "Orin pubkey present in shared authorized_keys"
          echo "Orin host setup complete"
          EOF

  # -----------------------------------------------------------------------
  # Summary
  # -----------------------------------------------------------------------

  summary:
    needs: [setup-dgx, setup-orin]
    if: always()
    runs-on: agx
    steps:
      - name: Summary
        run: |
          dgx="${{ needs.setup-dgx.result }}"
          orin="${{ needs.setup-orin.result }}"
          pass() { [[ "$1" == "success" ]] && echo "✅" || echo "❌ ($1)"; }
          {
            echo "## Setup Shared SSH Store"
            echo ""
            echo "| Machine | Status |"
            echo "|---|---|"
            echo "| DGX host — init \`~/shared/ssh/\` + symlinks | $(pass $dgx) |"
            echo "| Orin host — CIFS mount + symlinks + pubkey (via DGX) | $(pass $orin) |"
            echo ""
            echo "### Shared store"
            echo "\`\`\`"
            echo "DGX ~/shared/ssh/config          ← all Host blocks"
            echo "DGX ~/shared/ssh/known_hosts     ← trusted host keys"
            echo "DGX ~/shared/ssh/authorized_keys ← all machine pubkeys"
            echo "\`\`\`"
            echo "Windows path: \`C:\\Users\\aaron\\shared\\ssh\\\`"
            echo ""
            echo "### Next step"
            echo "Run **WSL2 Provision** then **WSL2 Post-Provision** to add a new distro."
          } >> "$GITHUB_STEP_SUMMARY"
