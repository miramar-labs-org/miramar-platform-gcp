name: Setup Shared SSH Store

# One-time infrastructure setup — run before provisioning any WSL2 distro.
# Also re-run whenever Orin needs to be re-wired.
#
# DGX host is the single source of truth: ~/shared/ssh/ holds the canonical
# config, known_hosts, and authorized_keys for all machines.
#
# Phase 1 (setup-dgx):  runner → SSH → DGX host
#   - Init ~/shared/ssh/ (migrate existing known_hosts + authorized_keys)
#   - Create ~/.ssh symlinks on DGX host
#
# Phase 2 (setup-orin): runs directly on agx runner (agx runner IS Orin — no SSH hop)
#   - Remove any stale CIFS leftovers (fstab entry, symlinks, umount)
#   - Remove legacy orin-ssh-setup.service if present
#   - CIFS-mount DGX shared store at ~/shared/, symlink ~/.ssh/ → ~/shared/ssh/
#
# Prerequisites:
#   - DGX ~/shared Samba share configured and running
#   - Vars:    DGX_HOST_IP, DGX_HOST_USER
#   - Secrets: HOST_SSH_KEY, HOST_SSH_KEY, DGX_SMB_PASSWORD

on:
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------------
  # Phase 1: DGX host — init ~/shared/ssh/ + symlinks
  # -----------------------------------------------------------------------

  setup-dgx:
    runs-on: agx
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key for DGX host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HOST_SSH_KEY }}" > /tmp/dgx_host
          chmod 600 /tmp/dgx_host
          ssh-keyscan -H "${{ vars.DGX_HOST_IP }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Initialise ~/shared/ssh/ and create symlinks on DGX host
        run: |
          ssh -i /tmp/dgx_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=accept-new \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST_IP }}" bash -s << 'EOF'
          set -euo pipefail

          mkdir -p ~/shared/ssh
          chmod 700 ~/shared/ssh

          # --- config ---
          if [[ ! -f ~/shared/ssh/config ]]; then
            {
              echo "Host orin"
              echo "    HostName orin.local"
              echo "    User aaron"
              echo "    IdentityFile ~/.ssh/id_ed25519"
              echo "    IdentitiesOnly yes"
              echo ""
              echo "Host dgx spark spark-79b7"
              echo "    HostName spark-79b7.local"
              echo "    User aaron"
              echo "    IdentityFile ~/.ssh/id_ed25519"
              echo "    IdentitiesOnly yes"
              echo ""
              echo "Host github.com"
              echo "    HostName github.com"
              echo "    User git"
              echo "    IdentityFile ~/.ssh/id_ed25519"
              echo "    IdentitiesOnly yes"
            } > ~/shared/ssh/config
            chmod 600 ~/shared/ssh/config
            echo "Created ~/shared/ssh/config"
          else
            echo "~/shared/ssh/config already exists — skipping"
          fi

          # --- known_hosts: seed from existing file to preserve host keys ---
          if [[ ! -f ~/shared/ssh/known_hosts ]]; then
            if [[ -f ~/.ssh/known_hosts && ! -L ~/.ssh/known_hosts ]]; then
              cp ~/.ssh/known_hosts ~/shared/ssh/known_hosts
              echo "Seeded ~/shared/ssh/known_hosts from existing file"
            else
              touch ~/shared/ssh/known_hosts
              echo "Created empty ~/shared/ssh/known_hosts"
            fi
            chmod 644 ~/shared/ssh/known_hosts
          else
            echo "~/shared/ssh/known_hosts already exists — skipping"
          fi

          # --- authorized_keys: seed from existing file ---
          if [[ ! -f ~/shared/ssh/authorized_keys ]]; then
            if [[ -f ~/.ssh/authorized_keys && ! -L ~/.ssh/authorized_keys ]]; then
              cp ~/.ssh/authorized_keys ~/shared/ssh/authorized_keys
              echo "Seeded ~/shared/ssh/authorized_keys from existing file"
            else
              touch ~/shared/ssh/authorized_keys
              echo "Created empty ~/shared/ssh/authorized_keys"
            fi
            chmod 600 ~/shared/ssh/authorized_keys
          else
            echo "~/shared/ssh/authorized_keys already exists — skipping"
          fi

          # --- add DGX host pubkey ---
          DGX_PUB=$(cat ~/.ssh/id_ed25519.pub)
          grep -qF "$DGX_PUB" ~/shared/ssh/authorized_keys 2>/dev/null || \
            printf '\n%s\n' "$DGX_PUB" >> ~/shared/ssh/authorized_keys
          echo "DGX pubkey present"

          # --- private key ---
          if [[ ! -f ~/shared/ssh/id_ed25519 ]]; then
            if [[ -f ~/.ssh/id_ed25519 && ! -L ~/.ssh/id_ed25519 ]]; then
              cp ~/.ssh/id_ed25519 ~/shared/ssh/id_ed25519
              chmod 600 ~/shared/ssh/id_ed25519
              echo "Seeded ~/shared/ssh/id_ed25519"
            else
              echo "WARNING: ~/.ssh/id_ed25519 not found or already a symlink" >&2
            fi
          else
            echo "~/shared/ssh/id_ed25519 already exists — skipping"
          fi

          # --- public key ---
          if [[ ! -f ~/shared/ssh/id_ed25519.pub ]]; then
            if [[ -f ~/.ssh/id_ed25519.pub && ! -L ~/.ssh/id_ed25519.pub ]]; then
              cp ~/.ssh/id_ed25519.pub ~/shared/ssh/id_ed25519.pub
              chmod 644 ~/shared/ssh/id_ed25519.pub
              echo "Seeded ~/shared/ssh/id_ed25519.pub"
            fi
          else
            echo "~/shared/ssh/id_ed25519.pub already exists — skipping"
          fi

          # --- symlinks (back up any existing regular files) ---
          for f in config known_hosts authorized_keys id_ed25519 id_ed25519.pub; do
            target="$HOME/shared/ssh/$f"
            link="$HOME/.ssh/$f"
            if [[ -L "$link" ]]; then
              echo "$f: already a symlink — skipping"
            elif [[ -f "$link" ]]; then
              mv "$link" "${link}.bak"
              echo "$f: backed up → ${link}.bak"
              ln -sf "$target" "$link"
              echo "$f: symlinked"
            else
              ln -sf "$target" "$link"
              echo "$f: symlinked"
            fi
          done

          echo "DGX host setup complete"
          EOF

  # -----------------------------------------------------------------------
  # Phase 2: Orin host — CIFS mount + symlinks
  # agx runner runs inside Docker; host-level ops (fstab, mount, ~/.smbcredentials)
  # require SSH to localhost:22 (the Orin HOST sshd).
  # Container uses --network=host so localhost:22 IS the Orin host.
  # Mounts //DGX/shared at ~/shared/ and symlinks ~/.ssh/ → ~/shared/ssh/.
  # Orin uses Spark's SSH identity — no local keypair.
  # Requires secret: HOST_SSH_KEY (same pattern as HOST_SSH_KEY).
  # -----------------------------------------------------------------------

  setup-orin:
    needs: setup-dgx
    runs-on: agx
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key for Orin host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HOST_SSH_KEY }}" > /tmp/orin_host
          chmod 600 /tmp/orin_host

      - name: Write .smbcredentials, mount DGX shared store, symlink SSH files
        env:
          DGX_SMB_PASSWORD: ${{ secrets.DGX_SMB_PASSWORD }}
          DGX_HOST_USER: ${{ vars.DGX_HOST_USER }}
          DGX_HOST_IP: ${{ vars.DGX_HOST_IP }}
        run: |
          # Write .smbcredentials via stdin (password never in args)
          printf 'username=%s\npassword=%s\n' "$DGX_HOST_USER" "$DGX_SMB_PASSWORD" | \
            ssh -i /tmp/orin_host \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              "$DGX_HOST_USER@localhost" \
              'cat > ~/.smbcredentials && chmod 600 ~/.smbcredentials'
          echo "Written .smbcredentials"

          ssh -i /tmp/orin_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$DGX_HOST_USER@localhost" bash -s "$DGX_HOST_IP" << 'EOF'
          set -euo pipefail
          DGX_HOST_IP_REMOTE="$1"

          # Remove any stale SSH symlinks
          for f in config known_hosts authorized_keys id_ed25519 id_ed25519.pub; do
            [[ -L ~/.ssh/$f ]] && rm -f ~/.ssh/$f && echo "Removed stale symlink ~/.ssh/$f" || true
          done

          # Remove stale CIFS fstab entry
          if grep -qF "$DGX_HOST_IP_REMOTE/shared" /etc/fstab 2>/dev/null; then
            grep -vF "$DGX_HOST_IP_REMOTE/shared" /etc/fstab | sudo tee /tmp/fstab.new >/dev/null
            sudo cp /tmp/fstab.new /etc/fstab && rm -f /tmp/fstab.new
            echo "Removed stale CIFS fstab entry"
          fi

          # Unmount if still mounted
          if mountpoint -q ~/shared 2>/dev/null; then
            sudo umount ~/shared || true
            echo "Unmounted ~/shared"
          fi

          # Remove legacy service
          if [[ -f /etc/systemd/system/orin-ssh-setup.service ]]; then
            sudo systemctl disable --now orin-ssh-setup.service 2>/dev/null || true
            sudo rm /etc/systemd/system/orin-ssh-setup.service
            sudo systemctl daemon-reload
            echo "Removed legacy orin-ssh-setup.service"
          fi

          # Remove local keypair (Spark's identity used via shared mount)
          rm -f ~/.ssh/id_ed25519 ~/.ssh/id_ed25519.pub

          # Install cifs-utils (enable universe repo — not present on JetPack by default)
          echo "deb http://ports.ubuntu.com/ubuntu-ports $(lsb_release -sc) universe" \
            | sudo tee /etc/apt/sources.list.d/universe.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cifs-utils
          echo "cifs-utils ready"

          # Create mount point + fstab entry
          mkdir -p ~/shared
          UID_NUM=$(id -u)
          GID_NUM=$(id -g)
          FSTAB_LINE="//$DGX_HOST_IP_REMOTE/shared $HOME/shared cifs credentials=$HOME/.smbcredentials,uid=$UID_NUM,gid=$GID_NUM,_netdev,nofail,x-systemd.automount,file_mode=0600,dir_mode=0700 0 0"
          echo "$FSTAB_LINE" | sudo tee -a /etc/fstab
          echo "Added CIFS fstab entry"

          # Mount
          sudo mount ~/shared
          echo "Mounted ~/shared"

          # Symlink all SSH files → shared store
          for f in config known_hosts authorized_keys id_ed25519 id_ed25519.pub; do
            target="$HOME/shared/ssh/$f"
            link="$HOME/.ssh/$f"
            if [[ ! -e "$target" ]]; then
              echo "WARNING: $target not found in shared store — skipping $f" >&2
              continue
            fi
            [[ -f "$link" && ! -L "$link" ]] && mv "$link" "${link}.bak" && echo "$f: backed up" || true
            ln -sf "$target" "$link"
            echo "$f: symlinked → $target"
          done

          echo "Orin SSH setup complete"
          EOF

  # -----------------------------------------------------------------------
  # Summary
  # -----------------------------------------------------------------------

  summary:
    needs: [setup-dgx, setup-orin]
    if: always()
    runs-on: agx
    steps:
      - name: Summary
        run: |
          dgx="${{ needs.setup-dgx.result }}"
          orin="${{ needs.setup-orin.result }}"
          pass() { [[ "$1" == "success" ]] && echo "✅" || echo "❌ ($1)"; }
          {
            echo "## Setup Shared SSH Store"
            echo ""
            echo "| Machine | Status |"
            echo "|---|---|"
            echo "| DGX host — init \`~/shared/ssh/\` + symlinks | $(pass $dgx) |"
            echo "| Orin host — CIFS mount + symlink \`~/.ssh/\` → \`~/shared/ssh/\` | $(pass $orin) |"
            echo ""
            echo "### Shared store"
            echo "\`\`\`"
            echo "DGX ~/shared/ssh/config          ← all Host blocks"
            echo "DGX ~/shared/ssh/known_hosts     ← trusted host keys"
            echo "DGX ~/shared/ssh/authorized_keys ← all machine pubkeys"
            echo "\`\`\`"
            echo "Windows path: \`C:\\Users\\${{ vars.DGX_HOST_USER }}\\shared\\ssh\\\`"
            echo ""
            echo "### Next step"
            echo "Run **WSL2 Provision** then **WSL2 Post-Provision** to add a new distro."
          } >> "$GITHUB_STEP_SUMMARY"
