name: Setup Shared SSH Store

# One-time infrastructure setup — run before provisioning any WSL2 distro.
# Also re-run whenever a new template is built (to pre-authorize the template
# SMB key on DGX) or whenever Orin needs to be re-wired.
#
# DGX host is the single source of truth: ~/shared/ssh/ holds the canonical
# config, known_hosts, and authorized_keys for all machines.
#
# Phase 1 (setup-dgx):  runner → SSH → DGX host
#   - Init ~/shared/ssh/ (migrate existing known_hosts + authorized_keys)
#   - Create ~/.ssh symlinks on DGX host
#   - Pre-authorize wsl2/id_ed25519_smb.pub (template SMB bootstrap key)
#
# Phase 2 (setup-orin): runs directly on agx runner (agx runner IS Orin — no SSH hop)
#   - Remove any stale CIFS leftovers (fstab entry, symlinks, umount)
#   - Remove legacy orin-ssh-setup.service if present
#   - Install smbclient + write .smbcredentials
#   - One-shot sync: pull SSH files from DGX shared store via smbclient
#
# Prerequisites:
#   - DGX ~/shared Samba share configured and running
#   - wsl2/id_ed25519_smb.pub committed to repo (generated by bootstrap.sh)
#   - Vars:    DGX_HOST, DGX_HOST_USER
#   - Secrets: DGX_HOST_SSH_KEY, DGX_SMB_PASSWORD

on:
  workflow_dispatch:

jobs:

  # -----------------------------------------------------------------------
  # Phase 1: DGX host — init ~/shared/ssh/ + symlinks
  # -----------------------------------------------------------------------

  setup-dgx:
    runs-on: agx
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key for DGX host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > ~/.ssh/dgx_host
          chmod 600 ~/.ssh/dgx_host
          ssh-keyscan -H "${{ vars.DGX_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Initialise ~/shared/ssh/ and create symlinks on DGX host
        run: |
          ssh -i ~/.ssh/dgx_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=accept-new \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST }}" bash -s << 'EOF'
          set -euo pipefail

          mkdir -p ~/shared/ssh
          chmod 700 ~/shared/ssh

          # --- config ---
          if [[ ! -f ~/shared/ssh/config ]]; then
            {
              echo "Host orin"
              echo "    HostName orin.local"
              echo "    User aaron"
              echo "    IdentityFile ~/.ssh/id_ed25519"
              echo "    IdentitiesOnly yes"
              echo ""
              echo "Host dgx spark spark-79b7"
              echo "    HostName spark-79b7.local"
              echo "    User aaron"
              echo "    IdentityFile ~/.ssh/id_ed25519"
              echo "    IdentitiesOnly yes"
              echo ""
              echo "Host github.com"
              echo "    HostName github.com"
              echo "    User git"
              echo "    IdentityFile ~/.ssh/id_ed25519"
              echo "    IdentitiesOnly yes"
            } > ~/shared/ssh/config
            chmod 600 ~/shared/ssh/config
            echo "Created ~/shared/ssh/config"
          else
            echo "~/shared/ssh/config already exists — skipping"
          fi

          # --- known_hosts: seed from existing file to preserve host keys ---
          if [[ ! -f ~/shared/ssh/known_hosts ]]; then
            if [[ -f ~/.ssh/known_hosts && ! -L ~/.ssh/known_hosts ]]; then
              cp ~/.ssh/known_hosts ~/shared/ssh/known_hosts
              echo "Seeded ~/shared/ssh/known_hosts from existing file"
            else
              touch ~/shared/ssh/known_hosts
              echo "Created empty ~/shared/ssh/known_hosts"
            fi
            chmod 644 ~/shared/ssh/known_hosts
          else
            echo "~/shared/ssh/known_hosts already exists — skipping"
          fi

          # --- authorized_keys: seed from existing file ---
          if [[ ! -f ~/shared/ssh/authorized_keys ]]; then
            if [[ -f ~/.ssh/authorized_keys && ! -L ~/.ssh/authorized_keys ]]; then
              cp ~/.ssh/authorized_keys ~/shared/ssh/authorized_keys
              echo "Seeded ~/shared/ssh/authorized_keys from existing file"
            else
              touch ~/shared/ssh/authorized_keys
              echo "Created empty ~/shared/ssh/authorized_keys"
            fi
            chmod 600 ~/shared/ssh/authorized_keys
          else
            echo "~/shared/ssh/authorized_keys already exists — skipping"
          fi

          # --- add DGX host pubkey ---
          DGX_PUB=$(cat ~/.ssh/id_ed25519.pub)
          grep -qF "$DGX_PUB" ~/shared/ssh/authorized_keys 2>/dev/null || \
            printf '\n%s\n' "$DGX_PUB" >> ~/shared/ssh/authorized_keys
          echo "DGX pubkey present"

          # --- symlinks (back up any existing regular files) ---
          for f in config known_hosts authorized_keys; do
            target="$HOME/shared/ssh/$f"
            link="$HOME/.ssh/$f"
            if [[ -L "$link" ]]; then
              echo "$f: already a symlink — skipping"
            elif [[ -f "$link" ]]; then
              mv "$link" "${link}.bak"
              echo "$f: backed up → ${link}.bak"
              ln -sf "$target" "$link"
              echo "$f: symlinked"
            else
              ln -sf "$target" "$link"
              echo "$f: symlinked"
            fi
          done

          echo "DGX host setup complete"
          EOF

      - name: Pre-authorize WSL2 template SMB key on DGX
        run: |
          if [[ ! -f wsl2/id_ed25519_smb.pub ]]; then
            echo "wsl2/id_ed25519_smb.pub not found — skipping (run bootstrap.sh and commit the pub key first)"
            exit 0
          fi
          TEMPLATE_PUB=$(cat wsl2/id_ed25519_smb.pub)
          ssh -i ~/.ssh/dgx_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=accept-new \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST }}" \
            "grep -qF '${TEMPLATE_PUB}' ~/shared/ssh/authorized_keys 2>/dev/null || \
              printf '\n%s\n' '${TEMPLATE_PUB}' >> ~/shared/ssh/authorized_keys && \
              echo 'Template SMB key pre-authorized on DGX'"

  # -----------------------------------------------------------------------
  # Phase 2: Orin host — smbclient service
  # agx runner runs inside Docker; host-level ops (systemctl, /usr/local/bin,
  # ~/.smbcredentials) require SSH to localhost:22 (the Orin HOST sshd).
  # Container uses --network=host so localhost:22 IS the Orin host.
  # Requires secret: ORIN_HOST_SSH_KEY (same pattern as DGX_HOST_SSH_KEY).
  # -----------------------------------------------------------------------

  setup-orin:
    needs: setup-dgx
    runs-on: agx
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key for Orin host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.ORIN_HOST_SSH_KEY }}" > ~/.ssh/orin_host
          chmod 600 ~/.ssh/orin_host

      - name: Copy setup-shared-ssh.sh to Orin host
        run: |
          scp -i ~/.ssh/orin_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            wsl2/setup-shared-ssh.sh \
            "${{ vars.DGX_HOST_USER }}@localhost:/tmp/setup-shared-ssh.sh"

      - name: Write .smbcredentials, install smbclient, sync SSH files
        env:
          DGX_SMB_PASSWORD: ${{ secrets.DGX_SMB_PASSWORD }}
          DGX_HOST_USER: ${{ vars.DGX_HOST_USER }}
        run: |
          # Write .smbcredentials via stdin (password never in args)
          printf 'username=%s\npassword=%s\n' "$DGX_HOST_USER" "$DGX_SMB_PASSWORD" | \
            ssh -i ~/.ssh/orin_host \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              "$DGX_HOST_USER@localhost" \
              'cat > ~/.smbcredentials && chmod 600 ~/.smbcredentials'
          echo "Written .smbcredentials"

          ssh -i ~/.ssh/orin_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$DGX_HOST_USER@localhost" bash -s << 'EOF'
          set -euo pipefail

          # Remove stale CIFS symlinks
          for f in config known_hosts authorized_keys; do
            if [[ -L ~/.ssh/$f ]]; then
              rm -f ~/.ssh/$f
              echo "Removed stale symlink ~/.ssh/$f"
            fi
          done
          # Remove CIFS fstab entry
          if grep -q 'spark-79b7.local/shared' /etc/fstab 2>/dev/null; then
            sudo sed -i '\|spark-79b7.local/shared|d' /etc/fstab
            echo "Removed CIFS fstab entry"
          fi
          # Unmount if still mounted
          if mountpoint -q ~/shared 2>/dev/null; then
            sudo umount ~/shared || true
            echo "Unmounted ~/shared"
          fi
          # Remove service if previously installed
          if [[ -f /etc/systemd/system/orin-ssh-setup.service ]]; then
            sudo systemctl disable --now orin-ssh-setup.service 2>/dev/null || true
            sudo rm /etc/systemd/system/orin-ssh-setup.service
            sudo systemctl daemon-reload
            echo "Removed legacy orin-ssh-setup.service"
          fi

          # Install smbclient (enable universe repo — not present on JetPack by default)
          echo "deb http://ports.ubuntu.com/ubuntu-ports $(lsb_release -sc) universe" \
            | sudo tee /etc/apt/sources.list.d/universe.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends smbclient
          echo "smbclient ready"

          # One-shot sync: pull SSH files from DGX shared store
          sudo bash /tmp/setup-shared-ssh.sh spark-79b7.local aaron "" 22
          echo "Orin SSH setup complete"
          EOF

  # -----------------------------------------------------------------------
  # Summary
  # -----------------------------------------------------------------------

  summary:
    needs: [setup-dgx, setup-orin]
    if: always()
    runs-on: agx
    steps:
      - name: Summary
        run: |
          dgx="${{ needs.setup-dgx.result }}"
          orin="${{ needs.setup-orin.result }}"
          pass() { [[ "$1" == "success" ]] && echo "✅" || echo "❌ ($1)"; }
          {
            echo "## Setup Shared SSH Store"
            echo ""
            echo "| Machine | Status |"
            echo "|---|---|"
            echo "| DGX host — init \`~/shared/ssh/\` + symlinks + template key pre-auth | $(pass $dgx) |"
            echo "| Orin host — smbclient + one-shot SSH file sync | $(pass $orin) |"
            echo ""
            echo "### Shared store"
            echo "\`\`\`"
            echo "DGX ~/shared/ssh/config          ← all Host blocks"
            echo "DGX ~/shared/ssh/known_hosts     ← trusted host keys"
            echo "DGX ~/shared/ssh/authorized_keys ← all machine pubkeys"
            echo "\`\`\`"
            echo "Windows path: \`C:\\Users\\${{ vars.DGX_HOST_USER }}\\shared\\ssh\\\`"
            echo ""
            echo "### Next step"
            echo "Run **WSL2 Provision** then **WSL2 Post-Provision** to add a new distro."
          } >> "$GITHUB_STEP_SUMMARY"
