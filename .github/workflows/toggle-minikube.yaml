name: Minikube Toggle

# Pause or unpause the minikube cluster on the target machine.
# Pause freezes all workloads without stopping the cluster — faster to
# recover than a full stop/start and preserves all in-memory state.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "pause or resume"
        required: true
        type: choice
        options:
          - pause
          - resume
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin, wsl2 = SSH to DGX from laptop)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
          - wsl2

jobs:
  toggle:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 10
    steps:
      - name: Resolve SSH target
        shell: bash
        run: |
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "HOST_IP=${{ vars.AGX_HOST_IP }}"     >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}" >> "$GITHUB_ENV"
          else
            echo "HOST_IP=${{ vars.DGX_HOST_IP }}"     >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}" >> "$GITHUB_ENV"
          fi

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            printf '%s\n' "${{ secrets.AGX_HOST_SSH_KEY }}" > /tmp/host_key
          else
            printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > /tmp/host_key
          fi
          chmod 600 /tmp/host_key
          ssh-keyscan -H "$HOST_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: ${{ inputs.action == 'pause' && 'Pause minikube' || 'Resume minikube' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i /tmp/host_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "$HOST_USER@$HOST_IP" \
            "minikube ${{ inputs.action == 'pause' && 'pause' || 'unpause' }}"
