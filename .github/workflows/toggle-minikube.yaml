name: Minikube Toggle

# Pause or unpause the minikube cluster on the DGX host via SSH.
# Pause freezes all workloads without stopping the cluster — faster to
# recover than a full stop/start and preserves all in-memory state.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "pause or resume"
        required: true
        type: choice
        options:
          - pause
          - resume
      runner:
        description: Runner host that can SSH to the DGX
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - wsl2

jobs:
  toggle:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key for DGX host
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > ~/.ssh/dgx_host
          chmod 600 ~/.ssh/dgx_host
          ssh-keyscan -H "${{ vars.DGX_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: ${{ inputs.action == 'pause' && 'Pause minikube on DGX' || 'Resume minikube on DGX' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dgx_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST }}" \
            "minikube ${{ inputs.action == 'pause' && 'pause' || 'unpause' }}"
