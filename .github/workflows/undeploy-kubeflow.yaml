name: Kubeflow Undeploy

# Removes Kubeflow Pipelines from the target k3s cluster and optionally
# deletes the kubeflow namespace. Passes the same pipeline_version used at
# deploy time so kustomize can find the exact resources to delete.
#
# Does NOT stop the cluster or affect any other workloads.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
      pipeline_version:
        description: Kubeflow Pipelines version tag used at deploy time
        default: "2.16.1"
        required: false
      delete_namespace:
        description: Delete kubeflow namespace after removal
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  undeploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 15
    steps:
      # 1-hour GitHub App token (replaces the org-admin PAT; Nov 2026 incident)
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          owner: miramar-labs-org
      - name: Export App token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GH_APP_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve host
        run: |
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "HOST_IP=${{ vars.AGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}" >> "$GITHUB_ENV"
          else
            echo "HOST_IP=${{ vars.DGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}" >> "$GITHUB_ENV"
          fi

      - name: Set up SSH key
        env:
          HOST_SSH_KEY: ${{ secrets.HOST_SSH_KEY }}
        run: |
          # Key lives only in ssh-agent memory: never written to disk, never
          # interpolated into the step script. Agent persists for later steps via GITHUB_ENV.
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$HOST_SSH_KEY" | ssh-add -q -t 21600 -
          { echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"; echo "SSH_AGENT_PID=$SSH_AGENT_PID"; } >> "$GITHUB_ENV"
          ssh-keyscan -H "${HOST_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy kubeconfig from host
        run: |
          mkdir -p ~/.kube
          scp -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}:/home/${HOST_USER}/.kube/config" ~/.kube/config
          echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Destroy Kubeflow Pipelines
        env:
          PIPELINE_VERSION: ${{ inputs.pipeline_version || '2.16.1' }}
          DELETE_NS: ${{ inputs.delete_namespace && 'true' || 'false' }}
        run: bash dgx/k3s/kubeflow/destroy-kubeflow.sh

      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k >/dev/null 2>&1 || true

      - name: Clear KFP active state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          var="${machine}_KFP_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="false" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="false" -f visibility="all"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Kubeflow Pipelines Undeployed"
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| Version | \`${{ inputs.pipeline_version || '2.16.1' }}\` |"
            echo "| Namespace deleted | \`${{ inputs.delete_namespace }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
