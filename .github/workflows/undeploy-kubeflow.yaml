name: Kubeflow Undeploy

# Removes Kubeflow Pipelines from the target minikube cluster and optionally
# deletes the kubeflow namespace. Passes the same pipeline_version used at
# deploy time so kustomize can find the exact resources to delete.
#
# Does NOT stop minikube or affect any other workloads.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
      pipeline_version:
        description: Kubeflow Pipelines version tag used at deploy time
        default: "2.16.1"
        required: false
      delete_namespace:
        description: Delete kubeflow namespace after removal
        type: boolean
        default: true

jobs:
  undeploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve host
        run: |
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "HOST_IP=${{ vars.AGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}" >> "$GITHUB_ENV"
          else
            echo "HOST_IP=${{ vars.DGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}" >> "$GITHUB_ENV"
          fi

      - name: Set up SSH key
        run: |
          echo "${{ secrets.HOST_SSH_KEY }}" > /tmp/k_key
          chmod 600 /tmp/k_key
          ssh-keyscan -H "${HOST_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy kubeconfig from host
        run: |
          mkdir -p ~/.kube
          scp -i /tmp/k_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}:/home/${HOST_USER}/.kube/config" ~/.kube/config
          echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Destroy Kubeflow Pipelines
        env:
          PIPELINE_VERSION: ${{ inputs.pipeline_version || '2.16.1' }}
          DELETE_NS: ${{ inputs.delete_namespace && 'true' || 'false' }}
        run: bash dgx/minikube/kubeflow/destroy-kubeflow.sh

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/k_key

      - name: Clear KFP active state
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          var="${machine}_KFP_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="false" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="false" -f visibility="all"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Kubeflow Pipelines Undeployed"
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| Version | \`${{ inputs.pipeline_version || '2.16.1' }}\` |"
            echo "| Namespace deleted | \`${{ inputs.delete_namespace }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
