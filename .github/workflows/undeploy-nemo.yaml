name: NeMo Undeploy

# Removes the NeMo Microservices Helm release from the target k3s cluster
# and optionally deletes the nemo-microservices namespace.
#
# Does NOT stop the cluster or affect any other workloads.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
      delete_namespace:
        description: Delete nemo-microservices namespace after uninstall
        type: boolean
        default: true

jobs:
  undeploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve host
        run: |
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "HOST_IP=${{ vars.AGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}" >> "$GITHUB_ENV"
          else
            echo "HOST_IP=${{ vars.DGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}" >> "$GITHUB_ENV"
          fi

      - name: Set up SSH key
        run: |
          echo "${{ secrets.HOST_SSH_KEY }}" > /tmp/k_key
          chmod 600 /tmp/k_key
          ssh-keyscan -H "${HOST_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy kubeconfig from host
        run: |
          mkdir -p ~/.kube
          scp -i /tmp/k_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}:/home/${HOST_USER}/.kube/config" ~/.kube/config
          echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Remove NIM deployments and CRDs
        run: |
          kubectl delete nimservice --all -n nemo-microservices --ignore-not-found || true
          kubectl delete nimcache   --all -n nemo-microservices --ignore-not-found || true
          kubectl delete configmap  -n nemo-microservices \
            -l app.nvidia.com/config-type=modelDeployment --ignore-not-found || true
          kubectl get crd -o name 2>/dev/null | grep nvidia.com \
            | xargs -r kubectl delete --ignore-not-found || true

      - name: Delete postgres PVCs
        run: |
          # Helm uninstall orphans PVCs; delete them explicitly so the next
          # NeMo deploy always initialises postgres fresh with the current secret.
          kubectl delete pvc -n nemo-microservices \
            -l app.kubernetes.io/name=postgresql --ignore-not-found || true
          kubectl delete pvc -n nemo-microservices \
            -l app.kubernetes.io/component=primary --ignore-not-found || true

      - name: Uninstall NeMo Helm release
        run: |
          if helm list -n nemo-microservices 2>/dev/null | grep -q nemo; then
            helm uninstall nemo -n nemo-microservices
          else
            echo "No 'nemo' release found in nemo-microservices — nothing to uninstall."
          fi

      - name: Delete namespace
        if: ${{ inputs.delete_namespace }}
        run: kubectl delete namespace nemo-microservices --ignore-not-found

      - name: Uninstall Volcano scheduler
        run: |
          kubectl delete -f \
            https://raw.githubusercontent.com/volcano-sh/volcano/v1.9.0/installer/volcano-development.yaml \
            --ignore-not-found || true
          kubectl delete namespace volcano-system --ignore-not-found || true

      - name: Clean up /etc/hosts
        run: |
          sudo sed -i '/nemo\.test/d'       /etc/hosts || true
          sudo sed -i '/nim\.test/d'        /etc/hosts || true
          sudo sed -i '/data-store\.test/d' /etc/hosts || true
          sudo sed -i '/# Added by NeMo setup script/d' /etc/hosts || true

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/k_key

      - name: Clear NeMo active state
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          var="${machine}_NEMO_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="false" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="false" -f visibility="all"

      - name: Summary
        if: always()
        run: |
          {
            echo "## NeMo Microservices Undeployed"
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| Namespace deleted | \`${{ inputs.delete_namespace }}\` |"
            echo "| Volcano removed | \`true\` |"
          } >> "$GITHUB_STEP_SUMMARY"
