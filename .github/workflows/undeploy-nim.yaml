name: NIM Undeploy

# Undeploys a NIM from the target k3s cluster via the NeMo Microservices deployment API.
# NeMo Microservices must be running. Safe to run if the NIM is already gone (404 → no-op).

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
      nim_name:
        description: "NIM model name (e.g. nvidia-nemotron-nano-9b-v2-dgx-spark)"
        required: false
        default: nvidia-nemotron-nano-9b-v2-dgx-spark
      nim_org:
        description: "NIM org / NGC namespace (e.g. nvidia, meta)"
        required: false
        default: nvidia

permissions:
  contents: read

jobs:
  undeploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 15
    steps:
      # 1-hour GitHub App token (replaces the org-admin PAT; Nov 2026 incident)
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          owner: miramar-labs-org
      - name: Export App token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GH_APP_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve state vars
        run: |
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "STATE_NIM_MODEL_VAR=CURRENT_NIM_MODEL_AGX"  >> "$GITHUB_ENV"
            echo "STATE_NIM_VRAM_VAR=CURRENT_NIM_VRAM_GB_AGX" >> "$GITHUB_ENV"
          else
            echo "STATE_NIM_MODEL_VAR=CURRENT_NIM_MODEL"       >> "$GITHUB_ENV"
            echo "STATE_NIM_VRAM_VAR=CURRENT_NIM_VRAM_GB"      >> "$GITHUB_ENV"
          fi

      - name: Set up kubeconfig
        run: |
          # k3s writes kubeconfig to ~/.kube/config at install time; no docker network
          # tricks needed — the API server is at 127.0.0.1:6443 and the runner uses
          # --network=host so it resolves directly.
          echo "KUBECONFIG=${HOME}/.kube/config" >> "${GITHUB_ENV}"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Set up /etc/hosts for NeMo endpoints
        run: |
          CLUSTER_IP=$(kubectl get node \
            -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          sudo sed -i '/nemo\.test/d' /etc/hosts || true
          sudo sed -i '/nim\.test/d'  /etc/hosts || true
          printf '%s nemo.test\n%s nim.test\n' "$CLUSTER_IP" "$CLUSTER_IP" \
            | sudo tee -a /etc/hosts >/dev/null
          echo "nemo.test → $CLUSTER_IP"

      - name: Undeploy NIM
        env:
          NIM_ORG: ${{ inputs.nim_org }}
          NIM_NAME: ${{ inputs.nim_name }}
        run: |
          # shellcheck source=dgx/k3s/nim/undeploy_nim.sh
          source dgx/k3s/nim/undeploy_nim.sh
          undeploy_nim "$NIM_ORG" "$NIM_NAME"

      - name: Update platform state
        if: success()
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          for var_val in "${STATE_NIM_MODEL_VAR}=none" "${STATE_NIM_VRAM_VAR}=0"; do
            var="${var_val%%=*}"; val="${var_val#*=}"
            GH_TOKEN="${GH_APP_TOKEN}" gh api \
              -X PATCH "repos/${GITHUB_REPOSITORY}/actions/variables/${var}" \
              -f value="${val}" 2>/dev/null || \
            GH_TOKEN="${GH_APP_TOKEN}" gh api \
              -X POST "repos/${GITHUB_REPOSITORY}/actions/variables" \
              -f name="${var}" -f value="${val}"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## NIM Undeploy"
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| NIM | \`${{ inputs.nim_org }}/${{ inputs.nim_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
