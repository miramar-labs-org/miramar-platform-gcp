name: Nsight Operator Undeploy

# Removes the NVIDIA Nsight Operator from the target k3s cluster.
# Stops the nsight-portfwd.service port-forward, optionally removes the
# kubeflow namespace injection label, and optionally deletes the namespace.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
      delete_namespace:
        description: Delete nsight-operator namespace after removal
        type: boolean
        default: true
        required: false
      unlabel_kubeflow_namespace:
        description: Remove nvidia-nsight-profile=enabled label from kubeflow namespace
        type: boolean
        default: true
        required: false
      restore_kubeflow_psa:
        description: "Restore the kubeflow namespace PodSecurity 'enforce' to baseline (the upstream KFP default). Set false only if you deliberately relaxed it by hand for another reason."
        type: boolean
        default: true
        required: false

permissions:
  contents: read

jobs:
  undeploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve host
        run: |
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "HOST_IP=${{ vars.AGX_HOST_IP }}"     >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}" >> "$GITHUB_ENV"
          else
            echo "HOST_IP=${{ vars.DGX_HOST_IP }}"     >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}" >> "$GITHUB_ENV"
          fi

      - name: Set up SSH key
        run: |
          echo "${{ secrets.HOST_SSH_KEY }}" > /tmp/k_key
          chmod 600 /tmp/k_key
          ssh-keyscan -H "${HOST_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy kubeconfig from host
        run: |
          mkdir -p ~/.kube
          scp -i /tmp/k_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}:/home/${HOST_USER}/.kube/config" ~/.kube/config
          echo "KUBECONFIG=${HOME}/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Stop port-forward service
        run: |
          ssh -i /tmp/k_key -o StrictHostKeyChecking=no \
            "${HOST_USER}@${HOST_IP}" \
            'systemctl --user disable --now nsight-portfwd.service 2>/dev/null || true'

      - name: Remove kubeflow namespace label
        if: ${{ inputs.unlabel_kubeflow_namespace }}
        run: kubectl label namespace kubeflow nvidia-nsight-profile- 2>/dev/null || true

      - name: Restore kubeflow PodSecurity enforcement
        if: ${{ inputs.restore_kubeflow_psa }}
        # Undo the deploy-time relax: put 'enforce' back to the upstream KFP
        # default of 'baseline'. Leaves 'warn'/'audit' untouched.
        run: |
          if kubectl get namespace kubeflow >/dev/null 2>&1; then
            kubectl label namespace kubeflow \
              pod-security.kubernetes.io/enforce=baseline --overwrite
          fi

      - name: Remove APE fixup webhook
        # The MutatingWebhookConfiguration is cluster-scoped, so it is NOT removed
        # by deleting the nsight-operator namespace. Delete it explicitly first so
        # no dangling webhook (failurePolicy: Ignore, but still) survives.
        run: |
          kubectl delete mutatingwebhookconfiguration nsight-ape-webhook --ignore-not-found
          kubectl delete clusterrolebinding nsight-ape-webhook --ignore-not-found
          kubectl delete clusterrole nsight-ape-webhook --ignore-not-found

      - name: Helm uninstall
        run: helm uninstall nsight-operator -n nsight-operator --wait || true

      - name: Delete namespace
        if: ${{ inputs.delete_namespace }}
        run: kubectl delete namespace nsight-operator --ignore-not-found

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/k_key

      - name: Clear Nsight Operator active state
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          var="${machine}_NSIGHT_OPERATOR_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="false" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="false" -f visibility="all"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Nsight Operator Undeployed"
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| Namespace deleted | \`${{ inputs.delete_namespace }}\` |"
            echo "| kubeflow label removed | \`${{ inputs.unlabel_kubeflow_namespace }}\` |"
            echo "| kubeflow PSA restored to baseline | \`${{ inputs.restore_kubeflow_psa }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
