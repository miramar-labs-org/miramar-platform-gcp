name: Ollama Undeploy

# Unloads the active Ollama model from GPU memory on the DGX Spark.
# Auto-detects the loaded model from ollama ps if model input is not specified.
# Safe to run if no model is loaded (no-op).

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model tag to unload (leave blank to auto-detect from ollama ps)"
        required: false
        default: ""
      delete_model:
        description: "Also delete the model from disk (ollama rm)"
        type: boolean
        required: false
        default: false

jobs:
  undeploy:
    runs-on: [self-hosted, dgx]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key for DGX host
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > ~/.ssh/dgx_host
          chmod 600 ~/.ssh/dgx_host
          ssh-keyscan -H "${{ vars.DGX_HOST }}" >> ~/.ssh/known_hosts

      - name: Unload model
        shell: bash
        run: |
          set -euo pipefail
          # printf '%q' ensures empty model arg isn't dropped by SSH arg concatenation
          model=$(printf '%q' "${{ inputs.model }}")
          ssh -i ~/.ssh/dgx_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST }}" \
            "bash -s -- ${model} ${{ inputs.delete_model }}" \
            < dgx/ollama/undeploy_ollama.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "## Ollama Undeploy"
            echo "| | |"
            echo "|---|---|"
            echo "| Model | \`${{ inputs.model || '(auto-detected)' }}\` |"
            echo "| Deleted from disk | \`${{ inputs.delete_model }}\` |"
            echo "| Host | \`${{ vars.DGX_HOST }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
