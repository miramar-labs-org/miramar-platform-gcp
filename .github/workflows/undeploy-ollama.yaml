name: Ollama Undeploy

# Unloads the active Ollama model from GPU memory on the target machine.
# Auto-detects the loaded model from ollama ps if model input is not specified.
# Safe to run if no model is loaded (no-op).

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
      model:
        description: "Ollama model tag to unload (leave blank to auto-detect from ollama ps)"
        required: false
        default: ""
      delete_model:
        description: "Also delete the model from disk (ollama rm)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  undeploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 15

    steps:
      # 1-hour GitHub App token (replaces the org-admin PAT; Nov 2026 incident)
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          owner: miramar-labs-org
      - name: Export App token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GH_APP_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve SSH target and state vars
        shell: bash
        run: |
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "HOST_IP=${{ vars.AGX_HOST_IP }}"               >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}"             >> "$GITHUB_ENV"
            echo "UNDEPLOY_SCRIPT=agx/ollama/undeploy_ollama.sh" >> "$GITHUB_ENV"
            echo "STATE_MODEL_VAR=CURRENT_OLLAMA_MODEL_AGX"      >> "$GITHUB_ENV"
            echo "STATE_VRAM_VAR=CURRENT_OLLAMA_VRAM_GB_AGX"     >> "$GITHUB_ENV"
          else
            echo "HOST_IP=${{ vars.DGX_HOST_IP }}"               >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}"             >> "$GITHUB_ENV"
            echo "UNDEPLOY_SCRIPT=dgx/ollama/undeploy_ollama.sh" >> "$GITHUB_ENV"
            echo "STATE_MODEL_VAR=CURRENT_OLLAMA_MODEL"           >> "$GITHUB_ENV"
            echo "STATE_VRAM_VAR=CURRENT_OLLAMA_VRAM_GB"          >> "$GITHUB_ENV"
          fi

      - name: Prepare SSH key
        shell: bash
        env:
          HOST_SSH_KEY: ${{ secrets.HOST_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          # Key lives only in ssh-agent memory: never written to disk, never
          # interpolated into the step script. Agent persists for later steps via GITHUB_ENV.
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$HOST_SSH_KEY" | ssh-add -q -t 21600 -
          { echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"; echo "SSH_AGENT_PID=$SSH_AGENT_PID"; } >> "$GITHUB_ENV"
          ssh-keyscan -H "$HOST_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Unload model
        shell: bash
        run: |
          set -euo pipefail
          # printf '%q' ensures empty model arg isn't dropped by SSH arg concatenation
          model=$(printf '%q' "${{ inputs.model }}")
          ssh \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "$HOST_USER@$HOST_IP" \
            "bash -s -- ${model} ${{ inputs.delete_model }}" \
            < "$UNDEPLOY_SCRIPT"

      - name: Update platform state
        if: success()
        shell: bash
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          for var_val in "${STATE_MODEL_VAR}=none" "${STATE_VRAM_VAR}=0"; do
            var="${var_val%%=*}"; val="${var_val#*=}"
            GH_TOKEN="${GH_APP_TOKEN}" gh api \
              -X PATCH "repos/${GITHUB_REPOSITORY}/actions/variables/${var}" \
              -f value="${val}" 2>/dev/null || \
            GH_TOKEN="${GH_APP_TOKEN}" gh api \
              -X POST "repos/${GITHUB_REPOSITORY}/actions/variables" \
              -f name="${var}" -f value="${val}"
          done
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          var="${machine}_OLLAMA_ACTIVE"
          GH_TOKEN="${GH_APP_TOKEN}" gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="false" -f visibility="all" \
          || GH_TOKEN="${GH_APP_TOKEN}" gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="false" -f visibility="all"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Ollama Undeploy"
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo "| Model | \`${{ inputs.model || '(auto-detected)' }}\` |"
            echo "| Deleted from disk | \`${{ inputs.delete_model }}\` |"
            echo "| Host | \`${HOST_IP}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k >/dev/null 2>&1 || true
