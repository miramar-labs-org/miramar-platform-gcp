name: Open WebUI Undeploy

# Removes the Open WebUI deployment from DGX K3s, AGX K3s, or GKE.
# Stops the openwebui-portfwd.service systemd unit on K3s hosts.
# Does NOT touch any _SERVING_ACTIVE or _OPENWEBUI_API_URL variables —
# those belong to serving project repos and are managed independently.

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Target host (dgx, agx, gke)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
          - gke

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}

jobs:
  undeploy-dgx:
    name: Undeploy Open WebUI (DGX)
    if: inputs.host == 'dgx'
    runs-on: [self-hosted, dgx]
    steps:
      # 1-hour GitHub App token (replaces the org-admin PAT; Nov 2026 incident)
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          owner: miramar-labs-org
      - name: Export App token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GH_APP_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up kubeconfig
        run: echo "KUBECONFIG=${HOME}/.kube/config" >> "${GITHUB_ENV}"

      - name: Set up SSH
        env:
          HOST_SSH_KEY: ${{ secrets.HOST_SSH_KEY }}
        run: |
          # Key lives only in ssh-agent memory: never written to disk, never
          # interpolated into the step script. Agent persists for later steps via GITHUB_ENV.
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$HOST_SSH_KEY" | ssh-add -q -
          { echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"; echo "SSH_AGENT_PID=$SSH_AGENT_PID"; } >> "$GITHUB_ENV"
          ssh-keyscan -H "${{ vars.DGX_HOST_IP }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Stop port-forward service
        run: |
          ssh -o StrictHostKeyChecking=no \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST_IP }}" \
            'systemctl --user disable --now openwebui-portfwd.service 2>/dev/null || true'

      - name: Delete deployment and service
        run: |
          kubectl delete deployment openwebui -n openwebui --ignore-not-found
          kubectl delete service openwebui -n openwebui --ignore-not-found

      - name: Clear Open WebUI active state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/DGX_OPENWEBUI_ACTIVE" \
            -f name="DGX_OPENWEBUI_ACTIVE" -f value="false" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="DGX_OPENWEBUI_ACTIVE" -f value="false" -f visibility="all"

      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k >/dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          {
            echo "## Open WebUI Undeployed (DGX)"
            echo "openwebui-portfwd.service stopped and disabled."
            echo "Deployment and service removed from namespace \`openwebui\`."
          } >> "$GITHUB_STEP_SUMMARY"

  undeploy-agx:
    name: Undeploy Open WebUI (AGX)
    if: inputs.host == 'agx'
    runs-on: [self-hosted, agx]
    steps:
      # 1-hour GitHub App token (replaces the org-admin PAT; Nov 2026 incident)
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          owner: miramar-labs-org
      - name: Export App token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GH_APP_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up kubeconfig
        run: echo "KUBECONFIG=${HOME}/.kube/config" >> "${GITHUB_ENV}"

      - name: Set up SSH
        env:
          HOST_SSH_KEY: ${{ secrets.HOST_SSH_KEY }}
        run: |
          # Key lives only in ssh-agent memory: never written to disk, never
          # interpolated into the step script. Agent persists for later steps via GITHUB_ENV.
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$HOST_SSH_KEY" | ssh-add -q -
          { echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"; echo "SSH_AGENT_PID=$SSH_AGENT_PID"; } >> "$GITHUB_ENV"
          ssh-keyscan -H "${{ vars.AGX_HOST_IP }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Stop port-forward service
        run: |
          ssh -o StrictHostKeyChecking=no \
            "${{ vars.AGX_HOST_USER }}@${{ vars.AGX_HOST_IP }}" \
            'systemctl --user disable --now openwebui-portfwd.service 2>/dev/null || true'

      - name: Delete deployment and service
        run: |
          kubectl delete deployment openwebui -n openwebui --ignore-not-found
          kubectl delete service openwebui -n openwebui --ignore-not-found

      - name: Clear Open WebUI active state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/AGX_OPENWEBUI_ACTIVE" \
            -f name="AGX_OPENWEBUI_ACTIVE" -f value="false" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="AGX_OPENWEBUI_ACTIVE" -f value="false" -f visibility="all"

      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k >/dev/null 2>&1 || true

      - name: Summary
        if: always()
        run: |
          {
            echo "## Open WebUI Undeployed (AGX)"
            echo "openwebui-portfwd.service stopped and disabled."
            echo "Deployment and service removed from namespace \`openwebui\`."
          } >> "$GITHUB_STEP_SUMMARY"

  undeploy-gke:
    name: Undeploy Open WebUI (GKE)
    if: inputs.host == 'gke'
    runs-on: ubuntu-latest
    steps:
      # 1-hour GitHub App token (replaces the org-admin PAT; Nov 2026 incident)
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          owner: miramar-labs-org
      - name: Export App token
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GH_APP_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c # v2.3.5
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Delete deployment and service
        run: |
          kubectl delete deployment openwebui -n openwebui --ignore-not-found
          kubectl delete service openwebui -n openwebui --ignore-not-found

      - name: Clear Open WebUI active state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/GKE_OPENWEBUI_ACTIVE" \
            -f name="GKE_OPENWEBUI_ACTIVE" -f value="false" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="GKE_OPENWEBUI_ACTIVE" -f value="false" -f visibility="all"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Open WebUI Undeployed (GKE)"
            echo "Deployment and service removed from namespace \`openwebui\`."
          } >> "$GITHUB_STEP_SUMMARY"
