name: K3s Uninstall

# Completely removes k3s from the target machine: stops the service, removes
# all state and binaries via k3s-uninstall.sh, and clears the kubeconfig.
# Run this before a clean reinstall via the K3s Install workflow.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx

jobs:
  uninstall:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Uninstall k3s
        run: |
          if [[ -x /usr/local/bin/k3s-uninstall.sh ]]; then
            /usr/local/bin/k3s-uninstall.sh
            echo "==> k3s uninstalled."
          else
            echo "==> k3s-uninstall.sh not found — already uninstalled."
          fi
          rm -f "${HOME}/.kube/config"
          echo "==> kubeconfig removed."

      - name: Clear k3s active state
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          var="${machine}_K3S_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="false" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="false" -f visibility="all"
