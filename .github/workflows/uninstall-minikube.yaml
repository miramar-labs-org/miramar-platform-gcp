name: Minikube Uninstall

# Stops the cluster, deletes all minikube state and cache (purge), and
# removes the minikube binary from the host.
# Run this before a clean reinstall via the Minikube Install workflow.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx

jobs:
  uninstall:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install minikube binary
        run: bash scripts/ubuntu/install-minikube.sh

      - name: Delete cluster and purge state
        run: |
          minikube delete --all --purge 2>/dev/null || true
          # --purge removes ~/.minikube entirely, which breaks the bind mount
          # in any running runner container. Recreate the directory immediately
          # so the mount target exists for subsequent workflow runs.
          mkdir -p "${HOME}/.minikube"
          echo "==> Cluster deleted and state purged."

      - name: Remove minikube binary from host
        run: |
          if [[ -f /host-bin/minikube ]]; then
            sudo rm -f /host-bin/minikube
            echo "==> Removed minikube from host (/usr/local/bin/minikube)."
          else
            echo "==> minikube not on host, skipping."
          fi

      - name: Clear minikube active state
        run: |
          export GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}"
          machine=$(echo "${{ inputs.runner }}" | tr '[:lower:]' '[:upper:]')
          var="${machine}_MINIKUBE_ACTIVE"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/${var}" \
            -f name="${var}" -f value="false" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="${var}" -f value="false" -f visibility="all"
