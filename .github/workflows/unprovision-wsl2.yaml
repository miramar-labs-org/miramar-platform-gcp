name: WSL2 Unprovision

# Unregisters a WSL2 distro on the Windows laptop (removes it from WSL; does not delete C:\wsl\<name> files).
# Also removes the wsl2-<name> Host block from the shared SSH config on DGX.
# Secrets required: WSL2_HOST, WSL2_HOST_USER, WSL2_HOST_SSH_KEY, DGX_HOST_SSH_KEY
# Vars required:    DGX_HOST_IP, DGX_HOST_USER

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "Name of the WSL2 distro to unregister"
        required: true
        default: dev
      delete_files:
        description: "Delete the distro folder at C:\\wsl\\<name> after unregistering"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      runner:
        description: "Runner to SSH from"
        required: false
        default: dgx
        type: choice
        options:
          - dgx
          - agx
          - wsl2

jobs:
  unprovision:
    runs-on: ${{ inputs.runner || 'dgx' }}
    timeout-minutes: 10
    steps:
      - name: Set up SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.WSL2_HOST_SSH_KEY }}" > /tmp/wsl2_host
          chmod 600 /tmp/wsl2_host
          ssh-keyscan -H "${{ secrets.WSL2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: List existing WSL distros
        shell: bash
        run: |
          ssh -i /tmp/wsl2_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}" \
            "wsl.exe --list --verbose" || true

      - name: Unregister WSL2 distro
        shell: bash
        run: |
          ssh -i /tmp/wsl2_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}" \
            "wsl.exe --unregister ${{ inputs.distro_name || 'test' }}"

      - name: Delete distro folder
        if: ${{ inputs.delete_files == 'true' }}
        shell: bash
        run: |
          ssh -i /tmp/wsl2_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}" \
            "if exist \"C:\\wsl\\${{ inputs.distro_name }}\" rd /s /q \"C:\\wsl\\${{ inputs.distro_name }}\"" || true

      - name: Remove from shared SSH config
        if: always()
        env:
          DGX_HOST: ${{ vars.DGX_HOST_IP }}
          DGX_HOST_USER: ${{ vars.DGX_HOST_USER }}
          DISTRO: ${{ inputs.distro_name }}
          # Stored in env so the script stays inside the YAML block scalar —
          # a bare heredoc (<<'PYEOF') at column 0 would terminate run: |.
          PYCODE: |
            import re, sys, os
            distro = sys.argv[1]
            path = os.path.expanduser('~/shared/ssh/config')
            try:
                with open(path) as f:
                    text = f.read()
            except FileNotFoundError:
                print(f'Shared SSH config not found at {path} — nothing to remove')
                sys.exit(0)
            new = re.sub(r'\nHost wsl2-' + re.escape(distro) + r'\n(?:[ \t][^\n]*\n?)*', '\n', text)
            with open(path, 'w') as f:
                f.write(new)
            if new != text:
                print(f'Removed wsl2-{distro} block from shared SSH config')
            else:
                print(f'wsl2-{distro} block not found in shared SSH config (already clean)')
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > /tmp/dgx_priv
          chmod 600 /tmp/dgx_priv
          printf '%s' "$PYCODE" | ssh -i /tmp/dgx_priv \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$DGX_HOST_USER@$DGX_HOST" \
            "python3 - $DISTRO"
          rm -f /tmp/dgx_priv

      - name: List WSL distros after unprovision
        if: always()
        shell: bash
        run: |
          ssh -i /tmp/wsl2_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}" \
            "wsl.exe --list --verbose" || true

      - name: Deregister from WSL2_DISTROS
        if: always()
        run: |
          DISTRO='${{ inputs.distro_name }}'
          REPO='${{ github.repository }}'
          export GH_TOKEN="$GITHUB_ORG_ADMIN_PAT"
          CURRENT=$(gh api "repos/$REPO/actions/variables/WSL2_DISTROS" --jq '.value' 2>/dev/null || echo "")
          [[ "$CURRENT" == "NONE" ]] && CURRENT=""
          NEW=$(echo "$CURRENT" | tr ' ' '\n' | grep -vxF "$DISTRO" | tr '\n' ' ' | xargs)
          [[ -z "$NEW" ]] && NEW="NONE"
          gh variable set WSL2_DISTROS --body "$NEW" --repo "$REPO"
          echo "WSL2_DISTROS: $NEW"

      - name: Summary
        if: always()
        run: |
          {
            echo "## WSL2 Unprovision"
            echo "| | |"
            echo "|---|---|"
            echo "| Distro | \`${{ inputs.distro_name }}\` |"
            echo "| Files deleted | \`${{ inputs.delete_files }}\` |"
            echo "| Host | \`${{ secrets.WSL2_HOST }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
