name: Ollama Update

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Target machine (dgx = DGX Spark, agx = AGX Orin, wsl2 = SSH to DGX from laptop)"
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - agx
          - wsl2

jobs:
  update:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Resolve SSH target
        shell: bash
        run: |
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            echo "HOST_IP=${{ vars.AGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.AGX_HOST_USER }}" >> "$GITHUB_ENV"
          else
            echo "HOST_IP=${{ vars.DGX_HOST_IP }}"   >> "$GITHUB_ENV"
            echo "HOST_USER=${{ vars.DGX_HOST_USER }}" >> "$GITHUB_ENV"
          fi

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          if [[ "${{ inputs.runner }}" == "agx" ]]; then
            printf '%s\n' "${{ secrets.AGX_HOST_SSH_KEY }}" > /tmp/host_key
          else
            printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > /tmp/host_key
          fi
          chmod 600 /tmp/host_key
          ssh-keyscan -H "$HOST_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Install / upgrade Ollama on host
        shell: bash
        run: |
          set -euo pipefail
          ssh -i /tmp/host_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "$HOST_USER@$HOST_IP" \
            'sudo bash -s' < scripts/ubuntu/install-ollama.sh

      - name: Update platform state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          OLLAMA_VERSION=$(ssh -i /tmp/host_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "$HOST_USER@$HOST_IP" \
            'ollama --version 2>/dev/null | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1 || echo "unknown"')
          echo "Ollama version: ${OLLAMA_VERSION}"
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X PATCH "repos/${GITHUB_REPOSITORY}/actions/variables/OLLAMA_VERSION" \
            -f value="${OLLAMA_VERSION}" 2>/dev/null || \
          GH_TOKEN="${GITHUB_ORG_ADMIN_PAT}" gh api \
            -X POST "repos/${GITHUB_REPOSITORY}/actions/variables" \
            -f name="OLLAMA_VERSION" -f value="${OLLAMA_VERSION}"
