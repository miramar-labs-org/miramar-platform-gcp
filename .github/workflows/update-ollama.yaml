name: Ollama Update

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner host that can SSH to the DGX
        type: choice
        required: true
        default: dgx
        options:
          - dgx
          - wsl2

jobs:
  update:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key for DGX host
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "${{ secrets.DGX_HOST_SSH_KEY }}" > ~/.ssh/dgx_host
          chmod 600 ~/.ssh/dgx_host

          ssh-keyscan -H "${{ vars.DGX_HOST }}" >> ~/.ssh/known_hosts

      - name: Install / upgrade Ollama on DGX host
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/dgx_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ vars.DGX_HOST_USER }}@${{ vars.DGX_HOST }}" \
            'sudo bash -s' < scripts/ubuntu/install-ollama.sh
