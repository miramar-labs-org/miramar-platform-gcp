name: WSL2 Verify SSH Topology

# Validates passwordless SSH from every lab host to every other lab host.
# For each machine, SSH in and try to reach all peers (excluding self):
#
#   DGX  → ssh orin hostname
#   DGX  → ssh wsl2-<name> hostname
#   Orin → ssh spark hostname
#   Orin → ssh wsl2-<name> hostname
#   WSL2 → ssh spark hostname   (nested via wsl2-<name> alias)
#   WSL2 → ssh orin hostname    (nested via wsl2-<name> alias)
#
# All SSH calls use BatchMode=yes — any password prompt is a hard failure.
# No secrets needed: all machines share Spark's SSH identity via ~/shared/ssh/.

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "WSL2 distro name"
        required: true
        default: dev
      ssh_port:
        description: "sshd port for this distro (2222 for first instance)"
        required: false
        default: "2222"
  workflow_call:
    inputs:
      distro_name:
        required: true
        type: string
      ssh_port:
        required: false
        type: string
        default: "2222"

jobs:

  # -----------------------------------------------------------------------
  # DGX → all others (orin, wsl2-<name>)
  # -----------------------------------------------------------------------

  verify-dgx:
    runs-on: dgx
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: DGX → orin
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            orin hostname)
          echo "DGX → orin: $HOSTNAME"
          echo "PASS"

      - name: DGX → wsl2-${{ inputs.distro_name }}
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "wsl2-${DISTRO_NAME}" hostname)
          echo "DGX → wsl2-${DISTRO_NAME}: $HOSTNAME"
          [[ "$HOSTNAME" == "$DISTRO_NAME" ]] && echo "PASS: hostname matches" \
            || echo "WARN: expected '$DISTRO_NAME', got '$HOSTNAME'"

      - id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Orin → all others (spark/dgx, wsl2-<name>)
  # -----------------------------------------------------------------------

  verify-agx:
    runs-on: agx
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: Orin → spark
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            spark hostname)
          echo "Orin → spark: $HOSTNAME"
          echo "PASS"

      - name: Orin → wsl2-${{ inputs.distro_name }}
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "wsl2-${DISTRO_NAME}" hostname)
          echo "Orin → wsl2-${DISTRO_NAME}: $HOSTNAME"
          [[ "$HOSTNAME" == "$DISTRO_NAME" ]] && echo "PASS: hostname matches" \
            || echo "WARN: expected '$DISTRO_NAME', got '$HOSTNAME'"

      - id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # WSL2 → all others (spark/dgx, orin)
  # Runs on DGX; uses wsl2-<name> alias to SSH into the distro, then
  # issues nested SSH outbound to each peer.
  # -----------------------------------------------------------------------

  verify-wsl2:
    needs: [verify-dgx]
    runs-on: dgx
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: WSL2 → spark
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "wsl2-${DISTRO_NAME}" \
            "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 spark hostname")
          echo "WSL2 → spark: $HOSTNAME"
          echo "PASS"

      - name: WSL2 → orin
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "wsl2-${DISTRO_NAME}" \
            "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 orin hostname")
          echo "WSL2 → orin: $HOSTNAME"
          echo "PASS"

      - id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Summary
  # -----------------------------------------------------------------------

  summary:
    needs: [verify-dgx, verify-agx, verify-wsl2]
    if: always()
    runs-on: dgx
    steps:
      - name: Summary
        run: |
          dgx="${{ needs.verify-dgx.result }}"
          agx="${{ needs.verify-agx.result }}"
          wsl="${{ needs.verify-wsl2.result }}"

          pass() { [[ "$1" == "success" ]] && echo "✅" || echo "❌ ($1)"; }

          {
            echo "## WSL2 SSH Topology Verification"
            echo "| | |"
            echo "|---|---|"
            echo "| Distro | \`${{ inputs.distro_name }}\` |"
            echo "| SSH alias | \`wsl2-${{ inputs.distro_name }}\` |"
            echo "| Port | \`${{ inputs.ssh_port }}\` |"
            echo ""
            echo "### Results"
            echo "| Path | Result |"
            echo "|---|---|"
            echo "| DGX → \`ssh orin hostname\` | $(pass $dgx) |"
            echo "| DGX → \`ssh wsl2-${{ inputs.distro_name }} hostname\` | $(pass $dgx) |"
            echo "| Orin → \`ssh spark hostname\` | $(pass $agx) |"
            echo "| Orin → \`ssh wsl2-${{ inputs.distro_name }} hostname\` | $(pass $agx) |"
            echo "| WSL2 → \`ssh spark hostname\` | $(pass $wsl) |"
            echo "| WSL2 → \`ssh orin hostname\` | $(pass $wsl) |"
          } >> "$GITHUB_STEP_SUMMARY"
