name: WSL2 Verify SSH Topology

# Validates bi-directional passwordless SSH between Spark, Orin, and a WSL2 distro:
#
#   DGX  → ssh wsl2-<distro> hostname
#   Orin → ssh wsl2-<distro> hostname
#   WSL2 → ssh spark hostname   (nested via wsl2-<distro> alias)
#   WSL2 → ssh orin hostname    (nested via wsl2-<distro> alias)
#
# All SSH calls use BatchMode=yes — any password prompt is a hard failure.
# No secrets needed: all machines share Spark's SSH identity via ~/shared/ssh/.

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "WSL2 distro name"
        required: true
        default: dev
      ssh_port:
        description: "sshd port for this distro (2222 for first instance)"
        required: false
        default: "2222"
  workflow_call:
    inputs:
      distro_name:
        required: true
        type: string
      ssh_port:
        required: false
        type: string
        default: "2222"

jobs:

  # -----------------------------------------------------------------------
  # DGX → WSL2
  # -----------------------------------------------------------------------

  verify-dgx:
    runs-on: dgx
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: Check wsl2-<distro> host block in DGX ~/.ssh/config
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          if ! grep -q "^Host wsl2-${DISTRO_NAME}" ~/.ssh/config 2>/dev/null; then
            echo "FAIL: 'Host wsl2-${DISTRO_NAME}' block missing from DGX ~/.ssh/config"
            exit 1
          fi
          echo "PASS: wsl2-${DISTRO_NAME} host block present"

      - name: SSH from DGX to WSL2
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "wsl2-${DISTRO_NAME}" hostname)
          echo "DGX -> wsl2-${DISTRO_NAME}: $HOSTNAME"
          [[ "$HOSTNAME" == "$DISTRO_NAME" ]] && echo "PASS: hostname matches" \
            || echo "WARN: expected '$DISTRO_NAME', got '$HOSTNAME'"

      - id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Orin → WSL2
  # -----------------------------------------------------------------------

  verify-agx:
    runs-on: agx
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: Check wsl2-<distro> host block in Orin ~/.ssh/config
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          if ! grep -q "^Host wsl2-${DISTRO_NAME}" ~/.ssh/config 2>/dev/null; then
            echo "FAIL: 'Host wsl2-${DISTRO_NAME}' block missing from Orin ~/.ssh/config"
            exit 1
          fi
          echo "PASS: wsl2-${DISTRO_NAME} host block present"

      - name: SSH from Orin to WSL2
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "wsl2-${DISTRO_NAME}" hostname)
          echo "Orin -> wsl2-${DISTRO_NAME}: $HOSTNAME"
          [[ "$HOSTNAME" == "$DISTRO_NAME" ]] && echo "PASS: hostname matches" \
            || echo "WARN: expected '$DISTRO_NAME', got '$HOSTNAME'"

      - id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # WSL2 → DGX and WSL2 → Orin
  # Uses the wsl2-<name> SSH alias (already in DGX ~/.ssh/config after provisioning)
  # to SSH into the distro, then issues nested SSH commands outbound.
  # -----------------------------------------------------------------------

  verify-wsl2:
    needs: [verify-dgx]
    runs-on: dgx
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: SSH from WSL2 to DGX (spark)
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "wsl2-${DISTRO_NAME}" \
            "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 spark hostname")
          echo "WSL2 -> spark: $HOSTNAME"
          echo "PASS"

      - name: SSH from WSL2 to Orin
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "wsl2-${DISTRO_NAME}" \
            "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 orin hostname")
          echo "WSL2 -> orin: $HOSTNAME"
          echo "PASS"

      - id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Summary
  # -----------------------------------------------------------------------

  summary:
    needs: [verify-dgx, verify-agx, verify-wsl2]
    if: always()
    runs-on: dgx
    steps:
      - name: Summary
        run: |
          dgx="${{ needs.verify-dgx.result }}"
          agx="${{ needs.verify-agx.result }}"
          wsl="${{ needs.verify-wsl2.result }}"

          pass() { [[ "$1" == "success" ]] && echo "✅" || echo "❌ ($1)"; }

          {
            echo "## WSL2 SSH Topology Verification"
            echo "| | |"
            echo "|---|---|"
            echo "| Distro | \`${{ inputs.distro_name }}\` |"
            echo "| SSH alias | \`wsl2-${{ inputs.distro_name }}\` |"
            echo "| Port | \`${{ inputs.ssh_port }}\` |"
            echo ""
            echo "### Results"
            echo "| Path | Result |"
            echo "|---|---|"
            echo "| DGX → \`ssh wsl2-${{ inputs.distro_name }} hostname\` | $(pass $dgx) |"
            echo "| Orin → \`ssh wsl2-${{ inputs.distro_name }} hostname\` | $(pass $agx) |"
            echo "| WSL2 → \`ssh spark hostname\` | $(pass $wsl) |"
            echo "| WSL2 → \`ssh orin hostname\` | $(pass $wsl) |"
          } >> "$GITHUB_STEP_SUMMARY"
