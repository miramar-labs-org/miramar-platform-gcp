name: WSL2 Verify SSH Topology

# Validates the full SSH mesh described in docs/ssh-runbook.md:
#
#   DGX  → ssh wsl2-<distro> hostname
#   Orin → ssh wsl2-<distro> hostname
#   MSI  → ssh wsl2-<distro> hostname   (via Windows OpenSSH → WSL2)
#   WSL2 → ssh spark hostname
#   WSL2 → ssh orin hostname
#   WSL2 → ssh msi hostname
#
# Each job also checks that the expected Host blocks exist in ~/.ssh/config
# and that authorized_keys contains the expected peer keys.
#
# All SSH calls use BatchMode=yes so any password prompt is a hard failure.

on:
  workflow_dispatch:
    inputs:
      distro_name:
        description: "WSL2 distro name (used to verify hostname)"
        required: true
        default: dev
      ssh_port:
        description: "sshd port for this distro (2222 for first instance)"
        required: false
        default: "2222"
      runner:
        description: "Runner for Windows SSH steps"
        required: false
        default: dgx
        type: choice
        options:
          - dgx
          - agx

jobs:

  # -----------------------------------------------------------------------
  # DGX: config check + ssh to wsl2-<distro>
  # -----------------------------------------------------------------------

  verify-dgx:
    runs-on: dgx
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: Check wsl2-<distro> host block in ~/.ssh/config
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          if ! grep -q "^Host wsl2-${DISTRO_NAME}" ~/.ssh/config 2>/dev/null; then
            echo "FAIL: 'Host wsl2-${DISTRO_NAME}' block missing from DGX ~/.ssh/config"
            exit 1
          fi
          echo "PASS: wsl2-${DISTRO_NAME} host block present in DGX ~/.ssh/config"

      - name: SSH from DGX to WSL2
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "wsl2-${DISTRO_NAME}" hostname)
          echo "DGX → wsl2-${DISTRO_NAME} hostname: $HOSTNAME"
          if [[ "$HOSTNAME" != "$DISTRO_NAME" ]]; then
            echo "WARN: expected hostname '$DISTRO_NAME', got '$HOSTNAME'"
          else
            echo "PASS: hostname matches"
          fi

      - id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Orin: config check + ssh to wsl2-<distro>
  # -----------------------------------------------------------------------

  verify-agx:
    runs-on: agx
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: Check wsl2-<distro> host block in ~/.ssh/config
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          if ! grep -q "^Host wsl2-${DISTRO_NAME}" ~/.ssh/config 2>/dev/null; then
            echo "FAIL: 'Host wsl2-${DISTRO_NAME}' block missing from Orin ~/.ssh/config"
            exit 1
          fi
          echo "PASS: wsl2-${DISTRO_NAME} host block present in Orin ~/.ssh/config"

      - name: SSH from Orin to WSL2
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "wsl2-${DISTRO_NAME}" hostname)
          echo "Orin → wsl2-${DISTRO_NAME} hostname: $HOSTNAME"
          if [[ "$HOSTNAME" != "$DISTRO_NAME" ]]; then
            echo "WARN: expected hostname '$DISTRO_NAME', got '$HOSTNAME'"
          else
            echo "PASS: hostname matches"
          fi

      - id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Windows: config check + ssh to wsl2-<distro>
  # -----------------------------------------------------------------------

  verify-windows:
    runs-on: ${{ inputs.runner }}
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: Set up SSH key for Windows host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.WSL2_HOST_SSH_KEY }}" > ~/.ssh/wsl2_host
          chmod 600 ~/.ssh/wsl2_host
          ssh-keyscan -H "${{ secrets.WSL2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Check wsl2-<distro> host block in Windows SSH config
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          RESULT=$(ssh -i ~/.ssh/wsl2_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}" \
            "powershell -Command \"if (Select-String -Path (Join-Path \$env:USERPROFILE '.ssh\\config') -Pattern 'Host wsl2-${DISTRO_NAME}' -Quiet -ErrorAction SilentlyContinue) { 'PASS' } else { 'FAIL' }\"")
          echo "Windows SSH config wsl2-${DISTRO_NAME} block: $RESULT"
          [[ "$RESULT" == "PASS" ]] || exit 1

      - name: SSH from Windows to WSL2
        env:
          DISTRO_NAME: ${{ inputs.distro_name }}
        run: |
          HOSTNAME=$(ssh -i ~/.ssh/wsl2_host \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}" \
            "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 wsl2-${DISTRO_NAME} hostname")
          echo "Windows → wsl2-${DISTRO_NAME} hostname: $HOSTNAME"
          if [[ "$HOSTNAME" != "$DISTRO_NAME" ]]; then
            echo "WARN: expected hostname '$DISTRO_NAME', got '$HOSTNAME'"
          else
            echo "PASS: hostname matches"
          fi

      - id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # WSL2: config check + ssh to spark, orin, msi
  # Runs on the DGX/AGX runner, which tunnels into WSL2 over the distro port
  # -----------------------------------------------------------------------

  verify-wsl2:
    needs: [verify-dgx]   # dgx must reach wsl2 first so we know sshd is up
    runs-on: ${{ inputs.runner }}
    outputs:
      result: ${{ steps.report.outputs.result }}
    steps:
      - name: Set up SSH known hosts for WSL2
        run: |
          install -m 700 -d ~/.ssh
          # Use the runner's own key — it was injected into WSL2 by post-provision.
          # WSL2 shares the Windows host's IP (mirrored networking), so WSL2_HOST:<port> reaches sshd.
          ssh-keyscan -p "${{ inputs.ssh_port }}" -H "${{ secrets.WSL2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Check SSH config inside WSL2
        run: |
          for host in spark orin msi github.com; do
            PRESENT=$(ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              -p "${{ inputs.ssh_port }}" "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}" \
              "grep -q \"^Host.*\\b${host}\\b\" ~/.ssh/config && echo PASS || echo MISSING")
            echo "WSL2 ~/.ssh/config 'Host $host': $PRESENT"
            [[ "$PRESENT" == "PASS" ]] || echo "WARN: Host $host block missing in WSL2 SSH config"
          done

      - name: SSH from WSL2 to DGX (spark)
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -p "${{ inputs.ssh_port }}" "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}" \
            "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 spark hostname")
          echo "WSL2 → spark hostname: $HOSTNAME"
          echo "PASS"

      - name: SSH from WSL2 to Orin
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -p "${{ inputs.ssh_port }}" "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}" \
            "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 orin hostname")
          echo "WSL2 → orin hostname: $HOSTNAME"
          echo "PASS"

      - name: SSH from WSL2 to MSI Windows
        run: |
          HOSTNAME=$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -p "${{ inputs.ssh_port }}" "${{ secrets.WSL2_HOST_USER }}@${{ secrets.WSL2_HOST }}" \
            "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 msi hostname")
          echo "WSL2 → msi hostname: $HOSTNAME"
          echo "PASS"

      - id: report
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Summary
  # -----------------------------------------------------------------------

  summary:
    needs: [verify-dgx, verify-agx, verify-windows, verify-wsl2]
    if: always()
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Summary
        run: |
          dgx="${{ needs.verify-dgx.result }}"
          agx="${{ needs.verify-agx.result }}"
          win="${{ needs.verify-windows.result }}"
          wsl="${{ needs.verify-wsl2.result }}"

          pass() { [[ "$1" == "success" ]] && echo "✅" || echo "❌ ($1)"; }

          {
            echo "## WSL2 SSH Topology Verification"
            echo "| | |"
            echo "|---|---|"
            echo "| Distro | \`${{ inputs.distro_name }}\` |"
            echo "| SSH alias | \`wsl2-${{ inputs.distro_name }}\` |"
            echo "| Port | \`${{ inputs.ssh_port }}\` |"
            echo "| Host | \`${{ secrets.WSL2_HOST }}\` |"
            echo ""
            echo "### Results"
            echo "| Path | Result |"
            echo "|---|---|"
            echo "| DGX → \`ssh wsl2-${{ inputs.distro_name }} hostname\` | $(pass $dgx) |"
            echo "| Orin → \`ssh wsl2-${{ inputs.distro_name }} hostname\` | $(pass $agx) |"
            echo "| Windows → \`ssh wsl2-${{ inputs.distro_name }} hostname\` | $(pass $win) |"
            echo "| WSL2 → \`ssh spark/orin/msi hostname\` | $(pass $wsl) |"
          } >> "$GITHUB_STEP_SUMMARY"
