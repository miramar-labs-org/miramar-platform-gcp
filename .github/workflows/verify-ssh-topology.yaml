name: WSL2 Verify SSH Topology

# Validates passwordless bi-directional SSH between all lab nodes:
#   spark  ↔ orin                        (core pair)
#   spark  ↔ wsl2-<name>                 (all active distros)
#   orin   ↔ wsl2-<name>                 (all active distros)
#   wsl2-<A> ↔ wsl2-<B>                  (all ordered pairs of active distros)
#
# Active distros are read from the WSL2_DISTROS repo variable (space-separated,
# or the sentinel value 'NONE' when no distros are provisioned).
#
# WSL2 outbound paths use nested SSH through the DGX runner — the runner SSHes
# into the distro, which then SSHes onward to the target.
#
# All SSH calls use BatchMode=yes — any password prompt is a hard failure.

on:
  workflow_dispatch:
  workflow_call:

jobs:

  # ── From spark ──────────────────────────────────────────────────────────
  # spark → orin
  # spark → wsl2-<name>   (all distros)

  dgx-tests:
    runs-on: dgx
    outputs:
      results: ${{ steps.run.outputs.results }}
    steps:
      - id: run
        shell: bash
        env:
          DISTROS: ${{ vars.WSL2_DISTROS }}
        run: |
          SSH="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          declare -A R
          any_fail=false

          # spark → orin
          if out=$($SSH orin hostname 2>&1); then
            echo "spark → orin: $out"
            R[spark__orin]=pass
          else
            echo "FAIL: spark → orin: $out"
            R[spark__orin]=fail
            any_fail=true
          fi

          if [[ "$DISTROS" != "NONE" && -n "$DISTROS" ]]; then
            for d in $DISTROS; do
              # spark → wsl2-<d>
              if out=$($SSH "wsl2-$d" hostname 2>&1); then
                echo "spark → wsl2-$d: $out"
                R["spark__wsl2-$d"]=pass
              else
                echo "FAIL: spark → wsl2-$d: $out"
                R["spark__wsl2-$d"]=fail
                any_fail=true
              fi
            done
          fi

          # Serialize results to JSON
          json='{'
          sep=""
          for k in "${!R[@]}"; do
            json+="${sep}$(printf '"%s":"%s"' "$k" "${R[$k]}")"
            sep=','
          done
          json+='}'
          echo "results=$json" >> "$GITHUB_OUTPUT"
          [[ "$any_fail" == "true" ]] && exit 1

  # ── From orin ────────────────────────────────────────────────────────────
  # orin → spark
  # orin → wsl2-<name>    (all distros)
  # Runs in parallel with dgx-tests (different runner).

  agx-tests:
    runs-on: agx
    outputs:
      results: ${{ steps.run.outputs.results }}
    steps:
      - id: run
        shell: bash
        env:
          DISTROS: ${{ vars.WSL2_DISTROS }}
        run: |
          SSH="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          declare -A R
          any_fail=false

          # orin → spark
          if out=$($SSH spark hostname 2>&1); then
            echo "orin → spark: $out"
            R[orin__spark]=pass
          else
            echo "FAIL: orin → spark: $out"
            R[orin__spark]=fail
            any_fail=true
          fi

          if [[ "$DISTROS" != "NONE" && -n "$DISTROS" ]]; then
            for d in $DISTROS; do
              # orin → wsl2-<d>
              if out=$($SSH "wsl2-$d" hostname 2>&1); then
                echo "orin → wsl2-$d: $out"
                R["orin__wsl2-$d"]=pass
              else
                echo "FAIL: orin → wsl2-$d: $out"
                R["orin__wsl2-$d"]=fail
                any_fail=true
              fi
            done
          fi

          json='{'
          sep=""
          for k in "${!R[@]}"; do
            json+="${sep}$(printf '"%s":"%s"' "$k" "${R[$k]}")"
            sep=','
          done
          json+='}'
          echo "results=$json" >> "$GITHUB_OUTPUT"
          [[ "$any_fail" == "true" ]] && exit 1

  # ── From each WSL2 distro ────────────────────────────────────────────────
  # wsl2-<name> → spark       (all distros, nested SSH)
  # wsl2-<name> → orin        (all distros, nested SSH)
  # wsl2-<A>    → wsl2-<B>    (all ordered pairs, nested SSH)
  # Runs on DGX after dgx-tests (same runner — must sequence).

  wsl2-tests:
    needs: [dgx-tests]
    if: always()
    runs-on: dgx
    outputs:
      results: ${{ steps.run.outputs.results }}
    steps:
      - id: run
        shell: bash
        env:
          DISTROS: ${{ vars.WSL2_DISTROS }}
        run: |
          SSH="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          declare -A R
          any_fail=false

          if [[ "$DISTROS" == "NONE" || -z "$DISTROS" ]]; then
            echo "No active distros — skipping all wsl2 outbound tests"
          else
            for d in $DISTROS; do
              # wsl2-<d> → spark  (nested SSH)
              if out=$($SSH "wsl2-$d" "$SSH spark hostname" 2>&1); then
                echo "wsl2-$d → spark: $out"
                R["wsl2-${d}__spark"]=pass
              else
                echo "FAIL: wsl2-$d → spark: $out"
                R["wsl2-${d}__spark"]=fail
                any_fail=true
              fi

              # wsl2-<d> → orin   (nested SSH)
              if out=$($SSH "wsl2-$d" "$SSH orin hostname" 2>&1); then
                echo "wsl2-$d → orin: $out"
                R["wsl2-${d}__orin"]=pass
              else
                echo "FAIL: wsl2-$d → orin: $out"
                R["wsl2-${d}__orin"]=fail
                any_fail=true
              fi
            done

            read -ra DARR <<< "$DISTROS"
            if [[ ${#DARR[@]} -ge 2 ]]; then
              for src in "${DARR[@]}"; do
                for dst in "${DARR[@]}"; do
                  [[ "$src" == "$dst" ]] && continue
                  if out=$($SSH "wsl2-$src" "$SSH wsl2-$dst hostname" 2>&1); then
                    echo "wsl2-$src → wsl2-$dst: $out"
                    R["wsl2-${src}__wsl2-${dst}"]=pass
                  else
                    echo "FAIL: wsl2-$src → wsl2-$dst: $out"
                    R["wsl2-${src}__wsl2-${dst}"]=fail
                    any_fail=true
                  fi
                done
              done
            fi
          fi

          json='{'
          sep=""
          for k in "${!R[@]}"; do
            json+="${sep}$(printf '"%s":"%s"' "$k" "${R[$k]}")"
            sep=','
          done
          json+='}'
          echo "results=$json" >> "$GITHUB_OUTPUT"
          [[ "$any_fail" == "true" ]] && exit 1

  # ── Summary ──────────────────────────────────────────────────────────────

  summary:
    needs: [dgx-tests, agx-tests, wsl2-tests]
    if: always()
    runs-on: dgx
    steps:
      - name: Render summary
        env:
          DISTROS: ${{ vars.WSL2_DISTROS }}
          DGX: ${{ needs.dgx-tests.outputs.results }}
          AGX: ${{ needs.agx-tests.outputs.results }}
          WSL2: ${{ needs.wsl2-tests.outputs.results }}
        shell: bash
        run: |
          icon() {
            local blob="$1" key="$2"
            if [[ -z "$blob" ]]; then printf '⚠️'; return; fi
            local val
            val=$(printf '%s' "$blob" | jq -r --arg k "$key" '.[$k] // "—"')
            case "$val" in
              pass) printf '✅' ;;
              fail) printf '❌' ;;
              *)    printf '—'  ;;
            esac
          }

          {
            echo "## SSH Topology Verification"
            echo ""
            echo "### Core"
            echo "| Direction | Result |"
            echo "|---|---|"
            echo "| spark → orin | $(icon "$DGX" spark__orin) |"
            echo "| orin → spark | $(icon "$AGX" orin__spark) |"

            if [[ "$DISTROS" != "NONE" && -n "$DISTROS" ]]; then
              for d in $DISTROS; do
                echo ""
                echo "### wsl2-$d"
                echo "| Direction | Result |"
                echo "|---|---|"
                echo "| spark → wsl2-$d    | $(icon "$DGX" "spark__wsl2-$d") |"
                echo "| orin → wsl2-$d     | $(icon "$AGX" "orin__wsl2-$d") |"
                echo "| wsl2-$d → spark    | $(icon "$WSL2" "wsl2-${d}__spark") |"
                echo "| wsl2-$d → orin     | $(icon "$WSL2" "wsl2-${d}__orin") |"
              done

              read -ra DARR <<< "$DISTROS"
              if [[ ${#DARR[@]} -ge 2 ]]; then
                echo ""
                echo "### wsl2 ↔ wsl2"
                echo "| Direction | Result |"
                echo "|---|---|"
                for src in "${DARR[@]}"; do
                  for dst in "${DARR[@]}"; do
                    [[ "$src" == "$dst" ]] && continue
                    echo "| wsl2-$src → wsl2-$dst | $(icon "$WSL2" "wsl2-${src}__wsl2-${dst}") |"
                  done
                done
              fi
            else
              echo ""
              echo "_No active WSL2 distros \`(WSL2_DISTROS = NONE)\`_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any path failed
        if: always()
        env:
          DGX_JOB: ${{ needs.dgx-tests.result }}
          AGX_JOB: ${{ needs.agx-tests.result }}
          WSL2_JOB: ${{ needs.wsl2-tests.result }}
          DGX: ${{ needs.dgx-tests.outputs.results }}
          AGX: ${{ needs.agx-tests.outputs.results }}
          WSL2: ${{ needs.wsl2-tests.outputs.results }}
        shell: bash
        run: |
          failed=false

          # Job-level failures (step errored before SSH tests could run)
          for r in "$DGX_JOB" "$AGX_JOB" "$WSL2_JOB"; do
            [[ "$r" == "failure" ]] && failed=true
          done

          # SSH-level failures within each job's result blob
          for blob in "$DGX" "$AGX" "$WSL2"; do
            [[ -z "$blob" ]] && continue
            if printf '%s' "$blob" | jq -e '[to_entries[] | select(.value == "fail")] | length > 0' > /dev/null; then
              failed=true
            fi
          done

          if $failed; then
            echo "One or more SSH paths failed." >&2
            exit 1
          fi
          echo "All SSH paths passed."
