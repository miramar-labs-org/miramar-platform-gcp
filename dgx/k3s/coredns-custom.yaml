# CoreDNS host.k3s.internal resolution — NOTE: this file is NOT applied via kubectl apply.
#
# k3s CoreDNS already has a 'hosts' plugin entry for NodeHosts in the default Corefile.
# Adding a second ConfigMap (with 'hosts' in a .override block) crashes CoreDNS with:
#   "hosts plugin can only be used once per Server Block"
#
# The correct approach is to append to the existing NodeHosts entry in the coredns ConfigMap.
# install-k3s.sh does this directly with kubectl patch — this file is documentation only.
#
# What install-k3s.sh does:
#   kubectl patch configmap coredns -n kube-system --type merge \
#     -p '{"data":{"NodeHosts":"<existing entries>\n<NODE_IP> host.k3s.internal"}}'
#
# To verify resolution inside a pod:
#   kubectl run -it --rm dns-test --image=busybox --restart=Never -- nslookup host.k3s.internal
