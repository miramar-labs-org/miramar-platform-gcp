# Routing table for the DGX model router. Serving projects add and remove their own
# entries here automatically on deploy/undeploy (GitHub Contents API, yaml.dump — which
# is why this file carries no comments it cannot afford to lose).
#
# The meta/llama-3.1-8b-instruct-dgx-spark entry that used to sit here was stale: the
# NeMo modeldeployment Service it pointed at no longer exists and the route returned 500.
#
# Ollama models are NOT listed here. Both hosts' catalogs are appended at deploy time as
# dgx/<model> and agx/<model> — see below.
model_list:

# --- Ollama on the DGX Spark and AGX Orin -------------------------------
# Generated at deploy time by scripts/gha/gen-ollama-upstreams.py from each host's
# live /api/tags and appended to a copy of this file by deploy-model-router.yaml.
# The catalogs are dynamic — `ollama pull` and the model exists — so a hand-maintained
# block drifts silently; the AGX one was listing 6 of 7 cached models.
#
# Ollama is host-native systemd on both machines, so neither has an in-cluster Service
# or a CoreDNS record: both are reached by host IP ({MACHINE}_HOST_IP) on Ollama's
# OpenAI-compatible /v1 endpoint. Entries are host-prefixed because both hosts carry
# qwen3.6:35b-a3b, gpt-oss:20b, nemotron-3-nano:30b and phi4, and Open WebUI reaches
# Ollama only through this router — these entries are the whole model picker.
