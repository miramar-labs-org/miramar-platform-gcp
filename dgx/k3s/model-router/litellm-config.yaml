# --- AGX Orin (secondary Ollama model runner) -------------------------------
# The AGX entries are NOT listed here. They are generated at deploy time by
# scripts/gha/gen-agx-upstreams.py from the AGX's live /api/tags and appended to
# this file by deploy-model-router.yaml, because the AGX catalog is dynamic and a
# hand-maintained block silently drifts (it listed 6 of 7 cached models).
#
# The AGX runs Ollama natively on the host and nothing else — no k3s, so there is
# no in-cluster Service and no CoreDNS record. It is reached by host IP
# (AGX_HOST_IP, 192.168.1.202) on the Ollama OpenAI-compatible /v1 endpoint, and
# entries are prefixed `agx/` to stay distinct from the identically named models
# on the DGX. Ollama loads a model on first request, subject to the ~40 GB
# AGX_VRAM_USEABLE budget — one large model at a time.
