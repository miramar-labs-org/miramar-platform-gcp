# Nsight Operator Helm values — miramar-platform-gcp
# Injection targets: kubeflow namespace pods labeled nvidia-nsight-profile=enabled
#
# Chart 26.3.x replaced the flat nsight-injector.nsightToolConfig block with
# nsightToolConfigs[] + injectionRules[]. The chart still ships a legacy shim
# (charts/nsight-injector/templates/default-injection-config.yaml) that maps the
# keys below — privileged, nsightToolArgs, injectionIncludePatterns — into the
# new NsightOperatorProfileConfig CR, so this file is kept in the old shape.
# Migrate to the new schema if/when NVIDIA drops the shim.

nsight-injector:
  # EXPERIMENT (test/nsight-drop-privileged): is privileged still required under
  # software CUPTI trace? Host two-arm pod test says no — a container with
  # CapEff=0, seccomp RuntimeDefault and no /dev/nvidia-caps captured 4310 kernels.
  # This branch drives the same question through the real injector path.
  privileged: false

  nsightToolConfig:
    # Match python3 processes (KFP component scripts)
    injectionIncludePatterns:
      - ".*python3.*"
    # Core profiling flags.
    #
    # --trace=cuda-sw (NOT cuda) is load-bearing. On a CUDA >= 13.0 driver,
    # `--trace=cuda` selects nsys's *hardware* CUDA trace; `--trace=cuda-sw`
    # selects the software CUPTI path. The operator always does a time-boxed
    # collection (`nsys start` ... `nsys stop`) while the profiled process keeps
    # running, and hardware trace only reconciles GPU-side kernel timestamps to
    # the host at process teardown. Every GPU record still unreconciled at
    # `nsys stop` is discarded ("Number of incomplete CUPTI events dropped: N"),
    # so a hardware-trace collection over a running process yields a report with
    # a full CPU-side API trace and NO CUPTI_ACTIVITY_KIND_KERNEL table at all.
    #
    # Measured on the DGX with nsys 2026.3.1.157 (the build this operator
    # injects), same workload, same 90s window, collection triggered 60s into the
    # process while the GPU was saturated:
    #   --trace=cuda      ->     0 kernel records (table absent), 8400 dropped
    #   --trace=cuda-sw   ->  8624 kernel records,                 176 dropped
    # Cost of the switch: ~3.5% runtime overhead on a gemm-bound loop.
    #
    # Trade-off: --cuda-graph-trace=node granularity and device-side graph launch
    # tracing require hardware trace and are unavailable under cuda-sw. Nothing on
    # this platform traces CUDA graphs at node granularity.
    #
    # --cuda-flush-interval only governs the software path; it was a no-op while
    # hardware trace was selected (CUDA_FLUSH_PERIODICALLY stayed false either way).
    #
    # DO NOT add --env-var NVIDIA_VISIBLE_DEVICES=all: it was observed to disrupt
    # GPU-side record collection.
    nsightToolArgs: >-
      --trace=cuda-sw,nvtx,cublas,cudnn
      --sample=none
      --cuda-flush-interval=100
      --force-overwrite=true
