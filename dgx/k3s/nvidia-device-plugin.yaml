# NVIDIA device plugin v0.18.0 — pinned for GB10 (Blackwell) fix.
# Applied by scripts/ubuntu/install-k3s.sh after k3s node is Ready.
# device-discovery-strategy=nvml: required on k3s because containerd socket is at
# /run/k3s/containerd/containerd.sock (not the standard path); auto strategy fails.
# k3s writes device plugin sockets to /var/lib/rancher/k3s/agent/pod-resources/
# but kubelet DevicePlugin API still uses /var/lib/kubelet/device-plugins.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      runtimeClassName: runc
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - image: nvcr.io/nvidia/k8s-device-plugin:v0.18.0
          name: nvidia-device-plugin-ctr
          args:
            - --device-discovery-strategy=nvml
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
