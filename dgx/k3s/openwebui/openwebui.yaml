# Open WebUI — private chat interface for vLLM / Ollama model endpoints
# Namespace: openwebui | Port: 8080 (in-cluster) → host port 8084 via openwebui-portfwd.service
#
# OPENAI_API_BASE_URL and ENABLE_OPENAI_API are substituted by deploy-openwebui.yaml at deploy time.
# When no serving project is active ENABLE_OPENAI_API=false and Ollama is the only backend.
# ENABLE_DIRECT_CONNECTIONS=false mitigates CVE-2025-64496.
---
apiVersion: v1
kind: Namespace
metadata:
  name: openwebui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: openwebui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:v0.6.5
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_BASE_URL
              value: "OPENAI_API_BASE_URL_PLACEHOLDER"
            - name: OPENAI_API_KEY
              value: "not-used"
            - name: ENABLE_OPENAI_API
              value: "ENABLE_OPENAI_API_PLACEHOLDER"
            - name: ENABLE_OLLAMA_API
              value: "true"
            - name: OLLAMA_BASE_URL
              value: "http://host.k3s.internal:11434"
            - name: ENABLE_SIGNUP
              value: "false"
            - name: WEBUI_AUTH
              value: "false"
            - name: ENABLE_DIRECT_CONNECTIONS
              value: "false"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "2Gi"
      volumes:
        - name: webui-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui
  namespace: openwebui
spec:
  selector:
    app: openwebui
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
