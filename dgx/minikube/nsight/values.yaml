# Nsight Operator Helm values — miramar-platform-gcp
# Injection targets: kubeflow namespace pods labeled nvidia-nsight-profile=enabled

nsight-injector:
  # privileged: required for hardware GPU trace on GB10.
  # Without it, ~7 kernel records; with it, ~47 records (1.89s hardware trace snapshot).
  privileged: true

  nsightToolConfig:
    # Match python3 processes (KFP component scripts)
    injectionIncludePatterns:
      - ".*python3.*"
    # Core profiling flags.
    # NOTE: In process hook injection mode, COLLECT_CUDA_TRACE=false is expected —
    # it means nsys uses hardware trace (not software CUPTI) for GPU-side kernel
    # records. The hardware trace captures a single ~1.89s snapshot (~45 kernels)
    # at CUDA init time. CPU-side CUDA API trace (CUPTI_ACTIVITY_KIND_RUNTIME) and
    # NVTX events are captured continuously for the full collection window.
    # DO NOT add --env-var NVIDIA_VISIBLE_DEVICES=all: this disrupts the hardware
    # trace snapshot timing and reduces kernel coverage from 47 to 2 records.
    nsightToolArgs: >-
      --trace=cuda,nvtx,cublas,cudnn
      --sample=none
      --cuda-flush-interval=100
      --force-overwrite=true
