apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: miramar-route
  namespace: model-router
spec:
  parentRefs:
    - name: miramar-gateway
      namespace: model-router
  hostnames:
    - "api.miramar-labs.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: model-router
          port: 8000
