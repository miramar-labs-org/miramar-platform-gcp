# Nsight Operator Helm values — GKE (miramar-shared-gke)
# GKE uses dynamic storage provisioning — no static PV required.
# The StatefulSet PVC binds to the cluster's default StorageClass automatically.
# (On k3s/DGX, a static hostPath PV is created before helm install — not needed here.)
#
# Chart 26.3.x reshaped nsight-injector.nsightToolConfig into nsightToolConfigs[] +
# injectionRules[]; the chart's legacy shim still maps the old keys used below, so
# this file is kept in the old shape. Migrate if NVIDIA drops the shim.

# nsight-tenant-operator provides remote-streaming access via STUNner (a WebRTC
# TURN gateway), which requires an external Gateway + LoadBalancer for NAT
# traversal. This platform forbids LoadBalancer Services (cost control) and
# only ever accesses the Nsight UI via kubectl port-forward, so this feature
# is both unusable and unneeded here. Disabling it also skips STUNner's
# bundled experimental-channel Gateway API CRDs, which GKE's
# enforce-gateway-standard-channel admission policy rejects.
nsight-tenant-operator:
  enabled: false
  stunner:
    enabled: false

nsight-injector:
  # privileged: kept true here as the safe default. Whether it is actually needed
  # depends on the node driver's RmProfilingAdminOnly (/proc/driver/nvidia/params):
  # 0 means CUPTI can attach unprivileged and this can be false (as on the DGX),
  # 1 means it cannot. GKE's L4 spot nodes are transient and their driver setting
  # has not been verified, so this stays true. See dgx/k3s/nsight/values.yaml.
  privileged: true

  nsightToolConfig:
    # Match python3 processes (KFP component scripts)
    injectionIncludePatterns:
      - ".*python3.*"
    # Core profiling flags.
    #
    # --trace=cuda-sw (NOT cuda) is load-bearing — see the long note in
    # dgx/k3s/nsight/values.yaml. Short version: on a CUDA >= 13.0 driver
    # `--trace=cuda` selects nsys's hardware CUDA trace, which only reconciles
    # GPU-side kernel timestamps at process teardown. The operator always stops
    # collection while the profiled process is still running, so every GPU record
    # is dropped as "incomplete" and the report comes back with no
    # CUPTI_ACTIVITY_KIND_KERNEL table. --trace=cuda-sw uses software CUPTI and
    # survives a mid-process stop (measured on DGX/GB10: 0 -> 8624 kernel records
    # over an identical 90s window, ~3.5% overhead).
    #
    # Trade-off: --cuda-graph-trace=node granularity requires hardware trace and
    # is unavailable under cuda-sw.
    nsightToolArgs: >-
      --trace=cuda-sw,nvtx,cublas,cudnn
      --sample=none
      --cuda-flush-interval=100
      --force-overwrite=true
