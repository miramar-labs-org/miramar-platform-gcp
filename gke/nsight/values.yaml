# Nsight Operator Helm values — GKE (miramar-shared-gke)
# GKE uses dynamic storage provisioning — no static PV required.
# The StatefulSet PVC binds to the cluster's default StorageClass automatically.
# (On k3s/DGX, a static hostPath PV is created before helm install — not needed here.)
#
# Chart 26.3.x reshaped nsight-injector.nsightToolConfig into nsightToolConfigs[] +
# injectionRules[]; the chart's legacy shim still maps the old keys used below, so
# this file is kept in the old shape. Migrate if NVIDIA drops the shim.

# nsight-tenant-operator provides remote-streaming access via STUNner (a WebRTC
# TURN gateway), which requires an external Gateway + LoadBalancer for NAT
# traversal. This platform forbids LoadBalancer Services (cost control) and
# only ever accesses the Nsight UI via kubectl port-forward, so this feature
# is both unusable and unneeded here. Disabling it also skips STUNner's
# bundled experimental-channel Gateway API CRDs, which GKE's
# enforce-gateway-standard-channel admission policy rejects.
nsight-tenant-operator:
  enabled: false
  stunner:
    enabled: false

nsight-injector:
  # privileged: required for hardware GPU trace.
  privileged: true

  nsightToolConfig:
    # Match python3 processes (KFP component scripts)
    injectionIncludePatterns:
      - ".*python3.*"
    # Core profiling flags.
    # NOTE: In process hook injection mode, COLLECT_CUDA_TRACE=false is expected —
    # it means nsys uses hardware trace (not software CUPTI) for GPU-side kernel
    # records. The hardware trace captures a single ~1.89s snapshot at CUDA init time.
    # CPU-side CUDA API trace (CUPTI_ACTIVITY_KIND_RUNTIME) and NVTX events are
    # captured continuously for the full collection window.
    nsightToolArgs: >-
      --trace=cuda,nvtx,cublas,cudnn
      --sample=none
      --cuda-flush-interval=100
      --force-overwrite=true
