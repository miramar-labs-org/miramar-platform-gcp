description: ""  # One sentence — shown in KFP Pipelines + KFP Experiments + MLflow Experiments UI

# ── Candidate models ─────────────────────────────────────────────────────────
# One entry per model under evaluation. `id` is the leaderboard key and must be
# unique. `ollama_tag` is required for serving_mode "ollama"; `hf_id` + `quant`
# are required for serving_mode "guided" (vLLM). List only the fields the modes
# you enable actually need.
models:
  - id: dgx-default
    ollama_tag: "{{DGX_DEFAULT_MODEL}}"   # from the DGX_DEFAULT_MODEL org variable
  # A `guided` (vLLM) candidate needs hf_id + quant instead of ollama_tag. Both must
  # describe the SAME model — an ollama_tag and an unrelated hf_id would silently
  # benchmark two different models under one leaderboard key:
  # - id: qwen3-4b
  #   hf_id: "Qwen/Qwen3-4B"        # HF repo for serving_mode: guided (vLLM)
  #   quant: "fp8"                  # vLLM --quantization (fp8 on GB10 — never nvfp4)

# ── Serving modes ────────────────────────────────────────────────────────────
# The matrix is models × serving_modes, run SERIALLY (one GPU, Ollama pins one
# resident model at a time).
#   ollama  — evict any other resident model, pull + preload the target, hit
#             /v1 on the shared Ollama (JSON mode).
#   guided  — stand up a short-lived vLLM Deployment with xgrammar guided
#             decoding, poll /health, tear it down after the combo.
serving_modes: [ollama]

# ── Task harnesses ───────────────────────────────────────────────────────────
# Module-name-style keys; each must have a matching entry in the notebook's
# HARNESSES registry (build_cases / run_case / gates / judge_prompt). The
# template ships `example_harness` only — add your own in the notebook.
tasks: [example_harness]

# ── Frozen dataset (MinIO artifact) ──────────────────────────────────────────
# load_dataset pulls s3://<bucket>/datasets/<version>/{<task>.jsonl, manifest.json}.
# Produce it with scripts/export_dataset.py (LangSmith → JSONL → MinIO).
dataset:
  s3_endpoint_url: "http://minio.mlflow-system.svc.cluster.local:9000"
  bucket: "{{PROJECT_NAME}}"       # export_dataset.py creates it if missing
  version: "v00000000"             # dated snapshot dir, e.g. v20260828
  # MinIO creds — the miramar-platform dev defaults (see the platform repo's
  # dgx/k3s/mlflow/integrate-mlflow.sh). Override in the deploy workflow if your
  # MinIO uses different credentials.
  access_key: "mlflowadmin"
  secret_key: "mlflowadmin12345678"

# ── LLM-as-judge ─────────────────────────────────────────────────────────────
# PLATFORM RULE: the LLM-as-judge is one shared model, hosted on the AGX Orin.
#
# Every project on the platform that needs a judge uses this same model at this same
# endpoint — the bakeoff is no exception. A fixed judge is what makes scores comparable
# across runs, across projects, and over time. Note the self-grading bias if the judge
# model is also entered as a candidate in `models:` below.
#
# Why the AGX: the judge is the one LLM that has to be available *during* an eval while
# not being the thing under evaluation. Here every candidate takes its turn holding DGX
# GPU memory, so a DGX-side judge would contend with whichever model is being scored.
# The judge loads on demand and needs ~9.1 GB of the AGX's ~40 GB model budget
# (AGX_VRAM_USEABLE) free — an `Ollama Deploy` against `agx` that pins a model larger
# than ~30 GB will starve it.
#
# This was `gpt-oss:120b` on the DGX. That model is 65 GB — it exceeds not just the AGX
# budget but the Orin's 64 GB of total memory, so it cannot be the platform judge. phi4
# scored 5/5 parseable and correct on a five-case safety set where the larger candidates
# returned empty completions (reasoning models that spend the token budget thinking).
#
# Cost: measured 2026-09-07, phi4, mean over five judge-shaped cases at temperature 0 —
# DGX 2.5 s/call vs AGX 14.0 s/call. Multiply by cases × models × serving_modes to size
# a bakeoff run; `case_timeout_s` still bounds each call.
#
# Verdicts are identical on both hosts (same model, temperature 0), so the fallback does
# not move a single score. If the AGX is offline, point base_url at
# http://192.168.1.200:11434/v1 (DGX).
judge:
  model: "{{AGX_DEFAULT_MODEL}}"            # platform judge — substituted from the AGX_DEFAULT_MODEL org variable
  base_url: "http://192.168.1.202:11434/v1" # AGX Orin (AGX_HOST_IP) — the judge always runs here

# ── Gate thresholds ──────────────────────────────────────────────────────────
# Harness-specific keys, read by each harness's gates() block. Deterministic,
# pass/fail — no model in the loop.
gate_thresholds:
  example_harness:
    min_output_keys: 1

# ── Score weights ────────────────────────────────────────────────────────────
# Per task, per metric. Weights are normalized per task before the weighted
# composite. `gate_pass` = fraction of cases passing all gates; `judge` = mean
# judge score normalized to 0–1.
score_weights:
  example_harness:
    gate_pass: 0.6
    judge: 0.4

# ── Timeouts / serving knobs ─────────────────────────────────────────────────
case_timeout_s: 180               # hard cap per run_case (bounds every agentic loop)
serving:
  # This is the CANDIDATE-UNDER-TEST endpoint, not the judge. It must stay on the DGX:
  # the bakeoff measures each model on the GB10, so serving a candidate anywhere else
  # would change what is being benchmarked. Do not repoint it at the AGX.
  ollama_base_url: "http://192.168.1.200:11434/v1"   # DGX Spark (DGX_HOST_IP)
  ollama_pull_timeout_s: 1800     # max wait for `ollama pull` of a cold model
  guided_readiness_timeout_s: 900 # max wait for a vLLM pod /health to go green
  guided_namespace: "kubeflow"    # namespace the transient vLLM Deployment lands in
  vllm_image: "vllm/vllm-openai:latest"
  vllm_max_model_len: 8192

# ── GPU profiling (Nsight Operator) ──────────────────────────────────────────
# This bakeoff's GPU work runs either on the host Ollama service (serving_mode:
# ollama) or in a transient vLLM Deployment that serve_model creates directly
# (serving_mode: guided) — neither is a KFP task pod, so the operator's per-pod
# webhook has nothing to hook here. To profile a candidate's serving backend,
# capture it on the host while a combo is GPU-hot:
#   /nsight-export {{PROJECT_NAME}} run-NNN main --adhoc --duration 90
# The block is kept for parity with the other templates; there is no per-stage
# toggle because there is no KFP GPU stage to toggle.
profiling:
  collection_window_s: 90

# ── LangSmith (dataset source) ───────────────────────────────────────────────
# scripts/export_dataset.py reads one `export` spec per task from `project`,
# writes ./dataset/<task>.jsonl + manifest.json, and uploads to
# s3://<dataset.bucket>/datasets/<version>/. Needs LANGCHAIN_API_KEY in env.
langsmith:
  project: ""                     # LangSmith project name
  export:
    - task: example_harness
      run_filter: ""              # LangSmith filter DSL, e.g. eq(name, "analyst_universe")
      limit: 50
      input_path: "inputs"        # dotted path into the run for the case inputs
      output_path: "outputs"      # dotted path into the run for the reference output
      # ── optional ──────────────────────────────────────────────────────────
      # skip_where:               # drop a matched run entirely
      #   - {path: "inputs.signal.action", equals: "HOLD"}
      # drop_input_keys: [signal] # prune leaked downstream state from the case inputs
      #                           # (LangGraph node runs carry the whole cumulative state)
      # collect_child_tools:      # walk each run's trace, attach these tool outputs as
      #   - get_option_chain      # case["fixtures"][<tool>] so an agentic loop replays offline
      #   - get_option_snapshot
