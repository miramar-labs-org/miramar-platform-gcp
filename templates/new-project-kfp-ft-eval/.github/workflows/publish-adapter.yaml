name: Publish Adapter to GCS

# Publishes a completed, gate-passed run as a versioned serving bundle to GCS.
# Produces: adapter/, eval/, manifest.json, model_card.md, smoke_test_prompts.jsonl
# The manifest is the stable contract consumed by llm-serving-vllm and other serving templates.
#
# Prerequisites:
#   - The KFP run must have completed with deployment gate PASS
#   - gs://miramar-platform-ft-adapters must exist (provisioned by gcp-platform-create.yaml)
#   - WIF_PROVIDER and GCP_SERVICE_ACCOUNT secrets must be set

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: Run name to publish (e.g. run-001)
        required: true
        default: run-001
      adapter_local_path:
        description: Local DGX path to adapter directory (auto-detected from project convention if blank)
        required: false

permissions:
  contents: read
  id-token: write

env:
  PIPELINE_NAME: {{PROJECT_NAME}}
  GCS_BUCKET: miramar-platform-ft-adapters
  GCP_REGION: ${{ vars.GCP_REGION }}

jobs:
  publish:
    runs-on: [self-hosted, dgx]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve adapter path
        id: adapter
        run: |
          ADAPTER_PATH="${{ inputs.adapter_local_path }}"
          if [[ -z "$ADAPTER_PATH" ]]; then
            ADAPTER_PATH="/home/aaron/shared/huggingface-kfp/hub/adapters/${PIPELINE_NAME}/chunk-0"
          fi
          if [[ ! -d "$ADAPTER_PATH" ]]; then
            echo "ERROR: adapter directory not found at: $ADAPTER_PATH"
            echo "Either the KFP run did not complete, or specify adapter_local_path manually."
            exit 1
          fi
          echo "path=$ADAPTER_PATH" >> "$GITHUB_OUTPUT"
          echo "Adapter path: $ADAPTER_PATH"
          ls -lh "$ADAPTER_PATH"

      - name: Check bucket exists
        run: |
          if ! gcloud storage buckets describe "gs://${GCS_BUCKET}" > /dev/null 2>&1; then
            echo "ERROR: gs://${GCS_BUCKET} does not exist."
            echo "Run gcp-platform-create.yaml to provision platform resources first."
            exit 1
          fi

      - name: Check run log exists
        run: |
          RUN_LOG="runs/${{ inputs.run_name }}.md"
          if [[ ! -f "$RUN_LOG" ]]; then
            echo "ERROR: $RUN_LOG not found. Cannot validate gate status or extract metrics."
            exit 1
          fi

      - name: Validate gate status
        run: |
          RUN_LOG="runs/${{ inputs.run_name }}.md"
          if ! grep -qi "gate.*pass\|PASS" "$RUN_LOG"; then
            echo "ERROR: $RUN_LOG does not show a PASS gate result."
            echo "Only gate-passed runs may be published."
            exit 1
          fi
          echo "Gate status: PASS confirmed."

      - name: Upload adapter files
        run: |
          DEST="gs://${GCS_BUCKET}/${PIPELINE_NAME}/${{ inputs.run_name }}/adapter"
          echo "Uploading adapter to $DEST"
          gsutil -m rsync -r "${{ steps.adapter.outputs.path }}/" "${DEST}/"
          echo "Adapter upload complete."
          gsutil ls -l "${DEST}/"

      - name: Extract and upload eval metrics
        run: |
          RUN_LOG="runs/${{ inputs.run_name }}.md"
          DEST="gs://${GCS_BUCKET}/${PIPELINE_NAME}/${{ inputs.run_name }}/eval"
          python3 scripts/extract_run_metrics.py \
            --run-log "$RUN_LOG" \
            --run-name "${{ inputs.run_name }}" \
            --output-dir /tmp/eval_metrics
          gsutil -m cp /tmp/eval_metrics/*.json "${DEST}/"
          echo "Eval metrics uploaded."

      - name: Generate and upload manifest.json
        run: |
          DEST_ROOT="gs://${GCS_BUCKET}/${PIPELINE_NAME}/${{ inputs.run_name }}"
          python3 scripts/generate_manifest.py \
            --config config.yaml \
            --run-name "${{ inputs.run_name }}" \
            --adapter-uri "${DEST_ROOT}/adapter" \
            --output /tmp/manifest.json
          gsutil cp /tmp/manifest.json "${DEST_ROOT}/manifest.json"
          echo "manifest.json uploaded."
          cat /tmp/manifest.json

      - name: Generate and upload model_card.md
        run: |
          DEST_ROOT="gs://${GCS_BUCKET}/${PIPELINE_NAME}/${{ inputs.run_name }}"
          python3 scripts/generate_model_card.py \
            --config config.yaml \
            --run-name "${{ inputs.run_name }}" \
            --manifest /tmp/manifest.json \
            --output /tmp/model_card.md
          gsutil cp /tmp/model_card.md "${DEST_ROOT}/model_card.md"
          echo "model_card.md uploaded."

      - name: Upload smoke_test_prompts.jsonl
        run: |
          DEST_ROOT="gs://${GCS_BUCKET}/${PIPELINE_NAME}/${{ inputs.run_name }}"
          if [[ -f "smoke_test_prompts.jsonl" ]]; then
            gsutil cp smoke_test_prompts.jsonl "${DEST_ROOT}/smoke_test_prompts.jsonl"
            echo "smoke_test_prompts.jsonl uploaded."
          else
            echo "WARNING: smoke_test_prompts.jsonl not found in repo root — skipping."
          fi

      - name: Confirm bundle
        run: |
          DEST_ROOT="gs://${GCS_BUCKET}/${PIPELINE_NAME}/${{ inputs.run_name }}"
          echo "Bundle contents:"
          gsutil ls -r "${DEST_ROOT}/"

      - name: Summary
        run: |
          MANIFEST_URI="gs://${GCS_BUCKET}/${PIPELINE_NAME}/${{ inputs.run_name }}/manifest.json"
          {
            echo "## Adapter Bundle Published"
            echo "| | |"
            echo "|---|---|"
            echo "| Project | \`$PIPELINE_NAME\` |"
            echo "| Run | \`${{ inputs.run_name }}\` |"
            echo "| Manifest URI | \`${MANIFEST_URI}\` |"
            echo ""
            echo "Use this manifest URI in your \`llm-serving-vllm\` project's \`serving-config.yaml\`:"
            echo "\`\`\`yaml"
            echo "adapter:"
            echo "  manifest_uri: ${MANIFEST_URI}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
