name: Open in JupyterLab

# Clones or pulls this repo to ~/git-miramar-labs-org/projects/<repo-name>
# on the DGX host and prints the direct JupyterLab URL.
#
# No secrets required — uses GITHUB_ORG_ADMIN_PAT (runner env var) for the
# HTTPS clone. The host path is exposed via a volume mount in launch-runner.sh:
#   ~/git-miramar-labs-org/projects -> /home/runner/git-miramar-labs-org/projects
#
# Prerequisites:
#   - Runner restarted after launch-runner.sh was updated to add the volume mount
#   - JupyterLab running on DGX (minikube systemd services installed)
#   - SSH tunnel: ssh -L 8888:localhost:8888 <user>@spark-79b7.local

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open:
    runs-on: [self-hosted, dgx]
    timeout-minutes: 5

    steps:
      - name: Clone or pull repo to DGX host
        env:
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          PROJECTS="${HOME}/git-miramar-labs-org/projects"
          if [ ! -d "${PROJECTS}" ]; then
            echo "ERROR: ${PROJECTS} not mounted — restart the runner after" \
                 "updating launch-runner.sh to add the projects volume mount." >&2
            exit 1
          fi
          if [ -d "${PROJECTS}/${REPO_NAME}/.git" ]; then
            git -C "${PROJECTS}/${REPO_NAME}" pull --ff-only
            echo "Pulled: ${PROJECTS}/${REPO_NAME}"
          else
            git clone \
              "https://x-access-token:${GITHUB_ORG_ADMIN_PAT}@github.com/${REPO}.git" \
              "${PROJECTS}/${REPO_NAME}"
            echo "Cloned: ${PROJECTS}/${REPO_NAME}"
          fi

      - name: Summary
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          {
            echo "## Open in JupyterLab"
            echo ""
            echo "Repo synced to \`~/git-miramar-labs-org/projects/${REPO_NAME}\` on the DGX."
            echo ""
            echo "**Open:** [http://localhost:8888/lab/tree/git-miramar-labs-org/projects/${REPO_NAME}](http://localhost:8888/lab/tree/git-miramar-labs-org/projects/${REPO_NAME})"
          } >> "$GITHUB_STEP_SUMMARY"
