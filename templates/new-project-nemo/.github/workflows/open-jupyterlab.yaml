name: Open in JupyterLab

# Clones or pulls this repo to ~/git-miramar-labs-org/projects/<repo-name>
# on the host machine and prints the direct JupyterLab URL.
#
# The target machine (DGX or AGX) is set by the PROJECT_HOST repo variable,
# written by the Create Project workflow. DGX uses port 8888, AGX uses 8887.
#
# Uses the SSH key already mounted in the runner at ~/.ssh/id_ed25519
# (from the shared SSH store). No GitHub secrets required.
#
# Prerequisites:
#   - Shared SSH store set up on the host (Setup Shared SSH Store workflow)
#   - JupyterLab running on host (systemd services installed and lingering)
#   - SSH tunnel open from laptop (see README for port)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open:
    runs-on: [self-hosted, "${{ vars.PROJECT_HOST || 'dgx' }}"]
    timeout-minutes: 5

    steps:
      - name: Clone or pull repo on host
        env:
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          HOST_USER: ${{ vars.PROJECT_HOST == 'agx' && vars.AGX_HOST_USER || vars.DGX_HOST_USER }}
          SCRIPT: |
            set -euo pipefail
            mkdir -p "${HOME}/git-miramar-labs-org/projects"
            DEST="${HOME}/git-miramar-labs-org/projects/${REPO_NAME}"
            if [ -d "${DEST}/.git" ]; then
              git -C "${DEST}" stash
              git -C "${DEST}" pull --ff-only
              git -C '${DEST}' stash drop 2>/dev/null || true
              echo "Pulled: ${DEST}"
            else
              git clone \
                "https://x-access-token:${PAT}@github.com/${REPO}.git" \
                "${DEST}"
              echo "Cloned: ${DEST}"
            fi
        run: |
          if [ ! -f ~/.ssh/id_ed25519 ]; then
            echo "ERROR: ~/.ssh/id_ed25519 not found." \
                 "Run the Setup Shared SSH Store workflow first." >&2
            exit 1
          fi
          printf '%s' "${SCRIPT}" \
            | ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
                "${HOST_USER:-aaron}@localhost" \
                env REPO="${REPO}" REPO_NAME="${REPO_NAME}" \
                    PAT="${GITHUB_ORG_ADMIN_PAT}" bash

      - name: Summary
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          HOST: ${{ vars.PROJECT_HOST || 'dgx' }}
        run: |
          JL_PORT=8888; [[ "${HOST}" == "agx" ]] && JL_PORT=8887
          JL_URL="http://localhost:${JL_PORT}/lab/tree/git-miramar-labs-org/projects/${REPO_NAME}"
          {
            echo "## Open in JupyterLab"
            echo ""
            echo "Repo synced to \`~/git-miramar-labs-org/projects/${REPO_NAME}\` on \`${HOST}\`."
            echo ""
            echo "**Open:** [${JL_URL}](${JL_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
