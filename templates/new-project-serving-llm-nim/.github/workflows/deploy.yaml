name: Deploy

# Deploys a model as a NIM service on DGX K3s using the generic Multi-LLM NIM runtime.
# Supports two modes based on model.model_path in serving-config.yaml:
#   local  — absolute path on DGX host (/abs/path) → hostPath volume mount
#   hf     — HuggingFace ID (hf://org/model or org/model) → NIM downloads from HF
# Run undeploy.yaml when done to free GPU memory.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: "{{PROJECT_NAME}}"

jobs:
  deploy-llm-nim-dgx:
    runs-on: [self-hosted, dgx]
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: echo "KUBECONFIG=${HOME}/.kube/config" >> "${GITHUB_ENV}"

      - name: Read config
        run: |
          NIM_IMAGE_TAG=$(python3 -c "import yaml; c=yaml.safe_load(open('serving-config.yaml')); print(c['nim']['image_tag'])")
          MODEL_PATH=$(python3 -c "import yaml; c=yaml.safe_load(open('serving-config.yaml')); print(c['model']['model_path'])")
          MODEL_NAME=$(python3 -c "import yaml; c=yaml.safe_load(open('serving-config.yaml')); print(c['model']['container_name'])")
          SERVED_MODEL_NAME=$(python3 -c "import yaml; c=yaml.safe_load(open('serving-config.yaml')); print(c['model']['served_model_name'])")
          echo "NIM_IMAGE_TAG=${NIM_IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "MODEL_PATH=${MODEL_PATH}" >> "$GITHUB_ENV"
          echo "MODEL_NAME=${MODEL_NAME}" >> "$GITHUB_ENV"
          echo "SERVED_MODEL_NAME=${SERVED_MODEL_NAME}" >> "$GITHUB_ENV"

      - name: Detect model mode
        run: |
          if [[ "${MODEL_PATH}" == /* ]]; then
            echo "MODEL_MODE=local" >> "$GITHUB_ENV"
            echo "HF_MODEL=" >> "$GITHUB_ENV"
            echo "Mode: local (hostPath volume)"
          else
            HF_MODEL="${MODEL_PATH#hf://}"
            echo "MODEL_MODE=hf" >> "$GITHUB_ENV"
            echo "HF_MODEL=${HF_MODEL}" >> "$GITHUB_ENV"
            echo "Mode: hf (NIM downloads from HuggingFace: ${HF_MODEL})"
          fi

      - name: Preflight checks
        env:
          HOST_USER: ${{ vars.DGX_HOST_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${HOST_USER}@localhost" "
              set -e

              if [[ '${MODEL_MODE}' == 'local' ]]; then
                echo '==> [1/3] Verify model path (local)'
                test -d '${MODEL_PATH}' || { echo 'ERROR: model dir not found: ${MODEL_PATH}'; exit 1; }
                ls -lh '${MODEL_PATH}' | head -10
              else
                echo '==> [1/3] HF model: ${HF_MODEL} (NIM will download)'
              fi

              echo '==> [2/3] Ensure nim-cache writable'
              mkdir -p \${HOME}/shared/nim-cache
              sudo chmod 777 \${HOME}/shared/nim-cache
              find \${HOME}/shared/nim-cache -mindepth 1 -exec chmod 777 {} +
              echo 'nim-cache permissions:'
              ls -la \${HOME}/shared/nim-cache

              echo '==> [3/3] Disk space'
              df -h \${HOME}/shared/nim-cache | tail -1
            "

      - name: Ensure namespace
        run: kubectl create namespace "$PROJECT_NAME" --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Ensure nvcr-pull secret
        run: |
          kubectl create secret docker-registry nvcr-pull \
            --docker-server=nvcr.io \
            --docker-username='$oauthtoken' \
            --docker-password="${{ secrets.NGC_API_KEY }}" \
            -n "$PROJECT_NAME" \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Ensure ngc-api-key secret
        run: |
          kubectl create secret generic ngc-api-key \
            --from-literal=NGC_API_KEY="${{ secrets.NGC_API_KEY }}" \
            -n "$PROJECT_NAME" \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Ensure hf-token secret
        if: env.MODEL_MODE == 'hf'
        run: |
          kubectl create secret generic hf-token \
            --from-literal=HF_TOKEN="${{ secrets.HF_TOKEN }}" \
            -n "$PROJECT_NAME" \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Undeploy active serving project
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          ACTIVE_REPO=$(gh api "orgs/miramar-labs-org/repos?type=public&per_page=100" \
            --jq '[.[] | select(.topics != null and (.topics | index("miramar-project") != null))] | .[].name' \
            | while read repo; do
                val=$(gh api "repos/miramar-labs-org/${repo}/actions/variables/DGX_SERVING_ACTIVE" \
                  --jq '.value // empty' 2>/dev/null || true)
                [[ "$val" == "true" ]] && echo "$repo" && break
              done || true)
          if [[ -n "$ACTIVE_REPO" && "$ACTIVE_REPO" != "$PROJECT_NAME" ]]; then
            echo "Undeploying active serving project: ${ACTIVE_REPO}"
            RUN_ID=$(gh workflow run undeploy.yaml \
              --repo "miramar-labs-org/${ACTIVE_REPO}" \
              --json | jq -r '.id // empty' 2>/dev/null || true)
            sleep 5
            RUN_ID=$(gh run list --repo "miramar-labs-org/${ACTIVE_REPO}" \
              --workflow=undeploy.yaml --limit=1 --json databaseId --jq '.[0].databaseId')
            echo "Waiting for undeploy run ${RUN_ID} to complete..."
            gh run watch "${RUN_ID}" --repo "miramar-labs-org/${ACTIVE_REPO}" --exit-status || true
            echo "Undeploy complete"
          else
            echo "No active serving project to undeploy"
          fi

      - name: Unserve Ollama
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          LOADED=$(curl -s http://localhost:11434/api/ps 2>/dev/null \
            | jq -r '.models[0].name // empty' || true)
          if [[ -n "$LOADED" ]]; then
            curl -s -X POST http://localhost:11434/api/generate \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$LOADED\",\"keep_alive\":0}" > /dev/null || true
            echo "Unloaded Ollama model: $LOADED"
          else
            echo "No Ollama model loaded — skipping"
          fi
          gh api -X PATCH \
            "repos/miramar-labs-org/miramar-platform-gcp/actions/variables/CURRENT_OLLAMA_MODEL" \
            -f value="none" 2>/dev/null || true
          gh api -X PATCH \
            "repos/miramar-labs-org/miramar-platform-gcp/actions/variables/CURRENT_OLLAMA_VRAM_GB" \
            -f value="0" 2>/dev/null || true
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/DGX_OLLAMA_ACTIVE" \
            -f name="DGX_OLLAMA_ACTIVE" -f value="false" -f visibility="all" 2>/dev/null || true

      - name: Substitute and apply K3s manifest
        run: |
          if [[ "${MODEL_MODE}" == "local" ]]; then
            sed "s|NIM_IMAGE_TAG_PLACEHOLDER|${NIM_IMAGE_TAG}|g" k8s/nim-local-k3s.yaml \
              | sed "s|SERVED_MODEL_NAME_PLACEHOLDER|${SERVED_MODEL_NAME}|g" \
              | sed "s|MODEL_NAME_PLACEHOLDER|${MODEL_NAME}|g" \
              | sed "s|MODEL_PATH_PLACEHOLDER|${MODEL_PATH}|g" \
              | kubectl apply --validate=false -f -
          else
            sed "s|NIM_IMAGE_TAG_PLACEHOLDER|${NIM_IMAGE_TAG}|g" k8s/nim-hf-k3s.yaml \
              | sed "s|SERVED_MODEL_NAME_PLACEHOLDER|${SERVED_MODEL_NAME}|g" \
              | sed "s|HF_MODEL_PLACEHOLDER|${HF_MODEL}|g" \
              | kubectl apply --validate=false -f -
          fi

      - name: Wait for rollout
        run: kubectl rollout status deployment/nim -n "$PROJECT_NAME" --timeout=3600s

      - name: Smoke test
        run: |
          kubectl port-forward svc/nim 18000:8000 -n "$PROJECT_NAME" &
          PF_PID=$!
          sleep 5
          trap "kill $PF_PID 2>/dev/null || true" EXIT

          curl -sf http://localhost:18000/v1/models | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          models=[m['id'] for m in d.get('data',[])]
          print('Models:', models)
          "

          PASS=0; FAIL=0
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            PROMPT=$(echo "$line" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('prompt',''))")
            [[ -z "$PROMPT" ]] && continue
            RESP=$(curl -sf -X POST http://localhost:18000/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"${SERVED_MODEL_NAME}\",\"messages\":[{\"role\":\"user\",\"content\":\"${PROMPT}\"}],\"max_tokens\":100}" \
              2>&1 || echo "CURL_ERROR")
            if echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['choices'][0]['message']['content'][:80])" 2>/dev/null; then
              PASS=$((PASS+1))
            else
              echo "FAIL: $RESP"
              FAIL=$((FAIL+1))
            fi
          done < smoke_test_prompts.jsonl

          echo "Smoke tests: $PASS passed, $FAIL failed"
          [[ $FAIL -eq 0 ]] || exit 1

      - name: Set serving state
        if: success()
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          gh api --method PATCH \
            "repos/miramar-labs-org/${{ env.PROJECT_NAME }}/actions/variables/DGX_SERVING_ACTIVE" \
            -f value="true" 2>/dev/null || \
          gh api --method POST \
            "repos/miramar-labs-org/${{ env.PROJECT_NAME }}/actions/variables" \
            -f name="DGX_SERVING_ACTIVE" -f value="true"

      - name: Update Open WebUI backend URL
        if: success()
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          BACKEND_URL="http://nim.${PROJECT_NAME}.svc.cluster.local:8000/v1"
          gh api --method PATCH "/orgs/miramar-labs-org/actions/variables/DGX_OPENWEBUI_API_URL" \
            -f name="DGX_OPENWEBUI_API_URL" -f value="${BACKEND_URL}" -f visibility="all" \
          || gh api --method POST "/orgs/miramar-labs-org/actions/variables" \
            -f name="DGX_OPENWEBUI_API_URL" -f value="${BACKEND_URL}" -f visibility="all"
          OWUI_ACTIVE=$(gh api "orgs/miramar-labs-org/actions/variables/DGX_OPENWEBUI_ACTIVE" \
            --jq '.value // empty' 2>/dev/null || true)
          if [[ "$OWUI_ACTIVE" == "true" ]]; then
            gh workflow run deploy-openwebui.yaml \
              --repo miramar-labs-org/miramar-platform-gcp \
              --field host=dgx
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy: $PROJECT_NAME (DGX K3s — LLM NIM)"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`nvcr.io/nim/nvidia/llm-nim:${NIM_IMAGE_TAG}\` |"
            echo "| Mode | \`${MODEL_MODE}\` |"
            echo "| Model | \`${MODEL_PATH}\` |"
            echo "| Served as | \`${SERVED_MODEL_NAME}\` |"
            echo "| Namespace | \`$PROJECT_NAME\` |"
            echo "| Port-forward | \`kubectl port-forward svc/nim 8000:8000 -n $PROJECT_NAME\` |"
          } >> "$GITHUB_STEP_SUMMARY"
