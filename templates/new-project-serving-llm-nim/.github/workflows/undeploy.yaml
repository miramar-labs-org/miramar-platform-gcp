name: Undeploy

# Removes the local LLM NIM deployment from K3s on DGX and frees GPU memory.
# DGX-only — no GKE target (model host path is not portable to GKE).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: "{{PROJECT_NAME}}"

jobs:
  undeploy-llm-nim-dgx:
    runs-on: [self-hosted, dgx]
    steps:
      # 1-hour miramar-serving-app App token (replaces the org-admin PAT; Nov 2026 incident)
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SERVING_APP_CLIENT_ID }}
          private-key: ${{ secrets.SERVING_APP_KEY }}
          owner: miramar-labs-org
          repositories: miramar-platform-gcp,${{ github.event.repository.name }}
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: echo "KUBECONFIG=${HOME}/.kube/config" >> "${GITHUB_ENV}"

      - name: Delete deployment
        run: |
          kubectl delete namespace "$PROJECT_NAME" --ignore-not-found
          echo "Namespace and all resources removed."

      - name: Clear serving state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api --method PATCH \
            "repos/miramar-labs-org/${{ env.PROJECT_NAME }}/actions/variables/DGX_SERVING_ACTIVE" \
            -f value="false" 2>/dev/null || true

      - name: Deregister from Open WebUI
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          SERVED_MODEL_NAME=$(python3 -c "import yaml; c=yaml.safe_load(open('serving-config.yaml')); print(c['model']['served_model_name'])" 2>/dev/null || true)
          [[ -z "$SERVED_MODEL_NAME" ]] && echo "Cannot read served_model_name — skipping" && exit 0
          if kubectl get namespace model-router --ignore-not-found 2>/dev/null | grep -q model-router; then
            # Removing the labelled Service removes the backend from router discovery.
            kubectl delete service -n "$PROJECT_NAME" -l miramar.ai/router=true --ignore-not-found
            echo "Deregistered ${SERVED_MODEL_NAME} — triggering dgx router redeploy"
            gh workflow run deploy-model-router.yaml \
              --repo miramar-labs-org/miramar-platform-gcp \
              --field runner=dgx
          else
            gh api --method DELETE "/orgs/miramar-labs-org/actions/variables/DGX_OPENWEBUI_API_URL" \
              2>/dev/null || true
            OWUI_ACTIVE=$(gh api "orgs/miramar-labs-org/actions/variables/DGX_OPENWEBUI_ACTIVE" \
              --jq '.value // empty' 2>/dev/null || true)
            if [[ "$OWUI_ACTIVE" == "true" ]]; then
              gh workflow run deploy-openwebui.yaml \
                --repo miramar-labs-org/miramar-platform-gcp \
                --field host=dgx
            fi
          fi

      - name: Summary
        run: |
          {
            echo "## Undeploy: $PROJECT_NAME (DGX K3s — Local LLM NIM)"
            echo "Deployment removed. GPU memory freed."
          } >> "$GITHUB_STEP_SUMMARY"
