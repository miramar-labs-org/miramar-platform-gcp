runtime:
  kind: llm-nim

nim:
  image: "nvcr.io/nim/nvidia/llm-nim"
  image_tag: "{{NIM_IMAGE_TAG}}"        # e.g. latest

model:
  model_path: "{{MODEL_PATH}}"          # /absolute/local/path  OR  hf://org/model  OR  org/model
  container_name: "{{MODEL_NAME}}"      # short name: volume name + /models/<name> mountPath (local mode only)
  served_model_name: "{{SERVED_MODEL_NAME}}"

deployment:
  namespace: "{{PROJECT_NAME}}"
  gpu_count: 1
