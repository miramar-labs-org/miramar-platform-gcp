name: Deploy

# Deploys the NIM serving pod to GKE (L4 spot) or K3s on DGX.
# No build step — NIM images are pulled directly from nvcr.io.
# NIM images are not portable: DGX uses the -dgx-spark variant (arm64 GB10 Blackwell).
# Run undeploy.yaml when done to stop costs (GKE) or free GPU memory (K3s).
# AGX not supported — no arm64 NIM images on NGC.

on:
  workflow_dispatch:
    inputs:
      host:
        description: Deployment target (dgx, gke)
        required: false
        default: dgx
        type: choice
        options:
          - dgx
          - gke

permissions:
  contents: read
  id-token: write

env:
  PROJECT_NAME: "{{PROJECT_NAME}}"
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}
  GAR_REPO: ${{ vars.GAR_REPO }}

jobs:
  deploy-dgx:
    if: inputs.host == 'dgx'
    runs-on: [self-hosted, dgx]
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: echo "KUBECONFIG=${HOME}/.kube/config" >> "${GITHUB_ENV}"

      - name: Read config
        run: |
          NIM_ORG=$(python3 -c "import yaml; c=yaml.safe_load(open('serving-config.yaml')); print(c['nim']['org'])")
          NIM_MODEL_NAME=$(python3 -c "import yaml; c=yaml.safe_load(open('serving-config.yaml')); print(c['nim']['model_name'])")
          DGX_IMAGE_TAG=$(python3 -c "import yaml; c=yaml.safe_load(open('serving-config.yaml')); print(c['nim']['dgx_image_tag'])")
          SERVED_MODEL_NAME=$(python3 -c "import yaml; c=yaml.safe_load(open('serving-config.yaml')); print(c['model']['served_model_name'])")
          echo "NIM_ORG=${NIM_ORG}" >> "$GITHUB_ENV"
          echo "NIM_MODEL_NAME=${NIM_MODEL_NAME}" >> "$GITHUB_ENV"
          echo "DGX_IMAGE_TAG=${DGX_IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "SERVED_MODEL_NAME=${SERVED_MODEL_NAME}" >> "$GITHUB_ENV"

      - name: Ensure namespace
        run: kubectl create namespace "$PROJECT_NAME" --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Ensure nvcr-pull secret
        run: |
          kubectl create secret docker-registry nvcr-pull \
            --docker-server=nvcr.io \
            --docker-username='$oauthtoken' \
            --docker-password="${{ secrets.NGC_API_KEY }}" \
            -n "$PROJECT_NAME" \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Substitute and apply K3s manifest
        run: |
          sed "s|NIM_ORG_PLACEHOLDER|${NIM_ORG}|g" k8s/nim-k3s.yaml \
            | sed "s|NIM_MODEL_NAME_PLACEHOLDER|${NIM_MODEL_NAME}|g" \
            | sed "s|DGX_IMAGE_TAG_PLACEHOLDER|${DGX_IMAGE_TAG}|g" \
            | sed "s|SERVED_MODEL_NAME_PLACEHOLDER|${SERVED_MODEL_NAME}|g" \
            | kubectl apply --validate=false -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/nim -n "$PROJECT_NAME" --timeout=1800s

      - name: Smoke test
        run: |
          kubectl port-forward svc/nim 18000:8000 -n "$PROJECT_NAME" &
          PF_PID=$!
          sleep 5
          trap "kill $PF_PID 2>/dev/null || true" EXIT

          curl -sf http://localhost:18000/v1/models | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          models=[m['id'] for m in d.get('data',[])]
          print('Models:', models)
          "

          PASS=0; FAIL=0
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            PROMPT=$(echo "$line" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('prompt',''))")
            [[ -z "$PROMPT" ]] && continue
            RESP=$(curl -sf -X POST http://localhost:18000/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"${SERVED_MODEL_NAME}\",\"messages\":[{\"role\":\"user\",\"content\":\"${PROMPT}\"}],\"max_tokens\":100}" \
              2>&1 || echo "CURL_ERROR")
            if echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['choices'][0]['message']['content'][:80])" 2>/dev/null; then
              PASS=$((PASS+1))
            else
              echo "FAIL: $RESP"
              FAIL=$((FAIL+1))
            fi
          done < smoke_test_prompts.jsonl

          echo "Smoke tests: $PASS passed, $FAIL failed"
          [[ $FAIL -eq 0 ]] || exit 1

      - name: Set serving state
        if: success()
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          gh api --method PATCH \
            "repos/miramar-labs-org/${{ env.PROJECT_NAME }}/actions/variables/DGX_SERVING_ACTIVE" \
            -f value="true" 2>/dev/null || \
          gh api --method POST \
            "repos/miramar-labs-org/${{ env.PROJECT_NAME }}/actions/variables" \
            -f name="DGX_SERVING_ACTIVE" -f value="true"

      - name: Record NIM VRAM
        if: success()
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          NIM_MiB=$(nvidia-smi --query-compute-apps=process_name,used_memory \
            --format=csv,noheader 2>/dev/null \
            | grep -i "nim" \
            | awk -F',' '{gsub(/[^0-9]/,"",$2); sum+=$2} END{print sum+0}' || echo 0)
          NIM_GB=$(( ${NIM_MiB:-0} / 1024 ))
          gh api --method PATCH \
            "repos/miramar-labs-org/${{ env.PROJECT_NAME }}/actions/variables/DGX_VLLM_VRAM_GB" \
            -f value="${NIM_GB}" 2>/dev/null || \
          gh api --method POST \
            "repos/miramar-labs-org/${{ env.PROJECT_NAME }}/actions/variables" \
            -f name="DGX_VLLM_VRAM_GB" -f value="${NIM_GB}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy: $PROJECT_NAME (DGX K3s)"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`nvcr.io/nim/${NIM_ORG}/${NIM_MODEL_NAME}-dgx-spark:${DGX_IMAGE_TAG}\` |"
            echo "| Namespace | \`$PROJECT_NAME\` |"
            echo "| Port-forward | \`kubectl port-forward svc/nim 8000:8000 -n $PROJECT_NAME\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-gke:
    if: inputs.host == 'gke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Read config
        run: |
          NIM_ORG=$(python3 -c "import yaml; c=yaml.safe_load(open('serving-config.yaml')); print(c['nim']['org'])")
          NIM_MODEL_NAME=$(python3 -c "import yaml; c=yaml.safe_load(open('serving-config.yaml')); print(c['nim']['model_name'])")
          GKE_IMAGE_TAG=$(python3 -c "import yaml; c=yaml.safe_load(open('serving-config.yaml')); print(c['nim']['gke_image_tag'])")
          SERVED_MODEL_NAME=$(python3 -c "import yaml; c=yaml.safe_load(open('serving-config.yaml')); print(c['model']['served_model_name'])")
          echo "NIM_ORG=${NIM_ORG}" >> "$GITHUB_ENV"
          echo "NIM_MODEL_NAME=${NIM_MODEL_NAME}" >> "$GITHUB_ENV"
          echo "GKE_IMAGE_TAG=${GKE_IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "SERVED_MODEL_NAME=${SERVED_MODEL_NAME}" >> "$GITHUB_ENV"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Expand GPU node pool (L4 spot)
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          echo "Triggering gke-expand-gpu (nvidia-l4, spot=true, namespace=$PROJECT_NAME)"
          gh workflow run gke-expand-gpu.yaml \
            --repo miramar-labs-org/miramar-platform-gcp \
            --field namespace="$PROJECT_NAME" \
            --field gpu_type=nvidia-l4 \
            --field spot=true
          echo "Waiting for GPU node pool to be ready..."
          for i in $(seq 1 40); do
            NODE=$(kubectl get nodes -l cloud.google.com/gke-accelerator=nvidia-l4 \
              --no-headers 2>/dev/null | grep -c "Ready" || true)
            if [[ "$NODE" -ge 1 ]]; then
              echo "GPU node ready."
              break
            fi
            echo "Waiting... ($i/40)"
            sleep 15
          done
          kubectl get nodes -l cloud.google.com/gke-accelerator=nvidia-l4

      - name: Ensure namespace
        run: kubectl create namespace "$PROJECT_NAME" --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Ensure nvcr-pull secret
        run: |
          kubectl create secret docker-registry nvcr-pull \
            --docker-server=nvcr.io \
            --docker-username='$oauthtoken' \
            --docker-password="${{ secrets.NGC_API_KEY }}" \
            -n "$PROJECT_NAME" \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Substitute and apply GKE manifest
        run: |
          sed "s|NIM_ORG_PLACEHOLDER|${NIM_ORG}|g" k8s/nim.yaml \
            | sed "s|NIM_MODEL_NAME_PLACEHOLDER|${NIM_MODEL_NAME}|g" \
            | sed "s|GKE_IMAGE_TAG_PLACEHOLDER|${GKE_IMAGE_TAG}|g" \
            | sed "s|SERVED_MODEL_NAME_PLACEHOLDER|${SERVED_MODEL_NAME}|g" \
            | kubectl apply --validate=false -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/nim -n "$PROJECT_NAME" --timeout=1800s

      - name: Smoke test
        run: |
          kubectl port-forward svc/nim 18000:8000 -n "$PROJECT_NAME" &
          PF_PID=$!
          sleep 5
          trap "kill $PF_PID 2>/dev/null || true" EXIT

          curl -sf http://localhost:18000/v1/models | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          models=[m['id'] for m in d.get('data',[])]
          print('Models:', models)
          "

          PASS=0; FAIL=0
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            PROMPT=$(echo "$line" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('prompt',''))")
            [[ -z "$PROMPT" ]] && continue
            RESP=$(curl -sf -X POST http://localhost:18000/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"${SERVED_MODEL_NAME}\",\"messages\":[{\"role\":\"user\",\"content\":\"${PROMPT}\"}],\"max_tokens\":100}" \
              2>&1 || echo "CURL_ERROR")
            if echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['choices'][0]['message']['content'][:80])" 2>/dev/null; then
              PASS=$((PASS+1))
            else
              echo "FAIL: $RESP"
              FAIL=$((FAIL+1))
            fi
          done < smoke_test_prompts.jsonl

          echo "Smoke tests: $PASS passed, $FAIL failed"
          [[ $FAIL -eq 0 ]] || exit 1

      - name: Set serving state
        if: success()
        env:
          GH_TOKEN: ${{ secrets.MIRAMAR_ORG_ADMIN_PAT }}
        run: |
          gh api --method PATCH \
            "repos/miramar-labs-org/${{ env.PROJECT_NAME }}/actions/variables/GKE_SERVING_ACTIVE" \
            -f value="true" 2>/dev/null || \
          gh api --method POST \
            "repos/miramar-labs-org/${{ env.PROJECT_NAME }}/actions/variables" \
            -f name="GKE_SERVING_ACTIVE" -f value="true"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy: $PROJECT_NAME (GKE)"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`nvcr.io/nim/${NIM_ORG}/${NIM_MODEL_NAME}:${GKE_IMAGE_TAG}\` |"
            echo "| Namespace | \`$PROJECT_NAME\` |"
            echo "| Port-forward | \`kubectl port-forward svc/nim 8000:8000 -n $PROJECT_NAME\` |"
          } >> "$GITHUB_STEP_SUMMARY"
