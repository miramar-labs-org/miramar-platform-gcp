apiVersion: v1
kind: Namespace
metadata:
  name: {{PROJECT_NAME}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nim
  namespace: {{PROJECT_NAME}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nim
  template:
    metadata:
      labels:
        app: nim
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: nvcr-pull
      containers:
        - name: nim
          image: nvcr.io/nim/NIM_ORG_PLACEHOLDER/NIM_MODEL_NAME_PLACEHOLDER:GKE_IMAGE_TAG_PLACEHOLDER
          env:
            - name: NIM_SERVED_MODEL_NAME
              value: SERVED_MODEL_NAME_PLACEHOLDER
            - name: NIM_CACHE_PATH
              value: /opt/nim/.cache
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 4
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: nim-cache
              mountPath: /opt/nim/.cache
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: nim-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nim
  namespace: {{PROJECT_NAME}}
spec:
  type: ClusterIP
  selector:
    app: nim
  ports:
    - name: http
      port: 8000
      targetPort: 8000
