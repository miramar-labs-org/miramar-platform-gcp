runtime:
  kind: nim

nim:
  org: "{{NIM_ORG}}"
  model_name: "{{NIM_MODEL_NAME}}"       # base name; -dgx-spark suffix added per host
  dgx_image_tag: "{{DGX_IMAGE_TAG}}"     # e.g. 1.0.0-variant
  gke_image_tag: "{{GKE_IMAGE_TAG}}"     # e.g. 1.5.0
  port: 8000

model:
  served_model_name: "{{SERVED_MODEL_NAME}}"

deployment:
  namespace: "{{PROJECT_NAME}}"
  gpu_count: 1
