name: Build and Push

# Builds the Triton+TRT-LLM serving image (with compiled engine baked in) and pushes to the registry.
# Reads compression.project and compression.run_id from serving-config.yaml,
# stages the GPU-arch-specific engine into the Docker build context, then builds and pushes.
#
# Engine architecture:
#   gke  → engine_l4/   (GKE L4, sm_89) — built on wsl2 runner, pushed to GAR
#   dgx  → engine_gb10/ (DGX Spark GB10) — built on dgx runner, pushed to GHCR
#
# NOTE: AGX (arm64/Orin) is not supported — engine_sm87 requires arm64 image; use serving-trt-engine for AGX.
#
# Run this after the compression pipeline produces a validated engine for the target GPU arch.

on:
  workflow_dispatch:
    inputs:
      host:
        description: Deployment target (determines engine arch and registry — gke=GAR, dgx=GHCR)
        required: false
        default: dgx
        type: choice
        options:
          - gke
          - dgx
      run_id:
        description: "Compression run ID (default: read from serving-config.yaml)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write
  packages: write

env:
  PROJECT_NAME: "{{PROJECT_NAME}}"
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_REPO: ${{ vars.GAR_REPO }}

jobs:
  build-push-gar:
    if: inputs.host == 'gke'
    runs-on: [self-hosted, wsl2]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Locate engine
        run: |
          COMP_PROJECT=$(python3 -c "import yaml; cfg=yaml.safe_load(open('serving-config.yaml')); print(cfg['compression']['project'])")
          RUN_ID_CFG=$(python3 -c "import yaml; cfg=yaml.safe_load(open('serving-config.yaml')); print(cfg['compression']['run_id'])")
          RUN_ID="${{ inputs.run_id }}"
          [[ -z "$RUN_ID" ]] && RUN_ID="$RUN_ID_CFG"
          if [[ -z "$COMP_PROJECT" ]]; then
            echo "ERROR: compression.project is not set in serving-config.yaml"
            exit 1
          fi
          SHARED="${HOME}/shared/huggingface-kfp"
          ENGINE_BASE="${SHARED}/engines/${COMP_PROJECT}"
          if [[ "$RUN_ID" == "latest" ]]; then
            RUN_ID=$(ls -t "$ENGINE_BASE" 2>/dev/null | head -1)
            [[ -z "$RUN_ID" ]] && echo "ERROR: No runs found in ${ENGINE_BASE}" && exit 1
          fi
          ENGINE_PATH="${ENGINE_BASE}/${RUN_ID}/engine_l4"
          if [[ ! -d "$ENGINE_PATH" ]]; then
            echo "ERROR: engine_l4 not found at ${ENGINE_PATH}"
            echo "Run the compression pipeline with target_gpu=l4 first."
            exit 1
          fi
          echo "Using engine: ${ENGINE_PATH}"
          echo "ENGINE_PATH=${ENGINE_PATH}" >> "$GITHUB_ENV"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"

      - name: Stage engine into build context
        run: |
          rm -rf engine/
          cp -r "${ENGINE_PATH}/" engine/
          echo "Staged engine files:"
          ls -lh engine/

      - name: Set image URI
        id: image
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO}/${PROJECT_NAME}"
          COMMIT_SHA="${{ github.sha }}"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "tag=${RUN_ID}-${COMMIT_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          IMAGE_URI="${{ steps.image.outputs.uri }}"
          TAG="${{ steps.image.outputs.tag }}"
          docker build \
            --platform linux/amd64 \
            --cache-from "${IMAGE_URI}:latest" \
            -t "${IMAGE_URI}:latest" \
            -t "${IMAGE_URI}:${TAG}" \
            -f Dockerfile.serve .
          docker push "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${TAG}"
          echo "Pushed ${IMAGE_URI}:${TAG}"

      - name: Clean up staged engine
        if: always()
        run: rm -rf engine/

      - name: Summary
        run: |
          {
            echo "## Build and Push Complete"
            echo "| | |"
            echo "|---|---|"
            echo "| Project | \`$PROJECT_NAME\` |"
            echo "| Registry | GAR |"
            echo "| Engine arch | L4 (sm_89) |"
            echo "| Compression Run | \`${RUN_ID}\` |"
            echo "| Image | \`${{ steps.image.outputs.uri }}:${{ steps.image.outputs.tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-push-ghcr:
    if: inputs.host == 'dgx'
    runs-on: [self-hosted, dgx]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.MIRAMAR_ORG_GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Locate engine
        run: |
          COMP_PROJECT=$(python3 -c "import yaml; cfg=yaml.safe_load(open('serving-config.yaml')); print(cfg['compression']['project'])")
          RUN_ID_CFG=$(python3 -c "import yaml; cfg=yaml.safe_load(open('serving-config.yaml')); print(cfg['compression']['run_id'])")
          RUN_ID="${{ inputs.run_id }}"
          [[ -z "$RUN_ID" ]] && RUN_ID="$RUN_ID_CFG"
          if [[ -z "$COMP_PROJECT" ]]; then
            echo "ERROR: compression.project is not set in serving-config.yaml"
            exit 1
          fi
          SHARED="${HOME}/shared/huggingface-kfp"
          ENGINE_BASE="${SHARED}/engines/${COMP_PROJECT}"
          if [[ "$RUN_ID" == "latest" ]]; then
            RUN_ID=$(ls -t "$ENGINE_BASE" 2>/dev/null | head -1)
            [[ -z "$RUN_ID" ]] && echo "ERROR: No runs found in ${ENGINE_BASE}" && exit 1
          fi
          ENGINE_PATH="${ENGINE_BASE}/${RUN_ID}/engine_gb10"
          if [[ ! -d "$ENGINE_PATH" ]]; then
            echo "ERROR: engine_gb10 not found at ${ENGINE_PATH}"
            echo "Run the compression pipeline with target_gpu=gb10 first."
            exit 1
          fi
          echo "Using engine: ${ENGINE_PATH}"
          echo "ENGINE_PATH=${ENGINE_PATH}" >> "$GITHUB_ENV"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"

      - name: Stage engine into build context
        run: |
          rm -rf engine/
          cp -r "${ENGINE_PATH}/" engine/
          echo "Staged engine files:"
          ls -lh engine/

      - name: Set image URI
        id: image
        run: |
          IMAGE_URI="ghcr.io/miramar-labs-org/${PROJECT_NAME}"
          COMMIT_SHA="${{ github.sha }}"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "tag=${RUN_ID}-${COMMIT_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          IMAGE_URI="${{ steps.image.outputs.uri }}"
          TAG="${{ steps.image.outputs.tag }}"
          docker build \
            --cache-from "${IMAGE_URI}:latest" \
            -t "${IMAGE_URI}:latest" \
            -t "${IMAGE_URI}:${TAG}" \
            -f Dockerfile.serve .
          docker push "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${TAG}"
          echo "Pushed ${IMAGE_URI}:${TAG}"

      - name: Clean up staged engine
        if: always()
        run: rm -rf engine/

      - name: Summary
        run: |
          {
            echo "## Build and Push Complete"
            echo "| | |"
            echo "|---|---|"
            echo "| Project | \`$PROJECT_NAME\` |"
            echo "| Registry | GHCR |"
            echo "| Engine arch | GB10 (Blackwell) |"
            echo "| Compression Run | \`${RUN_ID}\` |"
            echo "| Image | \`${{ steps.image.outputs.uri }}:${{ steps.image.outputs.tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
