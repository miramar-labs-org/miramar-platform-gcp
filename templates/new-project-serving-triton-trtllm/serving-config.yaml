runtime:
  kind: triton-trtllm

model:
  served_model_name: "{{SERVED_MODEL_NAME}}"   # stable alias exposed to clients

compression:
  project: ""     # name of the compression pipeline repo (e.g. qwen25-7b-arc-trt-compression)
  run_id: "latest"  # run directory name, or "latest" to auto-detect most recent

triton:
  image_tag: "25.06-trtllm-python-py3"
  port: 8000

deployment:
  namespace: "{{PROJECT_NAME}}"
  gpu_type: nvidia-l4
  spot: true
  gpu_count: 1
