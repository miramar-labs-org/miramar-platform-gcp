apiVersion: v1
kind: Namespace
metadata:
  name: {{PROJECT_NAME}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: {{PROJECT_NAME}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      enableServiceLinks: false
      containers:
        - name: triton
          image: IMAGE_PLACEHOLDER
          command: ["tritonserver"]
          args:
            - --model-store=/model_repo
            - --log-verbose=0
            - --exit-on-error=false
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /tmp/hf-cache
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8001
              name: grpc
            - containerPort: 8002
              name: metrics
          resources:
            requests:
              cpu: 4
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            initialDelaySeconds: 240
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: hf-cache
              mountPath: /tmp/hf-cache
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: hf-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: {{PROJECT_NAME}}
spec:
  type: ClusterIP
  selector:
    app: triton
  ports:
    - name: http
      port: 8000
      targetPort: 8000
