apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: {{PROJECT_NAME}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model=/model
            - --served-model-name=SERVED_MODEL_NAME_PLACEHOLDER
            - --dtype=bfloat16
            - --quantization=fp8
            - --gpu-memory-utilization=0.80
            - --max-model-len=4096
            - --trust-remote-code
            - --host=0.0.0.0
            - --port=8000
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 4
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: model
          hostPath:
            path: MODEL_PATH_PLACEHOLDER
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: {{PROJECT_NAME}}
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
