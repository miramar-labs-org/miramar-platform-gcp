runtime:
  kind: vllm-direct

model:
  served_model_name: "{{SERVED_MODEL_NAME}}"

compression:
  project: ""   # name of the compression pipeline repo (e.g. qwen25-7b-fp8-compression)
  run_id: "latest"   # run directory name, or "latest" to auto-detect most recent

vllm:
  gpu_memory_utilization: 0.80
  max_model_len: 4096
  port: 8000
  trust_remote_code: true

deployment:
  namespace: "{{PROJECT_NAME}}"
  gpu_count: 1
