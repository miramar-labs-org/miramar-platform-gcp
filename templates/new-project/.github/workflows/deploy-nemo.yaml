name: Deploy to NeMo

# Submits a training job to NeMo Microservices on the DGX minikube cluster.
# Prerequisites: NeMo must be running (see miramar-platform-gcp — NeMo Deploy workflow).
#
# TODO: Adjust the job payload below for your model and dataset.
# NeMo Jobs API docs: https://docs.nvidia.com/nemo/microservices/latest/

on:
  workflow_dispatch:
    inputs:
      job_name:
        description: Unique name for this training job
        required: true
      model:
        description: Base model namespace/name (e.g. meta/llama-3.1-8b)
        default: meta/llama-3.1-8b
        required: false
      dataset_path:
        description: Path or URI to the training dataset
        default: ""
        required: false
      num_epochs:
        description: Number of training epochs
        default: "1"
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, dgx]
    timeout-minutes: 60

    steps:
      - name: Set up kubeconfig
        run: |
          docker network connect minikube "$(cat /etc/hostname)" 2>/dev/null || true
          sudo chmod -R a+rX "${HOME}/.minikube"
          TMP_KC=$(mktemp)
          sed "s|/home/[^/]*/\.minikube/|${HOME}/.minikube/|g" \
              "${HOME}/.kube/config" > "${TMP_KC}"
          echo "KUBECONFIG=${TMP_KC}" >> "${GITHUB_ENV}"

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Set up /etc/hosts for NeMo endpoint
        run: |
          MINIKUBE_IP=$(kubectl get node minikube \
            -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')
          sudo sed -i '/nemo\.test/d' /etc/hosts || true
          printf '%s nemo.test\n' "$MINIKUBE_IP" | sudo tee -a /etc/hosts >/dev/null
          echo "nemo.test → $MINIKUBE_IP"

      - name: Submit training job
        # TODO: Adjust this payload to match your model and training config.
        # Refer to the NeMo Microservices API for supported fields.
        env:
          JOB_NAME: ${{ inputs.job_name }}
          MODEL: ${{ inputs.model }}
          DATASET_PATH: ${{ inputs.dataset_path }}
          NUM_EPOCHS: ${{ inputs.num_epochs }}
        run: |
          PAYLOAD=$(printf '{
            "name": "%s",
            "config": {
              "training_config": {
                "model": "%s",
                "num_epochs": %s
              },
              "dataset": {
                "file_path": "%s"
              }
            }
          }' "${JOB_NAME}" "${MODEL}" "${NUM_EPOCHS}" "${DATASET_PATH}")

          echo "Submitting job: ${JOB_NAME}"
          RESPONSE=$(curl -sf -X POST http://nemo.test/v1/jobs \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}")
          echo "${RESPONSE}"

          JOB_ID=$(echo "${RESPONSE}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id','unknown'))")
          echo "job_id=${JOB_ID}" >> "${GITHUB_OUTPUT}"

      - name: Wait for job to leave pending
        env:
          JOB_NAME: ${{ inputs.job_name }}
        run: |
          echo "Polling job status..."
          for i in $(seq 1 20); do
            STATUS=$(curl -sf "http://nemo.test/v1/jobs/${JOB_NAME}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")
            echo "  status: ${STATUS}"
            if [ "${STATUS}" != "pending" ] && [ "${STATUS}" != "unknown" ]; then
              break
            fi
            sleep 10
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## NeMo Training Job"
            echo "| | |"
            echo "|---|---|"
            echo "| Job name | \`${{ inputs.job_name }}\` |"
            echo "| Model | \`${{ inputs.model }}\` |"
            echo "| Epochs | \`${{ inputs.num_epochs }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
